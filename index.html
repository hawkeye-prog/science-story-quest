 this tell you?","options":["Salt water is a reaction","Salt water is a new substance","Salt water is a mixture","Salt disappears forever"],"answer":2,"explain":"Great inference! The article says sugar in water is a mixture because the crystals come back."},{"q":"In the article, what does 'substances' mean?","options":["Kitchen tools","Recipes","Small bubbles","Kinds of materials or matter"],"answer":3,"explain":"Correct! Reactions 'form brand new substances,' meaning new kinds of materials."},{"q":"Why does bread dough puff up?","options":["The oven blows air into it","Yeast gives off gas that gets trapped in the dough","Sugar turns into ice","The dough is stretched by hand"],"answer":1,"explain":"Well done! The text says carbon dioxide from yeast 'gets trapped in the stretchy dough.'"}],"grammar":[{"skill":"Sentence Types","q":"What kind of sentence is this: 'Put a spoonful of baking soda in a cup.'","options":["A question","An exclamation","A statement about the past","A command"],"answer":3,"explain":"Yes! The sentence tells someone to do something, so it is a command."},{"skill":"Homophones","q":"Choose the correct word: '____ baking bread in the kitchen.'","options":["Their","There","They're","Thier"],"answer":2,"explain":"Correct! 'They're' is short for 'they are.'"},{"skill":"Adverbs","q":"Which word is the ADVERB in this sentence: 'Slowly pour in a little vinegar.'","options":["pour","Slowly","little","vinegar"],"answer":1,"explain":"Great! 'Slowly' tells HOW to pour."},{"skill":"Punctuation","q":"Which sentence uses an apostrophe correctly?","options":["Ask for an adult's help.","Ask for an adults' help.","Ask for an adults help.","Ask for an adult,s help."],"answer":0,"explain":"Right! 'Adult's' shows the help belongs to one adult."}],"spelling":[{"word":"mixture","sentence":"A bowl of trail mix is a ____ too.","meaning":"Things mixed together without becoming new.","wrong":["mixsure","mixcher","mixtur"]},{"word":"vinegar","sentence":"A classic example is baking soda and ____.","meaning":"A sour liquid used in cooking.","wrong":["vinager","vineger","vinigar"]},{"word":"reaction","sentence":"Cooking an egg is another ____.","meaning":"A change that makes something new.","wrong":["reacshun","reacton","reaktion"]},{"word":"crystals","sentence":"If the water evaporates, the sugar ____ come back.","meaning":"Small, hard, shiny pieces.","wrong":["cristals","crystels","chrystals"]},{"word":"delicious","sentence":"When you toast bread, it turns brown and smells ____.","meaning":"Tasting or smelling very good.","wrong":["delishus","delicous","dilicious"]},{"word":"laboratory","sentence":"Your kitchen can become the tastiest ____ around.","meaning":"A room where scientists do experiments.","wrong":["labratory","laboratary","labortory"]}],"written":[{"q":"In your own words, explain the difference between a mixture and a chemical reaction.","minWords":12,"keyIdeas":[{"label":"A mixture combines things without making anything new","any":["mixture","mix","combin","nothing new","same","stir"]},{"label":"A mixture can be separated or come back","any":["separat","pick out","come back","evaporat","apart","still there"]},{"label":"A reaction makes a brand new substance","any":["reaction","new","substance","chang","form"]},{"label":"A reaction cannot be turned back","any":["can't","cannot","can not","never","back","undo","un-"]}],"need":2,"sample":"A mixture is when things are combined but nothing new is made, like trail mix, and you can still pick the parts out. A chemical reaction makes a brand new substance, like the gas from baking soda and vinegar, and you cannot turn it back."},{"q":"Why does a slice of bread have little holes in it? Explain using the article.","minWords":10,"keyIdeas":[{"label":"Yeast eats sugar","any":["yeast","fungus","sugar","eat"]},{"label":"Yeast gives off carbon dioxide gas","any":["carbon","dioxide","gas","bubble"]},{"label":"The gas gets trapped in the dough and leaves holes","any":["trap","pocket","dough","rise","puff","hole"]}],"need":2,"sample":"Bread has holes because yeast eats sugar and gives off carbon dioxide gas. The gas gets trapped in the stretchy dough as bubbles, and the holes are left behind after baking."}],"fixit":[{"wrong":"When baking soda and vinegar meets, they fizz and fome.","right":"When baking soda and vinegar meet, they fizz and foam.","errors":[{"bad":"meets,","good":"meet,","type":"Subject-Verb Agreement"},{"bad":"fome.","good":"foam.","type":"Spelling"}]},{"wrong":"there kitchen became a laboratory for the day","right":"Their kitchen became a laboratory for the day.","errors":[{"bad":"there","good":"Their","type":"Homophones"},{"bad":"day","good":"day.","type":"Punctuation"}]}]},{"id":"robots","title":"Beep, Boop, Build: How Robots Work","category":"Technology","emoji":"🦾","minutes":4,"paragraphs":["Imagine a machine that can sweep your floor while you sleep, explore the dusty surface of Mars, or help a doctor during surgery. These amazing helpers are robots. A robot is a machine that can sense the world around it, make decisions, and then take action, often without a person controlling every move. Robots come in all shapes, from giant factory arms to tiny rolling vacuum cleaners.","Most robots have three important jobs, and you can think of them as sense, think, and act. First, robots use sensors to gather information. Sensors work a bit like your eyes, ears, and skin. Cameras help a robot see, microphones help it hear, and touch sensors tell it when it bumps into something. Some robots even use lasers or sound waves to measure how far away objects are.","Next, the robot needs a brain. A robot's brain is a computer that follows a program. A program is a set of step-by-step instructions written by people called programmers. The instructions might say, 'If you sense a wall, turn left.' Some modern robots use artificial intelligence, which helps them learn from examples and handle new situations, but they still depend on what people build and teach them.","Finally, the robot must act. It moves using parts called actuators, such as electric motors that spin wheels or bend metal joints. Some robots have grippers like hands that can pick up an egg without cracking it. All of these parts need power, which usually comes from batteries or from being plugged into the wall.","Robots are great at jobs that are dull, dirty, or dangerous for people. In factories, robot arms build cars and never get tired of doing the same task again and again. Underwater robots explore the deep ocean, where the pressure would crush a human. NASA's rovers, like Perseverance, have rolled across Mars for years, taking photos and studying rocks that might hold clues about ancient life.","You do not have to be a grown-up to start building robots. Many schools and libraries have robot clubs where kids learn to write simple programs and build machines from kits. You might program a little robot to follow a line or dance to music. Always ask an adult before using tools or batteries. Who knows? Someday you might invent a robot that changes the world."],"funFact":"The word 'robot' was first used in a 1920 play by Czech writer Karel Čapek. It comes from a Czech word that means 'forced work.'","vocab":[{"word":"sensors","meaning":"Parts that help a robot notice light, sound, or touch."},{"word":"program","meaning":"A set of step-by-step instructions for a computer."},{"word":"artificial intelligence","meaning":"Computer skills that let machines learn from examples."},{"word":"actuators","meaning":"Robot parts, like motors, that make it move."},{"word":"dangerous","meaning":"Likely to cause harm or injury."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Mars is a dusty planet","Vacuum cleaners are noisy","Kids should not build robots","Robots sense, think, and act to help people"],"answer":3,"explain":"Excellent! The article explains how robots sense, think, and act."},{"q":"What do robots use to gather information about the world?","options":["Sensors","Actuators","Grippers","Wheels"],"answer":0,"explain":"Yes! The article says 'robots use sensors to gather information.'"},{"q":"A robot keeps bumping into walls. What part of it might need fixing?","options":["Its paint","Its name","Its sensors or its program","Its color"],"answer":2,"explain":"Smart thinking! Touch sensors and the program tell a robot what to do when it senses a wall."},{"q":"In the article, what are 'actuators'?","options":["People who write programs","Parts like motors that make a robot move","Cameras that help robots see","Clubs for kids"],"answer":1,"explain":"Correct! The text says a robot 'moves using parts called actuators.'"},{"q":"Why are robots used to explore the deep ocean?","options":["The pressure there would crush a human","Robots love water","Fish like robots","The ocean is too bright"],"answer":0,"explain":"Well done! The article says the deep ocean is where 'the pressure would crush a human.'"}],"grammar":[{"skill":"Plurals","q":"What is the correct plural of 'battery'?","options":["batterys","battery's","batteries","batteryes"],"answer":2,"explain":"Yes! When a word ends in a consonant plus y, change the y to i and add -es."},{"skill":"Prepositions","q":"Which word is the PREPOSITION in this sentence: 'The rover rolled across Mars.'","options":["rover","rolled","Mars","across"],"answer":3,"explain":"Correct! 'Across' shows where the rover rolled."},{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'The robot grips the egg.'","options":["grips","robot","egg","The"],"answer":0,"explain":"Great! 'Grips' is the action the robot does."},{"skill":"Capital Letters","q":"Which sentence uses capital letters correctly?","options":["The perseverance rover is on mars.","The Perseverance rover is on Mars.","the Perseverance rover is on Mars.","The Perseverance Rover Is On mars."],"answer":1,"explain":"Right! The first word and the names 'Perseverance' and 'Mars' need capitals."}],"spelling":[{"word":"sensors","sentence":"Robots use ____ to gather information.","meaning":"Parts that notice light, sound, or touch.","wrong":["sensers","censors","sensorz"]},{"word":"computer","sentence":"A robot's brain is a ____ that follows a program.","meaning":"A machine that follows instructions and stores information.","wrong":["compooter","computor","computter"]},{"word":"batteries","sentence":"Power usually comes from ____ or from being plugged in.","meaning":"Small containers that store electricity.","wrong":["batterys","batteris","battaries"]},{"word":"factories","sentence":"In ____, robot arms build cars.","meaning":"Buildings where things are made.","wrong":["factorys","factoryes","facteries"]},{"word":"pressure","sentence":"Underwater robots explore where the ____ would crush a human.","meaning":"A strong pushing force.","wrong":["presure","pressur","preshure"]},{"word":"decisions","sentence":"A robot can sense the world, make ____, and take action.","meaning":"Choices about what to do.","wrong":["desicions","decisons","decishuns"]}],"written":[{"q":"In your own words, describe the three main jobs a robot does: sense, think, and act.","minWords":12,"keyIdeas":[{"label":"Sense: robots use sensors to gather information","any":["sens","camera","microphone","see","hear","information","notice"]},{"label":"Think: a computer brain follows a program","any":["think","computer","brain","program","instruction","decid","artificial"]},{"label":"Act: actuators or motors make it move","any":["act","move","motor","actuator","wheel","grip","spin"]}],"need":2,"sample":"First, a robot senses the world using sensors like cameras and microphones. Then its computer brain follows a program to decide what to do, and finally motors called actuators make it move and act."},{"q":"Why do people send robots to Mars and the deep ocean instead of going themselves? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Those places are dangerous for people","any":["danger","unsafe","hurt","harm","die","crush","pressure"]},{"label":"Robots can do dull, dirty, or dangerous jobs","any":["dull","dirty","robot","machine","rover"]},{"label":"Robots can explore and study for a long time","any":["explor","study","photo","picture","years","tired","rock"]}],"need":2,"sample":"Robots are great at jobs that are dangerous for people. In the deep ocean, the pressure would crush a human, and rovers like Perseverance can explore Mars for years taking photos of rocks."}],"fixit":[{"wrong":"The robot use its sensers to find the wall.","right":"The robot uses its sensors to find the wall.","errors":[{"bad":"use","good":"uses","type":"Subject-Verb Agreement"},{"bad":"sensers","good":"sensors","type":"Spelling"}]},{"wrong":"The perseverance rover has rolled across mars for years","right":"The Perseverance rover has rolled across Mars for years.","errors":[{"bad":"perseverance","good":"Perseverance","type":"Capital Letters"},{"bad":"mars","good":"Mars","type":"Capital Letters"},{"bad":"years","good":"years.","type":"Punctuation"}]}]},{"id":"dinosaurs-fossils","title":"Bones of Stone: Dinosaurs and Fossils","category":"Earth","emoji":"🦕","minutes":4,"paragraphs":["Imagine digging in your backyard and finding a giant bone that is millions of years old. That might sound like a dream, but people have discovered dinosaur bones on every continent, including icy Antarctica. Dinosaurs were reptiles that ruled the land for about 165 million years. The last of the giant dinosaurs disappeared about 66 million years ago, long before the first humans walked on Earth.","How do we know so much about animals no person ever saw? The answer is fossils. A fossil is the preserved remains or trace of a living thing from long ago. Fossils can be bones, teeth, shells, or even leaves. They can also be footprints, nests, eggs, and droppings. Scientists who study fossils are called paleontologists, and they work like detectives solving a very old mystery.","Making a fossil takes an incredibly long time. First, an animal dies and is quickly buried by mud, sand, or ash. The soft parts rot away, but the hard bones remain. Over thousands and millions of years, more layers pile on top and press down. Water soaks through the ground and carries minerals into the bones. Slowly, the minerals replace the bone, turning it into rock in the shape of the original bone.","Fossils usually stay hidden in layers of rock called sedimentary rock. Wind, rain, and rivers wear the rock away over time and reveal fossils at the surface. Then paleontologists get to work with brushes, picks, and tiny tools. They carefully dig and wrap fragile bones in plaster, like a cast on a broken arm, before carrying them to a museum.","Fossils have taught us amazing things. Tyrannosaurus rex had teeth as long as bananas and one of the strongest bites of any land animal ever. Some dinosaurs, like the long-necked Argentinosaurus, grew longer than a basketball court. Many dinosaurs had feathers, and scientists now agree that birds are living descendants of dinosaurs. So the next time you see a pigeon, you are looking at a dinosaur's relative!","You can be a fossil hunter too. Many museums let visitors see real dinosaur skeletons up close, and some parks allow families to search for small fossils like shells. You can even make a pretend fossil by pressing a shell into clay. Always ask an adult before digging, and follow park rules, because some fossils are protected by law so that everyone can learn from them."],"funFact":"The word 'dinosaur' means 'terrible lizard,' even though dinosaurs were not actually lizards at all.","vocab":[{"word":"fossil","meaning":"The remains or trace of a living thing from long ago."},{"word":"preserved","meaning":"Kept safe from rotting or falling apart."},{"word":"paleontologists","meaning":"Scientists who study fossils."},{"word":"minerals","meaning":"Natural solid materials found in rocks and the ground."},{"word":"descendants","meaning":"Living things that come from earlier relatives."}],"comprehension":[{"q":"What is this article mostly about?","options":["How to keep a pet pigeon","How fossils form and what they teach us about dinosaurs","Why Antarctica is icy","How to play basketball"],"answer":1,"explain":"Terrific! The article explains how fossils form and what they tell us about dinosaurs."},{"q":"About how long ago did the last giant dinosaurs disappear?","options":["165 years ago","About 1,000 years ago","About 66 million years ago","Last year"],"answer":2,"explain":"Yes! The article says they 'disappeared about 66 million years ago.'"},{"q":"Why do paleontologists wrap fragile bones in plaster?","options":["To protect the bones from breaking while they are moved","To make the bones look white","To hide the bones from visitors","To make the bones heavier"],"answer":0,"explain":"Great inference! The plaster works 'like a cast on a broken arm,' keeping bones safe."},{"q":"In the article, the word 'preserved' means...","options":["broken into bits","painted bright colors","brand new","kept safe from falling apart"],"answer":3,"explain":"Correct! A fossil is the 'preserved remains' of a living thing, meaning it was kept safe over time."},{"q":"What happens right after an animal is buried by mud, sand, or ash?","options":["It becomes a museum","Birds eat the bones","The soft parts rot away","It turns into a pigeon"],"answer":2,"explain":"Well done! The text says 'The soft parts rot away, but the hard bones remain.'"}],"grammar":[{"skill":"Verb Tenses","q":"Which word in this sentence is a PAST tense verb: 'Dinosaurs ruled the land.'","options":["ruled","Dinosaurs","land","the"],"answer":0,"explain":"Yes! 'Ruled' ends in -ed and tells about something that already happened."},{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'The scientist carefully cleaned the bone.'","options":["carefully","scientist","cleaned","the"],"answer":1,"explain":"Correct! 'Scientist' names a person, so it is a noun. ('Bone' is a noun too!)"},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'Fossils ____ us about the past.'","options":["teaches","teaching","has taught","teach"],"answer":3,"explain":"Great! 'Fossils' is plural, so we use 'teach.'"},{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["Fossils can be bones teeth, or shells.","Fossils, can be bones, teeth or shells.","Fossils can be bones, teeth, or shells.","Fossils can, be bones teeth or shells."],"answer":2,"explain":"Right! Commas separate the items in the list: bones, teeth, or shells."}],"spelling":[{"word":"fossils","sentence":"Scientists who study ____ are called paleontologists.","meaning":"Remains of living things from long ago.","wrong":["fosils","fossles","fossels"]},{"word":"dinosaur","sentence":"People have discovered ____ bones on every continent.","meaning":"A reptile that lived millions of years ago.","wrong":["dinosour","dinasaur","dinosore"]},{"word":"skeletons","sentence":"Many museums let visitors see real dinosaur ____ up close.","meaning":"Frames of bones inside bodies.","wrong":["skelitons","skeletins","skelletons"]},{"word":"minerals","sentence":"Water carries ____ into the bones.","meaning":"Natural solid materials found in rocks.","wrong":["minerels","minnerals","minarals"]},{"word":"museum","sentence":"They carry the bones to a ____.","meaning":"A building where people view important objects.","wrong":["musem","museam","muzeum"]},{"word":"discovered","sentence":"People have ____ dinosaur bones on every continent.","meaning":"Found for the first time.","wrong":["discoverd","diskovered","discuvered"]}],"written":[{"q":"In your own words, explain how a dinosaur bone turns into a fossil.","minWords":12,"keyIdeas":[{"label":"The animal is buried by mud, sand, or ash","any":["buried","bury","mud","sand","ash","cover"]},{"label":"Soft parts rot and hard bones remain","any":["rot","soft","bone","hard","remain"]},{"label":"Layers pile on over millions of years","any":["layer","million","thousand","years","long time","pile","press"]},{"label":"Minerals replace the bone and turn it to rock","any":["mineral","replace","rock","stone","water"]}],"need":2,"sample":"First, the dinosaur is buried by mud or sand, and its soft parts rot away while the bones remain. Over millions of years, water carries minerals into the bones, and the minerals slowly replace the bone and turn it into rock."},{"q":"Why do you think some fossils are protected by law? Use details from the article.","minWords":8,"keyIdeas":[{"label":"So everyone can learn from them","any":["learn","everyone","study","science","teach","share"]},{"label":"Fossils are rare, old, or fragile","any":["rare","old","fragile","break","special","million","precious"]},{"label":"So they are kept safe in museums or not taken","any":["museum","safe","protect","take","steal","damage","ruin"]}],"need":2,"sample":"Some fossils are protected so that everyone can learn from them. They are very old and fragile, and if people took them home or broke them, scientists and museums could not study them."}],"fixit":[{"wrong":"Paleontologists has found dinosaur bones in antarctica.","right":"Paleontologists have found dinosaur bones in Antarctica.","errors":[{"bad":"has","good":"have","type":"Subject-Verb Agreement"},{"bad":"antarctica.","good":"Antarctica.","type":"Capital Letters"}]},{"wrong":"Fossils can be bones teeth, or shells","right":"Fossils can be bones, teeth, or shells.","errors":[{"bad":"bones","good":"bones,","type":"Punctuation"},{"bad":"shells","good":"shells.","type":"Punctuation"}]}]}];

/* ---- speech ---- */
let voice=null, VOICES=[];
function voiceScore(v){const n=v.name;let sc=0;
  if(/natural|neural/i.test(n))sc+=120;            /* Edge / Windows 11 neural voices */
  if(/online/i.test(n))sc+=30;
  if(/premium/i.test(n))sc+=100; if(/enhanced/i.test(n))sc+=85; if(/siri/i.test(n))sc+=90;
  if(/^google/i.test(n))sc+=70;                     /* Chrome's cloud voices */
  if(/aria|jenny|ava|zoe|allison|samantha|serena|libby|sonia|emma|michelle|ana\b|nicky|susan|karen|moira|tessa|natasha/i.test(n))sc+=20;
  if(/en[-_]US/i.test(v.lang))sc+=12;else if(/en[-_](GB|AU|CA|IE|NZ)/i.test(v.lang))sc+=8;else sc+=2;
  if(!v.localService)sc+=5;
  if(/david|mark|zira|hazel|george|fred|albert|bad news|bahh|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|junior|ralph|kathy|princess|hysterical|organ|superstar|wobble|jester|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|good news|deranged|pipe|espeak/i.test(n))sc-=80;
  return sc}
function pickVoice(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  voice=(S.voiceName&&VOICES.find(v=>v.name===S.voiceName))||VOICES[0]||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,800)}
let speakToken=0;
/* Speaks text sentence by sentence: sounds more natural and avoids Chrome cutting off long speech. */
function speak(text,rate,onend){try{if(!voice)pickVoice();speechSynthesis.cancel();const tok=++speakToken;
  const parts=String(text).match(/[^.!?;]+[.!?;]*["”’']?\s*/g)||[String(text)];let i=0;
  const next=()=>{if(tok!==speakToken)return;if(i>=parts.length){if(onend)onend();return}
    const u=new SpeechSynthesisUtterance(parts[i++].trim());if(voice){try{u.voice=voice;u.lang=voice.lang}catch(e){}}u.rate=rate||S.rate;u.pitch=1;u.volume=1;
    u.onend=next;u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")next()};speechSynthesis.speak(u)};
  next();return true}catch(e){return false}}
function voiceLabel(v){return v.name.replace(/^Microsoft /,"").replace(/ - English.*$/,"").replace(/\s*\(.*?\)\s*/g," ").trim()+(/natural|neural|premium|enhanced/i.test(v.name)?" ✨":"")+` (${v.lang})`}
function stopSpeak(){speakToken++;try{speechSynthesis.cancel()}catch(e){}}

/* confetti */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",sizeCv);sizeCv();
function confetti(n=140,ox,oy){const cols=["#ff5fa2","#7c5cff","#14b8a6","#ffc531","#ff8a3d","#3b82f6","#22c55e"];
  for(let i=0;i<n;i++){parts.push({x:ox??innerWidth/2,y:oy??innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,g:.35,s:Math.random()*8+5,
    c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.3,life:0,shape:Math.random()<.3?"c":"r"})}
  if(!raf)loop()}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);
  for(const p of parts){p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.shape==="c"){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;cx.clearRect(0,0,innerWidth,innerHeight)}}

let curTopic=null, readAloud=false, readMax=0;
function markVocab(text,vocab,used){let h=esc(text);
  for(const v of vocab){if(used.has(v.word.toLowerCase()))continue;const re=new RegExp("\\b("+reEsc(esc(v.word))+")\\b","i");
    if(re.test(h)){h=h.replace(re,`<span class="vw" data-w="${esc(v.word)}" data-m="${esc(v.meaning)}">$1</span>`);used.add(v.word.toLowerCase())}}
  return h}
function renderReader(id){const t=TOPICS.find(x=>x.id===id);if(!t)return go("home");curTopic=t;readAloud=false;readMax=0;const k=catOf(t.category);const used=new Set();
  $("#app").innerHTML=`<div class="screen"><div class="readerHead">
    <button class="iconbtn" onclick="go('home')" aria-label="Back">⬅️</button>
    <div class="bar"><i id="rbar" style="width:0%"></i></div>
    <button class="btn sm alt" id="ra" onclick="toggleRead()">🔊 Read to me</button></div>
  <article class="article card">
    <div class="ahead"><span class="bigem">${t.emoji}</span><br><span class="cat" style="background:${k.bg};color:${k.c}">${k.e} ${esc(t.category)}</span>
    <h1>${esc(t.title)}</h1><div class="muted" style="font-weight:700">⏱ ${t.minutes||4} minute read · Tap the <span class="vw" style="cursor:default">pink words</span> to see what they mean</div></div>
    ${t.paragraphs.map((p,i)=>`<p data-i="${i}">${markVocab(p,t.vocab,used)}</p>`).join("")}
    <div class="funfact"><span class="fe">🤯</span><div><b class="baloo" style="font-size:20px">Fun Fact!</b><div style="font-size:17px;font-weight:600;line-height:1.55">${esc(t.funFact)}</div></div></div>
    <div class="vocabBox"><h3>📝 Words to Know</h3><div class="vlist">${t.vocab.map(v=>`<span><b>${esc(v.word)}</b>: ${esc(v.meaning)}</span>`).join("")}</div></div>
    <div class="readDone">${mascot(80,"wow")}<h3 style="margin:6px 0 12px">Finished reading? Time for your challenge!</h3>
    ${S.inQuiz&&S.inQuiz.id===t.id?`<button class="btn" onclick="go('quiz','${t.id}')">Continue the Challenge (question ${S.inQuiz.idx+1} of ${S.inQuiz.items.length}) ▶</button><div style="margin-top:8px"><button class="peek" onclick="S.inQuiz=null;save();go('quiz','${t.id}')">Start over instead</button></div>`:`<button class="btn" onclick="go('quiz','${t.id}')">Start the Challenge 🎯</button>`}
    <div class="muted" style="margin-top:10px;font-weight:700">📖 5 reading questions · ✍️ 2 writing · ✏️ 4 grammar + 2 fix-its · 🐝 6 spelling words (listen & word detective)</div></div>
  </article></div>`;
  document.querySelectorAll(".vw[data-w]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();showTip(el)}));
}
function onScroll(){const b=$("#rbar");if(!b)return;const h=document.documentElement;const pct=Math.min(100,h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100);
  readMax=Math.max(readMax,pct);b.style.width=readMax+"%"}
addEventListener("scroll",onScroll,{passive:true});
let tipEl=null;
function showTip(el){closeTip();SFX.click();const r=el.getBoundingClientRect();tipEl=document.createElement("div");tipEl.className="tip";
  tipEl.innerHTML=`<b>${el.dataset.w} <span style="cursor:pointer" id="tipsay">🔊</span></b>${el.dataset.m}`;document.body.appendChild(tipEl);
  const w=tipEl.offsetWidth;tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+scrollX+r.width/2-w/2))+"px";tipEl.style.top=(r.bottom+scrollY+8)+"px";
  $("#tipsay").onclick=e=>{e.stopPropagation();speak(el.dataset.w+". "+el.dataset.m)}}
function closeTip(){if(tipEl){tipEl.remove();tipEl=null}}
document.addEventListener("click",closeTip);
function toggleRead(){const btn=$("#ra");if(readAloud){readAloud=false;stopSpeak();document.querySelectorAll(".article p").forEach(p=>p.classList.remove("speaking"));btn.textContent="🔊 Read to me";return}
  if(!("speechSynthesis" in window)){toast("😕","Your browser can't read aloud.");return}
  readAloud=true;btn.textContent="⏹ Stop";if(!S.stats.listened){S.stats.listened=true;save();checkBadges()}
  const ps=[...document.querySelectorAll(".article p[data-i]")];let i=0;
  const next=()=>{ps.forEach(p=>p.classList.remove("speaking"));if(!readAloud||i>=ps.length){readAloud=false;if($("#ra"))$("#ra").textContent="🔊 Read to me";return}
    const p=ps[i++];p.classList.add("speaking");p.scrollIntoView({behavior:"smooth",block:"center"});speak(p.textContent,S.rate,next)};next()}

  const r=scoreWriting(text,it);if(!Q.wFirst)Q.wFirst=r;Q.wLast=r;const stars=r.score>=.9?3:r.score>=.7?2:r.score>=.4?1:0;
  const missing=it.keyIdeas.filter((k,i)=>!r.found[i]);
  const ideaHTML=`${it.keyIdeas.map((k,i)=>r.found[i]?`<li class="yes">✅ ${esc(k.label)}</li>`:"").join("")}
     ${r.nf>=it.need?`<li class="yes">🎉 You included the most important ideas!</li>`:`<li class="no">💭 ${r.nf===0?"I couldn't find ideas from the story yet.":"Good start! Add one more idea."} ${missing.length?`<br><b>Hint:</b> Can you explain something about <i>${esc(missing[0].label.toLowerCase())}</i>?`:""}</li>`}
     ${!r.lenOK?`<li class="no">📏 Try writing a bit more: at least ${it.minWords} words (you have ${r.wc}).</li>`:""}`;
  const spHTML=r.sp.length?r.sp.map((e,i)=>`<div class="spfix"><span class="badw">${esc(e.word)}</span> ${e.sugg.length?`→ ${e.sugg.map(s=>`<button class="sugg" onclick="fixWord(this,'${esc(e.word).replace(/'/g,"\\'")}','${s.replace(/'/g,"\\'")}')">${esc(s)}</button>`).join("")}`:`<span class="muted">Check this spelling</span>`}</div>`).join(""):`<div class="good">🎉 No spelling mistakes!</div>`;
  const grHTML=r.gr.length?`<ul>${r.gr.map(g=>`<li><span class="gtype">${esc(g.type)}</span> ${g.m}</li>`).join("")}</ul>`:`<div class="good">🎉 Capitals, punctuation and grammar look great!</div>`;
  const meter=(v,c)=>`<div class="bar"><i style="width:${Math.round(v*100)}%;background:${c}"></i></div>`;
  const canRetry=Q.wTries<3&&r.score<.999;
  $("#wfb").innerHTML=`<div class="report">
    <div class="rhead"><span>📋 Writing Report Card <small class="muted">· check ${Q.wTries} of 3</small></span><span class="stars">${[1,2,3].map(n=>`<span class="${n<=stars?"":"off"}">⭐</span>`).join("")}</span></div>
    <div class="yourText"><small class="muted">Your writing:</small><br>${markText(text,r.sp)}</div>
    <div class="rgrid">
      <div class="rbox"><h4>📖 Ideas & Understanding</h4>${meter(r.ideas*(r.lenOK?1:.8),"linear-gradient(90deg,#ff8fc0,#ff5fa2)")}<ul>${ideaHTML}</ul></div>
      <div class="rbox"><h4>🔤 Spelling</h4>${meter(r.spell,"linear-gradient(90deg,#fcd34d,#f59e0b)")}${spHTML}</div>
      <div class="rbox"><h4>✏️ Grammar & Punctuation</h4>${meter(r.gram,"linear-gradient(90deg,#a78bfa,#7c5cff)")}${grHTML}</div>
    </div>
    <div class="spellActions">${canRetry?`<button class="btn" onclick="$('#wa').focus();$('#wa').scrollIntoView({behavior:'smooth',block:'center'})">✏️ Fix it up${Q.wTries===1?" (+5 bonus XP)":""}</button>`:""}
      <button class="btn ${canRetry?"alt":"green"}" onclick="finishWrite()">${canRetry?"I'm done ➜":"Finish ➜"}</button></div></div>`;
  $("#wchk").textContent=Q.wTries>=3?"No more checks":"Check again ✨";if(Q.wTries>=3){$("#wchk").disabled=true}
  if(r.score>=.9){SFX.ok();confetti(50)}else SFX.click();
  if(Q.wTries>=3||r.score>=.999){setTimeout(finishWrite,r.score>=.999?900:300)}
  else setTimeout(()=>$("#wfb").scrollIntoView({behavior:"smooth",block:"start"}),100)}
function fixWord(btn,bad,good){const wa=$("#wa");const re=new RegExp("\\b"+reEsc(bad)+"\\b");const rep=bad[0]===bad[0].toUpperCase()&&bad[0]!==bad[0].toLowerCase()?good[0].toUpperCase()+good.slice(1):good;
  wa.value=wa.value.replace(re,rep);wa.dispatchEvent(new Event("input"));btn.parentElement.innerHTML=`<span class="good">✅ ${esc(rep)}</span>`;SFX.coin()}
function finishWrite(){if(Q.answered)return;const it=Q.items[Q.idx];if(!Q.wLast){checkWrite();if(!Q.wLast)return}Q.answered=true;
  const r=Q.wLast;$("#wa").disabled=true;$("#wchk").disabled=true;document.querySelectorAll("#wfb .spellActions,.sugg").forEach(e=>e.remove());
  const improved=Q.wFirst&&Q.wTries>1&&r.score>Q.wFirst.score+.01;
  Q.score+=r.score;Q.res.write[0]+=r.score;Q.res.write[1]++;S.stats.write[0]+=r.score;S.stats.write[1]++;if(r.score>=.8)S.stats.writeGreat++;
  r.gr.forEach(g=>{const sk=S.stats.skills[g.type]=S.stats.skills[g.type]||[0,0];sk[1]++});
  const ok=r.score>=.7;let xp=Math.round(25*r.score)+(improved?5:0);if(Q.isDaily)xp*=2;Q.xp+=xp;Q.gems+=r.score>=.9?2:r.score>=.6?1:0;
  if(ok){Q.combo++;Q.best=Math.max(Q.best,Q.combo);SFX.ok()}else breakCombo();
  const b=$("#fb").getBoundingClientRect();flyXP(innerWidth/2,Math.min(innerHeight-60,Math.max(80,b.top)),`+${xp} XP`);$("#qxp").textContent=Q.xp;
  if(improved)toast("🛠️","<b>Great editing!</b> +5 bonus XP for fixing your work.");
  it.done=ok?"ok":"no";
  feedback(ok,"",`${improved?" You made your writing better by revising it. That's what real writers do!":""}<div class="sample"><b>⭐ Here's one great answer:</b>${esc(it.sample)}</div>`)}

/* ================= FIX THE SENTENCE UI ================= */
const toks=s=>s.replace(/[‘’]/g,"'").replace(/[“”]/g,'"').trim().split(/\s+/).filter(Boolean);
function renderFix(it){Q.fTries=0;const n=it.errors.length;
  $("#app").innerHTML=qShell(`<span class="skill" style="background:#ffe4e6;color:#be123c">🔧 Fix the Sentence</span>
    <div class="qtext">This sentence has <span style="color:#e11d48">${n} mistakes</span>. Rewrite it correctly!</div>
    <div class="broken"><span>🔧</span><div>${esc(it.wrong)}</div></div>
    <div class="wtips">Look for spelling, capital letters, punctuation and the right word forms. Edit the sentence in the box:</div>
    <textarea class="wa fx" id="fx" spellcheck="false" autocorrect="off" autocapitalize="off">${esc(it.wrong)}</textarea>
    <div class="spellActions"><button class="btn alt sm" onclick="$('#fx').value=Q.items[Q.idx].wrong;$('#fx').focus()">↺ Start over</button><button class="btn" id="fchk" onclick="checkFix(event)">Check ✓</button></div>
    <div id="ffb"></div><div id="fb"></div>`);
  const fx=$("#fx");setTimeout(()=>fx.focus({preventScroll:true}),400);fx.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(Q.answered){const nb=$("#nextb");if(nb)nb.click()}else checkFix()}})}
function evalFix(it,input){const u=toks(input),r=toks(it.right),w=toks(it.wrong);const errIdx=[];for(let i=0;i<w.length;i++)if(w[i]!==r[i])errIdx.push(i);
  let fixedSet=new Set(),extra=0;
  if(u.length===r.length){errIdx.forEach((i,k)=>{if(u[i]===r[i])fixedSet.add(k)});for(let i=0;i<r.length;i++)if(!errIdx.includes(i)&&u[i]!==r[i])extra++}
  else{it.errors.forEach((e,k)=>{if(u.includes(e.good)&&!(e.bad!==e.good&&u.includes(e.bad)))fixedSet.add(k)});extra=Math.abs(u.length-r.length)}
  /* map errIdx order to errors order by bad token */
  const fixed=it.errors.map(e=>{const pos=w.indexOf(e.bad);if(u.length===r.length&&pos>=0)return u[pos]===r[pos];return u.includes(e.good)&&!u.includes(e.bad)});
  const nf=fixed.filter(Boolean).length;return{fixed,nf,extra,perfect:nf===it.errors.length&&extra===0,score:Math.max(0,nf/it.errors.length-.25*extra)}}
function checkFix(ev){const it=Q.items[Q.idx];if(Q.answered)return;Q.fTries++;const r=evalFix(it,$("#fx").value);
  if(r.perfect||Q.fTries>=2){Q.answered=true;$("#fx").disabled=true;$("#fchk").disabled=true;
    let score=r.score*(Q.fTries>=2&&r.perfect?.8:Q.fTries>=2?.8:1);if(r.perfect&&Q.fTries===1)score=1;
    Q.score+=score;Q.res.gram[0]+=score;Q.res.gram[1]++;S.stats.fix[0]+=score;S.stats.fix[1]++;if(r.perfect&&Q.fTries===1)S.stats.fixPerfect++;
    it.errors.forEach((e,k)=>{const sk=S.stats.skills[e.type]=S.stats.skills[e.type]||[0,0];sk[1]++;if(r.fixed[k])sk[0]++});
    const w=toks(it.wrong),rt=toks(it.right);
    const line=rt.map((t,i)=>w[i]!==t?`<span class="${(()=>{const k=it.errors.findIndex(e=>e.good===t);return k>=0&&r.fixed[k]?"tf":"tm"})()}">${esc(t)}</span>`:esc(t)).join(" ");
    const list=it.errors.map((e,k)=>`<li>${r.fixed[k]?"✅":"❌"} <s>${esc(e.bad)}</s> → <b>${esc(e.good)}</b> <span class="gtype">${esc(e.type)}</span></li>`).join("");
    $("#ffb").innerHTML=`<div class="fixans"><small class="muted">Correct sentence:</small><div class="fixline">${line}</div><ul>${list}</ul>${r.extra?`<div class="muted" style="font-weight:700">⚠️ Watch out: ${r.extra} other word${r.extra>1?"s were":" was"} changed by mistake.</div>`:""}</div>`;
    const ok=score>=.75;if(ok){const b=$("#fchk").getBoundingClientRect();award(Math.round(15*score),ev&&ev.clientX?ev:{clientX:b.left+b.width/2,clientY:b.top})}else breakCombo();
    it.done=ok?"ok":"no";feedback(ok,r.perfect?(Q.fTries===1?"You found every mistake on the first try!":"You fixed them all on your second try!"):`You fixed ${r.nf} of ${it.errors.length} mistakes.`)}
  else{SFX.no();const left=it.errors.filter((e,k)=>!r.fixed[k]);
    $("#ffb").innerHTML=`<div class="feedback no">${mascot(60,"hmm","shake")}<div class="fb"><b>${r.nf?`You fixed ${r.nf} of ${it.errors.length}! 🔍`:"Not quite yet! 🔍"}</b>
      Still to fix: ${left.map(e=>`<span class="gtype">${esc(e.type)}</span>`).join(" ")}${r.extra?`<br>⚠️ Careful: ${r.extra} word${r.extra>1?"s":""} that were already right got changed.`:""}<br>Try once more!</div></div>`;
    $("#fx").focus()}}

/* ================= QUIZ ================= */
function saveQuiz(){if(!Q)return;try{S.inQuiz=JSON.parse(JSON.stringify(Q,(k,v)=>k==="t"?undefined:v));S.inQuiz.id=Q.t.id;save()}catch(e){}}
function startQuiz(id){const t=TOPICS.find(x=>x.id===id);if(!t)return go("home");stopSpeak();
  if(S.inQuiz&&S.inQuiz.id===id){Q=Object.assign({},S.inQuiz,{t});delete Q.id;Q.answered=false;Q.practice=false;renderQ();toast("💾","Welcome back! Picking up where you left off.");return}
  const mc=(q,type)=>{const order=shuffle(q.options.map((o,i)=>i));return{type,q:q.q,skill:q.skill,explain:q.explain,options:order.map(i=>q.options[i]),answer:order.indexOf(q.answer)}};
  const items=[...t.comprehension.map(q=>mc(q,"comp")),...(t.written||[]).map(w=>({type:"write",...w})),...t.grammar.map(q=>mc(q,"gram")),...(t.fixit||[]).map(f=>({type:"fix",...f})),...t.spelling.map(s=>({type:"spell",...s}))];
  Q={t,items,idx:0,combo:0,best:0,score:0,max:items.length,res:{comp:[0,0],write:[0,0],gram:[0,0],spell:[0,0]},xp:0,gems:0,typed:0,isDaily:dailyTopic()&&dailyTopic().id===t.id,answered:false,hint:0,tries:0};
  saveQuiz();renderQ()}
const STAGES=[["comp","📖 Understand"],["write","✍️ Write"],["gram","✏️ Grammar"],["spell","🐝 Spelling"]];
const stageOf=t=>t==="fix"?"gram":t;
function qShell(inner){const it0=Q.items[Q.idx];const it={type:stageOf(it0.type)};const same=Q.items.map((x,i)=>({x,i})).filter(o=>stageOf(o.x.type)===it.type);
  return `<div class="screen"><div class="readerHead"><button class="iconbtn" onclick="quitQuiz()" aria-label="Quit">✖️</button>
    <div class="bar"><i style="width:${(Q.idx/Q.items.length*100)}%"></i></div>
    <span class="pill">⚡ <span id="qxp">${Q.xp}</span> XP</span></div>
   <div class="qwrap"><div class="stages">${STAGES.map(([k,l])=>{const ti=STAGES.findIndex(s=>s[0]===it.type),si=STAGES.findIndex(s=>s[0]===k);
      if(k==="write"&&!Q.items.some(x=>x.type==="write"))return "";return `<span class="stage ${k===it.type?"on":si<ti?"done":""}">${si<ti?"✓ ":""}${l}</span>`}).join("")}</div>
   <div class="qcard card"><div class="qtop"><div class="dots">${same.map(o=>`<i class="${o.i===Q.idx?"cur":o.x.done==="ok"?"ok":o.x.done==="no"?"no":""}"></i>`).join("")}</div>
     <span class="combo ${Q.combo>=2?"show":""}" id="combo">🔥 ${Q.combo} in a row!</span></div>${inner}</div></div></div>`}
function renderQ(){Q.answered=false;Q.hint=0;Q.tries=0;window.scrollTo({top:0,behavior:"smooth"});const it=Q.items[Q.idx];
  if(it.type==="spell")return renderSpell(it);
  if(it.type==="write")return renderWrite(it);
  if(it.type==="fix")return renderFix(it);
  $("#app").innerHTML=qShell(`${it.type==="gram"?`<span class="skill">✏️ ${esc(it.skill||"Grammar")}</span>`:`<span class="skill" style="background:#fce7f3;color:#be185d">📖 Reading</span>`}
    <div class="qtext">${esc(it.q)}</div>
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" style="animation-delay:${i*70}ms" onclick="answerMC(${i},event)"><span class="let">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${it.type==="comp"?`<div style="text-align:center;margin-top:14px"><button class="peek" onclick="peek()">👀 Peek at the story</button></div>`:""}
    <div id="fb"></div>`)}
function answerMC(i,ev){if(Q.answered)return;Q.answered=true;const it=Q.items[Q.idx];const ok=i===it.answer;
  const btns=document.querySelectorAll(".opt");btns.forEach(b=>b.disabled=true);btns[it.answer].classList.add("right");if(!ok)btns[i].classList.add("wrong");
  Q.res[it.type][1]++;S.stats[it.type][1]++;
  if(it.type==="gram"&&it.skill){const sk=S.stats.skills[it.skill]=S.stats.skills[it.skill]||[0,0];sk[1]++;if(ok)sk[0]++}
  if(ok){Q.res[it.type][0]++;S.stats[it.type][0]++;Q.score+=1;award(10,ev)}else breakCombo();
  it.done=ok?"ok":"no";feedback(ok,it.explain)}
function award(base,ev){Q.combo++;Q.best=Math.max(Q.best,Q.combo);const bonus=Q.combo>=3?Math.min(10,(Q.combo-2)*2):0;let xp=base+bonus;if(Q.isDaily)xp*=2;
  Q.xp+=xp;Q.gems+=1;SFX.ok();const x=ev?ev.clientX:innerWidth/2,y=ev?ev.clientY:innerHeight/2;flyXP(x,y,`+${xp} XP${bonus?" 🔥":""}`);
  if(Q.combo===5||Q.combo===10){confetti(60,x,y);toast("🔥",`<b>${Q.combo} in a row!</b> Combo bonus!`)}
  const c=$("#qxp");if(c)c.textContent=Q.xp}
function breakCombo(){Q.combo=0;SFX.no()}
function feedback(ok,explain,extra=""){const last=Q.idx===Q.items.length-1;
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${mascot(64,ok?"happy":"hmm",ok?"jump":"shake")}
   <div class="fb"><b>${ok?pick(CHEERS_OK):pick(CHEERS_NO)}</b>${explain?esc(explain):""}${extra}</div>
   <button class="btn ${ok?"green":""}" id="nextb" onclick="nextQ()">${last?"See results 🏁":"Next ➜"}</button></div>`;
  const c=$("#combo");if(c){c.textContent=`🔥 ${Q.combo} in a row!`;c.className="combo "+(Q.combo>=2?"show":"")}
  setTimeout(()=>{const n=$("#nextb");if(n){n.focus({preventScroll:true});n.scrollIntoView({behavior:"smooth",block:"nearest"})}},150)}
function nextQ(){SFX.click();if(Q.idx<Q.items.length-1){const prev=stageOf(Q.items[Q.idx].type);Q.idx++;const nt=stageOf(Q.items[Q.idx].type);
    if(nt!==prev){const lbl=STAGES.find(s=>s[0]===nt)[1];toast(lbl.split(" ")[0],`<b>Next up: ${lbl.slice(2)}!</b>`)}saveQuiz();renderQ()}else finishQuiz()}
function peek(){SFX.click();const t=Q.t;const d=document.createElement("div");d.className="overlay";d.style.placeItems="stretch end";d.onclick=e=>{if(e.target===d)d.remove()};
  d.innerHTML=`<div class="drawer"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2>${t.emoji} ${esc(t.title)}</h2>
   <button class="iconbtn" onclick="this.closest('.overlay').remove()">✖️</button></div>${t.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;document.body.appendChild(d)}
function quitQuiz(){modal(`<div class="mi">🤔</div><h2>Leave the challenge?</h2><p class="muted" style="font-weight:700">💾 Your answers so far are saved. You can continue this challenge any time.</p>
  <div class="row"><button class="btn alt" onclick="closeModal()">Keep playing</button><button class="btn" onclick="closeModal();Q=null;go('home')">Leave</button></div>`)}

/* spelling */
const canSpeak=()=>"speechSynthesis" in window;
function maskDef(it){return esc(it.meaning).replace(new RegExp("\\b"+reEsc(esc(it.word))+"\\b","gi"),"this word")}
function renderSpell(it){const n=it.word.length;const k=Q.items.filter(x=>x.type==="spell").indexOf(it);
  it.mode=(k%2===0&&canSpeak())?"listen":"detective";Q.sTries=0;Q.sHints=0;Q.hint=0;Q.sClue=false;Q.sHeard=false;Q.practice=false;
  const listen=it.mode==="listen";
  $("#app").innerHTML=qShell(`<div class="spell">
    ${listen?`<span class="skill" style="background:#fef3c7;color:#b45309">🎧 Listen & Spell</span>
      <div class="qtext" style="margin-bottom:6px">Listen carefully, then type the word you hear!</div>
      <div class="hear"><button class="hearBtn" id="hb" onclick="sayWord(1)" aria-label="Hear the word">🔊</button>
        <button class="hearBtn slow" onclick="sayWord(.55)" aria-label="Hear it slowly" title="Slowly">🐢</button>
        <button class="hearBtn slow" style="background:linear-gradient(135deg,#f9a8d4,#ec4899);box-shadow:0 5px 0 #be185d" onclick="saySentence()" aria-label="Hear it in a sentence" title="In a sentence">💬</button></div>
      <div class="muted" style="font-weight:700;font-size:14px;margin-bottom:6px">🔊 word · 🐢 slowly · 💬 in a sentence</div>`
    :`<span class="skill" style="background:#e0e7ff;color:#4338ca">🕵️ Word Detective</span>
      <div class="qtext" style="margin-bottom:10px">Read the clue. What's the word, and how do you spell it?</div>
      <div class="defcard"><span class="dq">🔎</span><div><small>CLUE</small><div>${maskDef(it)}</div></div></div>
      <div class="muted" style="font-weight:800;margin-top:8px">It has <b style="color:var(--purple)">${n} letters</b> and it's a word from the story.</div>`}
    <div id="clues"></div>
    <div class="tiles" id="tiles">${Array(n).fill('<span></span>').join("")}</div>
    <input class="spellInput" id="sp" maxlength="${n+6}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the word">
    <div class="spellActions" id="sacts">
      ${listen?`<button class="btn alt sm" id="clueb" onclick="spellClue()">💡 What does it mean?</button>`
              :`<button class="btn alt sm" id="clueb" onclick="spellClue()">📝 Sentence clue</button>${canSpeak()?`<button class="btn alt sm" id="hearb" onclick="spellHear()">🔊 Hear it</button>`:""}`}
      <button class="btn alt sm" id="hintb" onclick="hint()">💎2 · Show a letter</button>
      <button class="btn" id="chk" onclick="checkSpell(event)">Check ✓</button></div>
    <div class="muted" id="hintnote" style="font-size:13px;font-weight:700;margin-top:8px">Fewer hints = more XP!</div>
    <div id="fb"></div></div>`);
  const inp=$("#sp");inp.addEventListener("input",updTiles);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(Q.practice)return practiceCheck();if(Q.answered){const nb=$("#nextb");if(nb)nb.click()}else checkSpell()}});
  setTimeout(()=>{inp.focus({preventScroll:true});if(listen)sayWord(1)},450)}
function sayWord(rate){const it=Q.items[Q.idx];const hb=$("#hb");if(hb){hb.classList.remove("ring");void hb.offsetWidth;hb.classList.add("ring")}
  if(!speak(it.word,rate*S.rate))toast("😕","Sound isn't available. Try a clue instead!")}
function saySentence(){const it=Q.items[Q.idx];speak(it.sentence.replace("____",it.word),S.rate)}
function useHint(){Q.sHints++;const n=$("#hintnote");if(n)n.textContent=`Hints used: ${Q.sHints}`}
function spellClue(){const it=Q.items[Q.idx];if(Q.sClue||Q.answered)return;Q.sClue=true;useHint();SFX.click();const b=$("#clueb");if(b)b.remove();
  const listen=it.mode==="listen";
  $("#clues").insertAdjacentHTML("beforeend",listen?`<div class="meaning cluepop">💡 Meaning: ${maskDef(it)}</div>`
    :`<div class="sentence cluepop">${esc(it.sentence).replace("____",`<span class="blank">${it.word[0].toLowerCase()}${"_".repeat(it.word.length-1).split("").join(" ")}</span>`)}</div>`);$("#sp").focus()}
function spellHear(){if(Q.answered)return;if(!Q.sHeard){Q.sHeard=true;useHint()}const b=$("#hearb");if(b)b.textContent="🔊 Hear again";speak(Q.items[Q.idx].word,S.rate);$("#sp").focus()}
function updTiles(){const it=Q.items[Q.idx];const v=$("#sp").value.replace(/\s/g,"");const ts=document.querySelectorAll("#tiles span");
  ts.forEach((t,i)=>{t.textContent=v[i]||"";t.className=v[i]?(i<Q.hint?"f h":"f"):""})}
function hint(){const it=Q.items[Q.idx];if(Q.answered)return;if(Q.hint>=it.word.length-1){toast("🙈","No more letters to show!");return}

function lockSpell(){["#sp","#chk","#hintb","#clueb","#hearb"].forEach(s=>{const e=$(s);if(e)e.disabled=true})}
function checkSpell(ev){const it=Q.items[Q.idx];if(Q.answered)return;const raw=$("#sp").value.trim();const v=raw.toLowerCase();const w=it.word.toLowerCase();
  if(!v){$("#sp").style.animation="shakeX .4s";setTimeout(()=>$("#sp").style.animation="",450);return}
  Q.sTries++;
  if(v===w){Q.answered=true;lockSpell();const pts=Math.max(.4,(Q.sTries===1?1:.6)-.2*Q.sHints);
    Q.score+=pts;Q.res.spell[0]+=pts;Q.res.spell[1]++;S.stats.spell[0]++;S.stats.spell[1]++;if(Q.sTries===1&&!Q.sHints)Q.typed++;
    showTiles(it.word,"g");it.done="ok";const r=$("#chk").getBoundingClientRect();
    award(Math.round(15*pts),ev&&ev.clientX?ev:{clientX:r.left+r.width/2,clientY:r.top});
    if(Q.sTries>1)Q.combo=Math.min(Q.combo,1);
    feedback(true,`${it.mode==="detective"?`You figured it out! `:""}“${it.word}” is spelled ${it.word.toUpperCase().split("").join("-")}.${Q.sTries>1?" You got it on your second try!":""}${it.mode==="detective"?"":` It means: ${it.meaning}`}`);return}
  /* wrong */
  const ts=document.querySelectorAll("#tiles span");let right=0;
  ts.forEach((t,i)=>{const c=v[i]||"";t.textContent=c;const ok=c&&c===w[i];if(ok)right++;t.className=c?(ok?"g":"x"):"";t.style.animationDelay=(i*50)+"ms"});
  if(Q.sTries===1){SFX.no();Q.combo=0;$("#sp").style.animation="shakeX .4s";setTimeout(()=>{const s=$("#sp");if(s)s.style.animation=""},450);
    const lenMsg=v.length!==w.length?` Your word has ${v.length} letters, but this word has ${w.length}.`:"";
    let extra="";if(it.mode==="listen"&&!Q.sClue){spellClue();Q.sHints--;const n=$("#hintnote");if(n)n.textContent=`Hints used: ${Q.sHints}`}
    if(it.mode==="detective"&&!Q.sClue){spellClue();Q.sHints--;const n=$("#hintnote");if(n)n.textContent=`Hints used: ${Q.sHints}`}
    $("#fb").innerHTML=`<div class="feedback no">${mascot(60,"hmm","shake")}<div class="fb"><b>${right?`${right} letter${right>1?"s":""} in the right spot! 🍀`:"Not quite! 🍀"}</b>
      Green letters are correct. Fix the red ones and try again!${lenMsg} I added a clue to help.</div></div>`;
    if(it.mode==="listen")setTimeout(()=>sayWord(.8),300);
    $("#sp").focus();$("#sp").select();return}
  /* second miss: show the answer, then practice typing it */
  Q.answered=true;lockSpell();breakCombo();Q.res.spell[1]++;S.stats.spell[1]++;it.done="no";
  setTimeout(()=>showTiles(it.word,"g"),700);
  $("#fb").innerHTML=`<div class="feedback no">${mascot(60,"hmm")}<div class="fb"><b>Good try! The word is “${esc(it.word)}”.</b>
     It's spelled <b style="display:inline;font-size:18px;letter-spacing:2px">${it.word.toUpperCase().split("").join("-")}</b>. You wrote “${esc(raw)}”.<br>
     ✍️ Practice: type it once correctly to remember it (+2 XP).</div></div>
    <div style="margin-top:12px"><input class="spellInput" id="pr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type ${esc(it.word.toLowerCase())}"></div>
    <div class="spellActions"><button class="btn alt sm" onclick="practiceDone(false)">Skip ➜</button><button class="btn green" onclick="practiceCheck()">Check ✓</button></div><div id="fb2"></div>`;
  if(canSpeak())setTimeout(()=>speak(it.word+". "+it.word.split("").join(", ")+". "+it.word,.8*S.rate),400);
  Q.practice=true;const pr=$("#pr");pr.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();practiceCheck()}});setTimeout(()=>pr.focus(),200)}
function practiceCheck(){const it=Q.items[Q.idx];const pr=$("#pr");if(!pr)return;if(pr.value.trim().toLowerCase()===it.word.toLowerCase()){practiceDone(true)}
  else{SFX.no();pr.style.animation="shakeX .4s";setTimeout(()=>pr.style.animation="",450);toast("👀",`Look closely: <b>${esc(it.word)}</b>`)}}

/* ===================== GAME GRAPHICS (procedural canvas art) ===================== */
const GFX = (()=>{
const TAU=Math.PI*2;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,col])=>g.addColorStop(o,col));return g}
function rg(c,x,y,r0,r1,st,x1,y1){const g=c.createRadialGradient(x,y,r0,x1??x,y1??y,r1);st.forEach(([o,col])=>g.addColorStop(o,col));return g}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const r=(A>>16&255)*(1-t)+(B>>16&255)*t,g=(A>>8&255)*(1-t)+(B>>8&255)*t,bl=(A&255)*(1-t)+(B&255)*t;
  return"#"+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(bl)).toString(16).slice(1)}
function glow(c,x,y,r,col,a=1){if(!(r>0)||!(a>0))return;c.save();c.globalCompositeOperation="lighter";c.globalAlpha=a;c.fillStyle=rg(c,x,y,0,r,[[0,col],[1,hexA(col.length===7?col:"#ffffff",0)]]);c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore()}
function noise1(seed){const r=rng(seed);const v=Array.from({length:512},()=>r());return x=>{const i=Math.floor(x),f=x-i,s=f*f*(3-2*f);return v[i&511]*(1-s)+v[(i+1)&511]*s}}
function fbm(n,x,oct=4){let a=0,amp=.5,f=1;for(let i=0;i<oct;i++){a+=amp*n(x*f);amp*=.5;f*=2.03}return a}

  bone:{m:"#d4cab2",d:"#57504a",l:"#fff6de",g:"#7fffd4",e:"#00ffc8"},
  violet:{m:"#8a3fb5",d:"#2c0e44",l:"#d49dff",g:"#f0b3ff",e:"#ff4fd8"},

/* ---------------- sky + backdrop ---------------- */
const SKY={
  day:[["0","#3f7fd0"],[".55","#9cc9f0"],["1","#f3e6c4"]],
  dusk:[["0","#24194f"],[".45","#7d3b78"],[".75","#ee7f47"],["1","#ffcc80"]],
  night:[["0","#03060f"],[".6","#0f1940"],["1","#2b2d6b"]]
};
const BIOME={
  academy:{far:"castle",mid:"hedge",ground:["#3d3a4a","#24212e"],edge:"#5d5870",fog:"#9aa0ff",parts:"lantern",tint:null},
  forest:{far:"hills",mid:"trees",ground:["#2f4a22","#17260f"],edge:"#5e8f3a",fog:"#cfe8c0",parts:"firefly",tint:null},
  swamp:{far:"hills",mid:"deadtrees",ground:["#2d3a24","#141b10"],edge:"#4f6b34",fog:"#9fd18a",parts:"firefly",tint:"#1f3a26"},
  cave:{far:"cave",mid:"stalag",ground:["#2b2a33","#121118"],edge:"#4a4858",fog:"#7fd6ff",parts:"mote",tint:"#000000",nosky:true},
  coast:{far:"ocean",mid:"cliffs",ground:["#c9b27e","#8a7448"],edge:"#e8d7a8",fog:"#e0f4ff",parts:"spray",tint:null},
  sea:{far:"ocean",mid:"none",ground:["#6b4a2b","#3a2615"],edge:"#8a6440",fog:"#d6ecff",parts:"spray",tint:null,deck:true},
  mountain:{far:"peaks",mid:"pines",ground:["#e9eef5","#aeb9c8"],edge:"#ffffff",fog:"#ffffff",parts:"snow",tint:null},
  ice:{far:"glacier",mid:"icespire",ground:["#cfe9f7","#8fbcd8"],edge:"#f4fbff",fog:"#d8f4ff",parts:"snow",tint:null,aurora:true},
  volcano:{far:"volcano",mid:"basalt",ground:["#2a1a17","#120a08"],edge:"#5a2a1a",fog:"#ff7a3a",parts:"ember",tint:"#3a0a00",forceSky:[["0","#140303"],[".5","#4a1006"],["1","#b8400e"]]},
  ruins:{far:"hills",mid:"columns",ground:["#5a5346","#2e2a22"],edge:"#7f7764",fog:"#e8dcc0",parts:"mote",tint:null},
  citadel:{far:"spires",mid:"statues",ground:["#25202f","#0f0b16"],edge:"#433a55",fog:"#b07cff",parts:"wisp",tint:"#12041f",forceSky:[["0","#05010b"],[".55","#220a35"],["1","#4b1f5e"]]},
  sky:{far:"clouds",mid:"islands",ground:["#8a7fa8","#4b4466"],edge:"#cfc6ee",fog:"#ffffff",parts:"cloud",tint:null}
};
const GROUND_Y=440, VH=540;

function makeCanvas(w,h){const c=document.createElement("canvas");c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}

function drawSky(c,w,biome,time,seed){const B=BIOME[biome];const st=B.forceSky||SKY[time];
  c.fillStyle=lg(c,0,0,0,VH,st.map(([o,col])=>[+o,col]));c.fillRect(0,0,w,VH);
  const r=rng(seed);
  if(B.nosky){c.fillStyle=lg(c,0,0,0,VH,[[0,"#050608"],[.6,"#10161c"],[1,"#1b2228"]]);c.fillRect(0,0,w,VH);return}
  if(time==="night"||B.forceSky){for(let i=0;i<w*0.35;i++){const x=r()*w,y=r()*VH*.7,s=r()*1.4+.2;c.fillStyle=`rgba(255,255,255,${.3+r()*.7})`;c.fillRect(x,y,s,s)}
    if(time==="night"&&!B.forceSky){const mx=w*.78,my=110;c.fillStyle=rg(c,mx,my,10,140,[[0,"rgba(220,230,255,.35)"],[1,"rgba(220,230,255,0)"]]);c.fillRect(mx-150,my-150,300,300);
      c.fillStyle=rg(c,mx-10,my-10,5,42,[[0,"#fffdf0"],[.7,"#e8e4d0"],[1,"#c9c5b0"]]);c.beginPath();c.arc(mx,my,40,0,TAU);c.fill();
      c.fillStyle="rgba(150,145,130,.35)";[[12,-8,8],[-14,10,6],[4,16,5],[-6,-18,4]].forEach(([dx,dy,rr])=>{c.beginPath();c.arc(mx+dx,my+dy,rr,0,TAU);c.fill()})}}
  if(time==="day"&&!B.forceSky){const sx=w*.8,sy=90;c.fillStyle=rg(c,sx,sy,10,260,[[0,"rgba(255,250,220,.9)"],[.15,"rgba(255,240,190,.5)"],[1,"rgba(255,240,190,0)"]]);c.fillRect(0,0,w,VH)}
  if(time==="dusk"&&!B.forceSky){const sx=w*.7,sy=VH*.62;c.fillStyle=rg(c,sx,sy,20,380,[[0,"rgba(255,230,160,.95)"],[.12,"rgba(255,170,90,.55)"],[1,"rgba(255,120,80,0)"]]);c.fillRect(0,0,w,VH)}
  /* soft clouds */
  if(biome!=="cave"){for(let i=0;i<7;i++){const cx=r()*w,cy=40+r()*170,cw=120+r()*240;const col=time==="night"?"rgba(120,130,180,.10)":time==="dusk"?"rgba(255,180,160,.18)":"rgba(255,255,255,.35)";
    for(let k=0;k<6;k++){c.fillStyle=col;c.beginPath();c.ellipse(cx+(k-3)*cw/7,cy+Math.sin(k*1.7)*8,cw/4.5,18+r()*14,0,0,TAU);c.fill()}}}
}
function atmos(base,time,f){const t=time==="day"?"#a9cdee":time==="dusk"?"#c77a86":"#26305e";return mix(base,t,f)}

function drawFar(c,w,biome,time,seed){const B=BIOME[biome];const r=rng(seed+7);const n=noise1(seed+3);
  const ridge=(baseY,amp,freq,col,o=0)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,VH);for(let x=0;x<=w;x+=6){c.lineTo(x,baseY-fbm(n,(x+o)*freq)*amp)}c.lineTo(w,VH);c.fill()};
  const t=time;
  switch(B.far){
  case"castle":{ridge(360,90,.004,atmos("#1d1a33",t,.45),0);
    const cx=w*.35;const towers=[[0,150,40],[-90,110,30],[90,120,32],[-160,80,24],[170,90,26],[40,190,26]];
    towers.forEach(([dx,h,tw])=>{const x=cx+dx,y=330-h;c.fillStyle=lg(c,x-tw/2,0,x+tw/2,0,[[0,"#1a1730"],[.5,"#2c2850"],[1,"#141226"]]);c.fillRect(x-tw/2,y,tw,h+40);
      c.fillStyle="#120f22";c.beginPath();c.moveTo(x-tw/2-6,y);c.lineTo(x,y-tw*1.6);c.lineTo(x+tw/2+6,y);c.fill();
      for(let k=0;k<3;k++){const wy=y+18+k*28;if(wy>370)break;const lit=r()<.8;c.fillStyle=lit?"#ffd27a":"#2a2645";c.fillRect(x-4,wy,8,12);if(lit)glow(c,x,wy+6,18,"#ffb347",.6)}});
    c.fillStyle="#1a1730";c.fillRect(cx-170,300,340,80);for(let i=0;i<14;i++){c.fillRect(cx-170+i*25,292,12,10)}
    for(let i=0;i<10;i++){c.fillStyle="#ffd27a";c.fillRect(cx-150+i*32,322,6,9);glow(c,cx-147+i*32,326,12,"#ffb347",.5)}
    ridge(400,40,.01,atmos("#16132a",t,.15),300);break}
  case"hills":ridge(340,140,.0025,atmos("#3b5a6b",t,.6));ridge(380,110,.004,atmos("#2b4a3a",t,.4),500);ridge(410,70,.007,atmos("#1f3a26",t,.25),900);break;
  case"cave":{c.fillStyle=lg(c,0,0,0,VH,[[0,"#0a0c10"],[1,"#151a20"]]);c.fillRect(0,0,w,VH);
    for(let i=0;i<w/60;i++){const x=r()*w,y=r()*VH*.8;const col=r()<.5?"#58e1ff":"#9cff9c";glow(c,x,y,8+r()*16,col,.35);c.fillStyle=col;c.fillRect(x,y,1.5,1.5)}
    c.fillStyle="#07080b";c.beginPath();c.moveTo(0,0);for(let x=0;x<=w;x+=8)c.lineTo(x,40+fbm(n,x*.01)*110);c.lineTo(w,0);c.fill();
    ridge(380,120,.006,"#0e1116");break}
  case"ocean":{const hy=330;c.fillStyle=lg(c,0,hy,0,VH,[[0,atmos("#2c6d9a",t,.35)],[1,atmos("#0b2b46",t,.15)]]);c.fillRect(0,hy,w,VH-hy);
    for(let i=0;i<w/4;i++){const x=r()*w,y=hy+Math.pow(r(),2)*(VH-hy);c.fillStyle=`rgba(255,255,255,${.05+r()*.18})`;c.fillRect(x,y,8+r()*20,1.2)}
    if(t!=="night"){c.fillStyle=t==="dusk"?"rgba(255,180,100,.35)":"rgba(255,255,230,.25)";c.beginPath();c.ellipse(w*.72,hy+40,60,140,0,0,TAU);c.fill()}
    ridge(hy+2,40,.006,atmos("#2d3f4f",t,.6),100);break}
  case"peaks":{const col=atmos("#7f93b3",t,.45);c.fillStyle=col;c.beginPath();c.moveTo(0,VH);let x=0;
    while(x<w){const pw=160+r()*220,ph=150+r()*170;c.lineTo(x+pw/2,360-ph);c.lineTo(x+pw,360);x+=pw*.7}c.lineTo(w,VH);c.fill();
    x=0;c.fillStyle="rgba(255,255,255,.85)";while(x<w){const pw=160+r()*220,ph=150+r()*170;const px=x+pw/2,py=360-ph;c.beginPath();c.moveTo(px,py);c.lineTo(px-pw*.18,py+ph*.28);c.lineTo(px-pw*.05,py+ph*.22);c.lineTo(px+pw*.06,py+ph*.32);c.lineTo(px+pw*.18,py+ph*.26);c.fill();x+=pw*.7}
    ridge(400,80,.005,atmos("#58698a",t,.3),400);break}
  case"glacier":ridge(350,150,.003,atmos("#a8d4ef",t,.4));ridge(390,90,.006,atmos("#7fb6dc",t,.25),300);
    for(let i=0;i<w/120;i++){const x=r()*w;c.fillStyle="rgba(255,255,255,.35)";c.beginPath();c.moveTo(x,400);c.lineTo(x+10,300-r()*60);c.lineTo(x+24,400);c.fill()}break;
  case"volcano":{const vx=w*.55;c.fillStyle=lg(c,vx-300,0,vx+300,0,[[0,"#1b0b08"],[.5,"#2e130c"],[1,"#140705"]]);c.beginPath();c.moveTo(vx-420,VH);c.lineTo(vx-70,150);c.lineTo(vx+70,150);c.lineTo(vx+420,VH);c.fill();
    glow(c,vx,150,160,"#ff5a1f",.7);c.strokeStyle="#ff7a2a";c.lineWidth=3;for(let k=0;k<4;k++){c.beginPath();let lx=vx-40+k*25,ly=152;c.moveTo(lx,ly);while(ly<420){lx+=(r()-.5)*30;ly+=20;c.lineTo(lx,ly)}c.stroke()}
    ridge(400,90,.006,"#1a0c09",200);break}
  case"spires":{ridge(380,60,.006,"#1a0f28");for(let i=0;i<w/70;i++){const x=r()*w,h=80+r()*200,sw=10+r()*22;c.fillStyle=lg(c,x,0,x+sw,0,[[0,"#120a1c"],[1,"#24163a"]]);c.beginPath();c.moveTo(x,400);c.lineTo(x+sw/2,400-h);c.lineTo(x+sw,400);c.fill();if(r()<.4){c.fillStyle="#c77dff";c.fillRect(x+sw/2-2,400-h*.6,4,6);glow(c,x+sw/2,400-h*.6,14,"#b062ff",.6)}}
    const cx=w*.6;c.fillStyle="#0d0716";c.beginPath();c.moveTo(cx-60,400);c.lineTo(cx-30,90);c.lineTo(cx,30);c.lineTo(cx+30,90);c.lineTo(cx+60,400);c.fill();c.fillStyle="#ff47e6";c.fillRect(cx-5,120,10,16);glow(c,cx,128,40,"#ff47e6",.7);break}
  case"clouds":for(let L=0;L<3;L++){for(let i=0;i<w/90;i++){const x=r()*w,y=330+L*45+r()*30;c.fillStyle=`rgba(255,255,255,${.25+L*.2})`;c.beginPath();c.ellipse(x,y,70+r()*80,22+r()*16,0,0,TAU);c.fill()}}
    for(let i=0;i<4;i++){const x=r()*w,y=150+r()*120;c.fillStyle=atmos("#6a5f8a",t,.4);c.beginPath();c.ellipse(x,y,60,14,0,0,TAU);c.fill();c.beginPath();c.moveTo(x-55,y);c.lineTo(x,y+60);c.lineTo(x+55,y);c.fill()}break;
  }
}
function tree(c,x,base,h,col,dark,kind,r){if(kind==="pine"){c.fillStyle=dark;c.fillRect(x-3,base-h*.25,6,h*.25);
    for(let k=0;k<4;k++){const y=base-h*.2-k*h*.2,wd=h*.36*(1-k*.2);c.fillStyle=k%2?col:mix(col,dark,.3);c.beginPath();c.moveTo(x-wd,y);c.lineTo(x,y-h*.32);c.lineTo(x+wd,y);c.fill()}}
  else{c.strokeStyle=dark;c.lineWidth=h*.06;c.beginPath();c.moveTo(x,base);c.quadraticCurveTo(x+h*.05,base-h*.4,x,base-h*.55);c.stroke();
    for(let k=0;k<6;k++){c.fillStyle=k%2?col:mix(col,dark,.35);c.beginPath();c.arc(x+(r()-.5)*h*.45,base-h*.6-(r())*h*.3,h*(.16+r()*.1),0,TAU);c.fill()}}}
function drawMid(c,w,biome,time,seed){const B=BIOME[biome];const r=rng(seed+11);const t=time;
  const dk=t==="night"?.55:t==="dusk"?.35:.1;
  switch(B.mid){
  case"trees":for(let i=0;i<w/38;i++){const x=r()*w,h=140+r()*170;tree(c,x,GROUND_Y+8,h,mix(r()<.5?"#2f6b2a":"#3e7d33","#0b1a10",dk),mix("#3a2716","#000000",dk),r()<.55?"pine":"oak",r)}break;
  case"deadtrees":for(let i=0;i<w/70;i++){const x=r()*w,h=130+r()*150;c.strokeStyle=mix("#2b2a1f","#000",dk);c.lineCap="round";const br=(x0,y0,a,l,d)=>{if(d>4||l<8)return;const x1=x0+Math.cos(a)*l,y1=y0+Math.sin(a)*l;c.lineWidth=Math.max(1,9-d*2);c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();br(x1,y1,a-.5+r()*.3,l*.7,d+1);br(x1,y1,a+.4-r()*.3,l*.65,d+1)};br(x,GROUND_Y+6,-Math.PI/2+(r()-.5)*.2,h*.45,0);
      c.fillStyle="rgba(140,170,90,.35)";for(let k=0;k<5;k++){c.fillRect(x-20+r()*40,GROUND_Y-h*.4+r()*h*.3,2,20+r()*30)}}
    c.fillStyle="rgba(40,70,50,.55)";c.fillRect(0,GROUND_Y-6,w,16);break;
  case"stalag":for(let i=0;i<w/50;i++){const x=r()*w,h=60+r()*160,sw=14+r()*30;c.fillStyle=lg(c,x,0,x+sw,0,[[0,"#1b1d24"],[.5,"#2e3240"],[1,"#15171d"]]);c.beginPath();c.moveTo(x,0);c.lineTo(x+sw/2,h);c.lineTo(x+sw,0);c.fill();
      if(r()<.5){c.beginPath();c.moveTo(x+10,GROUND_Y+10);c.lineTo(x+10+sw/2,GROUND_Y+10-h*.7);c.lineTo(x+10+sw,GROUND_Y+10);c.fill()}
      if(r()<.35){const cx=x+sw/2,cy=GROUND_Y-10-r()*40,col=r()<.5?"#5ef0ff":"#b388ff";c.fillStyle=col;c.beginPath();c.moveTo(cx,cy-24);c.lineTo(cx+8,cy);c.lineTo(cx,cy+6);c.lineTo(cx-8,cy);c.fill();glow(c,cx,cy-6,40,col,.45)}}break;
  case"cliffs":for(let i=0;i<w/260;i++){const x=r()*w,h=120+r()*120,cw=120+r()*160;c.fillStyle=lg(c,x,0,x+cw,0,[[0,mix("#7a6a55","#000",dk)],[1,mix("#4c4134","#000",dk)]]);c.beginPath();c.moveTo(x,GROUND_Y+10);c.lineTo(x+cw*.1,GROUND_Y-h);c.lineTo(x+cw*.6,GROUND_Y-h-20);c.lineTo(x+cw,GROUND_Y+10);c.fill();c.fillStyle=mix("#5e8f3a","#000",dk);c.fillRect(x+cw*.1,GROUND_Y-h-22,cw*.5,10)}break;
  case"pines":for(let i=0;i<w/40;i++){const x=r()*w,h=110+r()*140;tree(c,x,GROUND_Y+8,h,mix("#2a4f3a","#0b1a16",dk),"#2a1d12","pine",r);c.fillStyle="rgba(255,255,255,.85)";c.beginPath();c.moveTo(x-h*.12,GROUND_Y-h*.62);c.lineTo(x,GROUND_Y-h*.78);c.lineTo(x+h*.12,GROUND_Y-h*.62);c.fill()}break;
  case"icespire":for(let i=0;i<w/60;i++){const x=r()*w,h=80+r()*190,sw=18+r()*30;c.fillStyle=lg(c,x,0,x+sw,0,[[0,"rgba(190,235,255,.85)"],[.5,"rgba(240,252,255,.95)"],[1,"rgba(120,190,230,.85)"]]);c.beginPath();c.moveTo(x,GROUND_Y+8);c.lineTo(x+sw*.45,GROUND_Y-h);c.lineTo(x+sw,GROUND_Y+8);c.fill()}break;
  case"basalt":for(let i=0;i<w/55;i++){const x=r()*w,h=50+r()*140,sw=24+r()*30;c.fillStyle=lg(c,x,0,x+sw,0,[[0,"#1c120f"],[1,"#2e1d17"]]);c.fillRect(x,GROUND_Y-h,sw,h+10);c.fillStyle="#3a2620";c.fillRect(x,GROUND_Y-h,sw,4)}
    for(let i=0;i<w/300;i++){const x=r()*w;c.fillStyle=lg(c,0,GROUND_Y-30,0,GROUND_Y,[[0,"#ffb14a"],[1,"#ff4d1a"]]);c.fillRect(x,GROUND_Y-8,120+r()*100,14);glow(c,x+60,GROUND_Y,90,"#ff5a1f",.5)}break;
  case"columns":for(let i=0;i<w/110;i++){const x=r()*w,h=120+r()*170,broken=r()<.5;c.fillStyle=lg(c,x,0,x+34,0,[[0,mix("#9b917c","#000",dk)],[.5,mix("#c9bfa6","#000",dk)],[1,mix("#6f6756","#000",dk)]]);const hh=broken?h*.6:h;c.fillRect(x,GROUND_Y-hh,34,hh+10);
      for(let k=0;k<4;k++){c.fillStyle="rgba(0,0,0,.12)";c.fillRect(x+5+k*7,GROUND_Y-hh,2,hh)}c.fillStyle=mix("#b5ab92","#000",dk);c.fillRect(x-6,GROUND_Y-hh-8,46,10);
      if(r()<.6){c.strokeStyle=mix("#3f6b2a","#000",dk);c.lineWidth=2;c.beginPath();c.moveTo(x+4,GROUND_Y-hh);for(let k=0;k<6;k++)c.quadraticCurveTo(x+(k%2?30:0),GROUND_Y-hh+k*hh/6+10,x+17,GROUND_Y-hh+(k+1)*hh/6);c.stroke()}}break;
  case"statues":for(let i=0;i<w/140;i++){const x=r()*w,h=100+r()*140;c.fillStyle="#1a1426";c.fillRect(x,GROUND_Y-30,50,40);c.beginPath();c.moveTo(x+5,GROUND_Y-30);c.lineTo(x+25,GROUND_Y-30-h);c.lineTo(x+45,GROUND_Y-30);c.fill();
      c.beginPath();c.moveTo(x+25,GROUND_Y-30-h*.7);c.lineTo(x-25,GROUND_Y-30-h*.95);c.lineTo(x+10,GROUND_Y-30-h*.55);c.fill();c.beginPath();c.moveTo(x+25,GROUND_Y-30-h*.7);c.lineTo(x+75,GROUND_Y-30-h*.95);c.lineTo(x+40,GROUND_Y-30-h*.55);c.fill();
      c.fillStyle="#ff47e6";c.fillRect(x+21,GROUND_Y-30-h*.86,3,3);c.fillRect(x+27,GROUND_Y-30-h*.86,3,3)}break;
  case"hedge":for(let i=0;i<w/90;i++){const x=i*90+r()*30;c.fillStyle=mix("#1f3a2a","#000",dk);c.beginPath();c.ellipse(x,GROUND_Y,60,36,0,Math.PI,0);c.fill();
      c.fillStyle="#2a2433";c.fillRect(x+40,GROUND_Y-90,4,90);c.fillStyle="#ffcf6b";c.beginPath();c.arc(x+42,GROUND_Y-96,7,0,TAU);c.fill();glow(c,x+42,GROUND_Y-96,40,"#ffb347",.6)}break;
  case"islands":for(let i=0;i<w/220;i++){const x=r()*w,y=200+r()*140,iw=80+r()*90;c.fillStyle="#5d5480";c.beginPath();c.ellipse(x,y,iw,16,0,0,TAU);c.fill();c.beginPath();c.moveTo(x-iw*.9,y);c.lineTo(x,y+70+r()*40);c.lineTo(x+iw*.9,y);c.fill();
      c.fillStyle="#7fd17f";c.beginPath();c.ellipse(x,y-6,iw*.95,10,0,0,TAU);c.fill();tree(c,x-iw*.3,y-6,60,"#4fa86a","#3a2a1a","oak",r)}break;
  }
}
function buildBackdrop(biome,time,worldW,VW,seed=1){const RES=Math.min(1.5,(window.devicePixelRatio||1));
  const sw=VW+60,fw=VW+worldW*.18+60,mw=VW+worldW*.45+60;
  const mk=(w,fn)=>{const cv=makeCanvas(w*RES,VH*RES);const c=cv.getContext("2d");c.scale(RES,RES);fn(c,w);return cv};
  return{RES,sky:mk(sw,(c,w)=>drawSky(c,w,biome,time,seed)),far:mk(fw,(c,w)=>drawFar(c,w,biome,time,seed)),mid:mk(mw,(c,w)=>drawMid(c,w,biome,time,seed)),biome,time,seed,
    parts:[],fogT:0}}

/* ground + near decorations (live) */
function drawGround(c,bd,camX,VW,t){const B=BIOME[bd.biome];const n=bd._n||(bd._n=noise1(bd.seed+99));
  if(B.deck){/* ship deck */c.fillStyle=lg(c,0,GROUND_Y,0,VH,[[0,"#7a5532"],[1,"#3b2614"]]);c.fillRect(0,GROUND_Y,VW,VH-GROUND_Y);
    c.strokeStyle="rgba(0,0,0,.35)";c.lineWidth=2;for(let y=GROUND_Y+14;y<VH;y+=16){c.beginPath();c.moveTo(0,y);c.lineTo(VW,y);c.stroke()}
    for(let x=-((camX)%120);x<VW;x+=120){c.beginPath();c.moveTo(x,GROUND_Y);c.lineTo(x-30,VH);c.stroke()}
    c.fillStyle="#5a3a1e";c.fillRect(0,GROUND_Y-28,VW,10);for(let x=-((camX)%70);x<VW;x+=70){c.fillRect(x,GROUND_Y-28,8,30)}
    const mx=((900-camX)%1600+1600)%1600-200;c.fillStyle="#4a3018";c.fillRect(mx,40,14,GROUND_Y-40);c.fillStyle="rgba(240,230,210,.9)";c.beginPath();c.moveTo(mx+16,70);c.quadraticCurveTo(mx+120+Math.sin(t)*8,170,mx+16,300);c.fill();
    c.strokeStyle="rgba(60,40,20,.7)";c.lineWidth=1.5;c.beginPath();c.moveTo(mx+7,50);c.lineTo(mx-240,GROUND_Y-28);c.moveTo(mx+7,50);c.lineTo(mx+260,GROUND_Y-28);c.stroke();return}
  const [g1,g2]=B.ground;c.fillStyle=lg(c,0,GROUND_Y,0,VH,[[0,g1],[1,g2]]);c.beginPath();c.moveTo(0,VH);
  for(let x=0;x<=VW+8;x+=8){c.lineTo(x,GROUND_Y+fbm(n,(x+camX)*.01,3)*10-5)}c.lineTo(VW+8,VH);c.fill();
  c.strokeStyle=B.edge;c.lineWidth=3;c.beginPath();for(let x=0;x<=VW+8;x+=8){const y=GROUND_Y+fbm(n,(x+camX)*.01,3)*10-5;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
  /* tufts / texture */
  const r=rng(Math.floor(camX/40)+bd.seed);c.save();
  for(let wx=Math.floor(camX/40)*40;wx<camX+VW+40;wx+=40){const rr=rng(wx*13+bd.seed);const x=wx-camX;const y=GROUND_Y+fbm(n,wx*.01,3)*10-5;
    if(bd.biome==="forest"||bd.biome==="swamp"||bd.biome==="academy"||bd.biome==="ruins"){c.strokeStyle=hexA(B.edge,.9);c.lineWidth=1.5;for(let k=0;k<4;k++){const bx=x+rr()*40;c.beginPath();c.moveTo(bx,y+2);c.quadraticCurveTo(bx+2,y-8,bx+(rr()-.5)*8,y-10-rr()*8+Math.sin(t*2+wx)*1.5);c.stroke()}
      if(rr()<.15){c.fillStyle=["#ff8fc0","#ffe066","#c8a2ff","#ffffff"][Math.floor(rr()*4)];c.beginPath();c.arc(x+rr()*40,y-8,3,0,TAU);c.fill()}}
    else if(bd.biome==="mountain"||bd.biome==="ice"){if(rr()<.3){c.fillStyle="rgba(255,255,255,.7)";c.beginPath();c.ellipse(x+rr()*40,y+10+rr()*40,14,4,0,0,TAU);c.fill()}}
    else if(bd.biome==="volcano"){if(rr()<.35){const lx=x+rr()*40,ly=y+20+rr()*50;c.strokeStyle="#ff6a1f";c.lineWidth=2;c.beginPath();c.moveTo(lx,ly);c.lineTo(lx+12,ly+6);c.lineTo(lx+24,ly+2);c.stroke();glow(c,lx+12,ly+4,16,"#ff5a1f",.4+Math.sin(t*3+wx)*.15)}}
    else if(bd.biome==="coast"){if(rr()<.25){c.fillStyle="rgba(255,255,255,.6)";c.beginPath();c.arc(x+rr()*40,y+20+rr()*60,2,0,TAU);c.fill()}}
    else if(rr()<.3){c.fillStyle="rgba(0,0,0,.25)";c.beginPath();c.ellipse(x+rr()*40,y+16+rr()*50,8+rr()*10,3,0,0,TAU);c.fill()}}
  c.restore()}

/* particles + fog + aurora (live) */
function updParticles(bd,dt,VW){const B=BIOME[bd.biome];const P=bd.parts;const want={firefly:40,lantern:22,snow:110,ember:70,mote:45,spray:30,wisp:28,cloud:10}[B.parts]||30;
  while(P.length<want){P.push({x:Math.random()*VW,y:Math.random()*VH,vx:0,vy:0,s:Math.random(),ph:Math.random()*TAU,life:Math.random()})}
  for(const p of P){p.ph+=dt;switch(B.parts){
    case"snow":p.vy=30+p.s*50;p.vx=-20+Math.sin(p.ph)*15;break;case"ember":p.vy=-30-p.s*50;p.vx=Math.sin(p.ph*2)*20;break;
    case"lantern":p.vy=-10-p.s*14;p.vx=Math.sin(p.ph*.5)*6;break;case"spray":p.vy=-5+Math.sin(p.ph)*8;p.vx=-15-p.s*20;break;
    case"cloud":p.vx=-8-p.s*10;p.vy=0;break;default:p.vx=Math.sin(p.ph*.7)*12;p.vy=Math.cos(p.ph*.9)*10}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>VH+10){p.y=-10;p.x=Math.random()*VW}if(p.y<-20){p.y=VH;p.x=Math.random()*VW}if(p.x<-30)p.x=VW+20;if(p.x>VW+30)p.x=-20}}
function drawParticles(c,bd,t){const B=BIOME[bd.biome];c.save();
  for(const p of bd.parts){switch(B.parts){
    case"firefly":{const a=.4+.6*Math.max(0,Math.sin(p.ph*2+p.s*9));glow(c,p.x,p.y,10,"#e8ff7a",a*.8);c.fillStyle=`rgba(250,255,190,${a})`;c.fillRect(p.x-1,p.y-1,2,2);break}
    case"lantern":{c.fillStyle=rg(c,p.x,p.y,0,10,[[0,"#fff0b0"],[1,"#ff9a3c"]]);c.beginPath();c.ellipse(p.x,p.y,5+p.s*3,7+p.s*3,0,0,TAU);c.fill();glow(c,p.x,p.y,26,"#ffb347",.5);break}
    case"snow":c.fillStyle=`rgba(255,255,255,${.5+p.s*.5})`;c.beginPath();c.arc(p.x,p.y,1+p.s*2.2,0,TAU);c.fill();break;
    case"ember":glow(c,p.x,p.y,6,"#ff7a2a",.8);c.fillStyle="#ffd27a";c.fillRect(p.x,p.y,1.5,1.5);break;
    case"mote":c.fillStyle=`rgba(255,240,200,${.15+.35*Math.abs(Math.sin(p.ph))})`;c.fillRect(p.x,p.y,1.6,1.6);break;
    case"spray":c.fillStyle="rgba(255,255,255,.35)";c.beginPath();c.arc(p.x,p.y,1+p.s*1.5,0,TAU);c.fill();break;
    case"wisp":glow(c,p.x,p.y,14,"#b062ff",.35);break;
    case"cloud":c.fillStyle="rgba(255,255,255,.25)";c.beginPath();c.ellipse(p.x,p.y,60+p.s*60,14,0,0,TAU);c.fill();break}}
  c.restore()}
function drawAtmos(c,bd,t,VW){const B=BIOME[bd.biome];
  if(B.aurora&&bd.time==="night"){c.save();c.globalCompositeOperation="lighter";for(let k=0;k<3;k++){c.beginPath();for(let x=0;x<=VW;x+=10){const y=90+k*28+Math.sin(x*.006+t*.4+k)*30+Math.sin(x*.013-t*.3)*14;x?c.lineTo(x,y):c.moveTo(x,y)}
    c.lineWidth=40;c.strokeStyle=k===1?"rgba(120,255,200,.10)":"rgba(140,120,255,.08)";c.stroke()}c.restore()}
  /* fog bands */
  c.save();for(let k=0;k<2;k++){const y=GROUND_Y-60+k*40;const off=(t*(12+k*8))%VW;c.fillStyle=lg(c,0,y-50,0,y+50,[[0,hexA(B.fog,0)],[.5,hexA(B.fog,bd.biome==="swamp"?.22:.09)],[1,hexA(B.fog,0)]]);c.fillRect(-off,y-50,VW*2,100)}c.restore();
  if(B.tint){c.fillStyle=hexA(B.tint,.18);c.fillRect(0,0,VW,VH)}
  /* vignette */c.fillStyle=rg(c,VW/2,VH*.55,VH*.35,VW*.75,[[0,"rgba(0,0,0,0)"],[1,"rgba(0,0,0,.55)"]]);c.fillRect(0,0,VW,VH)}
function drawBackdrop(c,bd,camX,VW,t){const R=bd.RES;
  c.drawImage(bd.sky,0,0,bd.sky.width,bd.sky.height,0,0,bd.sky.width/R,VH);
  c.drawImage(bd.far,Math.min(camX*.18*R,bd.far.width-VW*R),0,VW*R,bd.far.height,0,0,VW,VH);
  c.drawImage(bd.mid,Math.min(camX*.45*R,bd.mid.width-VW*R),0,VW*R,bd.mid.height,0,0,VW,VH);
  if(bd.biome==="coast"||bd.biome==="sea"){c.save();c.globalAlpha=.5;for(let k=0;k<3;k++){const y=345+k*14;c.strokeStyle="rgba(255,255,255,.35)";c.lineWidth=1.5;c.beginPath();for(let x=0;x<=VW;x+=10){const yy=y+Math.sin(x*.03+t*(1+k*.4)+k)*2;x?c.lineTo(x,yy):c.moveTo(x,yy)}c.stroke()}c.restore()}}

/* person: (x,y)=feet center, h=height */
function drawPerson(c,x,y,h,o){const t=o.t||0;const s=h/170;c.save();c.translate(x,y);c.scale((o.face||1)*s,s);
  const walk=o.walk||0;const bob=o.float?Math.sin(t*2)*6-14:-Math.abs(Math.sin(walk*Math.PI))*5;const sway=Math.sin(walk*TAU)*6;
  c.fillStyle="rgba(0,0,0,.35)";c.beginPath();c.ellipse(0,0,46,10,0,0,TAU);c.fill();c.translate(0,bob);
  const robe=o.robe||["#3a4fc2","#1d2470"],skin=o.skin||"#f3cfb0",hair=o.hair||"#6b3f22";
  /* cape */c.fillStyle=lg(c,-40,-120,40,0,[[0,mix(robe[1],"#000000",.25)],[1,robe[1]]]);c.beginPath();c.moveTo(-26,-118);c.quadraticCurveTo(-58-sway,-50,-50+Math.sin(t*3)*6-sway,-4);c.lineTo(34,-4);c.quadraticCurveTo(40,-60,26,-118);c.fill();
  /* back hair */if(o.hairLong){c.fillStyle=mix(hair,"#000",.15);c.beginPath();c.moveTo(-20,-146);c.quadraticCurveTo(-34,-100,-26+Math.sin(t*2)*3,-78);c.lineTo(22,-78);c.quadraticCurveTo(32,-110,20,-146);c.fill()}
  /* robe */c.fillStyle=lg(c,-34,0,34,0,[[0,robe[1]],[.45,robe[0]],[1,robe[1]]]);c.beginPath();c.moveTo(-18,-122);c.lineTo(18,-122);c.quadraticCurveTo(30,-60,40+sway*.3,-6);
  for(let i=0;i<=6;i++){c.lineTo(40-i*13.3+sway*.3,-6+(i%2?5:0))}c.quadraticCurveTo(-30,-60,-18,-122);c.fill();
  c.strokeStyle="rgba(0,0,0,.18)";c.lineWidth=2;[-12,0,12].forEach(dx=>{c.beginPath();c.moveTo(dx*.6,-110);c.quadraticCurveTo(dx*1.2,-60,dx*2+sway*.3,-8);c.stroke()});
  if(o.trim){c.strokeStyle=o.trim;c.lineWidth=3;c.beginPath();c.moveTo(-38+sway*.3,-8);c.lineTo(40+sway*.3,-8);c.stroke()}
  /* belt + scarf */c.fillStyle=o.belt||"#c9a227";c.fillRect(-22,-82,44,5);
  if(o.scarf){c.fillStyle=o.scarf;c.beginPath();c.moveTo(-16,-124);c.lineTo(16,-124);c.lineTo(14,-114);c.lineTo(-14,-114);c.fill();c.fillRect(6,-118,8,30+Math.sin(t*3)*2);c.fillStyle="rgba(0,0,0,.2)";c.fillRect(6,-100,8,3);c.fillRect(6,-94,8,3)}
  /* staff arm */const ca=o.cast||0;
  if(o.staff!==false){c.save();c.translate(22,-112);c.rotate(-.15-ca*.9);c.strokeStyle=lg(c,0,0,6,0,[[0,"#5a3a1a"],[1,"#8a5a2a"]]);c.lineWidth=6;c.lineCap="round";c.beginPath();c.moveTo(8,40);c.lineTo(8,-58);c.stroke();
    c.strokeStyle="#c9a227";c.lineWidth=2;c.beginPath();c.arc(8,-64,9,0,TAU);c.stroke();const orb=o.orb||"#8ff3ff";c.fillStyle=rg(c,6,-66,1,8,[[0,"#ffffff"],[1,orb]]);c.beginPath();c.arc(8,-64,7,0,TAU);c.fill();glow(c,8,-64,28+ca*30+Math.sin(t*4)*4,orb,.7+ca*.3);
    c.fillStyle=lg(c,0,0,0,30,[[0,robe[0]],[1,robe[1]]]);c.beginPath();c.moveTo(-6,-6);c.lineTo(10,-4);c.lineTo(14,22);c.lineTo(0,24);c.fill();c.fillStyle=skin;c.beginPath();c.arc(8,24,5,0,TAU);c.fill();c.restore()}
  /* other arm */c.fillStyle=lg(c,0,-110,0,-70,[[0,robe[0]],[1,robe[1]]]);c.beginPath();c.moveTo(-18,-116);c.quadraticCurveTo(-34,-96,-30,-76);c.lineTo(-20,-74);c.quadraticCurveTo(-20,-96,-10,-112);c.fill();c.fillStyle=skin;c.beginPath();c.arc(-25,-73,5,0,TAU);c.fill();
  /* head */c.fillStyle=skin;c.fillRect(-5,-130,10,10);const hy=-146;c.fillStyle=rg(c,-6,hy-6,4,26,[[0,mix(skin,"#ffffff",.25)],[1,mix(skin,"#a0603a",.25)]]);c.beginPath();c.ellipse(0,hy,17,19,0,0,TAU);c.fill();
  if(o.skull){c.fillStyle="#efe6cf";c.beginPath();c.ellipse(0,hy,17,19,0,0,TAU);c.fill();c.fillStyle="#1a1a1a";c.beginPath();c.ellipse(-6,hy-2,4,5,0,0,TAU);c.ellipse(6,hy-2,4,5,0,0,TAU);c.fill();c.fillRect(-5,hy+9,10,2)}
  if(!o.skull){/* face */const ec=o.glowEyes||"#2a1a12";c.fillStyle=ec;c.beginPath();c.ellipse(5,hy+1,2.4,3.2,0,0,TAU);c.ellipse(-6,hy+1,2.4,3.2,0,0,TAU);c.fill();if(o.glowEyes){glow(c,5,hy+1,8,o.glowEyes,.9);glow(c,-6,hy+1,8,o.glowEyes,.9)}
    else{c.fillStyle="#fff";c.fillRect(5.5,hy-1,1.2,1.2);c.fillRect(-5.5,hy-1,1.2,1.2)}

    c.strokeStyle="#7a3b2a";c.lineWidth=1.6;c.beginPath();o.stern?(c.moveTo(-4,hy+10),c.lineTo(4,hy+10)):c.arc(0,hy+7,4,.2*Math.PI,.8*Math.PI);c.stroke();
    if(o.beard){c.fillStyle=o.beard;c.beginPath();c.moveTo(-14,hy+4);c.quadraticCurveTo(0,hy+44,14,hy+4);c.fill()}}
