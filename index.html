 is forty minutes long."},{"who":"narrator","text":"A knight in dark armor steps through the gate, a purple shadow-blade glowing in her hand."},{"who":"foe","text":"I am Sable, the Shadow Knight. Morwen told me you would come, {name}. She said you remind her of herself."},{"who":"player","text":"I'm nothing like Morwen! She broke the Grimoire!"},{"who":"foe","text":"She wasn't always like this. At Starfall, she and Elowen were inseparable. Ask your professor what happened."},{"who":"elowen","text":"...Morwen found a forbidden book. When the headmaster asked who knew about it, I told the truth."},{"who":"elowen","text":"She was expelled. I never even said goodbye. I was afraid, and she has been angry with the whole world ever since."},{"who":"foe","text":"So you see? Your precious teacher broke Morwen's heart first. Now, defend yourself!"}],"explore":{"goal":"Search the silent halls of Frostbell Monastery and collect ancient bell charms while shades lurk in the corners.","collectible":"charm","minion":"shade"},"gate":{"speaker":"The great frozen bell of Frostbell","line":"I have not rung in a hundred years. Answer me true, and I will sing once more."},"foe":{"name":"Sable the Shadow Knight","kind":"witch","palette":"shadow","weak":"light","resist":"ice","boss":false,"taunts":["Morwen sees you through my eyes!","Your light is only a candle!","Shadows never miss their mark!"],"attacks":["Shadow Blade","Darkness Charge","Eclipse Guard"],"defeat":"Sable's shadow-blade flickers out. 'You fight with light even when you're angry,' she whispers, and vanishes in a swirl of purple mist."},"outro":[{"who":"narrator","text":"The monastery bells ring for the first time in a hundred years. A bright page floats down from the bell tower."},{"who":"player","text":"Professor, is it true? Is that why Morwen is so angry?"},{"who":"elowen","text":"Part of it. I chose to be honest, and that was right. But I should have stood by my friend, too. I did not."},{"who":"bramble","text":"For the record, Professor, I think you are quite wonderful. Even if you are terrible at sharing stories."},{"who":"theo","text":"The page shows a dragon made of crystal sitting on a frozen throne. And the words 'only the worthy'."},{"who":"elowen","text":"Glacia. The oldest dragon in the world. She holds the last page of these mountains, {name}. And she will test you."}],"page":{"title":"The Page of Ringing Bells","lore":"Sound travels as waves through the air, and big bells make deep, slow waves. This page hums a note no one has heard in a century."}},{"n":27,"act":3,"title":"The Crystal Throne","location":"Glacia's Crystal Throne","biome":"ice","time":"night","intro":[{"who":"narrator","text":"At the highest point of the Frozen Peaks, under dancing ribbons of green and violet light, sits a throne of crystal."},{"who":"narrator","text":"Upon it rests Glacia, an ancient dragon whose scales shine like a thousand frozen stars."},{"who":"glacia","text":"So. The little reader arrives. Twenty-six pages bonded to your heart, {name}. Impressive. But are you worthy?"},{"who":"player","text":"I'm not trying to be a ruler. I just want to put the Grimoire back together, so everyone can learn."},{"who":"glacia","text":"Morwen said nearly the same words, once. Long ago, before she decided knowledge was safer locked away."},{"who":"theo","text":"Please be nice. Please be nice. Please be nice."},{"who":"bramble","text":"Your Majesty, might I mention we are VERY small and probably taste like snow?"},{"who":"glacia","text":"Peace, owl. I do not wish to harm you. But a test is a test, and I do not go easy."},{"who":"elowen","text":"Glacia tests with all her strength, {name}. Use everything you have learned."},{"who":"glacia","text":"Then show me, reader! Show me that knowledge in your hands grows brighter, not colder!"}],"explore":{"goal":"Climb the shimmering crystal stairs to Glacia's throne, gathering starlight shards under the glowing northern sky.","collectible":"shard","minion":"wisp"},"gate":{"speaker":"Glacia's crystal guardian statue","line":"Only those who learn may face the Queen of Ice. Prove your mind is sharp as crystal."},"foe":{"name":"Glacia the Crystal Dragon","kind":"dragon","palette":"frost","weak":"fire","resist":"ice","boss":true,"taunts":["Show me your wisdom, little one!","I have tested heroes for a thousand years!","Do not hold back. I certainly will not!"],"attacks":["Crystal Breath","Aurora Storm","Diamond Tail Sweep"],"defeat":"Glacia lowers her shining head and smiles. 'Enough, {name}. You fought hard, yet you never once fought cruelly. You are worthy.'"},"outro":[{"who":"glacia","text":"For a thousand years I have guarded this page. Now it is yours, reader, and so is my friendship."},{"who":"narrator","text":"A page of pure crystal light floats into {name}'s hands. The northern lights swirl brighter than ever."},{"who":"player","text":"Thank you, Glacia. Will you help us stop Morwen?"},{"who":"glacia","text":"I will carry you to Cinderfell Mountain, where her Shadow Citadel stands. Climb aboard, all of you."},{"who":"bramble","text":"Riding a dragon. Of course. Why walk when you can be terrified at great height?"},{"who":"theo","text":"Twenty-seven pages! Only nine left!"},{"who":"elowen","text":"And the hardest nine of all. Morwen is waiting, {name}. Hold on tight."}],"page":{"title":"The Page of the Northern Lights","lore":"The glowing curtains of the northern sky are made when particles from the sun meet the air. This page shimmers green and violet when held."}},{"n":28,"act":4,"title":"Sentinels of Cinderfell","location":"Cinderfell Foothills","biome":"volcano","time":"dusk","intro":[{"who":"narrator","text":"Glacia glides south over a land of black rock and glowing rivers of lava. Cinderfell Mountain smokes ahead."},{"who":"theo","text":"It's like we flew from the freezer straight into the oven. My eyebrows are sweating."},{"who":"bramble","text":"And here I was, just getting used to frozen tail feathers. Now they will be toasted."},{"who":"glacia","text":"I cannot fly closer. Morwen's shadow storm would freeze even my wings. You must climb from here."},{"who":"narrator","text":"At the top of the rocky path, stone gargoyles uncurl from their perches, wings grinding like millstones."},{"who":"foe","text":"HALT. None pass the Cinderfell gates. The Mistress has commanded it. The Mistress is always obeyed."},{"who":"player","text":"Does the Mistress ever say please?"},{"who":"foe","text":"...Please halt?"},{"who":"bramble","text":"Oh, look, they have manners. How very refreshing. Now please move."},{"who":"foe","text":"Negative. Sentinels attack!"}],"explore":{"goal":"Climb the smoking foothills of Cinderfell and collect cooled lava gems while fire imps scamper about.","collectible":"gem","minion":"imp"},"gate":{"speaker":"A stone gargoyle that never woke up","line":"Snore... huh? Oh, a visitor. I'm supposed to ask you something. Yes, a question. Here it comes."},"foe":{"name":"The Gargoyle Sentinels","kind":"flyer","palette":"stone","weak":"nature","resist":"fire","boss":false,"taunts":["We are stone. We do not tire.","Halt! We said halt!","The Mistress sees all!"],"attacks":["Granite Dive","Pebble Storm","Stony Stare"],"defeat":"Vines crack the shadow from the gargoyles' wings, and they settle back on their perches. 'Gate duty is boring anyway,' one mumbles, and falls asleep."},"outro":[{"who":"narrator","text":"Behind the sleeping gargoyles, a page is tucked into the old gate, warm as fresh toast."},{"who":"player","text":"Twenty-eight! My Vine Bind worked great on them. Plants really can crack stone!"},{"who":"elowen","text":"Roots split rocks over many years. You did it in a minute. Your magic is growing, {name}."},{"who":"theo","text":"This page has a map of lava tunnels. One tunnel leads straight up into the citadel!"},{"who":"bramble","text":"A tunnel of lava. Delightful. I shall be a roasted owl by suppertime."},{"who":"narrator","text":"Far below, something huge and orange moves through the lava, leaving ripples behind it."}],"page":{"title":"The Page of Guardian Stones","lore":"Rocks are slowly broken by wind, water and roots in a process called weathering. This page is cracked, but it still holds strong."}},{"n":29,"act":4,"title":"The Magma Serpent","location":"Cinderfell Lava Tunnels","biome":"volcano","time":"night","intro":[{"who":"narrator","text":"The lava tunnels glow orange and red. The air shimmers so much it makes everything look wobbly."},{"who":"theo","text":"I mixed us all a cooling potion. Side effect: it might make your ears turn blue for an hour."},{"who":"bramble","text":"I have no visible ears. I win."},{"who":"narrator","text":"A river of lava bubbles, and a serpent made of molten rock rises, its eyes like two burning coals."},{"who":"foe","text":"Ssssso. The little bookworms have come to my tunnelssss. The Shadow Witch promised me you would be crunchy."},{"who":"player","text":"Why does everyone think we're snacks?!"},{"who":"elowen","text":"Stay away from its tail, {name}. The serpent's heat grows stronger every time it strikes."},{"who":"foe","text":"Ssssurrender the pages, and perhaps I will let you sssswim home."},{"who":"theo","text":"Lava swimming is a terrible idea. I've read about it. I mean, I've read that it's a terrible idea."},{"who":"foe","text":"Then burn, little readerssss!"}],"choice":{"prompt":"The lava rises around the path. How should {name} prepare?","options":[{"text":"Drink Theo's cooling potion","reply":"Your ears turn bright blue, but the heat no longer stings. Theo giggles.","reward":"potion"},{"text":"Cast Frost on the path ahead","reply":"Your frost hardens the lava into a dark bridge of stone. Perfect!","reward":"xp"}]},"explore":{"goal":"Cross the glowing lava tunnels on cooled stone bridges and collect fire opals while embers spark through the air.","collectible":"opal","minion":"ember"},"gate":{"speaker":"A sleepy salamander on a hot rock","line":"Mmm, warm rocks make me lazy. But I still guard this door. Riddle time."},"foe":{"name":"The Magma Serpent","kind":"serpent","palette":"ember","weak":"ice","resist":"fire","boss":false,"taunts":["Ssssizzle and sssscorch!","My scales are hotter than the sun!","Nothing cools me down, nothing!"],"attacks":["Lava Lash","Molten Coil","Eruption Hiss"],"defeat":"Cooled by frost, the Magma Serpent hardens into a gentle gray stone. It yawns, curls up, and sinks peacefully back into the warm lava."},"outro":[{"who":"narrator","text":"Where the serpent sank, a page bobs on the cooling lava, glowing unharmed."},{"who":"player","text":"Twenty-nine! Theo, your ears are blue."},{"who":"theo","text":"So are yours, {name}! We match!"},{"who":"bramble","text":"I am delighted to report I have no ears to embarrass me. I remain stylish."},{"who":"elowen","text":"The tunnel ends at Morwen's citadel. Something waits at the gate that does not fight with fire. It fights with doubt."},{"who":"theo","text":"Doubt? How do you fight doubt?"}],"page":{"title":"The Page of Molten Rock","lore":"Deep underground, rock gets so hot it melts into magma. When it reaches the surface, it is called lava, and it cools into new land."}},{"n":30,"act":4,"title":"The Hall of Mirrors","location":"Shadow Citadel, Mirror Hall","biome":"citadel","time":"night","intro":[{"who":"narrator","text":"The Shadow Citadel's first hall is lined with tall mirrors. Each one shows {name} slightly different."},{"who":"theo","text":"Why is my reflection waving? I'm not waving. Am I waving?"},{"who":"bramble","text":"Mine is wearing a tiny crown. Finally, a mirror with good taste."},{"who":"narrator","text":"A witch steps out of the largest mirror, her face changing like ripples on water."},{"who":"foe","text":"Welcome, {name}. I am the Mirror Witch. I show people what they are afraid is true."},{"who":"foe","text":"Look, little scholar. A first-year who got lucky. What if you aren't clever enough? What if you fail them all?"},{"who":"player","text":"I... I don't always know the answers. Sometimes I get them wrong."},{"who":"elowen","text":"{name}. Everyone gets answers wrong. That is how learning begins, not how it ends."},{"who":"foe","text":"And you, Elowen. Shall I show your mirror? Two girls on a bell tower, counting lightning. Remember?"},{"who":"elowen","text":"I remember every day. That is why I came. Do your worst, witch."}],"explore":{"goal":"Wander the twisting Hall of Mirrors and gather silver keys while shades flicker between the reflections.","collectible":"key","minion":"shade"},"gate":{"speaker":"The one honest mirror in the hall","line":"I am the only mirror here that tells the truth. Answer me truthfully too."},"foe":{"name":"The Mirror Witch","kind":"witch","palette":"violet","weak":"light","resist":"ice","boss":false,"taunts":["Is that really your best?","Everyone can see your doubts!","You don't belong at Starfall!"],"attacks":["Doubt Reflection","Shattering Glare","Echo of Fear"],"defeat":"The Mirror Witch sees her own reflection, smiling for once. 'Oh,' she says softly, and drifts away into the glass, at peace."},"outro":[{"who":"narrator","text":"Every mirror cracks, and from the broken glass rises a page brighter than any before it."},{"who":"elowen","text":"This is the most powerful page in the Grimoire, {name}. It only bonds with someone who has faced her doubts."},{"who":"player","text":"Stars of knowledge, hear my call. Starfall! The whole ceiling just filled with shooting stars!"},{"who":"theo","text":"Starfall! The ultimate spell! Nobody has cast that in two hundred years!"},{"who":"bramble","text":"I would like it noted that I always believed in you. Even during the snowball incident."},{"who":"elowen","text":"Thirty pages. Above us waits Vorthak, keeper of Morwen's forbidden library. Be ready."}],"page":{"title":"The Page of Starfall","lore":"Every star you see is a faraway sun, and their light can travel for thousands of years to reach us. This page holds a little of that ancient light."}},{"n":31,"act":4,"title":"The Forbidden Library","location":"Shadow Citadel, Forbidden Library","biome":"citadel","time":"night","intro":[{"who":"narrator","text":"The stairway opens into a vast library. Its shelves are wrapped in chains, and every book is locked tight."},{"who":"bramble","text":"A library where nobody may read? That is the most villainous thing I have ever seen. Truly monstrous."},{"who":"theo","text":"Look at these titles. 'Healing Every Fever.' 'Growing Gardens in the Desert.' These could help so many people!"},{"who":"narrator","text":"A skeleton in purple robes rises from behind a desk, with tiny green flames for eyes."},{"who":"foe","text":"Shhhhh! I am Vorthak, Keeper of the Locked Books. Morwen collects all knowledge here, so no one else may have it."},{"who":"player","text":"But books are meant to be read! What good is knowledge nobody can use?"},{"who":"foe","text":"Power, child. Whoever owns knowledge owns the world. Morwen learned that the day Starfall threw her out."},{"who":"elowen","text":"She told me once that if no one else had the book, no one could ever take it from her."},{"who":"player","text":"That's so lonely. Knowledge is supposed to grow when you share it."},{"who":"foe","text":"Pretty words. Let us see how they hold up! SHHHHH!"}],"explore":{"goal":"Sneak between the chained shelves of the Forbidden Library and free glowing bookmarks while dusty spiders scuttle by.","collectible":"bookmark","minion":"spider"},"gate":{"speaker":"A chained talking book","line":"Please, read me! Nobody has opened me in years. Answer this, and you'll set my words free."},"foe":{"name":"Vorthak the Bone Lich","kind":"witch","palette":"bone","weak":"light","resist":"ice","boss":false,"taunts":["Shhhh! No talking in my library!","Overdue! You are all overdue!","Your knowledge will be locked away too!"],"attacks":["Bone Bookend","Silence Curse","Chains of the Shelf"],"defeat":"Vorthak's chains fall away and the books fly open like birds. 'Oh my. I had forgotten how lovely it is to hear a story read aloud,' he says."},"outro":[{"who":"narrator","text":"Thousands of books flutter free and soar out of the windows, scattering into the world like gentle snow."},{"who":"narrator","text":"One last page drifts down from the highest shelf and settles into {name}'s hands."},{"who":"theo","text":"Thirty-one! And look, the books are flying all the way back to Starfall!"},{"who":"bramble","text":"I have personally reserved six of them. All about blueberries."},{"who":"elowen","text":"Above us, at the Dragon Spire, is Nyx. Morwen's shadow dragon. The strongest creature she has ever bound."},{"who":"player","text":"We beat every foe so far together. We can do this too."}],"page":{"title":"The Page of Open Books","lore":"Libraries have helped people share knowledge for thousands of years. This page grows a little brighter every time someone reads it."}},{"n":32,"act":4,"title":"The Dragon Spire","location":"Shadow Citadel, Dragon Spire","biome":"citadel","time":"night","intro":[{"who":"narrator","text":"At the top of a spiral stair, a great balcony opens onto the storm. A black dragon waits, its wings full of shadow."},{"who":"foe","text":"I am Nyx, darkness given wings. Morwen made me from every secret she ever kept. You will not pass."},{"who":"theo","text":"Okay. That is the biggest dragon I have ever seen. Including Glacia. Including my nightmares."},{"who":"bramble","text":"Perhaps we could reason with it? Offer it a blueberry? I have one left. Barely."},{"who":"narrator","text":"Nyx roars, and a wave of shadow knocks {name} to her knees. Her spells flicker out."},{"who":"player","text":"It's too strong... I can't get up..."},{"who":"narrator","text":"Then a burst of red flame lights the sky. A young red dragon dives out of the clouds, roaring fiercely."},{"who":"emberclaw","text":"{name}! You freed me from Morwen's collar back in the Old Watchtower. Now it's my turn to help YOU!"},{"who":"player","text":"Emberclaw! You came back!"},{"who":"emberclaw","text":"Of course I did. Friends always come back. Now let's light up this shadow together!"}],"explore":{"goal":"Race up the winding Dragon Spire and collect dragon scales while Emberclaw clears away the shades.","collectible":"scale","minion":"shade"},"gate":{"speaker":"Emberclaw, perched on the spire","line":"Before we fly into battle, let's warm up that brain of yours, {name}. Here's one!"},"foe":{"name":"Nyx the Shadow Dragon","kind":"dragon","palette":"shadow","weak":"light","resist":"fire","boss":false,"taunts":["I am every secret ever kept!","Your light cannot reach me!","Even your dragon friend cannot save you!"],"attacks":["Shadow Breath","Night Wing Gust","Eclipse Roar"],"defeat":"Sunlight bursts through Nyx's shadows, and the dragon turns pale silver, like moonlight. 'I am... free,' Nyx whispers, and flies off to the peaceful night."},"outro":[{"who":"emberclaw","text":"We did it! Did you see that? Teamwork, fire and sunshine. Best combination ever."},{"who":"narrator","text":"Nyx's silver feather drifts down, wrapped around a glowing page."},{"who":"player","text":"Thank you, Emberclaw. I couldn't have done it without you."},{"who":"emberclaw","text":"You taught me that, {name}. Nobody has to fight alone. I'll be waiting outside when you need me."},{"who":"theo","text":"Thirty-two pages. The page says the floating stairs to the top start right here."},{"who":"elowen","text":"And someone is already standing on them. Sable has come back."}],"page":{"title":"The Page of Dragonfire","lore":"Dragons in old stories carry the warmth of the earth inside them. This page glows like coals in a friendly hearth."}},{"n":33,"act":4,"title":"The Knight's Choice","location":"The Floating Stair","biome":"sky","time":"night","intro":[{"who":"narrator","text":"Glowing stones float in the air, forming a staircase that twists up into the clouds toward the citadel's peak."},{"who":"bramble","text":"A staircase with no railing, thousands of feet in the air. I adore this. I adore this so very much."},{"who":"narrator","text":"On the first stone stands Sable, her shadow-blade drawn, but her hands trembling."},{"who":"foe","text":"{name}. Morwen ordered me to stop you here. If I fail again, she says I'll be nothing."},{"who":"player","text":"You're not nothing, Sable. You stopped your blade when you could have hurt us in the monastery."},{"who":"foe","text":"I joined Morwen because Starfall rejected me too. I failed my entrance exam three times. She said that made us the same."},{"who":"theo","text":"I failed my first potions test SO badly. It turned my hair green for a week. Failing isn't the end."},{"who":"elowen","text":"Starfall was wrong to turn you away, Sable. Just like it was wrong to never give Morwen a second chance."},{"who":"foe","text":"I... I don't know what to believe anymore. Show me, {name}. Show me your way is the right one!"}],"choice":{"prompt":"Sable raises her blade, but she looks uncertain. What does {name} say?","options":[{"text":"\"Come study with us at Starfall.\"","reply":"Sable's eyes widen. For the first time, she lowers her blade a little.","reward":"xp"},{"text":"\"I'll show you, but I won't fight cruelly.\"","reply":"You raise your shield gently. Sable nods, steadier now.","reward":"hp"},{"text":"\"You can choose your own path.\"","reply":"Sable takes a deep breath. Your magic shimmers warmly in reply.","reward":"mp"}]},"explore":{"goal":"Hop across the floating stones of the stairway and collect glimmering stardust while wisps whirl around you.","collectible":"stardust","minion":"wisp"},"gate":{"speaker":"Sable, standing on the stone above","line":"Morwen always quizzed me before she'd teach me anything. Let's see how you do."},"foe":{"name":"Sable the Shadow Knight","kind":"witch","palette":"shadow","weak":"light","resist":"wind","boss":false,"taunts":["I have to do this!","Morwen will never forgive me!","Prove it, {name}! Prove it!"],"attacks":["Torn Shadow Strike","Knight's Charge","Doubtful Guard"],"defeat":"Sable drops her shadow-blade, and it turns into a ribbon of light. 'I choose your side,' she says. 'If Starfall will have me.'"},"outro":[{"who":"narrator","text":"Sable kneels and opens her hand. In it rests a Grimoire page she has been guarding all along."},{"who":"foe","text":"Morwen gave me this to keep safe. I think she wanted me to give it to someone who would share it."},{"who":"elowen","text":"Starfall will have you, Sable. I'll make sure of it. I should have done the same for Morwen long ago."},{"who":"player","text":"Thirty-three! Sable, will you come with us?"},{"who":"foe","text":"I'll guard the stairs from below. But beware, the Hydra waits above. It has many heads and it never stops arguing."},{"who":"bramble","text":"A monster that never stops arguing? Finally, a worthy opponent for me."}],"page":{"title":"The Page of Second Chances","lore":"Mistakes are part of how every learner grows. This page was once torn in half and mended, and it is stronger for it."}},{"n":34,"act":4,"title":"The Hydra of Many Heads","location":"The Floating Stair, Cloud Landing","biome":"sky","time":"night","intro":[{"who":"narrator","text":"Halfway up the floating stair, a wide cloud landing glows silver. Something coils across it, hissing in five voices."},{"who":"foe","text":"Left head here! Middle head here! No, I'M the middle head! Stop it, I'm talking!"},{"who":"theo","text":"Is it... arguing with itself?"},{"who":"bramble","text":"Five heads and not one good manner among them. I feel right at home."},{"who":"foe","text":"Silence! We are Morwen's Shadow Hydra. Defeat one head and two grow back! Isn't that clever?"},{"who":"player","text":"Professor, how do we beat something that grows back?"},{"who":"elowen","text":"Shadow grows from fear, {name}. Light and steady thinking will stop it from growing."},{"who":"theo","text":"If all the heads are connected, we just need to hit the shadow heart in the middle!"},{"who":"foe","text":"No, no, don't tell them that! Right head, why did you look at the heart?! Now they know!"},{"who":"player","text":"Thanks for the hint, Right Head!"}],"explore":{"goal":"Dash across the swirling cloud landing and gather silver moonstones while sky bats swoop overhead.","collectible":"moonstone","minion":"bat"},"gate":{"speaker":"The Hydra's smallest, sleepiest head","line":"Psst. The others never let me talk. Can I ask you a question? I've been saving it."},"foe":{"name":"Morwen's Shadow Hydra","kind":"serpent","palette":"violet","weak":"light","resist":"ice","boss":false,"taunts":["Two heads are better than one! Five are best!","We never agree, except about defeating YOU!","Strike one, two more grow!"],"attacks":["Five-Fang Frenzy","Shadow Coil","Hydra Hiss Chorus"],"defeat":"The shadow heart fades, and the five heads finally agree on one thing: 'Let's go home.' The Hydra slithers off into the clouds, bickering gently."},"outro":[{"who":"narrator","text":"The landing brightens, and the thirty-fourth page floats down like a falling leaf."},{"who":"theo","text":"Thirty-four! Only two left! Just two!"},{"who":"bramble","text":"I am counting them on my talons, and I have run out of talons."},{"who":"elowen","text":"Above the clouds, Morwen's magic is strongest. She will send a piece of herself to stop us, {name}."},{"who":"player","text":"A piece of herself? What does that mean?"},{"who":"elowen","text":"An echo. Every memory she ever buried. Some of those memories... have me in them."}],"page":{"title":"The Page of Teamwork","lore":"Many minds working together can solve problems that one mind cannot. This page is written in five different handwritings that somehow agree."}},{"n":35,"act":4,"title":"The Echo of a Friend","location":"The Floating Stair, Hall of Memories","biome":"sky","time":"night","intro":[{"who":"narrator","text":"Near the top of the stair, the clouds form a hall of shimmering memories. Scenes of Starfall play in the mist."},{"who":"narrator","text":"In one memory, two young students giggle in the bell tower. One has silver-streaked hair. The other has dark curls."},{"who":"theo","text":"Is that... Professor Elowen when she was a kid? And that's..."},{"who":"elowen","text":"Morwen. Before the shadows. She was my very best friend."},{"who":"narrator","text":"The mist gathers into a pale, flickering girl with Morwen's face, but younger and full of hurt."},{"who":"foe","text":"I am Morwen's Echo. Every sad memory she ever buried. You left me alone, Elowen. Nobody stood up for me."},{"who":"elowen","text":"I know. I'm so sorry. I was afraid. I should have stood beside you, no matter what."},{"who":"foe","text":"Sorry doesn't fix anything! Nothing does! That's why we take all the magic and keep it safe, where nobody can hurt us!"},{"who":"player","text":"Keeping it all to yourself won't keep you safe. It'll just keep you lonely."},{"who":"foe","text":"Then show me something better, {name}! Or fade with the rest of the memories!"}],"choice":{"prompt":"The Echo flickers, half angry and half sad. What does {name} do first?","options":[{"text":"Remind her of the bell tower","reply":"The Echo pauses, remembering laughter. Her flicker softens.","reward":"mp"},{"text":"Let Elowen speak to her","reply":"Elowen steps forward gently, and the cold mist warms around you.","reward":"hp"},{"text":"Gather courage with Bramble","reply":"Bramble hands you his very last blueberry. 'For courage,' he whispers.","reward":"potion"}]},"explore":{"goal":"Walk through the misty Hall of Memories and collect shining memory pearls while shades drift through old scenes.","collectible":"pearl","minion":"shade"},"gate":{"speaker":"A memory of young Morwen","line":"I always loved riddles. I used to beat Elowen every time. Can you beat me?"},"foe":{"name":"Morwen's Echo","kind":"wraith","palette":"violet","weak":"light","resist":"wind","boss":false,"taunts":["Nobody stood by me!","Memories never fade!","You'll be left alone too, someday!"],"attacks":["Lonely Wail","Memory Mist","Forgotten Promise"],"defeat":"The Echo stops flickering and becomes a small, smiling girl for a moment. 'Tell her... tell her she can still come home,' she whispers, and fades into light."},"outro":[{"who":"narrator","text":"The memories fade gently, and the thirty-fifth page appears, glowing warm and golden."},{"who":"elowen","text":"That was the part of her that still remembers being kind. It means she can remember again."},{"who":"player","text":"Only one page left. And Morwen has it."},{"who":"bramble","text":"{name}, before we go, I would like to say something very profound and important."},{"who":"bramble","text":"...I have no more blueberries. That is all. I am being very brave about it."},{"who":"theo","text":"The last stair leads to the very top. To Morwen."},{"who":"elowen","text":"Then let us go and bring my friend home."}],"page":{"title":"The Page of Old Friendships","lore":"Friends who quarrel can still find their way back to each other. This page shows two names written side by side, smudged but never erased."}},{"n":36,"act":4,"title":"The Shadow Witch","location":"Shadow Citadel, the Starless Crown","biome":"sky","time":"night","intro":[{"who":"narrator","text":"At the very top of the Shadow Citadel, above the clouds, a swirling crown of shadow spins beneath a starless sky."},{"who":"narrator","text":"In its center, holding the final glowing page, stands Morwen the Shadow Witch."},{"who":"morwen","text":"So. Elowen's little student. Thirty-five pages, {name}. You've taken nearly everything I worked for."},{"who":"player","text":"I didn't take anything, Morwen. The pages chose to be shared. They want everyone to learn."},{"who":"morwen","text":"Everyone? Everyone who laughed at me? Everyone who turned their backs? Starfall threw me away like a broken wand."},{"who":"elowen","text":"Morwen. It's me. I'm the one who turned my back on you. I'm sorry, my friend. I've been sorry for twenty years."},{"who":"morwen","text":"Twenty years, Elowen! Twenty years too late!"},{"who":"theo","text":"{name}, all our friends are here. Look! Emberclaw, Glacia and Sable are flying up behind us!"},{"who":"bramble","text":"Madam Shadow Witch, I have faced wolves, yetis, giants and a very rude hydra. I am not afraid of you. Mostly."},{"who":"morwen","text":"Enough! If I cannot have the Grimoire, no one will! Face me, {name}!"}],"explore":{"goal":"Climb the spinning Starless Crown and collect the last sparks of starlight while Morwen's shades swirl around you.","collectible":"star","minion":"shade"},"gate":{"speaker":"The final Grimoire page, glowing in Morwen's shadow","line":"I have waited for the right reader, {name}. Answer me, and I will come to you."},"foe":{"name":"Morwen the Shadow Witch","kind":"witch","palette":"shadow","weak":"light","resist":"ice","boss":true,"taunts":["Knowledge belongs to ME alone!","You're just a first-year!","I was the brightest Starfall ever saw!"],"attacks":["Shadow Tempest","Grimoire Eclipse","Starless Night"],"defeat":"Morwen's shadows unravel into starlight, and she sinks to her knees. 'I'm so tired of being alone,' she whispers. 'Is it really... not too late?'"},"outro":[{"who":"elowen","text":"It's not too late, Morwen. It never was. Come home to Starfall with me."},{"who":"morwen","text":"...I'd like that. I'm sorry, {name}. You were right. It grows when it's shared."},{"who":"narrator","text":"Morwen opens her hand, and the final page rises. All thirty-six pages swirl together, and the Grand Grimoire is whole again."},{"who":"narrator","text":"A wave of golden light bursts across the realm, from the Frozen Peaks to the Drowned Coast to the Whispering Woods."},{"who":"elowen","text":"The Grimoire has chosen its reader. {name}, I name you Keeper of the Grimoire, protector of knowledge for all."},{"who":"player","text":"Then the first thing I'll do is open it for everyone. Every student, every village, every dragon. Magic is for all of us."},{"who":"emberclaw","text":"Hooray for {name}! Hooray for the Keeper!"},{"who":"glacia","text":"Well read, little Keeper. Very well read indeed."},{"who":"bramble","text":"A perfect ending. Now, about that dessert we were promised in Act One. And maybe some blueberries."}],"page":{"title":"The Page of Shared Light","lore":"The final page holds the Grimoire's oldest secret: knowledge grows brighter every time it is shared. It now shines in every library in the realm."}}];

function G(){if(!S.game)S.game={ch:1,stage:"intro",spells:["spark"],rank:{spark:1},pot:{hp:2,mp:1},pages:[],hp:null,narrate:false,music:true,replay:0};const g=S.game;if(g.music==null)g.music=true;if(!g.rank)g.rank={spark:1};if(!g.pot)g.pot={hp:2,mp:1};if(!g.pages)g.pages=[];if(!g.spells)g.spells=["spark"];if(g.tickets==null)g.tickets=0;return g}
const gtx=s=>String(s||"").replace(/\{name\}/g,S.name||"Wizard");
function wiz(){const L=levelInfo(S.xp).lvl;return{lvl:L,maxHP:100+10*(L-1),maxMP:50+5*(L-1)}}
function chapterReady(){const g=G();return g.ch<=STORY.length&&(g.tickets>0||g.active===g.ch||g.stage!=="intro")}
function grantTicket(n=1){const g=G();g.tickets+=n;save()}
function secretUnlock(){grantTicket(1);GA.resume();GA.FX.page();confetti(80);toast("🔑",`<b>Secret unlock!</b> +1 adventure ticket (you have ${G().tickets})`,3500);if(typeof tab!=="undefined"&&tab==="quest"&&!GW&&!Q)renderTab();else if(tab==="home"&&!Q&&!GW&&$(".hero"))renderTab()}
addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.altKey&&e.code==="KeyG"){e.preventDefault();secretUnlock()}});
let _taps=[];function secretTap(){const now=Date.now();_taps=_taps.filter(t=>now-t<2500);_taps.push(now);if(_taps.length>=5){_taps=[];secretUnlock()}}
function spellDiscovered(id){return SPELLS[id].from===0||G().pages.length>=SPELLS[id].from}
function wordBank(tier){const done=TOPICS.filter(t=>S.topics[t.id]);const src=done.length?done:TOPICS;const last=TOPICS.find(t=>t.id===S.lastTopic);let list=[];
  const add=(t,w)=>w.forEach(x=>list.push({w:x.word,m:x.meaning,t:t.id}));src.forEach(t=>{add(t,t.vocab);add(t,t.spelling)});
  const seen=new Set();list=list.filter(x=>{const k=x.w.toLowerCase();if(seen.has(k)||!/^[a-z]+$/i.test(x.w))return false;seen.add(k);return true});
  const fit=!tier?list:list.filter(x=>tier===1?x.w.length<=6:tier===2?x.w.length>=6&&x.w.length<=8:x.w.length>=8);const pool=fit.length>=3?fit:list;
  if(last&&Math.random()<.5){const lp=pool.filter(x=>x.t===last.id);if(lp.length)return pick(lp)}return pick(pool)}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

      <p class="qnote">Your level comes from the XP you earn reading stories. Higher level = more health and magic!</p>

       <div class="pot"><span>🔷</span><b>Magic Potion</b><small>You have ${g.pot.mp}</small><button class="btn sm ${S.gems>=6?"green":"alt"}" onclick="buyPotion('mp')">💎 6</button></div></div></div>
    <div class="qcard wide"><h3>📖 Spell Library</h3><p class="qnote">Spells are found as you recover Grimoire pages. Spend the 💎 gems you earn from stories to learn them and make them stronger. In battle, you power spells by typing words you've learned!</p>
      <div class="spgrid">${SPELL_ORDER.map(id=>{const s=SPELLS[id],has=g.spells.includes(id),disc=spellDiscovered(id),r=g.rank[id]||1,up=Math.round(s.cost*.8*r)+10;
        return `<div class="spc ${has?"has":disc?"disc":"lock"}"><div class="spi">${disc?s.i:"❔"}</div><b>${disc?s.n:"Unknown spell"}</b>

function afterQuestRender(){const cv=$("#qwiz");if(!cv)return;const c=cv.getContext("2d");let t=0;const loop=()=>{if(!document.body.contains(cv))return;t+=.03;c.clearRect(0,0,220,250);
  GFX.glow(c,110,150,110,"#7c5cff",.35);GFX.drawPerson(c,96,240,200,Object.assign(GFX.CAST.player({}),{t,face:1}));GFX.drawOwl(c,170,90+Math.sin(t*2)*6,1.1,t,true);requestAnimationFrame(loop)};loop()}
function buyPotion(k){const g=G();if(S.gems<6){toast("💎","You need more gems. Read a story to earn some!");SFX.no();return}if(g.pot[k]>=9){toast("🧪","Your bag is full of those!");return}S.gems-=6;g.pot[k]++;save();SFX.coin();renderTab()}
function learnSpell(id){const g=G(),s=SPELLS[id];if(S.gems<s.cost){toast("💎",`You need ${s.cost-S.gems} more gems. Finish a story challenge to earn them!`);SFX.no();return}
  S.gems-=s.cost;g.spells.push(id);g.rank[id]=1;save();GA.resume();GA.FX.page();confetti(80);modal(`<div class="mi">${s.i}</div><h2>${s.n} learned!</h2><p class="muted" style="font-weight:700">${esc(s.d)}</p><div class="row"><button class="btn" onclick="closeModal();renderTab()">Awesome!</button></div>`)}
function upSpell(id){const g=G(),s=SPELLS[id],r=g.rank[id]||1,c=Math.round(s.cost*.8*r)+10;if(r>=3)return;if(S.gems<c){toast("💎",`You need ${c-S.gems} more gems.`);SFX.no();return}S.gems-=c;g.rank[id]=r+1;save();GA.resume();GA.FX.level();toast(s.i,`<b>${s.n}</b> is now rank ${r+1}!`);renderTab()}

/* ===================== GAME SHELL ===================== */
let GW=null;
function openGame(replayN){const g=G();GA.resume();
  if(replayN){if(g.tickets<1){toast("🎟️","Finish a story challenge to earn an adventure ticket for a replay!");SFX.no();return}g.tickets--;save()}
  else{if(!chapterReady()){toast("🔒","Finish a story challenge to unlock your next adventure!");SFX.no();return}if(g.active!==g.ch&&g.stage==="intro"){g.tickets--;g.active=g.ch;save()}}
  const n=replayN||g.ch;const ch=STORY[n-1];if(!ch)return;stopSpeak();document.body.style.overflow="hidden";
  const el=document.createElement("div");el.id="gwrap";el.innerHTML=`<canvas id="gcv"></canvas><div id="ghud"></div>
   <div class="gtop"><span class="gchip">Ch ${n} · ${esc(ch.title)}</span><span style="flex:1"></span>
    <button class="gbtn" id="gnarr" title="Read dialogue aloud" onclick="toggleNarr()">${g.narrate?"🗣️":"🔇"}</button>
    <button class="gbtn" id="gmus" title="Music" onclick="toggleMus()">${g.music?"🎵":"🚫"}</button>
    <button class="gbtn" title="Save & exit" onclick="exitGame()">✖</button></div>`;document.body.appendChild(el);
  const cv=$("#gcv");GW={n,ch,replay:!!replayN,cv,c:cv.getContext("2d"),scene:null,last:performance.now(),t:0,keys:{},shake:0,stage:replayN?"intro":g.stage};
  GA.setMusic(g.music);resizeGame();addEventListener("resize",resizeGame);addEventListener("keydown",gKey);addEventListener("keyup",gKeyUp);
  runStage(GW.stage);GW.raf=requestAnimationFrame(gLoop)}
function exitGame(){if(!GW)return;cancelAnimationFrame(GW.raf);GA.stopMusic();GA.stopAmb();stopSpeak();removeEventListener("resize",resizeGame);removeEventListener("keydown",gKey);removeEventListener("keyup",gKeyUp);
  if(GW.scene&&GW.scene.stop)GW.scene.stop();const el=$("#gwrap");if(el)el.remove();document.body.style.overflow="";GW=null;save();if(tab==="quest")renderTab()}
function toggleNarr(){const g=G();g.narrate=!g.narrate;save();$("#gnarr").textContent=g.narrate?"🗣️":"🔇";if(!g.narrate)stopSpeak()}
function toggleMus(){const g=G();g.music=!g.music;save();GA.setMusic(g.music);$("#gmus").textContent=g.music?"🎵":"🚫"}
function resizeGame(){if(!GW)return;const W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);GW.cv.width=W*dpr;GW.cv.height=H*dpr;GW.cv.style.width=W+"px";GW.cv.style.height=H+"px";
  const sc=Math.min(H/540,W/520);GW.sc=sc;GW.VW=W/sc;GW.oy=(H-540*sc)/2;GW.dpr=dpr;if(GW.scene&&GW.scene.resize)GW.scene.resize()}
function gLoop(ts){if(!GW)return;const dt=Math.min(.05,(ts-GW.last)/1000);GW.last=ts;GW.t+=dt;const c=GW.c;
  c.setTransform(1,0,0,1,0,0);c.fillStyle="#05040a";c.fillRect(0,0,GW.cv.width,GW.cv.height);
  const sh=GW.shake>0?(GW.shake-=dt,(Math.random()-.5)*14*Math.min(1,GW.shake*3)):0;
  c.setTransform(GW.sc*GW.dpr,0,0,GW.sc*GW.dpr,sh*GW.dpr,(GW.oy+sh*.6)*GW.dpr);
  GW.raf=requestAnimationFrame(gLoop);
  if(GW.scene){try{GW.scene.update&&GW.scene.update(dt);c.save();c.beginPath();c.rect(0,0,GW.VW,540);c.clip();GW.scene.draw&&GW.scene.draw(c,dt)}catch(e){if(!GW._err){GW._err=1;console.warn(e)}}finally{c.restore()}}}
function gKey(e){if(!GW)return;if(/INPUT|TEXTAREA/.test(e.target.tagName))return;GW.keys[e.key.toLowerCase()]=true;if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault();GW.scene&&GW.scene.key&&GW.scene.key(e)}
function gKeyUp(e){if(!GW)return;GW.keys[e.key.toLowerCase()]=false}
function setStage(st){GW.stage=st;if(!GW.replay){G().stage=st;save()}runStage(st)}
function runStage(st){if(GW.scene&&GW.scene.stop)GW.scene.stop();$("#ghud").innerHTML="";const ch=GW.ch;
  if(st==="intro"){GW.scene=new Cutscene(ch.intro,"story",()=>ch.choice&&!GW.replay?setStage("choice"):setStage("explore"))}
  else if(st==="choice"){GW.scene=new Cutscene([],"story",null);showChoice()}
  else if(st==="explore"){GW.scene=new Explore()}
  else if(st==="battle"){GW.scene=new Battle()}
  else if(st==="outro"){GW.scene=new Cutscene(ch.outro,"story",()=>setStage("page"),true)}
  else if(st==="page"){GW.scene=new Cutscene([],"hub",null,true);showPageReward()}}
function hud(html){$("#ghud").insertAdjacentHTML("beforeend",html)}

/* ===================== CUTSCENE ===================== */
class Cutscene{constructor(lines,music,done,after){this.lines=lines;this.i=0;this.done=done;this.after=after;const ch=GW.ch;
  this.bd=GFX.buildBackdrop(ch.biome,ch.time,400,Math.max(GW.VW,900),ch.n*17);GA.startMusic(music);GA.ambience(ch.biome);this.who="narrator";this.right=null;
  if(lines.length){hud(`<div class="dlg" id="dlg" onclick="GW.scene.next()"><canvas id="dport" width="110" height="110"></canvas><div class="dtx"><div class="dname" id="dname"></div><div class="dtext" id="dtext"></div></div>
    <div class="dctl"><span class="dmore">▶</span></div></div><button class="gskip" onclick="GW.scene.skip()">Skip scene ⏭</button>`);this.show()}}
  show(){const L=this.lines[this.i];this.who=L.who;if(!["player","bramble","narrator"].includes(L.who))this.right=L.who;
    $("#dname").textContent=L.who==="player"?S.name:L.who==="foe"?GW.ch.foe.name:WHO[L.who]||"";$("#dname").style.display=L.who==="narrator"?"none":"block";
    this.full=gtx(L.text);this.shown=0;this.typing=true;$("#dlg").classList.toggle("narr",L.who==="narrator");if(G().narrate)speak(this.full);GA.FX.ui()}
  next(){if(!this.lines.length)return;if(this.typing){this.shown=this.full.length;return}this.i++;if(this.i>=this.lines.length){this.finish();return}this.show()}
  skip(){stopSpeak();this.finish()}
  finish(){if(this._f)return;this._f=1;stopSpeak();this.done&&this.done()}
  key(e){if(e.key===" "||e.key==="Enter"){this.next()}}
  update(dt){if(this.typing&&this.full){this.shown=Math.min(this.full.length,this.shown+dt*55);const el=$("#dtext");if(el)el.textContent=this.full.slice(0,Math.floor(this.shown));if(this.shown>=this.full.length)this.typing=false}
    GFX.updParticles(this.bd,dt,GW.VW);const pc=$("#dport");if(pc)GFX.drawPortrait(pc.getContext("2d"),this.who,110,110,GW.t,S.name,GW.ch.foe)}
  draw(c){const VW=GW.VW,t=GW.t,ch=GW.ch;GFX.drawBackdrop(c,this.bd,60+Math.sin(t*.05)*30,VW,t);GFX.drawGround(c,this.bd,60,VW,t);
    const talkP=this.who==="player";GFX.drawPerson(c,VW*.27,GFX.GROUND_Y+10,175,Object.assign(GFX.CAST.player({}),{t,face:1,cast:talkP?.2+Math.sin(t*6)*.05:0}));
    GFX.drawOwl(c,VW*.27-70+Math.sin(t*1.3)*10,300+Math.sin(t*2)*12,1.15,t,true);
    const r=this.after&&this.right==="foe"?null:this.right;
    if(r==="foe")GFX.drawFoe(c,ch.foe.kind,VW*.72,GFX.GROUND_Y+12,ch.foe.kind==="dragon"?300:ch.foe.kind==="witch"?190:250,ch.foe.palette,t,{},ch.foe.name);
    else if(r==="emberclaw"||r==="glacia")GFX.drawFoe(c,"dragon",VW*.74,GFX.GROUND_Y+12,300,r==="glacia"?"frost":"ember",t,{});
    else if(r&&GFX.CAST[r])GFX.drawPerson(c,VW*.72,GFX.GROUND_Y+10,r==="theo"?160:180,Object.assign(GFX.CAST[r](),{t,face:-1}));
    if(this.after&&this.lines.length)GFX.glow(c,VW*.5,200,140+Math.sin(t*2)*10,"#fff2b0",.25);
    GFX.drawParticles(c,this.bd,t);GFX.drawAtmos(c,this.bd,t,VW)}
  stop(){}}
function showChoice(){const ch=GW.ch;hud(`<div class="gpanel center" id="gch"><div class="gq">🤔 ${esc(gtx(ch.choice.prompt))}</div>${ch.choice.options.map((o,i)=>`<button class="gopt" onclick="pickChoice(${i})">${esc(gtx(o.text))}</button>`).join("")}</div>`)}
function pickChoice(i){const ch=GW.ch,o=ch.choice.options[i],g=G();GA.FX.ui();let rw="";
  if(o.reward==="potion"||o.reward==="hp"){g.pot.hp=Math.min(9,g.pot.hp+1);rw="❤️‍🩹 +1 Healing Potion"}else if(o.reward==="mp"){g.pot.mp=Math.min(9,g.pot.mp+1);rw="🔷 +1 Magic Potion"}else{S.xp+=25;rw="⚡ +25 XP"}save();
  $("#gch").innerHTML=`<div class="gq">${esc(gtx(o.reply))}</div><div class="greward">${rw}</div><button class="btn gold" onclick="setStage('explore')">Continue ➜</button>`;GA.FX.potion()}

/* ===================== POWER-WORD CHALLENGE (shared) ===================== */
function powerWord(opts,cb){/* opts:{title,tier,time,listen} cb(quality,word) */const W=wordBank(opts.tier||2);const listen=opts.listen&&("speechSynthesis" in window);
  const secs=opts.time===0?0:Math.round(10+W.w.length*1.2);let left=secs,done=false,tries=0;
  hud(`<div class="gpanel center pw" id="pw"><div class="pwt">${opts.title}</div>
    ${listen?`<div class="pwc">🎧 Listen to the power word and spell it!</div><button class="hearBtn" onclick="speak('${W.w}',.85*S.rate)">🔊</button>`:`<div class="pwc">🔎 Clue: <b>${esc(W.m)}</b></div><div class="pwc small">${W.w.length} letters · a word from your stories</div>`}
    <div class="tiles" id="pwtiles">${Array(W.w.length).fill("<span></span>").join("")}</div>
    <input class="spellInput" id="pwin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the power word">
    ${secs?`<div class="pwtimer"><i id="pwbar"></i></div>`:""}<div class="spellActions"><button class="btn gold" id="pwgo">Cast! ✨</button></div><div class="pwmsg" id="pwmsg"></div></div>`);
  const inp=$("#pwin");setTimeout(()=>inp.focus(),80);if(listen)setTimeout(()=>speak(W.w,.85*S.rate),250);
  inp.addEventListener("input",()=>{GA.FX.type();const v=inp.value;document.querySelectorAll("#pwtiles span").forEach((s,i)=>{s.textContent=v[i]||"";s.className=v[i]?"f":""})});
  const finish=q=>{if(done)return;done=true;clearInterval(iv);const ts=document.querySelectorAll("#pwtiles span");ts.forEach((s,i)=>{s.textContent=W.w[i];s.className=q>=1?"g":"x";if(q>=1)s.className="g"});
    if(q<1){$("#pwmsg").innerHTML=`The power word was <b>${esc(W.w)}</b> (${W.w.toUpperCase().split("").join("-")})`;speak(W.w,.85*S.rate)}
    setTimeout(()=>{const p=$("#pw");if(p)p.remove();cb(q,W.w,left/(secs||1))},q>=1?600:2100)};
  const submit=()=>{const v=inp.value.trim().toLowerCase(),w=W.w.toLowerCase();if(!v)return;if(v===w)return finish(1);const d=lev(v,w);
    if(opts.retry&&tries===0){tries++;$("#pwmsg").innerHTML=`Almost! ${d===1?"Just one letter is off.":"Try again."} ${listen?"":"Hint: it starts with <b>"+W.w[0]+"</b>"}`;GA.FX.fizzle();inp.select();return}
    finish(d===1?.5:0)};
  $("#pwgo").onclick=submit;inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
  const iv=secs?setInterval(()=>{left-=.1;const b=$("#pwbar");if(b)b.style.width=Math.max(0,left/secs*100)+"%";if(left<=0)finish(lev(inp.value.trim().toLowerCase(),W.w.toLowerCase())===1?.5:0)},100):null}

/* ===================== EXPLORATION ===================== */
const NUMW={three:3,four:4,five:5,six:6,seven:7,eight:8};
class Explore{constructor(){const ch=GW.ch,g=G(),w=wiz();this.L=3000;const r=GFX.rng(ch.n*31+5);
  this.bd=GFX.buildBackdrop(ch.biome,ch.time,this.L,Math.max(GW.VW,900),ch.n*17);GA.startMusic("explore");GA.ambience(ch.biome);
  const m=ch.explore.goal.match(/\b(\d+|three|four|five|six|seven|eight)\b/i);this.need=Math.max(3,Math.min(8,m?(+m[1]||NUMW[m[1].toLowerCase()]):5));
  this.p={x:120,y:GFX.GROUND_Y,vx:0,vy:0,ground:true,face:1,walk:0,inv:0,cool:0,cast:0};if(g.hp==null||g.hp<=0)g.hp=w.maxHP;this.hp=Math.min(g.hp,w.maxHP);this.maxHP=w.maxHP;
  this.plats=[];for(let i=0;i<6;i++){const x=320+i*440+r()*120;this.plats.push({x,y:GFX.GROUND_Y-90-r()*70,w:130+r()*80})}
  this.items=[];const spots=[];for(let i=0;i<this.need+1;i++){const onP=i%2===0&&this.plats[i%6];spots.push(onP?{x:onP.x+onP.w/2,y:onP.y-30}:{x:260+i*(this.L-600)/(this.need+1)+r()*80,y:GFX.GROUND_Y-40})}
  spots.forEach(s=>this.items.push({...s,type:"c",got:false}));this.items.push({x:900+r()*200,y:GFX.GROUND_Y-40,type:"hp",got:false},{x:2200+r()*200,y:this.plats[4].y-30,type:"mp",got:false,px:this.plats[4]});
  this.items[this.items.length-1].x=this.plats[4].x+this.plats[4].w/2;
  const mk=ch.explore.minion;const flying=["bat","wisp","ember","shade","imp"].includes(mk);this.mins=[];for(let i=0;i<8;i++){const x=500+i*300+r()*120;this.mins.push({x,bx:x,y:flying?GFX.GROUND_Y-70-r()*80:GFX.GROUND_Y-12,by:0,ph:r()*6,alive:true,fly:flying,dir:r()<.5?-1:1})}
  this.mins.forEach(m=>m.by=m.y);this.shots=[];this.fx=[];this.got=0;this.cam=0;this.seal={x:1550,open:false,busy:false};this.gate={x:this.L-160,open:false,busy:false};this.paused=false;this.stepT=0;
  hud(`<div class="ehud"><div class="ehp"><span>❤️</span><div class="bar hp"><i id="ehp"></i></div></div><div class="egoal">🎯 ${esc(gtx(ch.explore.goal))}</div><div class="ecount" id="ecount"></div></div>
   <div class="ehelp" id="ehelp">← → move · ↑ or Space jump · F cast Spark</div>
   <div class="touch"><button data-k="arrowleft">◀</button><button data-k="arrowright">▶</button><span style="flex:1"></span><button data-k="f">✨</button><button data-k=" ">⤒</button></div>`);
  document.querySelectorAll(".touch button").forEach(b=>{const k=b.dataset.k;const dn=e=>{e.preventDefault();GW.keys[k]=true;if(k===" "||k==="f")this.key({key:k})};const up=e=>{e.preventDefault();GW.keys[k]=false};
    b.addEventListener("touchstart",dn,{passive:false});b.addEventListener("touchend",up);b.addEventListener("mousedown",dn);b.addEventListener("mouseup",up);b.addEventListener("mouseleave",up)});
  setTimeout(()=>{const h=$("#ehelp");if(h)h.style.opacity=0},7000);this.updHud()}
  updHud(){const b=$("#ehp");if(b)b.style.width=(this.hp/this.maxHP*100)+"%";const c=$("#ecount");if(c)c.innerHTML=`✨ ${esc(GW.ch.explore.collectible)}: <b>${this.got}/${this.need}</b> · 🧪 ${G().pot.hp} · 🔷 ${G().pot.mp}`}
  key(e){if(this.paused)return;const k=e.key.toLowerCase();if((k===" "||k==="arrowup"||k==="w")&&this.p.ground){this.p.vy=-610;this.p.ground=false;GA.FX.jump()}
    if(k==="f"&&this.p.cool<=0){this.p.cool=.35;this.p.cast=.3;this.shots.push({x:this.p.x+this.p.face*30,y:this.p.y-120,vx:this.p.face*720,life:.9});GA.FX.zap()}}
  update(dt){GFX.updParticles(this.bd,dt,GW.VW);if(this.paused)return;const p=this.p,K=GW.keys;const ax=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0);
    p.vx+=(ax*300-p.vx)*Math.min(1,dt*10);if(ax)p.face=ax;p.x=Math.max(40,Math.min(this.L-40,p.x+p.vx*dt));p.vy+=1500*dt;const oy=p.y;p.y+=p.vy*dt;
    if(Math.abs(p.vx)>20&&p.ground){p.walk+=dt*Math.abs(p.vx)/120;this.stepT-=dt;if(this.stepT<=0){GA.FX.step();this.stepT=.32}}else p.walk*=.9;
    const wasG=p.ground;p.ground=false;if(p.y>=GFX.GROUND_Y){p.y=GFX.GROUND_Y;p.vy=0;p.ground=true}
    for(const pl of this.plats){if(p.vy>=0&&oy<=pl.y+2&&p.y>=pl.y&&p.x>pl.x-10&&p.x<pl.x+pl.w+10){p.y=pl.y;p.vy=0;p.ground=true}}if(p.ground&&!wasG)GA.FX.land();
    p.cool-=dt;p.cast=Math.max(0,p.cast-dt);p.inv=Math.max(0,p.inv-dt);
    /* seal & gate blocking */if(!this.seal.open&&p.x>this.seal.x-50){p.x=this.seal.x-50;p.vx=0;if(!this.seal.busy)this.openSeal()}
    if(!this.gate.open&&p.x>this.gate.x-60){p.x=this.gate.x-60;p.vx=0;if(!this.gate.busy)this.openGate()}
    if(this.gate.open&&p.x>this.gate.x+10&&!this._done){this._done=1;G().hp=this.hp;save();GA.FX.gate();setTimeout(()=>setStage("battle"),400)}
    this.cam+=((p.x-GW.VW*.38)-this.cam)*Math.min(1,dt*5);this.cam=Math.max(0,Math.min(this.L-GW.VW,this.cam));
    for(const it of this.items){if(!it.got&&Math.abs(it.x-p.x)<34&&Math.abs(it.y-(p.y-60))<70){it.got=true;if(it.type==="c"){this.got++;GA.FX.collect();S.xp+=3;this.fx.push({x:it.x,y:it.y,t:0,txt:"+1 ✨"})}
      else{G().pot[it.type]=Math.min(9,G().pot[it.type]+1);GA.FX.potion();this.fx.push({x:it.x,y:it.y,t:0,txt:it.type==="hp"?"+1 ❤️‍🩹":"+1 🔷"})}this.updHud();save()}}
    for(const m of this.mins){if(!m.alive)continue;m.ph+=dt;if(m.fly){m.x=m.bx+Math.sin(m.ph*.8)*90;m.y=m.by+Math.sin(m.ph*2.2)*26}else{m.x+=m.dir*50*dt;if(Math.abs(m.x-m.bx)>100)m.dir*=-1}
      if(p.inv<=0&&Math.abs(m.x-p.x)<30&&Math.abs(m.y-(p.y-50))<55){this.hp=Math.max(0,this.hp-7);p.inv=1.1;p.vx=-p.face*300;p.vy=-300;GA.FX.hurt();GW.shake=.25;this.updHud();if(this.hp<=0)this.faint()}}
    for(const s of this.shots){s.x+=s.vx*dt;s.life-=dt;for(const m of this.mins){if(m.alive&&Math.abs(m.x-s.x)<28&&Math.abs(m.y-s.y)<34){m.alive=false;s.life=0;GA.FX.pop();S.xp+=5;this.fx.push({x:m.x,y:m.y,t:0,txt:"+5 XP",burst:1})}}}
    this.shots=this.shots.filter(s=>s.life>0);this.fx.forEach(f=>f.t+=dt);this.fx=this.fx.filter(f=>f.t<1.2)}
  faint(){this.paused=true;hud(`<div class="gpanel center" id="faint"><div style="font-size:50px">🦉</div><div class="gq">“Whoa, careful, ${esc(S.name)}! Have a blueberry and catch your breath.”</div><button class="btn gold" onclick="GW.scene.revive()">Get up! 💪</button></div>`)}
  revive(){const f=$("#faint");if(f)f.remove();this.hp=Math.round(this.maxHP*.6);this.p.x=Math.max(60,this.p.x-250);this.p.inv=2;this.paused=false;this.updHud()}
  openSeal(){this.seal.busy=true;this.paused=true;const ch=GW.ch;GA.FX.ui();
    hud(`<div class="gpanel center" id="sealmsg"><div style="font-size:44px">🔮</div><div class="gq">A shimmering magic seal blocks the path! Bramble whispers: “Speak a power word to break it!”</div><button class="btn gold" onclick="document.getElementById('sealmsg').remove();GW.scene.sealWord()">Ready!</button></div>`)}

        else if(p.el==="wind"){c.strokeStyle="rgba(220,255,240,.7)";c.lineWidth=3;for(let i=0;i<3;i++){c.beginPath();c.arc(x,y,20+i*12,t*10+i,t*10+i+4);c.stroke()}}
        else if(p.el==="nature"){c.strokeStyle="#5fdc4a";c.lineWidth=5;c.beginPath();c.moveTo(p.x,p.y);for(let k=0;k<=12;k++){const uu=k/12*u;c.lineTo(p.x+(p.tx-p.x)*uu,p.y+(p.ty-p.y)*uu+Math.sin(k*1.4+t*8)*16)}c.stroke()}
        else if(p.el==="ice"){for(let i=0;i<3;i++){c.save();c.translate(x-i*22,y+(i-1)*14);c.rotate(Math.atan2(p.ty-p.y,p.tx-p.x));c.fillStyle="rgba(220,250,255,.95)";c.beginPath();c.moveTo(18,0);c.lineTo(-10,-6);c.lineTo(-10,6);c.fill();c.restore();GFX.glow(c,x-i*22,y+(i-1)*14,18,col,.6)}}
        else{for(let i=0;i<6;i++)GFX.glow(c,x-i*10,y+(Math.random()-.5)*8,26-i*3,i%2?"#ffd27a":col,.85);GFX.glow(c,x,y,14,"#ffffff",.9)}
        if(u>=1&&p.t<p.dur+.3){GFX.glow(c,p.tx,p.ty,120*(1-(p.t-p.dur)/.3),col,.8)}}}
    c.textAlign="center";for(const n of this.nums){c.globalAlpha=Math.max(0,1-n.t/1.3);c.font=n.small?"16px serif":"bold 32px 'Baloo 2',sans-serif";c.fillStyle=n.col;if(!n.small){c.strokeStyle="rgba(0,0,0,.7)";c.lineWidth=5;c.strokeText(n.txt,n.x,n.y-n.t*60)}c.fillText(n.txt,n.x,n.y-n.t*60)}c.globalAlpha=1;
    GFX.drawParticles(c,this.bd,t);GFX.drawAtmos(c,this.bd,t,VW)}
  stop(){}}

/* ===================== PAGE REWARD ===================== */
function showPageReward(){const ch=GW.ch,g=G();GA.FX.page();confetti(160);const sp=SPELL_ORDER.find(id=>SPELLS[id].from===ch.n);
  if(!GW.replay){if(!g.pages.includes(ch.n))g.pages.push(ch.n);g.ch=Math.max(g.ch,ch.n+1);g.stage="intro";g.active=null;g.hp=null;save();checkBadges()}
  const last=ch.n===STORY.length;
  hud(`<div class="gpanel center pagecard"><div class="gkick">📜 GRIMOIRE PAGE RECOVERED</div><div class="gtitle">${esc(ch.page.title)}</div><div class="lore">“${esc(gtx(ch.page.lore))}”</div>
    ${sp&&!GW.replay?`<div class="newspell"><span>${SPELLS[sp].i}</span><div><b>New spell discovered: ${SPELLS[sp].n}!</b><br>${esc(SPELLS[sp].d)} Learn it in the Spell Library for 💎 ${SPELLS[sp].cost}.</div></div>`:""}
    ${last&&!GW.replay?`<div class="newspell"><span>👑</span><div><b>You are the Keeper of the Grimoire!</b><br>The realm's magic is whole again, and shared with everyone. Congratulations, ${esc(S.name)}!</div></div>`:""}
    <div class="gq small">📜 ${g.pages.length}/${STORY.length} pages collected</div>
    <button class="btn gold" onclick="exitGame();go('quest')">Back to the Quest ➜</button></div>`)}

/* ================= BOOT ================= */
addEventListener("keydown",e=>{if(!Q||Q.answered||!["comp","gram"].includes(Q.items[Q.idx].type)||/INPUT|TEXTAREA/.test(e.target.tagName))return;const n="1234".indexOf(e.key)>=0?"1234".indexOf(e.key):"abcd".indexOf(e.key.toLowerCase());
  if(n>=0&&n<4){const b=document.querySelectorAll(".opt")[n];if(b)b.click()}});
if(S.name){go("home")}else go("welcome");
