s called ____.","meaning":"Proteins that grab onto germs.","wrong":["antibodys","antybodies","antibodeis"]},{"word":"vaccines","sentence":"____ teach your immune system to recognize a germ ahead of time.","meaning":"Medicines that help your body get ready to fight germs.","wrong":["vacines","vaxines","vaccenes"]},{"word":"temperature","sentence":"A fever means your body ____ goes up a little.","meaning":"How hot or cold something is.","wrong":["temperture","tempature","temprature"]}],"written":[{"q":"Describe how your body's defense team fights germs.","minWords":10,"keyIdeas":[{"label":"Skin and mucus keep germs out","any":["skin","mucus","barrier","wall","nose","tears","saliva"]},{"label":"White blood cells attack germs","any":["white blood","blood cell","guard","gobble","eat","attack"]},{"label":"Antibodies grab onto germs","any":["antibod","protein","grab","lock","key"]},{"label":"The immune system remembers germs","any":["remember","memory","faster","vaccin"]}],"need":2,"sample":"First, my skin and sticky mucus keep most germs out. If germs get in, white blood cells gobble them up or make antibodies that grab onto them."},{"q":"Why does washing your hands help keep you from getting sick? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Germs are on your hands and things you touch","any":["hand","doorknob","touch","everywhere"]},{"label":"Soap and water wash germs away","any":["soap","water","wash","clean","remov","kill"]},{"label":"Fewer germs get into your body","any":["sick","into your body","get in","fewer","spread","mouth","nose"]}],"need":2,"sample":"Germs are on our hands and on things like doorknobs. Washing with soap and water cleans the germs away, so fewer of them get into my body and make me sick."}],"fixit":[{"wrong":"When you sneeze cover you're mouth with your elbow","right":"When you sneeze, cover your mouth with your elbow.","errors":[{"bad":"sneeze","good":"sneeze,","type":"Punctuation"},{"bad":"you're","good":"your","type":"Homophones"},{"bad":"elbow","good":"elbow.","type":"Punctuation"}]},{"wrong":"Virus are smaller than bacteria, and they causes colds.","right":"Viruses are smaller than bacteria, and they cause colds.","errors":[{"bad":"Virus","good":"Viruses","type":"Plurals"},{"bad":"causes","good":"cause","type":"Subject-Verb Agreement"}]}]},{"id":"digestion","title":"The Amazing Journey of Your Lunch","category":"Human Body","emoji":"🍎","minutes":4,"paragraphs":["Imagine you just took a big bite of a peanut butter sandwich. Where does it go? Your food is about to take an amazing trip through your body. This trip is called digestion. Digestion breaks food into tiny pieces your body can use for energy, growth, and repair. The whole path, from your mouth to the end, is called the digestive tract. In a grown-up, it can be about 30 feet long!","The journey starts in your mouth. Your teeth chop and grind the food. At the same time, your mouth makes saliva, or spit. Saliva makes food soft and slippery, and it starts breaking down some of the food right away. Your tongue rolls the food into a soft ball so you can swallow it. Have you ever noticed your mouth watering when you smell a yummy meal? That is your body getting ready to eat!","When you swallow, the food slides down a tube called the esophagus. The esophagus doesn't just let food fall. Its muscles squeeze in waves to push food along, like squeezing toothpaste out of a tube. That's why you could swallow even if you were upside down!","Next stop: the stomach. Your stomach is a stretchy, J-shaped bag. It mixes and churns the food with strong juices that contain acid. After a few hours, the food becomes a thick, soupy mush. Then the stomach slowly squirts the mush into the small intestine, a little at a time.","The small intestine is a long, twisty tube. It isn't small in length at all! In a grown-up, it can be about 20 feet long. It is called small because it is narrow. Here, juices from the pancreas and liver help finish breaking down the food. The walls of the small intestine are covered with tiny, finger-like bumps called villi. They soak up nutrients and pass them into your blood, which carries them all over your body.","Whatever your body can't use moves into the large intestine. The large intestine soaks up water and turns the leftovers into waste. Then the waste leaves your body when you go to the bathroom. To keep your digestion running smoothly, drink plenty of water. Eat fruits, vegetables, and whole grains that have fiber, and chew your food well. Your body will turn that sandwich into energy for your next big adventure!"],"funFact":"Your stomach protects itself from its own strong acid with a thick layer of mucus, and it replaces many of its lining cells every few days.","vocab":[{"word":"saliva","meaning":"The watery spit your mouth makes."},{"word":"esophagus","meaning":"The tube that carries food from your mouth to your stomach."},{"word":"churns","meaning":"Stirs and mixes something hard."},{"word":"nutrients","meaning":"Parts of food your body needs to grow and stay healthy."},{"word":"fiber","meaning":"A part of plant foods that keeps digestion moving."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Peanut butter sandwiches are healthy","The stomach is shaped like a J","Food takes a journey through your body to be broken down and used","Saliva is the same as water"],"answer":2,"explain":"Great job! The article follows food step by step as your body breaks it down."},{"q":"Where does food go right after the esophagus?","options":["The stomach","The mouth","The large intestine","The small intestine"],"answer":0,"explain":"You got it! After the esophagus, the article says, 'Next stop: the stomach.'"},{"q":"Why do you think chewing your food well helps digestion?","options":["It makes food travel backward","It makes the stomach smaller","It stops saliva from forming","It breaks food into smaller pieces that are easier to digest"],"answer":3,"explain":"Smart thinking! The article explains that digestion is all about breaking food into tiny pieces."},{"q":"The article says the stomach 'churns' the food. What does churns mean?","options":["Freezes","Stirs and mixes hard","Colors","Keeps very still"],"answer":1,"explain":"Nice! The article says the stomach 'mixes and churns the food.'"},{"q":"Why is the small intestine called 'small'?","options":["It is the shortest part","It only holds small foods","It is narrow","It is found only in small children"],"answer":2,"explain":"Exactly! The article says, 'It is called small because it is narrow.'"}],"grammar":[{"skill":"Prepositions","q":"Which word is a PREPOSITION in this sentence: 'The food slides down a tube.'","options":["food","slides","tube","down"],"answer":3,"explain":"Yes! 'Down' tells where the food goes, so it is a preposition."},{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'Your stomach mixes the food.'","options":["mixes","stomach","food","Your"],"answer":0,"explain":"Correct! 'Mixes' is the action the stomach does."},{"skill":"Sentence Types","q":"What kind of sentence is this: 'Where does your food go?'","options":["Statement","Question","Command","Exclamation"],"answer":1,"explain":"Great! It asks something and ends with a question mark, so it is a question."},{"skill":"Conjunctions","q":"Choose the best conjunction: 'The small intestine is long, ____ it is called small because it is narrow.'","options":["or","because","but","so"],"answer":2,"explain":"Right! 'But' joins two ideas that seem to go against each other."}],"spelling":[{"word":"digestion","sentence":"This trip through your body is called ____.","meaning":"How your body breaks down food.","wrong":["digestshun","dygestion","digeston"]},{"word":"saliva","sentence":"Your mouth makes ____, or spit.","meaning":"The watery spit in your mouth.","wrong":["saleva","salliva","saliver"]},{"word":"esophagus","sentence":"When you swallow, the food slides down a tube called the ____.","meaning":"The food tube from mouth to stomach.","wrong":["esofagus","esophogus","esophegus"]},{"word":"stomach","sentence":"Your ____ is a stretchy, J-shaped bag.","meaning":"The stretchy bag that mixes your food.","wrong":["stomick","stomache","stumach"]},{"word":"intestine","sentence":"The small ____ is a long, twisty tube.","meaning":"A long tube where food is broken down and soaked up.","wrong":["intestin","intesteen","intestene"]},{"word":"nutrients","sentence":"Tiny bumps called villi soak up ____ and pass them into your blood.","meaning":"Healthy parts of food your body needs.","wrong":["nutrience","nutrents","nutriants"]}],"written":[{"q":"Describe the journey your food takes after you swallow it.","minWords":12,"keyIdeas":[{"label":"It goes down the esophagus","any":["esophagus","tube","throat","swallow"]},{"label":"The stomach mixes it into mush","any":["stomach","churn","mix","acid","mush"]},{"label":"The small intestine soaks up nutrients","any":["small intestine","nutrient","villi","blood","soak"]},{"label":"The large intestine makes waste","any":["large intestine","waste","water","bathroom","poop","leftover"]}],"need":2,"sample":"After I swallow, the food slides down the esophagus to my stomach, where it is churned into mush. Then the small intestine soaks up the nutrients, and the large intestine turns the leftovers into waste."},{"q":"Why can you swallow food even if you are upside down? Use details from the article.","minWords":10,"keyIdeas":[{"label":"The esophagus has muscles","any":["muscle","esophagus","tube","throat"]},{"label":"The muscles squeeze in waves","any":["squeez","wave","push","toothpaste"]},{"label":"Food does not just fall down","any":["fall","gravity","upside","move along"]}],"need":2,"sample":"The esophagus does not just let food fall. Its muscles squeeze in waves to push the food along, like squeezing toothpaste out of a tube."}],"fixit":[{"wrong":"the stomach mix food with strong juices","right":"The stomach mixes food with strong juices.","errors":[{"bad":"the","good":"The","type":"Capital Letters"},{"bad":"mix","good":"mixes","type":"Subject-Verb Agreement"},{"bad":"juices","good":"juices.","type":"Punctuation"}]},{"wrong":"I eat fruits, vegetables, and hole grains to get fiber yesterday.","right":"I ate fruits, vegetables, and whole grains to get fiber yesterday.","errors":[{"bad":"eat","good":"ate","type":"Verb Tense"},{"bad":"hole","good":"whole","type":"Homophones"}]}]},{"id":"senses","title":"Your Five Super Senses","category":"Human Body","emoji":"👀","minutes":4,"paragraphs":["Imagine biting into a juicy orange. You see its bright color, smell its sweet scent, feel its bumpy peel, taste its tangy juice, and hear the squish as you bite. In just one moment, you used all five of your senses! Your senses are how your body collects information about the world. They send messages to your brain, and your brain figures out what they mean.","Let's start with sight. Light bounces off objects and enters your eye through the pupil, the black circle in the middle. The lens focuses the light onto the retina at the back of your eye. The retina turns light into signals and sends them to your brain. Here's a fun twist: the picture on your retina is upside down, but your brain flips it right side up!","Next is hearing. Sounds are vibrations that travel through the air in waves. Your outer ear catches the sound waves like a funnel. The waves make your eardrum vibrate. Then three tiny bones pass the vibrations along to a snail-shaped part called the cochlea. The cochlea turns the vibrations into signals for your brain. Loud sounds can harm the cochlea, so it is smart to protect your ears.","Smell and taste are best buddies. Your nose has special cells that detect tiny particles floating in the air. Your tongue is covered with taste buds that can sense sweet, salty, sour, bitter, and savory flavors. Much of what we call flavor actually comes from smell. That's why food tastes bland when you have a stuffy nose!","Touch is the sense you use with your whole body. Your skin is your largest organ, and it is filled with nerve endings. Some detect pressure, while others sense heat, cold, or pain. Your fingertips and lips have lots of these nerve endings, so they are extra sensitive. That's why you use your fingers to feel whether something is smooth or rough.","Your senses work as a team to keep you safe and help you enjoy life. Smelling smoke warns you of danger. Feeling a hot stove tells you to pull your hand away. To protect your senses, wear sunglasses in bright sun, keep music at a safe volume, and wash your hands often. Take a moment today to notice what you can see, hear, smell, taste, and touch!"],"funFact":"Scientists say people actually have more than five senses! One sense helps you keep your balance, and another tells you where your arms and legs are without looking.","vocab":[{"word":"pupil","meaning":"The black circle in your eye that lets light in."},{"word":"retina","meaning":"The back of the eye that turns light into signals."},{"word":"vibrations","meaning":"Fast back-and-forth shaking movements."},{"word":"cochlea","meaning":"A snail-shaped part of your inner ear."},{"word":"sensitive","meaning":"Quick to notice or feel things."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Oranges are juicy and sweet","Your ears are shaped like funnels","Food tastes bland when you are sick","Your five senses collect information and send it to your brain"],"answer":3,"explain":"Great job! The article explains how each sense gathers information for your brain."},{"q":"Which part of the ear turns vibrations into signals?","options":["The eardrum","The cochlea","The outer ear","The retina"],"answer":1,"explain":"You got it! The article says, 'The cochlea turns the vibrations into signals for your brain.'"},{"q":"Leo has a cold, and he says his pizza tastes like nothing. Based on the article, why?","options":["His stuffy nose keeps him from smelling the food","His taste buds fell off","Pizza has no flavor","His eyes are closed"],"answer":0,"explain":"Smart thinking! The article says much of flavor comes from smell, so a stuffy nose makes food taste bland."},{"q":"The article says fingertips are extra 'sensitive.' What does sensitive mean?","options":["Very dirty","Very strong","Quick to feel things","Very cold"],"answer":2,"explain":"Nice! Fingertips have lots of nerve endings, so they feel things easily."},{"q":"Which of these happens FIRST when you hear a sound?","options":["The cochlea sends signals","The tiny bones pass along vibrations","Your brain understands the sound","Your outer ear catches the sound waves"],"answer":3,"explain":"Exactly! The article says the outer ear catches the waves before the eardrum and bones get to work."}],"grammar":[{"skill":"Adjectives","q":"Which word is an ADJECTIVE in this sentence: 'You see its bright color.'","options":["see","bright","color","You"],"answer":1,"explain":"Yes! 'Bright' describes the color, so it is an adjective."},{"skill":"Commas","q":"Which sentence uses commas correctly in a list?","options":["Taste buds sense sweet, salty, and sour flavors.","Taste buds sense, sweet salty and sour flavors.","Taste buds, sense sweet salty, and sour flavors.","Taste buds sense sweet salty, and, sour flavors."],"answer":0,"explain":"Correct! A comma goes after each item in the list except the last one."},{"skill":"Homophones","q":"Choose the correct word: 'The orange has a bumpy peel, and ____ juice is tangy.'","options":["it's","its'","its","it is"],"answer":2,"explain":"Great! 'Its' without an apostrophe shows that the juice belongs to the orange."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'Your senses ____ as a team.'","options":["works","is working","has worked","work"],"answer":3,"explain":"Right! 'Senses' is plural, so it goes with 'work.'"}],"spelling":[{"word":"vibrations","sentence":"Sounds are ____ that travel through the air in waves.","meaning":"Fast shaking movements.","wrong":["vibrashuns","vibratons","vybrations"]},{"word":"retina","sentence":"The lens focuses the light onto the ____ at the back of your eye.","meaning":"The part of the eye that turns light into signals.","wrong":["retena","retinna","rettina"]},{"word":"cochlea","sentence":"Three tiny bones pass the vibrations to a snail-shaped part called the ____.","meaning":"A snail-shaped part of the inner ear.","wrong":["kochlea","cochlia","coklea"]},{"word":"particles","sentence":"Your nose has special cells that detect tiny ____ floating in the air.","meaning":"Very tiny bits of something.","wrong":["particals","partickles","partikles"]},{"word":"sensitive","sentence":"Your fingertips and lips are extra ____.","meaning":"Able to feel things easily.","wrong":["sensative","sensitiv","sencitive"]},{"word":"flavors","sentence":"Taste buds can sense sweet, salty, sour, bitter, and savory ____.","meaning":"The tastes of foods.","wrong":["flavers","flavores","flavrs"]}],"written":[{"q":"In your own words, explain how your eyes help you see.","minWords":10,"keyIdeas":[{"label":"Light enters through the pupil","any":["light","pupil","enter","black circle"]},{"label":"The lens focuses light on the retina","any":["lens","focus","retina","back of"]},{"label":"Signals go to the brain","any":["signal","brain","message","nerve"]},{"label":"The brain flips the picture","any":["flip","upside","right side","turn"]}],"need":2,"sample":"Light bounces off things and goes into my eye through the pupil. The lens focuses it on the retina, which sends signals to my brain so I can see."},{"q":"Why does food taste bland when you have a stuffy nose? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Much of flavor comes from smell","any":["smell","scent","nose","sniff"]},{"label":"A stuffy nose blocks smelling","any":["stuffy","block","cold","can't","cannot","stuck"]},{"label":"Taste and smell work together","any":["taste","together","buddies","flavor","team"]}],"need":2,"sample":"Much of what we call flavor actually comes from smell. When my nose is stuffy, I can't smell my food well, so it tastes bland."}],"fixit":[{"wrong":"my eyes ears, and nose send messages to the brain.","right":"My eyes, ears, and nose send messages to the brain.","errors":[{"bad":"my","good":"My","type":"Capital Letters"},{"bad":"eyes","good":"eyes,","type":"Punctuation"}]},{"wrong":"Your fingertips is extra sensative to touch.","right":"Your fingertips are extra sensitive to touch.","errors":[{"bad":"is","good":"are","type":"Subject-Verb Agreement"},{"bad":"sensative","good":"sensitive","type":"Spelling"}]}]},{"id":"dna","title":"DNA: The Instruction Book Inside You","category":"Human Body","emoji":"🧬","minutes":4,"paragraphs":["Have you ever wondered why you have your mom's curly hair or your grandpa's dimples? The answer is hiding inside almost every one of your cells. It is a tiny but powerful molecule called DNA. DNA is like an instruction book that tells your body how to grow, what to look like, and how to work.","DNA stands for deoxyribonucleic acid. That's a mouthful, so everyone just says DNA! Its shape is called a double helix. Imagine a ladder that has been twisted like a spiral staircase. The two long sides of the ladder are like rails, and the rungs in the middle are made of pairs of chemicals.","Those chemicals work like letters in an alphabet. But DNA's alphabet has only four letters: A, T, C, and G. Each letter stands for a chemical with a long name. The order of these letters spells out instructions, just like the order of letters in words tells a story. Your DNA has about three billion pairs of letters! If you read one pair out loud every second, without ever stopping, it would take you about 95 years.","A section of DNA that holds the directions for one job is called a gene. Some genes help decide your eye color. Others help build your muscles or help your body digest food. Humans have around 20,000 genes. Your DNA is packed into bundles called chromosomes. Most people have 46 chromosomes in each cell, arranged in 23 pairs.","You get half of your DNA from your mother and half from your father. That's why you might look a little like each of them, but not exactly like either one. Every person's DNA is a special mix. Identical twins share almost exactly the same DNA, but everyone else in the world has their very own. That makes you truly one of a kind!","Here is something amazing: if you could stretch out all the DNA from just one of your cells, it would be about six feet long! It fits inside the tiny cell because it is wound up very tightly, like thread on a spool. Scientists study DNA to learn about health, to understand how living things are related, and even to learn about animals that lived long ago. Your DNA connects you to your family and to all life on Earth."],"funFact":"Your DNA is almost 99 percent the same as a chimpanzee's! And any two people on Earth share about 99.9 percent of their DNA.","vocab":[{"word":"molecule","meaning":"A tiny building block made of atoms joined together."},{"word":"helix","meaning":"A twisting spiral shape, like a curly slide."},{"word":"gene","meaning":"A part of DNA with directions for one job."},{"word":"chromosomes","meaning":"Bundles that hold tightly packed DNA inside cells."},{"word":"identical","meaning":"Exactly alike in every way."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Twins always look exactly the same","DNA is an instruction book that shapes how your body grows and works","Ladders can be twisted into spirals","Grandpas often have dimples"],"answer":1,"explain":"Great job! The article explains how DNA gives your body its instructions."},{"q":"How many letters are in DNA's alphabet?","options":["Two","Twenty-six","Twenty-three","Four"],"answer":3,"explain":"You got it! The article says DNA's alphabet 'has only four letters: A, T, C, and G.'"},{"q":"Why might a girl have her dad's freckles and her mom's smile?","options":["She chose them herself","Freckles only come from the sun","She got half her DNA from each parent","Her DNA is exactly the same as her mom's"],"answer":2,"explain":"Smart thinking! The article says you get half your DNA from your mother and half from your father."},{"q":"According to the article, what is a 'gene'?","options":["A section of DNA with directions for one job","A kind of twisted ladder","A tiny bone in the ear","A letter in the regular alphabet"],"answer":0,"explain":"Nice! The article says a gene 'holds the directions for one job.'"},{"q":"How can six feet of DNA fit inside one tiny cell?","options":["It is cut into pieces and thrown away","It is wound up very tightly","It is folded like a paper airplane","The cell stretches to six feet long"],"answer":1,"explain":"Exactly! The article says DNA 'is wound up very tightly, like thread on a spool.'"}],"grammar":[{"skill":"Capital Letters","q":"Why are all the letters in 'DNA' capitals?","options":["Because it is always the first word in a sentence","Because it is a short way to write a long name","Because it is an action word","Because it ends a sentence"],"answer":1,"explain":"Yes! DNA is an abbreviation for 'deoxyribonucleic acid,' so its letters are capitalized."},{"skill":"Verb Tenses","q":"Which sentence is written in the FUTURE tense?","options":["Scientists studied DNA.","Scientists study DNA.","Scientists will study DNA.","Scientists are studying DNA."],"answer":2,"explain":"Correct! 'Will study' tells about something that is going to happen."},{"skill":"Conjunctions","q":"Which word is the CONJUNCTION in this sentence: 'You might look like your parents, but not exactly like either one.'","options":["look","parents","exactly","but"],"answer":3,"explain":"Great! 'But' connects two ideas, so it is a conjunction."},{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'The DNA is wound up tightly.'","options":["DNA","wound","tightly","is"],"answer":0,"explain":"Right! 'DNA' names a thing, so it is a noun."}],"spelling":[{"word":"molecule","sentence":"It is a tiny but powerful ____ called DNA.","meaning":"A tiny building block of matter.","wrong":["molecool","molecul","mollecule"]},{"word":"spiral","sentence":"Imagine a ladder that has been twisted like a ____ staircase.","meaning":"A shape that winds around and around.","wrong":["spirel","spiril","spyral"]},{"word":"alphabet","sentence":"Those chemicals work like letters in an ____.","meaning":"A set of letters used to write words.","wrong":["alfabet","alphabit","alphebet"]},{"word":"chromosomes","sentence":"Your DNA is packed into bundles called ____.","meaning":"Bundles of DNA inside your cells.","wrong":["cromosomes","chromozomes","chromosoms"]},{"word":"identical","sentence":"____ twins share almost exactly the same DNA.","meaning":"Exactly the same.","wrong":["identicle","idenical","identikal"]},{"word":"scientists","sentence":"____ study DNA to learn about health.","meaning":"People who study the world to learn how it works.","wrong":["sientists","scientests","sceintists"]}],"written":[{"q":"In your own words, explain what DNA does.","minWords":10,"keyIdeas":[{"label":"DNA is like an instruction book","any":["instruction","direction","book","recipe","code","tell"]},{"label":"It tells your body how to grow and work","any":["grow","work","build","body"]},{"label":"It decides how you look","any":["look","eye","hair","color","dimple","freckle"]},{"label":"It is made of genes or four letters","any":["gene","letter","chromosom","helix"]}],"need":2,"sample":"DNA is like an instruction book inside my cells. It tells my body how to grow and how to work, and it helps decide things like my eye color."},{"q":"Why might you look a little like both of your parents but not exactly like either one? Use details from the article.","minWords":10,"keyIdeas":[{"label":"You get half your DNA from each parent","any":["half","both","each parent","mom","dad","mother","father"]},{"label":"Your DNA is a special mix","any":["mix","combin","blend","unique","special","one of a kind"]},{"label":"Genes decide traits like eye color","any":["gene","trait","eye","hair","look"]}],"need":2,"sample":"I get half of my DNA from my mom and half from my dad. My DNA is a special mix of both, so I look a little like each of them but not exactly like either one."}],"fixit":[{"wrong":"dna is shaped like a twisted ladder","right":"DNA is shaped like a twisted ladder.","errors":[{"bad":"dna","good":"DNA","type":"Capital Letters"},{"bad":"ladder","good":"ladder.","type":"Punctuation"}]},{"wrong":"Most people has 46 chromosome in each cell.","right":"Most people have 46 chromosomes in each cell.","errors":[{"bad":"has","good":"have","type":"Subject-Verb Agreement"},{"bad":"chromosome","good":"chromosomes","type":"Plurals"}]}]},{"id":"magnets","title":"The Invisible Pull: The Mystery of Magnets","category":"Physics","emoji":"🧲","minutes":4,"paragraphs":["Imagine holding a small gray rock that can pull a nail right out of your hand. Thousands of years ago, people in places like ancient Greece and China found rocks just like that. They called the rock lodestone. It seemed like magic, but it was really science. Today we call objects that can pull on certain metals magnets, and you probably have a few stuck to your refrigerator right now.","Every magnet has two ends called poles. One is the north pole and the other is the south pole. Here is the strange rule: opposite poles attract, which means they pull toward each other. But two north poles push apart, and so do two south poles. Try to push two matching poles together and you will feel an invisible force fighting back, almost like a bouncy cushion of air.","That invisible force spreads out around the magnet in an area called a magnetic field. You cannot see it, but you can make it appear. Place a magnet under a sheet of paper and gently sprinkle tiny bits of iron on top. The bits will line up in curving lines that loop from one pole to the other. It looks like a secret map drawn by the magnet itself.","Magnets do not stick to everything. They pull strongly on iron, nickel, and cobalt, and on steel, which is mostly iron. They do not pull on wood, plastic, glass, or most coins. Aluminum soda cans will not stick either. Inside a magnetic metal, tiny regions act like little magnets. When most of them point the same direction, the metal itself becomes a magnet.","Here is a giant surprise: Earth itself acts like an enormous magnet. Deep inside our planet, hot liquid metal swirls around and creates a magnetic field that wraps around the whole world. That is why a compass works. The compass needle is a tiny magnet, and it turns to line up with Earth's field, pointing north. Sailors and explorers have used compasses to find their way for about a thousand years.","Magnets are hidden all around you. They help speakers make music, keep cabinet doors closed, and spin the motors inside fans and electric cars. Hospitals use powerful magnets in MRI machines to take pictures of the inside of the body. You can explore magnets at home by testing which objects in a drawer they will pick up. Just ask an adult first, and keep magnets away from phones, computers, and small children, because swallowing magnets is very dangerous."],"funFact":"Some sea turtles, salmon, and birds can sense Earth's magnetic field and use it like a built-in compass when they travel thousands of miles.","vocab":[{"word":"lodestone","meaning":"A natural rock that acts like a magnet."},{"word":"poles","meaning":"The two ends of a magnet, called north and south."},{"word":"attract","meaning":"To pull something toward you."},{"word":"magnetic field","meaning":"The invisible area around a magnet where its force works."},{"word":"compass","meaning":"A tool with a magnet needle that points north."}],"comprehension":[{"q":"What is this article mostly about?","options":["How to build a refrigerator","How magnets work and where we find them","Why rocks are gray","The history of ancient Greece"],"answer":1,"explain":"Great job! The whole article explains how magnets work, from poles to Earth's magnetic field."},{"q":"What happens when you push two north poles together?","options":["They stick together tightly","They turn into south poles","They lose their magnet power","They push apart"],"answer":3,"explain":"Yes! The article says 'two north poles push apart.'"},{"q":"Why would a magnet NOT help you pick up spilled aluminum cans?","options":["Aluminum cans are too heavy","Magnets do not pull on aluminum","The cans are too cold","Magnets only work underwater"],"answer":1,"explain":"Nice thinking! The article says aluminum soda cans will not stick to a magnet."},{"q":"In the article, what does the word 'attract' mean?","options":["To pull toward each other","To push away hard","To break into pieces","To hide from sight"],"answer":0,"explain":"Correct! The text explains that attract 'means they pull toward each other.'"},{"q":"Why does a compass needle point north?","options":["It is painted to point north","The wind pushes it","It lines up with Earth's magnetic field","It is pulled by the sun"],"answer":2,"explain":"Well done! The article says the needle 'turns to line up with Earth's field, pointing north.'"}],"grammar":[{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'The magnet pulls the paperclip.'","options":["magnet","the","pulls","paperclip"],"answer":2,"explain":"Yes! 'Pulls' is the action the magnet does."},{"skill":"Plurals","q":"What is the correct plural of 'compass'?","options":["compasses","compass's","compassies","compasss"],"answer":0,"explain":"Right! Words ending in -ss add -es, so 'compass' becomes 'compasses.'"},{"skill":"Homophones","q":"Choose the word that correctly completes the sentence: 'A magnet has ____ poles.'","options":["to","too","tow","two"],"answer":3,"explain":"Great! 'Two' is the number, and a magnet has two poles."},{"skill":"Capital Letters","q":"Which word in this sentence should start with a capital letter: 'Sailors in ancient greece found lodestone.'","options":["ancient","greece","found","lodestone"],"answer":1,"explain":"Correct! 'Greece' is the name of a country, so it is a proper noun that needs a capital letter."}],"spelling":[{"word":"magnetic","sentence":"That invisible force spreads out around the magnet in an area called a ____ field.","meaning":"Able to pull things made of iron or steel toward it.","wrong":["magnetik","magnettic","magentic"]},{"word":"invisible","sentence":"You will feel an ____ force fighting back.","meaning":"Not able to be seen.","wrong":["invisable","invisibel","invissible"]},{"word":"attract","sentence":"Opposite poles ____, which means they pull toward each other.","meaning":"To pull toward.","wrong":["atract","attrack","atttract"]},{"word":"compass","sentence":"The ____ needle is a tiny magnet.","meaning":"A tool that shows which way is north.","wrong":["compas","cumpass","compuss"]},{"word":"explorers","sentence":"Sailors and ____ have used compasses to find their way.","meaning":"People who travel to discover new places.","wrong":["explorors","explorres","exployers"]},{"word":"surprise","sentence":"Here is a giant ____: Earth itself acts like an enormous magnet.","meaning":"Something you did not expect.","wrong":["suprise","surprize","serprise"]}],"written":[{"q":"In your own words, explain how a magnet can move something without touching it.","minWords":10,"keyIdeas":[{"label":"A magnet has an invisible force","any":["invisible","force","power","energy","can't see","cannot see"]},{"label":"The force is a magnetic field around the magnet","any":["field","magnetic","around the magnet","area"]},{"label":"It pulls on metals like iron or steel","any":["pull","attract","iron","steel","metal","nickel","draw"]},{"label":"Opposite poles attract and matching poles push","any":["pole","north","south","opposite","push","repel"]}],"need":2,"sample":"A magnet has an invisible force called a magnetic field that spreads out around it. That force can pull on metals like iron and steel, so a paperclip moves toward the magnet even before they touch."},{"q":"What would happen if you tried to use a compass in a place with no magnetic field? Use details from the article.","minWords":10,"keyIdeas":[{"label":"The needle would not point north","any":["north","not point","wouldn't point","would not point","point","direction"]},{"label":"A compass needle is a magnet that lines up with Earth's field","any":["line up","lines up","earth","field","magnet","needle"]},{"label":"You could get lost or not find your way","any":["lost","find your way","way","direction","navigate","useless","not work","wouldn't work"]}],"need":2,"sample":"The compass would not work because its needle is a tiny magnet that lines up with Earth's magnetic field. Without that field, the needle would not point north, so sailors could get lost."}],"fixit":[{"wrong":"the magnet pull a paperclip.","right":"The magnet pulls a paperclip.","errors":[{"bad":"the","good":"The","type":"Capital Letters"},{"bad":"pull","good":"pulls","type":"Subject-Verb Agreement"}]},{"wrong":"Sailors used compasses to find there way across the ocean","right":"Sailors used compasses to find their way across the ocean.","errors":[{"bad":"there","good":"their","type":"Homophones"},{"bad":"ocean","good":"ocean.","type":"Punctuation"}]}]},{"id":"electricity","title":"Zap! The Amazing Path of Electricity","category":"Physics","emoji":"⚡","minutes":4,"paragraphs":["Imagine flipping a switch and watching a dark room fill with light in less than a blink. What makes that happen? The answer is electricity, a kind of energy that comes from tiny particles called electrons. Electrons are far too small to see, even with a regular microscope. But when billions of them move together along a wire, they can power lamps, toasters, and video games.","Electricity needs a path to follow, and that path is called a circuit. Think of a circuit like a race track shaped in a loop. The electricity must be able to travel all the way around and come back to where it started. A simple circuit has three main parts: a power source such as a battery, wires to carry the electricity, and something that uses the energy, like a small light bulb.","If there is a gap anywhere in the loop, the electricity stops flowing. This is called an open circuit, and the bulb goes dark. When the loop is complete, it is a closed circuit, and the bulb glows. A switch is simply a clever bridge. When you flip it on, the bridge closes the gap. When you flip it off, the bridge lifts and the gap opens again.","Some materials let electricity pass through easily. These are called conductors. Most metals, like copper and aluminum, are excellent conductors, which is why wires are usually made of copper. Other materials block electricity. These are called insulators. Rubber, plastic, glass, and dry wood are good insulators. That is why wires are covered in a plastic coating. The coating keeps the electricity inside the wire, where it belongs.","Electricity also shows up in nature. When you rub a balloon on your hair, it can make your hair stand up and the balloon stick to a wall. That is static electricity, which builds up when electrons jump from one object to another. Lightning is static electricity on a giant scale. A single bolt is hotter than the surface of the sun!","Electricity is powerful, so safety matters. Never touch outlets, power lines, or anything electrical with wet hands, because water can carry electricity into your body. If you want to build a circuit, use a small battery, a few wires, and a tiny bulb, and always ask an adult to help you. Small batteries from science kits are a safe way to watch the amazing path of electricity in action."],"funFact":"An electric eel can make a shock of about 600 volts. That is roughly five times more than a regular wall outlet in an American home!","vocab":[{"word":"electrons","meaning":"Tiny particles that carry electricity."},{"word":"circuit","meaning":"A complete loop that electricity travels around."},{"word":"conductors","meaning":"Materials that let electricity flow through easily."},{"word":"insulators","meaning":"Materials that block electricity from flowing."},{"word":"static electricity","meaning":"Electricity that builds up when electrons jump between objects."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Lightning is dangerous","Copper is a shiny metal","Electricity flows in circuits and can be used safely","Balloons can stick to walls"],"answer":2,"explain":"Super! The article explains circuits, conductors, insulators, and safety."},{"q":"What happens when there is a gap in a circuit?","options":["The electricity stops flowing","The bulb glows brighter","The battery gets bigger","The wire turns into rubber"],"answer":0,"explain":"Yes! The text says 'If there is a gap anywhere in the loop, the electricity stops flowing.'"},{"q":"Why do you think electricians often wear rubber gloves?","options":["Rubber gloves are warm","Rubber makes electricity stronger","Rubber gloves are pretty","Rubber is an insulator that blocks electricity"],"answer":3,"explain":"Great inference! The article says rubber is a good insulator, which blocks electricity."},{"q":"In the article, the word 'conductors' means...","options":["people who lead a band","materials that let electricity pass through easily","switches on a wall","tiny light bulbs"],"answer":1,"explain":"Correct! The text says materials that 'let electricity pass through easily' are conductors."},{"q":"What happens when you flip a switch on?","options":["The wire melts","The battery runs out","The bridge closes the gap and the bulb lights","Lightning appears"],"answer":2,"explain":"Well done! The article says that when you flip it on, 'the bridge closes the gap.'"}],"grammar":[{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'The bulb glows brightly.'","options":["The","bulb","glows","brightly"],"answer":1,"explain":"Yes! 'Bulb' is a thing, so it is a noun."},{"skill":"Commas","q":"Which sentence uses commas correctly in a list?","options":["Rubber plastic, and glass block electricity.","Rubber, plastic and, glass block electricity.","Rubber plastic and glass, block electricity.","Rubber, plastic, and glass block electricity."],"answer":3,"explain":"Great! Commas separate each item in a list: rubber, plastic, and glass."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'Copper wires ____ electricity well.'","options":["carry","carries","carrying","carryed"],"answer":0,"explain":"Correct! 'Wires' is plural, so we use 'carry.'"},{"skill":"Sentence Types","q":"What kind of sentence is this: 'A single bolt is hotter than the surface of the sun!'","options":["A question","A command","An exclamation","A sentence fragment"],"answer":2,"explain":"Nice! It shows strong feeling and ends with an exclamation point."}],"spelling":[{"word":"battery","sentence":"A power source such as a ____ gives the circuit energy.","meaning":"A small container that stores electricity.","wrong":["batery","battary","batterie"]},{"word":"circuit","sentence":"Electricity needs a path to follow, and that path is called a ____.","meaning":"A loop that electricity travels around.","wrong":["circut","cercuit","circiut"]},{"word":"electricity","sentence":"Lightning is static ____ on a giant scale.","meaning":"A kind of energy that powers lights and machines.","wrong":["electrisity","electricty","elecktricity"]},{"word":"insulators","sentence":"Rubber, plastic, glass, and dry wood are good ____.","meaning":"Materials that block electricity.","wrong":["insolators","insulaters","inslators"]},{"word":"lightning","sentence":"____ is static electricity on a giant scale.","meaning":"A giant flash of electricity in the sky.","wrong":["lightening","litening","lightnin"]},{"word":"excellent","sentence":"Most metals are ____ conductors.","meaning":"Very, very good.","wrong":["excelent","exellent","excellant"]}],"written":[{"q":"In your own words, explain what a circuit is and why a bulb lights up only when the circuit is closed.","minWords":12,"keyIdeas":[{"label":"A circuit is a complete loop or path","any":["loop","path","circle","around","complete","track"]},{"label":"Electricity or electrons flow through it","any":["electric","electron","flow","travel","energy","current"]},{"label":"A gap stops the electricity","any":["gap","open","break","stop","broken"]},{"label":"A battery, wires, and bulb are the parts","any":["battery","batteries","wire","bulb","switch"]}],"need":2,"sample":"A circuit is a complete loop that electricity travels around, made of a battery, wires, and a bulb. If there is a gap, the electricity stops flowing and the bulb goes dark, but when the loop is closed it glows."},{"q":"Why are wires covered in plastic? What might happen if they were not? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Plastic is an insulator that blocks electricity","any":["insulat","block","plastic","rubber","stop"]},{"label":"The coating keeps electricity inside the wire","any":["inside","keep","stay","belong","in the wire"]},{"label":"Without it, someone could get shocked or hurt","any":["shock","hurt","danger","zap","unsafe","injur","burn","fire"]}],"need":2,"sample":"Wires are covered in plastic because plastic is an insulator that blocks electricity. The coating keeps the electricity inside the wire, so without it a person could touch the wire and get a shock."}],"fixit":[{"wrong":"copper wires carrys electricity very well.","right":"Copper wires carry electricity very well.","errors":[{"bad":"copper","good":"Copper","type":"Capital Letters"},{"bad":"carrys","good":"carry","type":"Subject-Verb Agreement"}]},{"wrong":"Rubber plastic and glass are good insulaters.","right":"Rubber, plastic, and glass are good insulators.","errors":[{"bad":"Rubber","good":"Rubber,","type":"Punctuation"},{"bad":"plastic","good":"plastic,","type":"Punctuation"},{"bad":"insulaters.","good":"insulators.","type":"Spelling"}]}]},{"id":"sound","title":"Good Vibrations: How Sound Travels","category":"Physics","emoji":"🎵","minutes":4,"paragraphs":["Imagine putting your fingers gently on your throat and humming a tune. Do you feel a buzzing? That tiny shaking is called a vibration, and it is the secret behind every sound you have ever heard. A dog's bark, a drum's boom, and your best friend's laugh all begin when something vibrates back and forth very quickly.","When an object vibrates, it bumps into the tiny particles of air around it. Those particles bump into the particles next to them, and those bump into the next ones. The push moves outward like a ripple spreading across a pond after you toss in a pebble. Scientists call this moving pattern a sound wave. When the wave reaches your ear, your eardrum starts to vibrate too, and your brain turns that shaking into sound.","Sound needs something to travel through. It can move through gases like air, liquids like water, and solids like wood or metal. In fact, sound travels about four times faster in water than in air, and even faster through steel. But in outer space there is almost no air at all. With nothing to carry the vibrations, space is silent. Astronauts on a spacewalk use radios to talk to each other.","Sounds can be high or low. This is called pitch. Fast vibrations make high-pitched sounds, like a whistle or a bird's tweet. Slow vibrations make low-pitched sounds, like a tuba or the rumble of thunder. Sounds can also be loud or soft. A big, strong vibration makes a loud sound, while a small, gentle vibration makes a soft one.","Have you ever shouted in a big empty gym or near a canyon and heard your voice come back? That is an echo. An echo happens when sound waves bounce off a hard surface and return to your ears. Bats and dolphins use echoes to find food. They send out clicks or squeaks and listen for the echoes, which tell them where objects are, even in total darkness.","You can try a simple experiment. Stretch a rubber band around an open box and pluck it. Then try a tighter band and listen for a higher pitch. You can also make a string telephone with two paper cups and a long piece of string. Ask an adult to help poke the holes. Pull the string tight, and your whispers will travel along it like magic!"],"funFact":"Blue whales are among the loudest animals on Earth, and their deep calls can travel hundreds of miles through the ocean.","vocab":[{"word":"vibration","meaning":"A quick back-and-forth shaking movement."},{"word":"particles","meaning":"Very tiny pieces of something."},{"word":"eardrum","meaning":"A thin part inside your ear that shakes when sound hits it."},{"word":"pitch","meaning":"How high or low a sound is."},{"word":"echo","meaning":"A sound that bounces back to you."}],"comprehension":[{"q":"What is this article mostly about?","options":["How sound is made and how it travels","Why bats sleep upside down","How to play the tuba","Why astronauts wear helmets"],"answer":0,"explain":"Awesome! The article explains vibrations, sound waves, pitch, and echoes."},{"q":"Why is outer space silent?","options":["Space is too cold for sound","Astronauts are very quiet","There is almost no air to carry the vibrations","Sound travels too fast in space"],"answer":2,"explain":"Yes! The article says 'With nothing to carry the vibrations, space is silent.'"},{"q":"A tight guitar string vibrates faster than a loose one. What kind of sound would it make?","options":["A lower sound","A higher sound","No sound at all","An echo only"],"answer":1,"explain":"Smart thinking! The article says fast vibrations make high-pitched sounds."},{"q":"In the article, what does 'pitch' mean?","options":["Throwing a ball","A dark, sticky goo","How loud a sound is","How high or low a sound is"],"answer":3,"explain":"Correct! The text says sounds can be high or low, and 'This is called pitch.'"},{"q":"What happens FIRST when a sound is made?","options":["Something vibrates","Your brain hears the sound","Your eardrum shakes","An echo bounces back"],"answer":0,"explain":"Great job! The article says every sound begins 'when something vibrates back and forth.'"}],"grammar":[{"skill":"Adjectives","q":"Which word is an ADJECTIVE in this sentence: 'A big drum makes a loud boom.'","options":["drum","makes","boom","loud"],"answer":3,"explain":"Yes! 'Loud' describes the boom, so it is an adjective. ('Big' is one too!)"},{"skill":"Verb Tenses","q":"Which sentence is written in the PAST tense?","options":["The bat sends out clicks.","The bat sent out clicks.","The bat will send out clicks.","The bat is sending out clicks."],"answer":1,"explain":"Right! 'Sent' tells us the action already happened."},{"skill":"Punctuation","q":"Which end mark belongs at the end of this sentence: 'Do you feel a buzzing'","options":["a period (.)","a comma (,)","a question mark (?)","an apostrophe (')"],"answer":2,"explain":"Great! The sentence asks something, so it needs a question mark."},{"skill":"Conjunctions","q":"Which word is the CONJUNCTION in this sentence: 'Sounds can be high or low.'","options":["or","can","high","Sounds"],"answer":0,"explain":"Correct! 'Or' joins the words 'high' and 'low.'"}],"spelling":[{"word":"vibration","sentence":"That tiny shaking is called a ____.","meaning":"A quick back-and-forth shake.","wrong":["vibrashun","vibratoin","vybration"]},{"word":"particles","sentence":"An object bumps into the tiny ____ of air around it.","meaning":"Very tiny pieces of something.","wrong":["particals","partikles","parcticles"]},{"word":"whistle","sentence":"Fast vibrations make high-pitched sounds, like a ____.","meaning":"A small tool you blow into to make a high sound.","wrong":["wistle","whisle","whistel"]},{"word":"thunder","sentence":"Slow vibrations make low sounds, like the rumble of ____.","meaning":"The loud boom you hear during a storm.","wrong":["thundar","thunderr","thuder"]},{"word":"surface","sentence":"Sound waves bounce off a hard ____ and return to your ears.","meaning":"The outside or top layer of something.","wrong":["surfice","serface","surfase"]},{"word":"experiment","sentence":"You can try a simple ____ with a rubber band.","meaning":"A test to find out something new.","wrong":["expirement","experament","experimint"]}],"written":[{"q":"In your own words, describe how a sound gets from a drum to your ears.","minWords":12,"keyIdeas":[{"label":"The drum vibrates or shakes","any":["vibrat","shak","move back and forth","wiggl","buzz"]},{"label":"Air particles bump into each other","any":["particle","air","bump","push","ripple"]},{"label":"A sound wave travels outward","any":["wave","travel","spread","move","outward"]},{"label":"Your eardrum vibrates and your brain hears it","any":["ear","eardrum","brain","hear"]}],"need":2,"sample":"When you hit a drum, it vibrates and bumps into the tiny particles of air around it. Those particles bump into each other and make a sound wave that travels to your ear, where your eardrum vibrates and your brain hears the sound."},{"q":"Why can't astronauts hear each other shout during a spacewalk? Explain using the article.","minWords":10,"keyIdeas":[{"label":"Space has almost no air","any":["no air","air","empty","nothing","vacuum"]},{"label":"Sound needs something to travel through","any":["travel","carry","need","through","move"]},{"label":"So space is silent and they use radios","any":["silent","quiet","radio","can't hear","cannot hear","no sound"]}],"need":2,"sample":"Sound needs something like air to travel through, but space has almost no air. With nothing to carry the vibrations, space is silent, so astronauts use radios to talk."}],"fixit":[{"wrong":"Bats sends out clicks and listen for the echos.","right":"Bats send out clicks and listen for the echoes.","errors":[{"bad":"sends","good":"send","type":"Subject-Verb Agreement"},{"bad":"echos.","good":"echoes.","type":"Plurals"}]},{"wrong":"yesterday I hear my voice echo in the gym","right":"Yesterday I heard my voice echo in the gym.","errors":[{"bad":"yesterday","good":"Yesterday","type":"Capital Letters"},{"bad":"hear","good":"heard","type":"Verb Tense"},{"bad":"gym","good":"gym.","type":"Punctuation"}]}]},{"id":"light-rainbows","title":"Chasing Rainbows: The Secret Colors of Light","category":"Physics","emoji":"🌈","minutes":4,"paragraphs":["Imagine stepping outside after a summer rain shower. The clouds are drifting away, the sun peeks out, and suddenly a giant arch of color stretches across the sky. Red, orange, yellow, green, blue, and violet glow like a painted bridge. Where do all those colors come from? The surprising answer is that they were hiding inside ordinary sunlight the whole time.","Light is a form of energy that travels incredibly fast. It zooms at about 186,000 miles every second. That is quick enough to circle Earth more than seven times in one second! Light from the sun takes about eight minutes to reach us. Light usually travels in straight lines, which is why you cannot see around corners and why objects cast shadows when they block the light.","Sunlight looks white or plain, but it is really a mix of many colors blended together. When light passes from air into something like water or glass, it slows down and bends. This bending is called refraction. Each color bends a slightly different amount. Violet bends the most and red bends the least, so the colors spread out and separate, like runners fanning out on a track.","A prism is a clear, wedge-shaped piece of glass that is great at splitting light. Shine sunlight through a prism and a little rainbow appears on the wall. Raindrops act like millions of tiny prisms. When sunlight enters a raindrop, it bends, bounces off the back of the drop, and bends again as it comes out. All those drops working together paint a rainbow across the sky.","To see a rainbow, the sun must be behind you and the rain must be in front of you. That is why rainbows often appear in the late afternoon or early morning, when the sun is low. Sometimes you might even spot a double rainbow. The second, fainter bow has its colors in reverse order, with red on the inside instead of the outside.","You can make your own rainbow on a sunny day. Stand with your back to the sun and gently spray a fine mist from a garden hose. Or place a glass of water on a sunny windowsill and look for colors on the floor. Ask an adult before using the hose, and remember one important rule: never look straight at the sun, because it can badly hurt your eyes."],"funFact":"From an airplane or a tall mountain, people can sometimes see a rainbow as a full circle instead of an arch!","vocab":[{"word":"ordinary","meaning":"Normal and everyday, nothing special."},{"word":"shadows","meaning":"Dark shapes made when something blocks light."},{"word":"refraction","meaning":"The bending of light as it passes into something new."},{"word":"prism","meaning":"A clear, wedge-shaped glass that splits light into colors."},{"word":"reverse","meaning":"Turned around, in the opposite order."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Rain is wet and cold","Garden hoses are fun","Airplanes fly above clouds","Rainbows form when sunlight bends and splits into colors"],"answer":3,"explain":"Excellent! The article explains how light bends and separates into a rainbow."},{"q":"Which color bends the MOST when light is refracted?","options":["Red","Violet","Yellow","Green"],"answer":1,"explain":"Yes! The article says 'Violet bends the most and red bends the least.'"},{"q":"It is noon and the sun is high overhead. Why is it hard to see a rainbow now?","options":["Rainbows are easier to see when the sun is low","Rainbows only happen at night","The sun is too cold at noon","Raindrops disappear at noon"],"answer":0,"explain":"Smart! The article says rainbows often appear in the morning or late afternoon 'when the sun is low.'"},{"q":"In the article, the word 'reverse' means...","options":["very bright","in the opposite order","hidden away","very fast"],"answer":1,"explain":"Correct! A double rainbow's colors are in reverse, with red on the inside instead of the outside."},{"q":"What happens to sunlight right after it enters a raindrop?","options":["It turns into rain","It disappears","It bends","It turns completely white"],"answer":2,"explain":"Great job! The text says 'When sunlight enters a raindrop, it bends.'"}],"grammar":[{"skill":"Prepositions","q":"Which word is the PREPOSITION in this sentence: 'The rainbow stretched across the sky.'","options":["across","rainbow","stretched","sky"],"answer":0,"explain":"Yes! 'Across' shows where the rainbow stretched."},{"skill":"Adverbs","q":"Which word is the ADVERB in this sentence: 'Gently spray a fine mist.'","options":["spray","fine","Gently","mist"],"answer":2,"explain":"Nice work! 'Gently' tells HOW to spray the mist."},{"skill":"Homophones","q":"Choose the correct word: 'A double rainbow has ____ colors in reverse order.'","options":["it's","its","its'","it is"],"answer":1,"explain":"Correct! 'Its' shows that the colors belong to the rainbow. 'It's' means 'it is.'"},{"skill":"Plurals","q":"What is the correct plural of 'shadow'?","options":["shadowes","shadowies","shadow's","shadows"],"answer":3,"explain":"Great! For most words, just add -s: 'shadows.'"}],"spelling":[{"word":"rainbow","sentence":"Shine sunlight through a prism and a little ____ appears on the wall.","meaning":"An arch of colors in the sky.","wrong":["rainbo","ranebow","rainbowe"]},{"word":"shadows","sentence":"Objects cast ____ when they block the light.","meaning":"Dark shapes made when light is blocked.","wrong":["shaddows","shadoes","shadoughs"]},{"word":"violet","sentence":"Red, orange, yellow, green, blue, and ____ glow like a painted bridge.","meaning":"A bluish-purple color.","wrong":["voilet","vilet","violit"]},{"word":"refraction","sentence":"This bending of light is called ____.","meaning":"The bending of light.","wrong":["refracshun","refracton","rifraction"]},{"word":"separate","sentence":"The colors spread out and ____.","meaning":"To move apart from each other.","wrong":["seperate","separete","saparate"]},{"word":"windowsill","sentence":"Place a glass of water on a sunny ____.","meaning":"The narrow shelf along the bottom edge of a window frame, where plants often sit.","wrong":["windosill","windowsil","windowcill"]}],"written":[{"q":"In your own words, explain how raindrops make a rainbow.","minWords":12,"keyIdeas":[{"label":"Sunlight is made of many colors mixed together","any":["color","colour","mix","white light","sunlight","blend"]},{"label":"Light bends when it enters water (refraction)","any":["bend","bent","refract","slow"]},{"label":"Each color bends a different amount and spreads out","any":["different","spread","separat","split","fan"]},{"label":"Raindrops act like tiny prisms and light bounces inside","any":["prism","bounce","reflect","drop","back of"]}],"need":2,"sample":"Sunlight is really a mix of many colors. When it enters a raindrop, it bends and bounces off the back of the drop, and each color bends a different amount, so the colors spread out into a rainbow."},{"q":"You are outside after a rainstorm and the sun is in front of you. Will you see a rainbow? Why or why not?","minWords":10,"keyIdeas":[{"label":"No, you probably will not see it","any":["no","not","won't","wouldn't","unlikely"]},{"label":"The sun must be behind you","any":["behind","back","turn around","turned around","sun"]},{"label":"The rain must be in front of you","any":["front","rain","ahead","opposite"]}],"need":2,"sample":"No, I probably will not see a rainbow. The article says the sun must be behind you and the rain must be in front of you, so I would need to turn around."}],"fixit":[{"wrong":"Violet bend the most and red bends the leest.","right":"Violet bends the most and red bends the least.","errors":[{"bad":"bend","good":"bends","type":"Subject-Verb Agreement"},{"bad":"leest.","good":"least.","type":"Spelling"}]},{"wrong":"A double rainbow has it's colors in reverse order","right":"A double rainbow has its colors in reverse order.","errors":[{"bad":"it's","good":"its","type":"Homophones"},{"bad":"order","good":"order.","type":"Punctuation"}]}]},{"id":"simple-machines","title":"Work Smarter: The Power of Simple Machines","category":"Physics","emoji":"⚙️","minutes":4,"paragraphs":["Imagine trying to lift a car with your bare hands. Impossible, right? Now imagine doing it with a tool called a jack, turning a handle around and around until the car slowly rises. Tools like that help us do hard jobs with less effort. Many of them are built from six basic tools that scientists call simple machines.","The six simple machines are the lever, the pulley, the wheel and axle, the inclined plane, the wedge, and the screw. A simple machine has few or no moving parts. It does not make work disappear. Instead, it changes how we push or pull. Often it lets us use a smaller force over a longer distance, which makes a heavy job feel much easier.","A lever is a stiff bar that rests on a point called a fulcrum. A seesaw is a lever. When you push down on one end, the other end lifts up. If the fulcrum is close to a heavy object, you can lift it with surprisingly little effort. A pulley is a wheel with a rope wrapped around it. Pulling down on the rope lifts a load up, which is how flags rise to the top of flagpoles.","The wheel and axle is a big wheel attached to a smaller rod in its center called an axle. When one turns, the other turns too. Doorknobs, bicycles, and wagon wheels all use this idea. An inclined plane is simply a ramp. Rolling a heavy box up a ramp takes a longer path than lifting it straight up, but it needs much less force.","A wedge is two inclined planes stuck back to back, forming a sharp edge. An axe, a knife, and even your front teeth are wedges that split or cut things apart. A screw is an inclined plane wrapped around a pole, like a spiral staircase. Turning a screw pulls it deep into wood, and the lid on a jar uses the same twisting trick.","Many everyday tools combine several simple machines. A pair of scissors uses two levers and two wedges. A bicycle uses wheels and axles, levers in the brakes, and a chain with gears. Next time you open a door or ride your bike, look for the hidden machines at work. You can build a ramp with books and a board, but ask an adult before using any sharp tools."],"funFact":"Ancient Egyptians likely used ramps, levers, and wooden sledges to move the giant stone blocks that built the pyramids.","vocab":[{"word":"effort","meaning":"The push or pull you use to do a job."},{"word":"lever","meaning":"A stiff bar that tips on a point to lift things."},{"word":"fulcrum","meaning":"The point a lever rests and turns on."},{"word":"inclined plane","meaning":"A flat, slanted surface, like a ramp."},{"word":"wedge","meaning":"A tool with a sharp edge that splits things apart."}],"comprehension":[{"q":"What is this article mostly about?","options":["How to ride a bicycle safely","Six simple machines that make work easier","How cars are built","Why teeth are sharp"],"answer":1,"explain":"Great work! The article describes the six simple machines and how they help us."},{"q":"According to the article, what is a seesaw an example of?","options":["A pulley","A screw","A lever","A wedge"],"answer":2,"explain":"Yes! The article says 'A seesaw is a lever.'"},{"q":"A worker needs to get a heavy piano onto a truck. Which simple machine would help most?","options":["A wedge, to split the piano","A screw, to twist the piano","A knife, to cut the piano","An inclined plane, to roll it up a ramp"],"answer":3,"explain":"Good thinking! The article says a ramp 'needs much less force' than lifting straight up."},{"q":"In the article, the word 'fulcrum' means...","options":["the point a lever rests on","a type of rope","a heavy box","a sharp edge"],"answer":0,"explain":"Correct! The text says a lever 'rests on a point called a fulcrum.'"},{"q":"What happens when you pull down on the rope of a pulley?","options":["The wheel breaks","The rope gets shorter forever","The load lifts up","The flag falls down"],"answer":2,"explain":"Well done! The article says 'Pulling down on the rope lifts a load up.'"}],"grammar":[{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'The heavy box slid down the ramp.'","options":["heavy","slid","ramp","down"],"answer":2,"explain":"Yes! 'Ramp' names a thing, so it is a noun. ('Box' is one too!)"},{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'A wedge splits the log.'","options":["wedge","splits","the","log"],"answer":1,"explain":"Right! 'Splits' is the action the wedge does."},{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["Doorknobs, bicycles, and wagon wheels use axles.","Doorknobs bicycles, and wagon wheels use axles.","Doorknobs, bicycles and, wagon wheels use axles.","Doorknobs bicycles and wagon, wheels use axles."],"answer":0,"explain":"Great! Commas go between each item in the list."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'A pair of scissors ____ two levers.'","options":["use","using","were using","uses"],"answer":3,"explain":"Correct! The subject is 'a pair,' which is one thing, so we use 'uses.'"}],"spelling":[{"word":"machines","sentence":"Scientists call these six basic tools simple ____.","meaning":"Tools or devices that help us do work.","wrong":["masheens","machins","mashines"]},{"word":"distance","sentence":"It lets us use a smaller force over a longer ____.","meaning":"How far it is from one place to another.","wrong":["distence","distanse","distants"]},{"word":"fulcrum","sentence":"A lever is a stiff bar that rests on a point called a ____.","meaning":"The point a lever turns on.","wrong":["fulcrom","fullcrum","fulcrumb"]},{"word":"bicycle","sentence":"A ____ uses wheels and axles, levers, and gears.","meaning":"A two-wheeled ride you pedal.","wrong":["bicycel","bysicle","bicicle"]},{"word":"staircase","sentence":"A screw is like a spiral ____.","meaning":"A set of steps going up or down.","wrong":["stairecase","starecase","staircace"]},{"word":"scissors","sentence":"A pair of ____ uses two levers and two wedges.","meaning":"A cutting tool with two blades.","wrong":["sissors","scisors","scissers"]}],"written":[{"q":"In your own words, explain how a simple machine makes work easier.","minWords":10,"keyIdeas":[{"label":"It changes how we push or pull","any":["push","pull","change","direction"]},{"label":"It uses a smaller force or less effort","any":["less","small","effort","force","easier","strength"]},{"label":"It spreads the work over a longer distance","any":["long","distance","farther","further","path"]},{"label":"Gives an example like a lever, ramp, or pulley","any":["lever","ramp","pulley","wedge","screw","wheel","axle","inclined","seesaw"]}],"need":2,"sample":"A simple machine changes how we push or pull so we can use less force. For example, a ramp lets you push a heavy box over a longer distance instead of lifting it straight up."},{"q":"What would happen if you moved the fulcrum of a seesaw very close to a heavy rock? Use details from the article.","minWords":10,"keyIdeas":[{"label":"It would be easier to lift the rock","any":["easier","easy","less effort","little effort","less force","lift"]},{"label":"The fulcrum is the point the lever rests on","any":["fulcrum","point","rest","lever","seesaw"]},{"label":"Pushing down one end lifts the other end","any":["push down","push","other end","end","goes up","rise"]}],"need":2,"sample":"It would be much easier to lift the rock. The article says that if the fulcrum is close to a heavy object, you can lift it with surprisingly little effort by pushing down on the other end."}],"fixit":[{"wrong":"A pair of sissors use two levers and two wedges.","right":"A pair of scissors uses two levers and two wedges.","errors":[{"bad":"sissors","good":"scissors","type":"Spelling"},{"bad":"use","good":"uses","type":"Subject-Verb Agreement"}]},{"wrong":"Long ago, egyptians use ramps and levers to move giant stones","right":"Long ago, Egyptians used ramps and levers to move giant stones.","errors":[{"bad":"egyptians","good":"Egyptians","type":"Capital Letters"},{"bad":"use","good":"used","type":"Verb Tense"},{"bad":"stones","good":"stones.","type":"Punctuation"}]}]},{"id":"states-of-matter","title":"Ice, Water, Steam: The Shape-Shifting World of Matter","category":"Chemistry","emoji":"🧊","minutes":4,"paragraphs":["Imagine an ice cube sitting in your hand. It feels cold and hard. Wait a few minutes, and it turns into a little puddle of water. Leave that water in a pot on a hot stove, and it rises into the air as steam. It is the same stuff the whole time, but it keeps changing its form. Welcome to the shape-shifting world of matter!","Matter is anything that takes up space and has mass. Your desk, your juice, and even the air you breathe are all matter. Everything is made of particles far too tiny to see. How those particles behave decides whether matter is a solid, a liquid, or a gas. These are called the three common states of matter.","In a solid, the particles are packed tightly together and only wiggle in place. That is why a solid, like a rock or a spoon, keeps its own shape. In a liquid, the particles are still close, but they can slide past one another. A liquid flows and takes the shape of whatever container holds it. Pour milk into a glass or a bowl, and it fits perfectly either way.","In a gas, the particles zoom around with lots of space between them. A gas spreads out to fill any container it is in, whether it is a balloon or a whole room. That is why you can smell cookies baking from across the house. The tiny scent particles drift through the air until they reach your nose.","Heat is the secret to changing states. When you add heat, particles move faster. A solid melts into a liquid, and a liquid can evaporate into a gas. When you take heat away, particles slow down. A gas can condense into a liquid, like the drops that form on a cold glass of lemonade. A liquid can freeze into a solid. Water freezes at 32 degrees Fahrenheit and boils at 212 degrees Fahrenheit at sea level.","Water is special because we see it in all three states every day: ice in the freezer, water from the faucet, and water vapor in the air. You can watch these changes yourself. Put an ice cube on a plate and time how long it takes to melt. Ask an adult to help you boil water and watch the steam rise, but stay back, because steam can cause painful burns."],"funFact":"There is a fourth state of matter called plasma. It is a super-hot, glowing gas found in lightning and in stars like our sun.","vocab":[{"word":"matter","meaning":"Anything that takes up space and has mass."},{"word":"solid","meaning":"Matter that keeps its own shape, like a rock."},{"word":"container","meaning":"Something that holds things, like a jar or box."},{"word":"evaporate","meaning":"To change from a liquid into a gas."},{"word":"condense","meaning":"To change from a gas into a liquid."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Lemonade tastes best cold","Stoves are very hot","Matter can be a solid, liquid, or gas and can change states","Cookies smell good when baking"],"answer":2,"explain":"Fantastic! The article explains the three states of matter and how they change."},{"q":"What happens to particles when you add heat?","options":["They disappear","They turn into ice","They stop moving","They move faster"],"answer":3,"explain":"Yes! The article says 'When you add heat, particles move faster.'"},{"q":"Why can you pour juice into a cup of any shape?","options":["Juice is a liquid, so it takes the shape of its container","Juice is a solid","Juice has no particles","Cups are always round"],"answer":0,"explain":"Smart! The article says a liquid 'takes the shape of whatever container holds it.'"},{"q":"In the article, what does 'condense' mean?","options":["To change from a solid to a liquid","To change from a gas to a liquid","To get very hot","To fill a balloon"],"answer":1,"explain":"Correct! The text says a gas can condense into a liquid, like drops on a cold glass."},{"q":"What is the correct order as an ice cube heats up on a hot stove?","options":["Gas, liquid, solid","Liquid, solid, gas","Solid, gas, liquid","Solid, liquid, gas"],"answer":3,"explain":"Great job! The article describes ice melting into water, then rising as steam."}],"grammar":[{"skill":"Verb Tenses","q":"Which sentence is written in the FUTURE tense?","options":["The ice melted.","The ice will melt.","The ice melts.","The ice was melting."],"answer":1,"explain":"Yes! 'Will melt' tells us it has not happened yet."},{"skill":"Adjectives","q":"Which word is an ADJECTIVE in this sentence: 'The cold glass dripped.'","options":["cold","glass","dripped","The"],"answer":0,"explain":"Correct! 'Cold' describes the glass."},{"skill":"Capital Letters","q":"Which word in this sentence needs a capital letter: 'Water boils at 212 degrees fahrenheit.'","options":["Water","boils","fahrenheit","degrees"],"answer":2,"explain":"Right! 'Fahrenheit' is named after a scientist, so it is a proper noun."},{"skill":"Conjunctions","q":"Which conjunction best completes the sentence: 'The particles are close, ____ they can slide past one another.'","options":["but","so","or","because"],"answer":0,"explain":"Great! 'But' shows a contrast between being close and still being able to slide."}],"spelling":[{"word":"liquid","sentence":"In a ____, the particles can slide past one another.","meaning":"Matter that flows, like water.","wrong":["liquit","likwid","liqued"]},{"word":"particles","sentence":"Everything is made of ____ far too tiny to see.","meaning":"Very tiny pieces of matter.","wrong":["particals","partickles","partcles"]},{"word":"container","sentence":"A gas spreads out to fill any ____ it is in.","meaning":"Something that holds things.","wrong":["contaner","containor","contianer"]},{"word":"evaporate","sentence":"A liquid can ____ into a gas.","meaning":"To turn from a liquid into a gas.","wrong":["evaperate","evaporait","evapourate"]},{"word":"condense","sentence":"A gas can ____ into a liquid.","meaning":"To turn from a gas into a liquid.","wrong":["condence","condens","kondense"]},{"word":"freezer","sentence":"We see ice in the ____ every day.","meaning":"A very cold box that keeps food frozen.","wrong":["freazer","freezar","freezzer"]}],"written":[{"q":"In your own words, describe how the particles in a solid, a liquid, and a gas are different.","minWords":12,"keyIdeas":[{"label":"In a solid, particles are packed tight and wiggle in place","any":["solid","packed","tight","wiggle","in place","close"]},{"label":"In a liquid, particles slide past each other and flow","any":["liquid","slide","flow","pour","shape of"]},{"label":"In a gas, particles zoom around with lots of space","any":["gas","zoom","space","spread","far apart","fill"]}],"need":2,"sample":"In a solid, the particles are packed tightly and only wiggle in place, so it keeps its shape. In a liquid, they slide past each other so it can flow, and in a gas they zoom around with lots of space between them."},{"q":"Why do drops of water form on the outside of a cold glass of lemonade? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Water vapor (gas) is in the air","any":["vapor","vapour","gas","air","steam"]},{"label":"The cold takes heat away and particles slow down","any":["cold","heat","slow","cool"]},{"label":"The gas condenses into liquid drops","any":["condens","liquid","drop","water","turn into"]}],"need":2,"sample":"There is water vapor, which is a gas, in the air. The cold glass takes heat away so the particles slow down, and the gas condenses into liquid drops on the glass."}],"fixit":[{"wrong":"Water freezes at 32 degrees fahrenheit and boil at 212 degrees.","right":"Water freezes at 32 degrees Fahrenheit and boils at 212 degrees.","errors":[{"bad":"fahrenheit","good":"Fahrenheit","type":"Capital Letters"},{"bad":"boil","good":"boils","type":"Subject-Verb Agreement"}]},{"wrong":"Yesterday the ice cube melt into a puddel on the plate","right":"Yesterday the ice cube melted into a puddle on the plate.","errors":[{"bad":"melt","good":"melted","type":"Verb Tense"},{"bad":"puddel","good":"puddle","type":"Spelling"},{"bad":"plate","good":"plate.","type":"Punctuation"}]}]},{"id":"kitchen-chemistry","title":"Fizz, Pop, Rise: Chemistry in Your Kitchen","category":"Chemistry","emoji":"🧪","minutes":4,"paragraphs":["Imagine a science lab with jars of powders, bottles of liquids, and a hot oven. Now look around. That lab might be your kitchen! Every time someone bakes a cake, scrambles an egg, or makes lemonade, they are doing chemistry. Chemistry is the science of what things are made of and how they change.","Some kitchen changes are mixtures. A mixture is two or more things combined without becoming anything new. Stir sugar into water, and the sugar seems to disappear, but it is still there. If you let the water evaporate, the sugar crystals come back. A bowl of trail mix is a mixture too. You could pick out every raisin and peanut, and each would be the same as before.","Other changes are chemical reactions. In a reaction, the ingredients join or break apart to form brand new substances. A classic example is baking soda and vinegar. When they meet, they fizz and foam like a bubbling volcano. The bubbles are carbon dioxide, a gas that was not there before. Once the reaction happens, you cannot simply turn it back into baking soda and vinegar.","How can you tell when a reaction has happened? Look for clues like bubbles of gas, a change in color, a new smell, or heat being given off. When you toast bread, it turns brown and smells delicious. That browning is a reaction, and you cannot un-toast the toast! Cooking an egg is another reaction. The clear, runny part turns solid and white, and it can never become runny again.","Bread uses a tiny living helper called yeast. Yeast is a fungus that eats sugar and gives off carbon dioxide gas. The gas gets trapped in the stretchy dough, making little pockets of air. That is why dough puffs up as it rises. In the hot oven, the bubbles grow a bit more, then the bread sets firm. Look at a slice of bread and you can see the holes left by those bubbles.","You can try a fizzy experiment at home with an adult's help. Put a spoonful of baking soda in a cup set on a tray, then slowly pour in a little vinegar. Watch the foam climb! Never taste your experiments, and never mix cleaning products, because some can create dangerous gases. With an adult as your lab partner, your kitchen can become the tastiest laboratory around."],"funFact":"Popcorn pops because a tiny drop of water inside each kernel turns to steam, building up pressure until the kernel bursts open.","vocab":[{"word":"chemistry","meaning":"The science of what things are made of and how they change."},{"word":"mixture","meaning":"Things combined together without becoming something new."},{"word":"reaction","meaning":"A change that makes brand new substances."},{"word":"substances","meaning":"Kinds of matter or materials."},{"word":"yeast","meaning":"A tiny living fungus that makes bread dough rise."}],"comprehension":[{"q":"What is this article mostly about?","options":["How chemistry happens in the kitchen through mixtures and reactions","How to clean a kitchen","Why volcanoes erupt","How to grow peanuts"],"answer":0,"explain":"Wonderful! The article shows how cooking and baking are full of chemistry."},{"q":"What are the bubbles made of when baking soda and vinegar mix?","options":["Water","Carbon dioxide","Sugar","Air from the cup"],"answer":1,"explain":"Yes! The article says 'The bubbles are carbon dioxide.'"},{"q":"Salt stirred into water can come back if the water dries up. What does
