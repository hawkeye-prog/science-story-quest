<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Story Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2350; --muted:#6f6796; --line:#ece6fb;
  --pink:#ff5fa2; --purple:#7c5cff; --teal:#14b8a6; --yellow:#ffc531; --orange:#ff8a3d;
  --blue:#3b82f6; --green:#22c55e; --red:#ef4444;
  --card:#ffffff; --soft:#f7f3ff;
  --shadow:0 10px 30px -12px rgba(76,48,160,.35);
  --shadow-sm:0 4px 14px -6px rgba(76,48,160,.3);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#fde7f5 0%,#efe8ff 40%,#e3f3ff 75%,#e6fff6 100%) fixed;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,h3,h4,.baloo{font-family:'Baloo 2','Nunito',sans-serif;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* floating background */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;bottom:-80px;font-size:28px;opacity:.22;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-120vh) rotate(360deg)}}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}

#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:16px 16px 110px}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);
  border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow-sm);position:sticky;top:10px;z-index:20}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,#ffd6ea,#e4dcff);box-shadow:inset 0 0 0 3px #fff, 0 3px 10px -3px rgba(124,92,255,.5)}
.lvl{flex:1;min-width:120px}
.lvl .t{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.lvl .t small{color:var(--muted);font-weight:700}
.bar{height:12px;border-radius:99px;background:#eee8ff;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width 1s cubic-bezier(.2,.9,.3,1.2);
  background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;box-shadow:var(--shadow-sm);font-size:15px}
.pill.gem{color:#0e7490}.pill.fire{color:#ea580c}
.iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow-sm);transition:transform .2s}
.iconbtn:hover{transform:rotate(20deg) scale(1.08)}

/* bottom nav */
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);padding:8px;border-radius:99px;box-shadow:var(--shadow)}
.nav button{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12px;padding:6px 16px;border-radius:99px;color:var(--muted);transition:all .25s}
.nav button b{font-size:22px;transition:transform .3s}
.nav button.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.nav button.on b{transform:translateY(-2px) scale(1.15)}
.nav button:hover b{transform:scale(1.2)}

/* generic */
.screen{animation:screenIn .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px;padding:13px 24px;border-radius:99px;
  background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 0 #5a3fd1, 0 12px 20px -8px rgba(124,92,255,.6);
  transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5a3fd1}
.btn.alt{background:#fff;color:var(--purple);box-shadow:0 5px 0 #d9cffc, 0 10px 18px -10px rgba(124,92,255,.5)}
.btn.alt:active{box-shadow:0 1px 0 #d9cffc}
.btn.green{background:linear-gradient(135deg,#34d399,#14b8a6);box-shadow:0 6px 0 #0f8f80,0 12px 20px -8px rgba(20,184,166,.6)}
.btn.sm{font-size:14px;padding:9px 16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.muted{color:var(--muted)}
.sectiontitle{font-size:24px;margin:26px 4px 12px;display:flex;align-items:center;gap:10px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:18px;padding:18px 22px;
  background:linear-gradient(120deg,#fff 0%,#fff6fb 60%,#f3eeff 100%)}
.hero h1{font-size:clamp(26px,4vw,38px)}
.hero h1 .wave{display:inline-block;animation:wave 2s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.bubble{position:relative;background:var(--soft);border-radius:16px;padding:10px 14px;margin-top:8px;font-weight:700;color:#4b3d8a;display:inline-block;max-width:560px}
.bubble:before{content:"";position:absolute;left:-10px;top:14px;border:6px solid transparent;border-right:10px solid var(--soft)}
.heroStats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hs{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-size:14px}

/* mascot */
.mascot{display:block;flex-shrink:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.mascot .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .ant{animation:glow 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes glow{to{transform:scale(1.3);filter:drop-shadow(0 0 6px #ffd23f)}}
.mascot .armR{animation:armwave 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:10% 50%}
@keyframes armwave{50%{transform:rotate(-25deg)}}
.mascot.jump{animation:jump .6s ease}
@keyframes jump{30%{transform:translateY(-22px) scale(1.05)}60%{transform:translateY(0) scale(1.05,.92)}}
.mascot.shake{animation:shakeX .5s}

/* daily */
.daily{margin-top:16px;display:flex;align-items:center;gap:16px;padding:16px 20px;color:#fff;flex-wrap:wrap;
  background:linear-gradient(120deg,#ff8a3d,#ff5fa2 55%,#a855f7);position:relative;overflow:hidden}
.daily:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg);animation:sweep 4s ease-in-out infinite}
@keyframes sweep{60%,100%{left:130%}}
.daily .em{font-size:44px;animation:bob 2s ease-in-out infinite}
.daily h3{font-size:22px}
.daily .btn{background:#fff;color:#e2458c;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.daily.done{background:linear-gradient(120deg,#34d399,#14b8a6)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{padding:8px 14px;border-radius:99px;background:#fff;font-weight:800;font-size:14px;box-shadow:var(--shadow-sm);transition:all .2s;border:2px solid transparent}
.chip:hover{transform:translateY(-2px)}
.chip.on{color:#fff;border-color:rgba(255,255,255,.6)}

/* topic grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tcard{position:relative;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  opacity:0;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) forwards;transition:transform .25s, box-shadow .25s}
.tcard:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:var(--shadow)}
.tcard:hover .tem{transform:scale(1.15) rotate(8deg)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
.tcard .top{height:6px;position:absolute;left:0;right:0;top:0}
.tem{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:34px;transition:transform .3s}
.tcard h4{font-size:19px}
.cat{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;width:fit-content}
.stars{font-size:18px;letter-spacing:2px}
.stars .off{filter:grayscale(1);opacity:.25}
.ribbon{position:absolute;top:14px;right:-30px;transform:rotate(35deg);background:var(--yellow);font-weight:800;font-size:11px;padding:3px 34px;color:#7a4a00}
.tmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:auto}

/* reader */
.readerHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:10px;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  padding:10px 14px;border-radius:var(--r);box-shadow:var(--shadow-sm)}
.readerHead .bar{flex:1;min-width:120px}
.article{max-width:760px;margin:18px auto 0;padding:clamp(20px,4vw,44px)}
.article .ahead{text-align:center;margin-bottom:18px}
.article .bigem{font-size:76px;display:inline-block;animation:bob 3s ease-in-out infinite}
.article h1{font-size:clamp(28px,5vw,42px);margin:4px 0 8px}
.article p{font-size:clamp(18px,2.2vw,21px);line-height:1.75;margin-bottom:18px;padding:6px 10px;border-radius:12px;transition:background .3s}
.article p.speaking{background:#fff5c9;box-shadow:0 0 0 3px #ffe58a}
.article p:first-of-type::first-letter{font-family:'Baloo 2';font-size:3.1em;float:left;line-height:.9;margin:6px 8px 0 0;color:var(--purple)}
.vw{background:linear-gradient(transparent 55%,#ffd9ec 55%);font-weight:800;cursor:pointer;border-radius:3px;position:relative;color:#b01d6a}
.vw:hover{background:#ffd9ec}
.tip{position:absolute;z-index:50;background:var(--ink);color:#fff;padding:10px 14px;border-radius:14px;font-size:15px;max-width:260px;box-shadow:var(--shadow);
  animation:pop .25s ease forwards;line-height:1.4}
.tip b{color:#ffd23f;display:block;font-family:'Baloo 2';font-size:18px}
.funfact{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(120deg,#fff8d6,#ffeef7);border:2px dashed #ffc531;border-radius:18px;padding:16px;margin:10px 0 24px}
.funfact .fe{font-size:36px;animation:wiggle 2.5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.vocabBox{background:var(--soft);border-radius:18px;padding:16px;margin-bottom:24px}
.vocabBox h3{margin-bottom:8px}
.vlist{display:flex;flex-wrap:wrap;gap:8px}
.vlist span{background:#fff;padding:6px 12px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:var(--shadow-sm)}
.vlist span b{color:#b01d6a}
.readDone{text-align:center;padding:10px 0}

/* quiz */
.qwrap{max-width:760px;margin:18px auto 0}
.stages{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.stage{padding:8px 14px;border-radius:99px;font-weight:800;font-size:14px;background:#fff;color:var(--muted);box-shadow:var(--shadow-sm);transition:all .3s}
.stage.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;transform:scale(1.08)}
.stage.done{background:#d1fae5;color:#047857}
.qcard{padding:clamp(18px,4vw,34px);position:relative}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:#e8e2fb;transition:all .3s}
.dots i.ok{background:var(--green)}.dots i.no{background:#fca5a5}.dots i.cur{background:var(--purple);transform:scale(1.3)}
.combo{font-weight:800;color:#ea580c;font-size:15px;opacity:0;transition:opacity .3s}
.combo.show{opacity:1;animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.3)}}
.skill{display:inline-block;background:#ede9fe;color:#5b21b6;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:10px}
.qtext{font-size:clamp(20px,2.6vw,24px);font-weight:800;line-height:1.4;margin-bottom:18px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:18px;font-weight:700;padding:14px 16px;border-radius:16px;background:#fff;
  border:3px solid var(--line);box-shadow:0 4px 0 var(--line);transition:all .15s;opacity:0;animation:slideIn .4s forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.opt:hover:not([disabled]){border-color:#c4b5fd;transform:translateY(-2px);box-shadow:0 6px 0 #c4b5fd}
.opt .let{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--purple);font-weight:800}
.opt.right{opacity:1;background:#dcfce7;border-color:#22c55e;box-shadow:0 4px 0 #16a34a;animation:bounceOk .5s}
.opt.right .let{background:#22c55e;color:#fff}
.opt.wrong{opacity:1;background:#fee2e2;border-color:#f87171;box-shadow:0 4px 0 #ef4444;animation:shakeX .45s}
.opt.wrong .let{background:#ef4444;color:#fff}
.opt[disabled]{cursor:default}
@keyframes bounceOk{40%{transform:scale(1.04)}}
@keyframes shakeX{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.feedback{margin-top:18px;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;animation:pop .35s forwards;flex-wrap:wrap}
.feedback.ok{background:#ecfdf5;border:2px solid #86efac}
.feedback.no{background:#fff7ed;border:2px solid #fdba74}
.feedback .fb{flex:1;min-width:200px;font-size:16px;line-height:1.5}
.feedback .fb b{font-family:'Baloo 2';font-size:20px;display:block}
.peek{font-weight:800;color:var(--purple);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* spelling */
.spell{text-align:center}
.hear{display:flex;gap:10px;justify-content:center;margin:6px 0 16px;flex-wrap:wrap}
.hearBtn{width:84px;height:84px;border-radius:50%;font-size:38px;background:linear-gradient(135deg,#ffd23f,#ff8a3d);box-shadow:0 6px 0 #d9691f;color:#fff;transition:transform .15s}
.hearBtn:hover{transform:scale(1.08)}
.hearBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9691f}
.hearBtn.slow{width:60px;height:60px;font-size:26px;align-self:center;background:linear-gradient(135deg,#7dd3fc,#3b82f6);box-shadow:0 5px 0 #1d4ed8}
.ring{animation:ringPulse 1s ease-out}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,138,61,.7),0 6px 0 #d9691f}100%{box-shadow:0 0 0 24px rgba(255,138,61,0),0 6px 0 #d9691f}}
.sentence{font-size:20px;font-weight:700;background:var(--soft);padding:14px;border-radius:16px;margin-bottom:10px;line-height:1.6}
.sentence .blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--purple);color:var(--purple)}
.meaning{color:var(--muted);font-weight:700;margin-bottom:16px}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tiles span{width:38px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:'Baloo 2';font-size:26px;font-weight:800;
  background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 var(--line);text-transform:lowercase;transition:all .15s}
.tiles span.f{border-color:#c4b5fd;box-shadow:0 3px 0 #c4b5fd;animation:tilePop .2s}
.tiles span.h{background:#fff7d6;border-color:#ffc531}
.tiles span.g{opacity:1;background:#dcfce7;border-color:#22c55e;box-shadow:0 3px 0 #16a34a;animation:flip .5s backwards}
.defcard{display:flex;gap:14px;align-items:center;text-align:left;background:linear-gradient(120deg,#eef2ff,#fdf4ff);border:3px solid #c7d2fe;border-radius:18px;padding:16px 18px;font-size:21px;font-weight:700;line-height:1.45;max-width:560px;margin:0 auto}
.defcard .dq{font-size:40px;animation:wiggle 2.5s ease-in-out infinite}
.defcard small{display:block;font-size:12px;font-weight:800;letter-spacing:2px;color:#6366f1}
.cluepop{animation:pop .35s forwards;margin-top:10px}
.tiles span.x{background:#fee2e2;border-color:#f87171;box-shadow:0 3px 0 #ef4444;animation:flip .4s backwards;opacity:1}
@keyframes tilePop{50%{transform:scale(1.15)}}
@keyframes flip{from{transform:rotateX(90deg)}}
.spellInput{width:100%;max-width:420px;font-size:26px;font-weight:800;text-align:center;padding:12px;border-radius:16px;border:3px solid #c4b5fd;outline:none;
  letter-spacing:3px;color:var(--ink);background:#fff}
.spellInput:focus{border-color:var(--purple);box-shadow:0 0 0 5px #ede9fe}
.spellActions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* results */
.results{max-width:640px;margin:24px auto;text-align:center;padding:30px 24px}
.bigStars{font-size:64px;display:flex;justify-content:center;gap:10px;margin:8px 0}
.bigStars span{display:inline-block;opacity:0;animation:starIn .6s cubic-bezier(.2,.9,.3,1.6) forwards}
.bigStars span.off{filter:grayscale(1);opacity:0;animation-name:starInOff}
@keyframes starIn{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:none}}
@keyframes starInOff{from{opacity:0;transform:scale(0)}to{opacity:.25;transform:none}}
.scoreRows{display:grid;gap:10px;margin:18px 0;text-align:left}
.srow{display:flex;align-items:center;gap:12px;background:var(--soft);padding:10px 14px;border-radius:14px;font-weight:800}
.srow .bar{flex:1;margin:0}
.rewards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.reward{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 18px;font-weight:800;font-size:20px;animation:pop .5s backwards}
.reward small{display:block;font-size:12px;color:var(--muted)}

/* badges / stickers / words */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{padding:16px 12px;text-align:center;opacity:0;animation:pop .45s forwards}
.badge .bi{font-size:44px;width:76px;height:76px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 30%,#fff7c2,#ffc531);box-shadow:0 0 0 5px #fff3c4, 0 8px 16px -6px rgba(255,170,0,.6)}
.badge.locked .bi{background:#eee;box-shadow:0 0 0 5px #f5f5f5;filter:grayscale(1);opacity:.45}
.badge h4{font-size:16px}
.badge p{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.badge:not(.locked):hover .bi{animation:wiggle .6s}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{padding:16px}
.stat .n{font-family:'Baloo 2';font-size:34px;font-weight:800}
.skillRow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin:6px 0}
.skillRow span:first-child{width:170px;flex-shrink:0}
.skillRow .bar{flex:1;margin:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.sticker{padding:14px 10px;text-align:center;position:relative;opacity:0;animation:pop .45s forwards}
.sticker .si{font-size:54px;display:block;transition:transform .3s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.sticker:hover .si{transform:scale(1.2) rotate(-8deg)}
.sticker.notown .si{filter:grayscale(1);opacity:.5}
.sticker h5{font-size:14px;margin:6px 0}
.rar{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:6px}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.word{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.word b{font-family:'Baloo 2';font-size:20px;color:#b01d6a}
.word p{font-size:14px;color:var(--muted);font-weight:600}
.word .from{font-size:12px;margin-top:4px}
.empty{text-align:center;padding:40px 20px}
.empty .ee{font-size:60px}

/* welcome */
.welcome{max-width:560px;margin:5vh auto 0;text-align:center;padding:32px 24px}
.welcome h1{font-size:clamp(32px,6vw,46px);background:linear-gradient(90deg,var(--pink),var(--purple),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.nameIn{width:100%;font-size:22px;font-weight:800;text-align:center;padding:14px;border-radius:16px;border:3px solid #c4b5fd;outline:none;margin:14px 0}
.nameIn:focus{border-color:var(--purple);box-shadow:0 0 0 5px #ede9fe}
.avs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 22px}
.avs button{width:58px;height:58px;font-size:32px;border-radius:50%;background:#fff;border:3px solid var(--line);transition:all .2s}
.avs button:hover{transform:scale(1.12)}
.avs button.on{border-color:var(--purple);background:#f3eeff;transform:scale(1.15);box-shadow:0 0 0 4px #ede9fe}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(45,35,80,.45);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:28px;padding:28px 24px;max-width:440px;width:100%;text-align:center;box-shadow:var(--shadow);animation:pop .4s cubic-bezier(.2,.9,.3,1.4) forwards;max-height:90vh;overflow:auto}
.modal .mi{font-size:80px;display:inline-block;animation:spinIn .8s cubic-bezier(.2,.9,.3,1.4)}
@keyframes spinIn{from{transform:scale(0) rotate(-360deg)}}
.modal h2{font-size:30px;margin:6px 0}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.setRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;text-align:left}
.toggle{width:54px;height:30px;border-radius:99px;background:#ddd;position:relative;transition:background .2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}.toggle.on:after{left:27px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#fff;border-radius:18px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:toastIn .5s cubic-bezier(.2,.9,.3,1.4)}
.toast .ti{font-size:28px}
@keyframes toastIn{from{opacity:0;transform:translateY(-30px) scale(.8)}}
.flyxp{position:fixed;z-index:150;font-family:'Baloo 2';font-weight:800;font-size:26px;color:var(--purple);pointer-events:none;animation:flyUp 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes flyUp{to{transform:translateY(-80px) scale(1.3);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,94vw);background:#fff;z-index:120;box-shadow:-10px 0 40px rgba(0,0,0,.2);overflow:auto;padding:22px;animation:slideL .35s ease}
@keyframes slideL{from{transform:translateX(100%)}}
.drawer p{font-size:17px;line-height:1.7;margin-bottom:12px}


/* writing */
.wtips{background:#f0f9ff;border-radius:14px;padding:10px 14px;font-weight:700;color:#0c4a6e;font-size:15px;margin-bottom:12px}
.wa{width:100%;min-height:140px;font-size:19px;line-height:1.6;padding:14px 16px;border-radius:16px;border:3px solid #c4b5fd;font-family:'Nunito',sans-serif;
  resize:vertical;outline:none;color:var(--ink);background:#fff;transition:border-color .2s, box-shadow .2s}
.wa:focus{border-color:var(--purple);box-shadow:0 0 0 5px #ede9fe}
.wa.fx{min-height:90px;font-size:20px}
.wa:disabled{background:#faf8ff}
.wmeta{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:var(--muted);margin-top:6px}
.wgoal{padding:2px 10px;border-radius:99px;background:#f1f5f9;transition:all .3s}
.wgoal.met{background:#dcfce7;color:#15803d}
.wgoal.met:before{content:"✓ "}
.report{margin-top:18px;border:3px solid var(--line);border-radius:20px;padding:16px;background:linear-gradient(180deg,#fff,#fbf9ff);animation:pop .4s forwards}
.rhead{display:flex;justify-content:space-between;align-items:center;font-family:'Baloo 2';font-weight:800;font-size:20px;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.rhead small{font-family:'Nunito';font-size:13px}
.yourText{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:17px;line-height:1.6;margin-bottom:12px}
mark.sp{background:#fee2e2;color:#b91c1c;text-decoration:underline wavy #ef4444;text-underline-offset:4px;border-radius:4px;padding:0 2px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rbox{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow-sm);font-size:15px}
.rbox h4{font-size:17px;margin-bottom:6px}
.rbox .bar{margin:0 0 10px}
.rbox ul{list-style:none;display:grid;gap:6px}
.rbox li{line-height:1.4;font-weight:600}
.rbox li.no{background:#fff7ed;border-radius:10px;padding:6px 8px}
.good{color:#15803d;font-weight:800}
.spfix{margin:6px 0;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badw{color:#b91c1c;text-decoration:line-through wavy #ef4444;font-weight:800}
.sugg{background:#ecfdf5;border:2px solid #86efac;color:#166534;font-weight:800;border-radius:99px;padding:3px 10px;font-size:14px;transition:transform .15s}
.sugg:hover{transform:scale(1.08);background:#d1fae5}
.gtype{display:inline-block;background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;vertical-align:middle;margin-right:2px}
.sample{margin-top:10px;background:#fffbeb;border:2px solid #fde68a;border-radius:14px;padding:10px 12px;font-weight:600;line-height:1.5}
.sample b{display:block;font-size:16px;font-family:'Baloo 2'}
.broken{display:flex;gap:12px;align-items:center;background:#fff1f2;border:3px dashed #fda4af;border-radius:16px;padding:14px 16px;font-size:20px;font-weight:700;margin-bottom:12px;line-height:1.5}
.broken span{font-size:30px;animation:wiggle 2s ease-in-out infinite}
.fixans{margin-top:14px;background:#f8fafc;border-radius:16px;padding:12px 14px;animation:pop .35s forwards}
.fixline{font-size:20px;font-weight:700;line-height:1.7;margin:4px 0 8px}
.fixline .tf{background:#bbf7d0;border-radius:6px;padding:0 4px}
.fixline .tm{background:#fecaca;border-radius:6px;padding:0 4px}
.fixans ul{list-style:none;display:grid;gap:4px;font-weight:700}
.fixans s{color:#b91c1c}
@media (max-width:640px){
  .rgrid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;text-align:center}
  .hero .mascot{margin:0 auto}
  .bubble:before{display:none}
  .nav button{padding:6px 10px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .tcard{padding:12px}
  .tcard h4{font-size:16px}
  .tem{width:50px;height:50px;font-size:28px}
  .skillRow span:first-child{width:110px}
  .pill{padding:5px 9px;font-size:14px}
  .topbar .me{flex-basis:100%}
  .topbar .pills{flex:1}
  .lvl .t{font-size:13px}
  .daily .btn{width:100%}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* ===== QUEST TAB ===== */
.quest{margin-top:16px;border-radius:26px;padding:clamp(14px,3vw,26px);color:#f5ecd7;background:radial-gradient(ellipse at 20% 0%,#3b2a6e 0%,#1a1236 45%,#0c0a1c 100%);box-shadow:0 20px 50px -20px rgba(20,10,60,.8);position:relative;overflow:hidden}
.quest:before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent),radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#ffe9a8 50%,transparent),radial-gradient(1px 1px at 40% 80%,#fff 50%,transparent),radial-gradient(1px 1px at 10% 70%,#fff 50%,transparent);opacity:.6;pointer-events:none}
.quest h1,.quest h3,.quest h4,.gtitle,.gkick,.qkick{font-family:'Cinzel','Baloo 2',serif}
.qhero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative}
.qhero canvas{width:180px;height:205px;flex-shrink:0}
.qinfo{flex:1;min-width:240px}
.qkick{color:#e8c766;letter-spacing:3px;font-size:13px;font-weight:700}
.qinfo h1{font-size:clamp(24px,3.6vw,36px);margin:6px 0;color:#fff4d6;text-shadow:0 2px 12px rgba(255,200,100,.35)}
.qloc{color:#cbbfe8;font-weight:700}
.qprog{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:800;font-size:14px;color:#e8c766}
.qprog .bar{flex:1;max-width:320px;background:rgba(255,255,255,.12)}
.qprog .bar i{background:linear-gradient(90deg,#e8c766,#ffefa8)}
.btn.gold{background:linear-gradient(135deg,#f5d77a,#c9952a);color:#3a2408;box-shadow:0 6px 0 #8a5f12,0 12px 24px -8px rgba(230,180,60,.7)}
.btn.gold:active{box-shadow:0 2px 0 #8a5f12}
.btn.big{font-size:20px;padding:15px 30px}
.qsub{font-size:13px;color:#cbbfe8;margin-top:6px;font-weight:700}
.qlock{background:rgba(255,255,255,.08);border:1px dashed rgba(232,199,102,.5);border-radius:16px;padding:14px;font-weight:700;line-height:1.5}
.qstatus.done{background:rgba(232,199,102,.15);border-radius:16px;padding:14px;font-weight:800;color:#ffe9a8}
.qgrid{display:grid;grid-template-columns:1fr 2fr;gap:16px;margin-top:18px;position:relative}
.qcard{background:rgba(255,255,255,.06);border:1px solid rgba(232,199,102,.25);border-radius:20px;padding:16px;backdrop-filter:blur(4px)}
.qcard.wide{grid-column:span 1}
.qcard h3{color:#ffe9a8;font-size:19px;margin-bottom:8px}.qcard h4{color:#e8c766;margin:12px 0 8px}
.qstats{display:flex;flex-wrap:wrap;gap:8px}.qstats span{background:rgba(0,0,0,.25);padding:6px 10px;border-radius:12px;font-weight:800;font-size:14px}
.qnote{color:#cbbfe8;font-size:13.5px;font-weight:600;line-height:1.45;margin:8px 0}
.potrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pot{background:rgba(0,0,0,.25);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.pot span{font-size:30px}.pot small{color:#cbbfe8;font-weight:700}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.spc{background:rgba(0,0,0,.28);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;border:1px solid transparent;transition:transform .2s}
.spc:hover{transform:translateY(-3px)}
.spc.has{border-color:rgba(232,199,102,.6);box-shadow:0 0 18px -6px rgba(232,199,102,.6)}
.spc.disc{border-color:rgba(160,200,255,.45);animation:discGlow 2s ease-in-out infinite}
@keyframes discGlow{50%{box-shadow:0 0 22px -4px rgba(160,200,255,.7)}}
.spc.lock{opacity:.5}
.spi{font-size:34px;filter:drop-shadow(0 0 8px rgba(255,220,140,.5))}
.spc b{color:#fff4d6}.spc small{color:#cbbfe8;font-size:12px;font-weight:600;line-height:1.3}
.spm{font-size:12px;font-weight:800;color:#9fd0ff}.rank{color:#ffd84a;letter-spacing:2px}.maxed{font-weight:800;color:#ffd84a;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.pg{aspect-ratio:3/4;border-radius:6px;background:rgba(0,0,0,.3);color:#8a80aa;font-weight:800;font-size:12px;border:1px solid rgba(255,255,255,.08)}
.pg.has{background:linear-gradient(160deg,#fff4d0,#d9b45a);color:#5a3a08;font-size:16px;box-shadow:0 0 12px rgba(255,220,120,.6);cursor:pointer}
.chlist{max-height:240px;overflow:auto;display:grid;gap:4px;padding-right:4px}
.chrow{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.2);font-weight:700;font-size:14px}
.chrow.cur{background:rgba(232,199,102,.18);color:#ffe9a8}.chrow.lock{color:#7f76a0}
.questBanner{margin-top:16px;display:flex;align-items:center;gap:14px;padding:14px 18px;color:#fff4d6;flex-wrap:wrap;background:linear-gradient(120deg,#1a1236,#3b2a6e 60%,#5a2a7e);border:1px solid rgba(232,199,102,.4)}
.questBanner .em{font-size:40px;animation:bob 2.4s ease-in-out infinite}
.questBanner h3{font-family:'Cinzel',serif;color:#ffe9a8}
@media (max-width:760px){.qgrid{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(9,1fr)}}

/* ===== GAME OVERLAY ===== */
#gwrap{position:fixed;inset:0;z-index:150;background:#05040a;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;font-family:'Nunito',sans-serif;color:#fff}
#gwrap canvas#gcv{position:absolute;inset:0}
#ghud{position:absolute;inset:0;pointer-events:none}
#ghud>*{pointer-events:auto}
.gtop{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5}
.gchip{background:rgba(10,6,24,.65);border:1px solid rgba(232,199,102,.4);padding:6px 14px;border-radius:99px;font-family:'Cinzel',serif;font-weight:700;color:#ffe9a8;font-size:14px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbtn{width:40px;height:40px;border-radius:50%;background:rgba(10,6,24,.65);border:1px solid rgba(232,199,102,.4);color:#fff;font-size:17px}
.gbtn:hover{background:rgba(60,40,110,.8)}
.dlg{position:absolute;left:0;right:0;margin:0 auto;bottom:18px;width:min(860px,94vw);display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;cursor:pointer;
  background:linear-gradient(180deg,rgba(20,12,44,.9),rgba(10,6,24,.94));border:2px solid rgba(232,199,102,.55);box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(124,92,255,.15);animation:fadeUp .35s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes gpopc{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.dlg canvas{width:92px;height:92px;border-radius:16px;border:2px solid rgba(232,199,102,.6);flex-shrink:0}
.dlg.narr canvas{opacity:.9}
.dtx{flex:1;min-height:80px}
.dname{font-family:'Cinzel',serif;color:#ffd875;font-weight:700;font-size:17px;margin-bottom:4px}
.dtext{font-size:clamp(16px,2.2vw,20px);line-height:1.5;font-weight:600}
.dlg.narr .dtext{font-style:italic;color:#e6dcff}
.dmore{color:#ffd875;font-size:20px;animation:bob 1s ease-in-out infinite;display:inline-block}
.gskip{position:absolute;right:14px;bottom:calc(18px + 150px);background:rgba(10,6,24,.6);color:#e8dcff;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px}
.gpanel{position:absolute;background:linear-gradient(180deg,rgba(26,16,56,.95),rgba(12,8,28,.97));border:2px solid rgba(232,199,102,.6);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.7);text-align:center;color:#fff4d6;animation:pop .35s forwards}
.gpanel.center{left:50%;top:50%;transform:translate(-50%,-50%);animation:gpopc .35s both;width:min(560px,92vw);max-height:88vh;overflow:auto}
.gpanel .gq{font-size:18px;font-weight:700;line-height:1.5;margin:10px 0 16px}.gpanel .gq.small{font-size:14px;color:#cbbfe8}
.gname{font-family:'Cinzel',serif;color:#ffd875;font-weight:700}
.gtitle{font-size:clamp(24px,4vw,34px);color:#ffe9a8;text-shadow:0 0 18px rgba(255,210,120,.5);margin:6px 0}
.gkick{color:#e8c766;letter-spacing:3px;font-size:13px}
.gopt{display:block;width:100%;margin:8px 0;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(232,199,102,.4);color:#fff4d6;font-weight:700;font-size:16px;text-align:left;transition:all .15s}
.gopt:hover{background:rgba(232,199,102,.2);transform:translateX(4px)}
.greward{font-size:20px;font-weight:800;color:#9fffc8;margin-bottom:14px}
.lore{font-style:italic;font-size:17px;color:#f3e2b0;line-height:1.55;margin:8px 0 14px}
.newspell{display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.08);border-radius:16px;padding:12px;margin:10px 0;font-size:15px;line-height:1.4}
.newspell span{font-size:40px}
.pagecard{background:radial-gradient(ellipse at top,rgba(80,60,20,.95),rgba(20,12,36,.97))}
.gpanel .rewards .reward{background:rgba(255,255,255,.1);border-color:rgba(232,199,102,.4);color:#fff4d6}
.gpanel .rewards .reward small{color:#cbbfe8}
/* power word */
.pw .pwt{font-family:'Cinzel',serif;font-size:20px;color:#ffe9a8;margin-bottom:8px}
.pw .pwc{font-size:17px;font-weight:700;margin:6px 0;color:#f3e9ff}.pw .pwc.small{font-size:13px;color:#cbbfe8}.pw .pwc b{color:#ffd875}

.pw .tiles span.x{background:#7a1f2a;border-color:#f87171;color:#fff}
.pw .spellInput{background:rgba(255,255,255,.95)}
.pwtimer{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:12px auto 0;max-width:420px}

.pwmsg{margin-top:10px;font-weight:700;color:#ffd875;min-height:20px}

.bar.hp i{background:linear-gradient(90deg,#ff4d6d,#ff8fa3)}.bar.mp i{background:linear-gradient(90deg,#3b82f6,#7fb0ff)}.bar.foehp i{background:linear-gradient(90deg,#b91c1c,#ef4444,#f97316)}
#gwrap .bar{background:rgba(255,255,255,.15)}

.ecount b{color:#ffd875}
.ehelp{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(10,6,24,.7);padding:8px 16px;border-radius:99px;font-weight:700;transition:opacity 1s;pointer-events:none;white-space:nowrap}
.touch{position:absolute;bottom:14px;left:14px;right:14px;display:flex;gap:10px}
.touch button{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:24px;backdrop-filter:blur(4px)}

/* battle hud */
.bfoe{position:absolute;top:58px;right:14px;width:min(380px,60vw);background:rgba(10,6,24,.7);border:1px solid rgba(255,100,100,.4);border-radius:16px;padding:10px 14px}
.bname{font-family:'Cinzel',serif;font-weight:700;color:#ffd0d0}.bname small{color:#ffd875;font-size:11px;letter-spacing:2px}
.bfoe .bar{margin:6px 0 2px;height:14px}
.bstat{font-size:13px;font-weight:800;color:#ffd875;min-height:16px}
.bmsg{position:absolute;top:58px;left:14px;width:min(420px,calc(100vw - 420px));min-width:220px;background:rgba(10,6,24,.72);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.4;border:1px solid rgba(232,199,102,.3)}

const TOPICS = [{"id":"solar-system","title":"Our Amazing Solar System","category":"Space","emoji":"🪐","minutes":4,"paragraphs":["Imagine riding a spaceship away from Earth and looking back. Our planet would shrink to a tiny blue dot. All around it, you would see the members of our solar system, a giant family held together by the Sun. The Sun sits in the center, and everything else travels around it. This family includes eight planets, many moons, dwarf planets like Pluto, and millions of asteroids and comets.","The Sun is a star, a huge ball of hot, glowing gas. It is so big that about one million Earths could fit inside it! The Sun gives us light and warmth. Its powerful gravity is like an invisible rope. It pulls on every planet and keeps each one moving in a path called an orbit. Without the Sun's gravity, the planets would drift away into dark space.","The four planets closest to the Sun are Mercury, Venus, Earth, and Mars. They are called rocky planets because they have hard, solid surfaces you could stand on. Mercury is the smallest planet and the closest to the Sun. Venus is the hottest planet, even though it is second in line. Its thick clouds trap heat like a blanket. Earth is the only planet we know of that has liquid water on its surface and living things. Mars is a dusty red world with giant volcanoes.","Past Mars is a wide ring of rocks called the asteroid belt. Beyond it are four giant planets: Jupiter, Saturn, Uranus, and Neptune. Jupiter and Saturn are made mostly of gas. Uranus and Neptune are icy giants. You could never land on these planets, because they do not have solid ground. Jupiter is the biggest planet of all. It has a giant storm called the Great Red Spot that is wider than Earth! Saturn is famous for its beautiful rings, which are made of chunks of ice and rock.","Far beyond Neptune lies a cold, dim region filled with small, icy worlds. Pluto lives there. For many years, people called Pluto the ninth planet. In 2006, scientists decided to call it a dwarf planet instead. Pluto is smaller than our Moon, and it shares its neighborhood with many other icy objects.","How do we know so much about places so far away? Scientists use powerful telescopes to study the sky. They also send robot spacecraft to visit other planets and take pictures. Every mission teaches us something new. Some of the scientists who will make the next big discovery might be kids reading this right now. Maybe one of them is you!"],"funFact":"A day on Venus is longer than its year! Venus takes about 243 Earth days to spin around once, but only about 225 Earth days to travel around the Sun.","vocab":[{"word":"gravity","meaning":"An invisible pull that draws objects toward each other."},{"word":"orbit","meaning":"The curved path an object takes around a planet or star."},{"word":"asteroid belt","meaning":"A ring of space rocks between Mars and Jupiter."},{"word":"dwarf planet","meaning":"A round space object that is smaller than a planet, like Pluto."},{"word":"spacecraft","meaning":"A machine built to travel through space."}],"comprehension":[{"q":"What is this article mostly about?","options":["How to build a spaceship at home","The Sun and the planets, moons, and other objects that travel around it","Why Pluto is the biggest planet","How storms form on Earth"],"answer":1,"explain":"Great job! The article describes the Sun and all the members of its 'giant family.'"},{"q":"Which planet is the hottest?","options":["Mercury","Mars","Jupiter","Venus"],"answer":3,"explain":"Yes! The article says Venus is the hottest because its thick clouds trap heat like a blanket."},{"q":"Why could you NOT land on Jupiter?","options":["It has no solid ground because it is made mostly of gas","It is too close to the Sun","It is covered in liquid water","It is smaller than Pluto"],"answer":0,"explain":"Nice thinking! The text says Jupiter is made mostly of gas and does not have solid ground."},{"q":"The article says gravity is 'like an invisible rope.' What does this comparison help you understand?","options":["Gravity is made of string","Gravity only works on Earth","Gravity pulls on things even though we cannot see it","Gravity makes planets hot"],"answer":2,"explain":"Exactly! A rope pulls things, and calling it invisible means we cannot see gravity's pull."},{"q":"What would happen to the planets without the Sun's gravity?","options":["They would grow rings like Saturn","They would turn into stars","They would spin faster in the same orbit","They would drift away into dark space"],"answer":3,"explain":"Right! The article says that without the Sun's gravity, the planets would drift away into dark space."}],"grammar":[{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'Saturn shines in the night sky.'","options":["Saturn","shines","night","sky"],"answer":1,"explain":"Well done! 'Shines' is the action word that tells what Saturn does."},{"skill":"Capital Letters","q":"Which sentence uses capital letters correctly?","options":["Jupiter is the biggest planet.","Jupiter is the Biggest Planet.","jupiter is the biggest planet.","jupiter Is the biggest planet."],"answer":0,"explain":"Yes! A sentence starts with a capital, and 'Jupiter' is a name, but 'biggest' and 'planet' are not."},{"skill":"Homophones","q":"Choose the correct word: 'Saturn is famous for ____ beautiful rings.'","options":["it's","it is","its'","its"],"answer":3,"explain":"Correct! 'Its' shows that the rings belong to Saturn, while 'it's' means 'it is.'"},{"skill":"Plurals","q":"What is the correct plural of 'family'?","options":["familys","family's","families","familyes"],"answer":2,"explain":"Great! When a word ends in a consonant and 'y,' change the 'y' to 'i' and add 'es.'"}],"spelling":[{"word":"gravity","sentence":"The Sun's powerful ____ keeps each planet moving in its orbit.","meaning":"An invisible pull between objects.","wrong":["gravaty","gravety","gravitty"]},{"word":"asteroid","sentence":"Past Mars is a wide ring of rocks called the ____ belt.","meaning":"A rocky object that travels around the Sun.","wrong":["asteriod","astroid","asteroyd"]},{"word":"telescope","sentence":"Scientists look through a powerful ____ to study the sky.","meaning":"A tool that makes faraway things look closer.","wrong":["telescop","teliscope","telescoap"]},{"word":"spacecraft","sentence":"Scientists send robot ____ to visit other planets.","meaning":"A vehicle built to fly far beyond Earth, like a rocket or a probe.","wrong":["spacecraf","spaceraft","spacekraft"]},{"word":"beautiful","sentence":"Saturn is famous for its ____ rings.","meaning":"Very pretty to look at.","wrong":["beutiful","beautifull","beatiful"]},{"word":"surface","sentence":"Earth has liquid water on its ____.","meaning":"The outside or top layer of something.","wrong":["surfase","serface","surfice"]}],"written":[{"q":"In your own words, explain how the Sun keeps the planets in our solar system.","minWords":10,"keyIdeas":[{"label":"The Sun's gravity pulls on the planets","any":["gravity","pull","attract","tug","rope"]},{"label":"Planets travel in an orbit around the Sun","any":["orbit","around","circle","path","travel","moving","move"]},{"label":"Without gravity, the planets would drift away","any":["drift","float","fly away","away","lost","escape"]}],"need":2,"sample":"The Sun has powerful gravity that pulls on every planet like an invisible rope. This pull keeps each planet moving in an orbit around the Sun. Without it, the planets would drift away into space."},{"q":"Why could a person stand on Mars but not on Jupiter? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Mars is a rocky planet with solid ground","any":["rock","solid","hard","ground","surface","land"]},{"label":"Jupiter is made mostly of gas","any":["gas","gassy","cloud","air"]},{"label":"Jupiter has no solid surface to stand on","any":["no solid","no ground","not solid","nothing to stand","no surface","sink","fall","nowhere"]}],"need":2,"sample":"Mars is a rocky planet, so it has hard, solid ground to stand on. Jupiter is a giant made mostly of gas. It has no solid ground, so there is nowhere to land."}],"fixit":[{"wrong":"jupiter is the biggest planet in are solar system.","right":"Jupiter is the biggest planet in our solar system.","errors":[{"bad":"jupiter","good":"Jupiter","type":"Capital Letters"},{"bad":"are","good":"our","type":"Homophones"}]},{"wrong":"Saturns rings is made of ice and rock","right":"Saturn's rings are made of ice and rock.","errors":[{"bad":"Saturns","good":"Saturn's","type":"Punctuation"},{"bad":"is","good":"are","type":"Subject-Verb Agreement"},{"bad":"rock","good":"rock.","type":"Punctuation"}]}]},{"id":"moon-phases","title":"The Moon's Changing Faces","category":"Space","emoji":"🌙","minutes":4,"paragraphs":["Have you ever noticed that the Moon looks different from night to night? Some nights it is a big, bright circle. Other nights it is a thin silver sliver, like a fingernail clipping in the sky. On some nights, you cannot see it at all! The Moon is not really changing its shape. What changes is how much of its sunny side we can see from Earth.","Here is the secret: the Moon does not make its own light. It is a big ball of rock, and it shines because sunlight bounces off it. The Sun always lights up half of the Moon, just like a flashlight shining on a ball. The other half stays dark. As the Moon travels around Earth, we see different amounts of the bright half. These different looks are called phases.","The Moon takes about 29 and a half days to go through all of its phases. The cycle starts with the new moon. During a new moon, the bright side faces away from us, so the Moon seems to disappear. A few days later, a thin crescent appears. Each night, the lit part grows a little bigger. When the lit part is growing, we say the Moon is waxing.","About one week after the new moon, we see the first quarter moon. It looks like half of a circle. Next comes the gibbous moon, which is more than half lit and looks a bit like a lopsided egg. Finally, about two weeks after the new moon, the whole face glows. This is the full moon. After that, the lit part shrinks night by night. A shrinking Moon is called waning. It goes back through gibbous, quarter, and crescent shapes until it reaches the new moon again.","The Moon affects our planet in surprising ways. Its gravity gently pulls on Earth's oceans. This pull helps make the water rise and fall along the beaches. These changes are called tides. If you visit the ocean, you might see the water creep up the sand and then slide back hours later.","People have watched the Moon for thousands of years. Long ago, many cultures used its phases as a calendar to track the months. In 1969, astronauts first walked on its dusty, gray surface. Their footprints are probably still there, because the Moon has no wind or rain to wipe them away. Tonight, step outside and look up. Which phase will you see?"],"funFact":"The Moon is slowly drifting away from Earth. Every year, it moves about 1.5 inches farther away, which is about how much your fingernails grow in a year.","vocab":[{"word":"phases","meaning":"The different shapes the Moon seems to have during a month."},{"word":"crescent","meaning":"A thin, curved shape like a banana or fingernail."},{"word":"gibbous","meaning":"A Moon shape that is more than half lit but not full."},{"word":"waning","meaning":"Getting smaller little by little."},{"word":"tides","meaning":"The daily rising and falling of ocean water."}],"comprehension":[{"q":"What is the main idea of the article?","options":["The Moon makes its own light like a lamp","Astronauts built a calendar on the Moon","The Moon looks different because we see different amounts of its sunlit half","The Moon changes its real shape every night"],"answer":2,"explain":"Great work! The article explains that what changes is how much of the Moon's sunny side we can see."},{"q":"How long does the Moon take to go through all its phases?","options":["About 7 days","About 29 and a half days","About 365 days","About 2 days"],"answer":1,"explain":"Yes! The article says the Moon takes about 29 and a half days to go through all of its phases."},{"q":"Which phase comes right after the new moon?","options":["Full moon","Gibbous moon","First quarter moon","A thin crescent"],"answer":3,"explain":"Right! The text says that a few days after the new moon, a thin crescent appears."},{"q":"In the article, what does 'waxing' mean?","options":["The lit part is growing","The lit part is shrinking","The Moon is hidden by clouds","The Moon is spinning fast"],"answer":0,"explain":"Nice! The article says that when the lit part is growing, the Moon is waxing."},{"q":"Why are the astronauts' footprints probably still on the Moon?","options":["Robots guard them","The Moon has no wind or rain to wipe them away","They were made of metal","The Moon is too cold for dust"],"answer":1,"explain":"Exactly! The article says the Moon has no wind or rain to wipe the footprints away."}],"grammar":[{"skill":"Adverbs","q":"Which word is the ADVERB in this sentence: 'The Moon's gravity gently pulls on the oceans.'","options":["gravity","gently","pulls","oceans"],"answer":1,"explain":"Well done! 'Gently' tells HOW the gravity pulls, so it is an adverb."},{"skill":"Verb Tenses","q":"Which sentence is written in the PAST tense?","options":["Astronauts walk on the Moon.","Astronauts will walk on the Moon.","Astronauts walked on the Moon.","Astronauts are walking on the Moon."],"answer":2,"explain":"Yes! 'Walked' ends in '-ed' and tells about something that already happened."},{"skill":"Punctuation","q":"Which end mark belongs at the end of this sentence: 'Have you ever noticed that the Moon looks different from night to night'","options":["a question mark (?)","a period (.)","a comma (,)","a colon (:)"],"answer":0,"explain":"Correct! The sentence asks something, so it needs a question mark."},{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'The silver crescent glows brightly.'","options":["silver","glows","brightly","crescent"],"answer":3,"explain":"Great! 'Crescent' names a thing, so it is a noun."}],"spelling":[{"word":"crescent","sentence":"A few days after the new moon, a thin ____ appears.","meaning":"A thin, curved shape.","wrong":["cresent","crescant","creshent"]},{"word":"calendar","sentence":"Long ago, many cultures used the Moon's phases as a ____.","meaning":"A chart that shows the days, weeks, and months.","wrong":["calender","calandar","calindar"]},{"word":"astronaut","sentence":"In 1969, an ____ walked on the Moon for the first time.","meaning":"A person trained to travel into space.","wrong":["astronot","astranaut","astronaught"]},{"word":"disappear","sentence":"During a new moon, the Moon seems to ____.","meaning":"To go out of sight.","wrong":["dissapear","disapear","disappeer"]},{"word":"surprising","sentence":"The Moon affects our planet in ____ ways.","meaning":"Unexpected or amazing.","wrong":["suprising","surprizing","surpriseing"]},{"word":"footprints","sentence":"The astronauts' ____ are probably still on the Moon.","meaning":"Marks left by feet or shoes.","wrong":["fotprints","footprintz","footprins"]}],"written":[{"q":"In your own words, explain why the Moon seems to change shape.","minWords":12,"keyIdeas":[{"label":"The Moon reflects light from the Sun","any":["reflect","sunlight","sun","bounce","light","shine"]},{"label":"Only half of the Moon is lit at a time","any":["half","one side","lit","bright side","sunny side","dark"]},{"label":"We see different amounts as it travels around Earth","any":["orbit","around","travel","moves","moving","goes around","different amount","different part","more","less"]}],"need":2,"sample":"The Moon does not make its own light. Sunlight bounces off it and lights up half of it. As the Moon travels around Earth, we see different amounts of the bright half, so it looks like it changes shape."},{"q":"What would happen to the astronauts' footprints if the Moon had wind and rain like Earth? Explain why.","minWords":10,"keyIdeas":[{"label":"The footprints would be wiped away","any":["wipe","wash","erase","disappear","gone","away","blow","fade","destroy","cover"]},{"label":"Wind and rain move the dust around","any":["wind","rain","weather","dust","dirt","storm"]},{"label":"Right now the Moon has no wind or rain, so they stay","any":["no wind","no rain","still there","stay","last"]}],"need":2,"sample":"If the Moon had wind and rain, the footprints would probably be wiped away. The wind would blow the dust around, and the rain would wash it. Right now they stay because the Moon has no wind or rain."}],"fixit":[{"wrong":"the Moon takes about 29 days to go threw it's phases.","right":"The Moon takes about 29 days to go through its phases.","errors":[{"bad":"the","good":"The","type":"Capital Letters"},{"bad":"threw","good":"through","type":"Homophones"},{"bad":"it's","good":"its","type":"Homophones"}]},{"wrong":"In 1969, astronauts walk on the Moon for the first time","right":"In 1969, astronauts walked on the Moon for the first time.","errors":[{"bad":"walk","good":"walked","type":"Verb Tense"},{"bad":"time","good":"time.","type":"Punctuation"}]}]},{"id":"stars","title":"Stars: Sparkling Lights in the Sky","category":"Space","emoji":"⭐","minutes":4,"paragraphs":["On a clear, dark night, the sky can sparkle with thousands of stars. They look like tiny glitter scattered across black paper. But stars are not tiny at all. Each star is a gigantic ball of glowing gas, and many are much bigger than our Sun. They only look small because they are incredibly far away.","In fact, the Sun is a star too! It is the closest star to Earth, which is why it looks so big and bright. Deep inside every star, tiny particles smash together and release huge amounts of energy. This energy makes the star shine with light and heat. Our Sun has been shining for about four and a half billion years, and it will keep shining for billions more.","Stars come in different colors, and a star's color is a clue about its temperature. Red stars are the coolest. Yellow stars, like our Sun, are in the middle. Blue-white stars are the hottest of all. That might surprise you, since we often think of red as hot and blue as cold. With stars, it is the other way around!","Stars have life stories, a bit like living things. A star is born inside a giant cloud of gas and dust called a nebula. Gravity pulls the gas and dust together into a tight ball until it gets hot enough to start shining. Most stars glow steadily for billions of years. When a medium-sized star like the Sun gets very old, it puffs up into a red giant. Some huge stars end their lives with a gigantic explosion called a supernova.","Long ago, people looked at the stars and imagined pictures connecting them, like a dot-to-dot puzzle. These star patterns are called constellations. Orion the Hunter has three bright stars in a row that make his belt. The Big Dipper, part of a constellation called the Great Bear, looks like a giant ladle for scooping soup. Today, scientists recognize 88 official constellations.","Stars have also helped people find their way. Sailors and travelers used the North Star, also called Polaris, as a guide. It stays in almost the same spot in the northern sky all night long. If you face it, you are facing north. Tonight, find a dark spot away from bright city lights. Let your eyes adjust for a few minutes, and you might see more stars than you can count."],"funFact":"When you look at a faraway star, you are seeing light that left it long ago. Light from some stars takes hundreds or even thousands of years to reach your eyes!","vocab":[{"word":"gigantic","meaning":"Extremely big."},{"word":"temperature","meaning":"How hot or cold something is."},{"word":"nebula","meaning":"A huge cloud of gas and dust in space where stars are born."},{"word":"supernova","meaning":"The giant, bright explosion of a huge star."},{"word":"constellations","meaning":"Groups of stars that make pictures or patterns in the sky."}],"comprehension":[{"q":"What is this article mostly about?","options":["What stars are, how they live, and how people use them","How to build a telescope at home","Why the Moon changes shape","How sailors build ships"],"answer":0,"explain":"Great job! The article covers what stars are, their life stories, and how people use them."},{"q":"Which color of star is the hottest?","options":["Red","Yellow","Blue-white","Orange"],"answer":2,"explain":"Yes! The article says blue-white stars are the hottest of all."},{"q":"Why do stars look tiny from Earth?","options":["They are smaller than pebbles","They only shine for a few minutes","They are hidden behind clouds","They are incredibly far away"],"answer":3,"explain":"Right! The text says stars only look small because they are incredibly far away."},{"q":"In the article, what is a 'nebula'?","options":["A kind of telescope","A giant cloud of gas and dust where stars are born","A group of sailors","The brightest star in the sky"],"answer":1,"explain":"Nice! The article says a star is born inside a giant cloud of gas and dust called a nebula."},{"q":"What happens to a medium-sized star like the Sun when it gets very old?","options":["It turns blue-white","It becomes a constellation","It puffs up into a red giant","It shrinks into a nebula"],"answer":2,"explain":"Exactly! The article says a very old medium-sized star puffs up into a red giant."}],"grammar":[{"skill":"Adjectives","q":"Which word is an ADJECTIVE in this sentence: 'A bright star twinkles above the hills.'","options":["star","twinkles","bright","hills"],"answer":2,"explain":"Well done! 'Bright' describes the star, so it is an adjective."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'Red stars ____ cooler than blue-white stars.'","options":["is","are","was","be"],"answer":1,"explain":"Yes! 'Stars' is plural, so it needs the plural verb 'are.'"},{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["Stars can be red yellow, or blue-white.","Stars, can be red, yellow or blue-white.","Stars can be, red yellow, or blue-white.","Stars can be red, yellow, or blue-white."],"answer":3,"explain":"Correct! Commas separate each item in a list of three or more things."},{"skill":"Sentence Types","q":"What kind of sentence is this: 'Find a dark spot away from city lights.'","options":["A command","A question","An exclamation","A statement"],"answer":0,"explain":"Great! The sentence tells you to do something, so it is a command."}],"spelling":[{"word":"gigantic","sentence":"Each star is a ____ ball of glowing gas.","meaning":"Extremely big.","wrong":["jigantic","gigantick","gigantec"]},{"word":"explosion","sentence":"Some huge stars end their lives with a giant ____ called a supernova.","meaning":"A sudden, powerful burst.","wrong":["explotion","exploshun","explosian"]},{"word":"temperature","sentence":"A star's color is a clue about its ____.","meaning":"How hot or cold something is.","wrong":["temprature","tempurature","temperture"]},{"word":"particles","sentence":"Deep inside every star, tiny ____ smash together.","meaning":"Very tiny bits of something.","wrong":["particals","partickles","partikles"]},{"word":"surprise","sentence":"It might ____ you that blue-white stars are the hottest.","meaning":"To make someone feel amazed by something unexpected.","wrong":["suprise","surprize","serprise"]},{"word":"northern","sentence":"The North Star stays in almost the same spot in the ____ sky.","meaning":"In or toward the direction a compass needle points; the opposite of southern.","wrong":["northurn","nothern","northen"]}],"written":[{"q":"Describe how a star is born and what can happen when it gets old.","minWords":12,"keyIdeas":[{"label":"Stars are born in a nebula of gas and dust","any":["nebula","cloud","gas","dust"]},{"label":"Gravity pulls the gas and dust together","any":["gravity","pull","squeez","together","ball"]},{"label":"Old stars can puff up into red giants","any":["red giant","puff","swell","bigger","grow"]},{"label":"Huge stars can explode as a supernova","any":["supernova","explo","blow up","boom","burst"]}],"need":2,"sample":"A star is born inside a nebula, a giant cloud of gas and dust. Gravity pulls the gas and dust together until it gets hot enough to shine. When a star like the Sun gets old, it puffs up into a red giant, and some huge stars explode in a supernova."},{"q":"Why would a sailor long ago use the North Star to find the way? Use details from the article.","minWords":10,"keyIdeas":[{"label":"The North Star stays in almost the same spot","any":["same spot","same place","stays","does not move","doesn't move","stay","still"]},{"label":"Facing it means you are facing north","any":["north","direction","which way","compass","point"]},{"label":"It works like a guide for travelers","any":["guide","find","way","lost","navigat","map"]}],"need":2,"sample":"The North Star stays in almost the same spot in the sky all night. If a sailor faces it, he knows he is facing north. That helps him find his way across the ocean."}],"fixit":[{"wrong":"red stars is cooler than blue-white starz.","right":"Red stars are cooler than blue-white stars.","errors":[{"bad":"red","good":"Red","type":"Capital Letters"},{"bad":"is","good":"are","type":"Subject-Verb Agreement"},{"bad":"starz.","good":"stars.","type":"Spelling"}]},{"wrong":"Sailors used the north star to find there way.","right":"Sailors used the North Star to find their way.","errors":[{"bad":"north","good":"North","type":"Capital Letters"},{"bad":"star","good":"Star","type":"Capital Letters"},{"bad":"there","good":"their","type":"Homophones"}]}]},{"id":"mars-rovers","title":"Robot Explorers on Mars","category":"Space","emoji":"🤖","minutes":4,"paragraphs":["Imagine driving a car on another planet, millions of miles away, without ever leaving your chair. That is what scientists do when they explore Mars! They use rovers, which are robots on wheels. Rovers roll across the Martian ground, take pictures, and study rocks. Then they send their discoveries back to Earth.","Mars is the fourth planet from the Sun. It is often called the Red Planet because its soil is full of rusty iron dust. Mars is a cold desert world with a very thin atmosphere. It also has the tallest volcano in the solar system, called Olympus Mons. That volcano is about two and a half times taller than Mount Everest!","Getting a rover to Mars is not easy. The trip takes about seven months. Then the rover has to land safely. Engineers call the landing 'seven minutes of terror' because so much can go wrong. Over the years, engineers have tried many clever landing tricks. Some rovers bounced down inside giant airbags, like a beach ball. The newest rovers were lowered gently to the ground on cables by a flying machine called a sky crane.","The rovers have amazing names. Spirit and Opportunity landed in 2004. Each one was planned to work for about three months. Opportunity surprised everyone by exploring for almost fifteen years! Curiosity landed in 2012 and is about the size of a small car. Perseverance landed in 2021. It even carried a tiny helicopter named Ingenuity, the first helicopter ever to fly on another planet.","Why do scientists care so much about Mars? They want to know if Mars was ever home to tiny living things. Rovers have found clues that Mars had lakes and rivers long ago. On Earth, wherever there is water, there is usually life. Perseverance is collecting rock samples and sealing them in tubes. Someday, a future mission may bring them back to Earth for scientists to study.","Driving a rover is tricky. Messages between Earth and Mars can take up to about twenty minutes to travel each way. That means drivers cannot steer with a joystick like a video game. Instead, they plan each move carefully and send instructions ahead of time. The rover then follows the plan on its own. Someday, astronauts may walk beside these robot explorers. Maybe you will be one of them!"],"funFact":"Mars has two tiny moons named Phobos and Deimos. They are lumpy and shaped a bit like potatoes instead of round balls.","vocab":[{"word":"rovers","meaning":"Robot vehicles with wheels that explore other worlds."},{"word":"atmosphere","meaning":"The layer of gases around a planet."},{"word":"engineers","meaning":"People who design and build machines and structures."},{"word":"samples","meaning":"Small pieces of something collected to study."},{"word":"mission","meaning":"A special trip or job with an important goal."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Mars has the tallest mountain on Earth","Video games help scientists relax","Helicopters are easy to fly","Scientists use robot rovers to explore Mars and look for clues about its past"],"answer":3,"explain":"Great job! The whole article is about rovers exploring Mars and searching for clues."},{"q":"Which rover explored for almost fifteen years?","options":["Curiosity","Opportunity","Perseverance","Ingenuity"],"answer":1,"explain":"Yes! The article says Opportunity surprised everyone by exploring for almost fifteen years."},{"q":"Why do scientists get excited when rovers find signs of old lakes and rivers?","options":["Water is a clue that tiny living things might once have lived there","Lakes make Mars look red","Rivers help rovers drive faster","Water makes rocket fuel for the trip home"],"answer":0,"explain":"Nice thinking! The article says that on Earth, wherever there is water, there is usually life."},{"q":"Perseverance is collecting rock 'samples.' What are samples?","options":["Pictures of the sky","Messages sent to Earth","Small pieces collected to study","Spare wheels for the rover"],"answer":2,"explain":"Exactly! The rover collects pieces of rock in tubes so scientists can study them."},{"q":"Why can't drivers steer a rover with a joystick like a video game?","options":["The rover has no wheels","Messages take many minutes to travel between Earth and Mars","Mars is too dark to see","Joysticks do not work in cold weather"],"answer":1,"explain":"Right! The article says messages can take up to about twenty minutes to travel each way."}],"grammar":[{"skill":"Conjunctions","q":"Which word is the CONJUNCTION in this sentence: 'The trip is long, but the rover lands safely.'","options":["trip","long","but","safely"],"answer":2,"explain":"Well done! 'But' joins the two parts of the sentence, so it is a conjunction."},{"skill":"Prepositions","q":"Which word is the PREPOSITION in this sentence: 'The rover rolled across the dusty ground.'","options":["across","rover","rolled","dusty"],"answer":0,"explain":"Yes! 'Across' shows where the rover rolled in relation to the ground."},{"skill":"Verb Tenses","q":"Which sentence is written in the FUTURE tense?","options":["Perseverance landed on Mars.","Perseverance collects rocks.","Perseverance is driving slowly.","A mission will bring the samples back."],"answer":3,"explain":"Correct! 'Will bring' tells about something that has not happened yet."},{"skill":"Capital Letters","q":"Which word should begin with a capital letter: 'In 2012, the rover named curiosity landed on Mars.'","options":["rover","curiosity","named","landed"],"answer":1,"explain":"Great! 'Curiosity' is the rover's name, and names are proper nouns that need capital letters."}],"spelling":[{"word":"engineers","sentence":"Over the years, ____ have tried many clever landing tricks.","meaning":"People who design and build machines.","wrong":["enginears","engeneers","enjineers"]},{"word":"helicopter","sentence":"Perseverance carried a tiny ____ named Ingenuity.","meaning":"An aircraft with spinning blades on top.","wrong":["helicoptor","helecopter","hellicopter"]},{"word":"atmosphere","sentence":"Mars is a cold desert world with a very thin ____.","meaning":"The layer of gases around a planet.","wrong":["atmosfere","atmousphere","atmospere"]},{"word":"discoveries","sentence":"Rovers send their ____ back to Earth.","meaning":"New things that someone finds or learns.","wrong":["discoverys","discoveryes","discoverries"]},{"word":"carefully","sentence":"Drivers plan each move ____ and send instructions ahead of time.","meaning":"With lots of attention so nothing goes wrong.","wrong":["carefuly","carfully","carefulley"]},{"word":"volcano","sentence":"Mars has the tallest ____ in the solar system.","meaning":"A mountain that can erupt with melted rock.","wrong":["volcanoe","vulcano","volcanno"]}],"written":[{"q":"In your own words, explain what rovers do on Mars.","minWords":10,"keyIdeas":[{"label":"They drive around and explore","any":["drive","roll","explor","move","wheel","travel"]},{"label":"They take pictures and study rocks","any":["picture","photo","camera","rock","stud","sample","collect"]},{"label":"They send discoveries back to Earth","any":["send","back to earth","message","report","discover"]},{"label":"They look for clues about water or life","any":["water","life","living","clue","lake","river"]}],"need":2,"sample":"Rovers are robots on wheels that drive across Mars and explore. They take pictures and study rocks. Then they send what they discover back to Earth."},{"q":"Why do rover drivers have to plan each move ahead of time instead of steering with a joystick?","minWords":12,"keyIdeas":[{"label":"Messages take a long time to travel","any":["minute","long time","delay","slow","take time","takes time","late","twenty","20"]},{"label":"Mars is very far from Earth","any":["far","distance","million","away"]},{"label":"The rover follows the plan on its own","any":["plan","instruction","own","itself","ahead","program"]}],"need":2,"sample":"Mars is millions of miles away, so messages take up to about twenty minutes to get there. If drivers used a joystick, the rover would get the message too late. So they send instructions ahead of time, and the rover follows the plan on its own."}],"fixit":[{"wrong":"Perseverance land on mars in 2021","right":"Perseverance landed on Mars in 2021.","errors":[{"bad":"land","good":"landed","type":"Verb Tense"},{"bad":"mars","good":"Mars","type":"Capital Letters"},{"bad":"2021","good":"2021.","type":"Punctuation"}]},{"wrong":"The rovers send there picturs back to earth.","right":"The rovers send their pictures back to Earth.","errors":[{"bad":"there","good":"their","type":"Homophones"},{"bad":"picturs","good":"pictures","type":"Spelling"},{"bad":"earth.","good":"Earth.","type":"Capital Letters"}]}]},{"id":"volcanoes","title":"Volcanoes: Mountains of Fire","category":"Earth","emoji":"🌋","minutes":4,"paragraphs":["Deep beneath your feet, far below the dirt and rocks, it is incredibly hot. In some places, it is hot enough to melt rock into a thick, glowing liquid. This melted rock is called magma. When magma finds a way to escape to the surface, a volcano is born.","A volcano is an opening in Earth's crust, the thin, rocky outer layer of our planet. Magma is lighter than the solid rock around it, so it slowly rises, like a blob in a lava lamp. It collects in an underground pool called a magma chamber. As more magma and gas build up, the pressure grows stronger and stronger.","Think about shaking a bottle of soda and then opening the cap. Whoosh! The bubbles rush out all at once. A volcano can work in a similar way. When the pressure becomes too great, the volcano erupts. Melted rock bursts out of the top or through cracks in the sides. Once magma reaches the surface, it gets a new name: lava. Lava can be hotter than 2,000 degrees Fahrenheit. That is more than five times hotter than an oven baking cookies!","Not every eruption looks the same. Some volcanoes have runny lava that oozes out and flows down the slopes like hot syrup. The volcanoes of Hawaii are famous for this gentle kind of eruption. Other volcanoes have thick, sticky magma that traps gas. These can explode violently, blasting ash and rock high into the sky. Volcanic ash is not soft like fireplace ash. It is made of tiny, sharp bits of rock and glass.","Scientists who study volcanoes are called volcanologists. They watch for warning signs, such as small earthquakes, swelling ground, and puffs of gas. Their careful work helps people know when to leave an area and stay safe. Some volcanoes are active, which means they have erupted recently or might erupt soon. Others are dormant, or sleeping. Some are extinct and will probably never erupt again.","Even though volcanoes can be dangerous, they also help our planet. Over time, volcanic ash breaks down into rich soil that is perfect for growing crops. Some islands, including Hawaii, were built by volcanoes over a very long time. Every time lava cools and hardens, it adds new rock to Earth. In a way, volcanoes are like giant builders shaping the world we live on."],"funFact":"Many volcanoes are hidden deep under the ocean. Scientists think most of Earth's volcanic eruptions happen underwater, where no one can see them!","vocab":[{"word":"magma","meaning":"Hot, melted rock found deep underground."},{"word":"crust","meaning":"The thin, rocky outer layer of Earth."},{"word":"erupts","meaning":"Bursts out suddenly with force."},{"word":"dormant","meaning":"Sleeping or quiet for now, but able to wake up later."},{"word":"extinct","meaning":"No longer active and not expected to erupt again."}],"comprehension":[{"q":"What is the article mainly about?","options":["How to bake cookies safely","Why soda bottles explode","How volcanoes form, erupt, and shape our planet","Why Hawaii has the best beaches"],"answer":2,"explain":"Great job! The article explains how volcanoes form, how they erupt, and how they help build land."},{"q":"What is magma called once it reaches the surface?","options":["Lava","Ash","Crust","Soil"],"answer":0,"explain":"Yes! The article says that once magma reaches the surface, it gets a new name: lava."},{"q":"What causes a volcano to erupt?","options":["Rain fills the top of the volcano","Scientists poke holes in it","The ground gets too cold","Pressure from magma and gas becomes too great"],"answer":3,"explain":"Right! The article says that when the pressure becomes too great, the volcano erupts."},{"q":"The article says some volcanoes are 'dormant.' What does dormant mean here?","options":["Erupting right now","Sleeping, but could erupt again","Made of ice","Brand new"],"answer":1,"explain":"Nice! The article explains that dormant volcanoes are sleeping, which means they could wake up later."},{"q":"Why might farmers like to grow crops near old volcanoes?","options":["Lava keeps the crops warm at night","Volcanoes scare away birds","Volcanic ash breaks down into rich soil","The ground there never shakes"],"answer":2,"explain":"Exactly! The article says volcanic ash breaks down into rich soil that is perfect for growing crops."}],"grammar":[{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'Lava flows down the mountain.'","options":["Lava","down","mountain","flows"],"answer":3,"explain":"Well done! 'Flows' is the action word that tells what the lava does."},{"skill":"Plurals","q":"What is the correct plural of 'glass'?","options":["glasses","glasss","glassies","glass's"],"answer":0,"explain":"Yes! Words that end in 's' add 'es' to become plural."},{"skill":"Homophones","q":"Choose the correct word: 'Lava is much ____ hot to touch.'","options":["to","too","two","tow"],"answer":1,"explain":"Correct! 'Too' means 'very' or 'more than enough.'"},{"skill":"Punctuation","q":"Which sentence has the correct end mark?","options":["Is the volcano active.","Is the volcano active,","Is the volcano active?","Is the volcano active!"],"answer":2,"explain":"Great! This sentence asks a question, so it ends with a question mark."}],"spelling":[{"word":"pressure","sentence":"As more magma and gas build up, the ____ grows stronger.","meaning":"A strong pushing force.","wrong":["presure","preshure","pressur"]},{"word":"eruption","sentence":"The volcanoes of Hawaii are famous for
