he leaves. Leaf cells are packed with tiny green parts called chloroplasts. Inside them is a green substance called chlorophyll. Chlorophyll is like a solar panel. It catches energy from sunlight. The plant uses that energy to turn water and carbon dioxide into a kind of sugar called glucose. Glucose is the plant's food, giving it energy to grow leaves, flowers, roots, and fruit.","Why are most leaves green? Sunlight looks white, but it is really a mix of many colors. Chlorophyll soaks up lots of red and blue light, but it does not use much green light. Instead, the green light bounces off the leaf and into your eyes. In autumn, many trees stop making chlorophyll. As the green fades, yellow and orange colors that were hiding in the leaves all along finally show through.","Photosynthesis has a wonderful leftover: oxygen. Plants release oxygen into the air through those same tiny holes in their leaves. Every time you take a breath, you are breathing oxygen made by plants and by tiny ocean living things called phytoplankton. In fact, scientists think ocean phytoplankton make about half of the new oxygen produced on Earth each year.","Here is something to think about. When you eat an apple, a carrot, or a bowl of rice, you are eating energy that a plant first captured from the sun. Even a hamburger connects back to plants, because cows eat grass. That means almost every meal on your plate began with photosynthesis. So the next time you see a leafy tree, thank it for the food and the fresh air!"],"funFact":"Sunlight takes about eight minutes to travel from the Sun to Earth. So the light a leaf catches right now left the Sun about eight minutes ago!","vocab":[{"word":"photosynthesis","meaning":"How plants use sunlight to make their own food."},{"word":"stomata","meaning":"Tiny holes in leaves that let gases in and out."},{"word":"substance","meaning":"A kind of material or stuff."},{"word":"chlorophyll","meaning":"The green material in plants that catches sunlight."},{"word":"glucose","meaning":"A kind of sugar that plants make and use for energy."}],"comprehension":[{"q":"What is the main idea of the article?","options":["Plants need to be cooked to grow","Plants use sunlight, water, and carbon dioxide to make their own food","Leaves are green because they are painted","Only trees can make oxygen"],"answer":1,"explain":"Great job! The whole article explains how plants make food through photosynthesis."},{"q":"How does carbon dioxide get into a leaf?","options":["Through the roots","Through the flowers","Through the fruit","Through tiny holes called stomata"],"answer":3,"explain":"Yes! The article says carbon dioxide enters the leaves through tiny holes called stomata."},{"q":"Why do many leaves turn yellow and orange in autumn?","options":["Trees stop making chlorophyll, so hidden colors show through","The leaves get painted by frost","The sun turns orange in fall","The roots stop drinking water"],"answer":0,"explain":"Right! The text says as the green fades, yellow and orange colors that were hiding finally show."},{"q":"The article says 'Chlorophyll is like a solar panel.' What does this comparison tell you?","options":["Chlorophyll is made of metal","Chlorophyll is found on rooftops","Chlorophyll catches energy from sunlight","Chlorophyll makes electricity for houses"],"answer":2,"explain":"Nice! Right after the comparison, the article says it catches energy from sunlight."},{"q":"Why does the author say even a hamburger connects back to plants?","options":["Hamburgers are made from leaves","Cows get their energy by eating grass","Plants grow inside hamburgers","Hamburgers make oxygen"],"answer":1,"explain":"Exactly! The article explains that cows eat grass, so the energy started with plants."}],"grammar":[{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'Plants release oxygen into the air.'","options":["Plants","release","oxygen","air"],"answer":1,"explain":"'Release' is the verb because it tells what the plants do."},{"skill":"Homophones","q":"Choose the correct word: '____ amazing that plants make their own food.'","options":["Its","Its'","It's","Itz"],"answer":2,"explain":"'It's' is short for 'it is,' which fits this sentence."},{"skill":"Commas","q":"Where does the comma belong? 'When you eat an apple you are eating energy from the sun.'","options":["after 'When'","after 'eating'","after 'energy'","after 'apple'"],"answer":3,"explain":"A comma goes after the opening part 'When you eat an apple' to separate it from the rest."},{"skill":"Sentence Types","q":"What kind of sentence is this: 'Thank the tree for the fresh air.'","options":["Command","Question","Exclamation","Statement"],"answer":0,"explain":"It tells someone to do something, so it is a command."}],"spelling":[{"word":"ingredients","sentence":"To make food, a plant needs three ____: sunlight, water, and carbon dioxide.","meaning":"The things you need to make something.","wrong":["ingrediants","ingredeints","ingreedients"]},{"word":"microscope","sentence":"These holes are so small that you would need a ____ to see them.","meaning":"A tool that makes tiny things look much bigger.","wrong":["microscop","mikroscope","microskope"]},{"word":"energy","sentence":"Chlorophyll catches ____ from sunlight.","meaning":"The power that makes things move, grow, or work.","wrong":["enrgy","enerjy","energie"]},{"word":"autumn","sentence":"In ____, many trees stop making chlorophyll.","meaning":"The season between summer and winter; fall.","wrong":["autum","awtumn","autemn"]},{"word":"breathing","sentence":"Every time you take a breath, you are ____ oxygen made by plants.","meaning":"Taking air in and out of your body.","wrong":["breething","breatheing","brething"]},{"word":"wonderful","sentence":"Photosynthesis has a ____ leftover: oxygen.","meaning":"Very good or amazing.","wrong":["wonderfull","wunderful","wondreful"]}],"written":[{"q":"In your own words, explain how a plant makes its own food.","minWords":12,"keyIdeas":[{"label":"It uses sunlight","any":["sun","light","solar","energy"]},{"label":"It takes in water through its roots","any":["water","root","soil","drink","soak"]},{"label":"It takes in carbon dioxide through its leaves","any":["carbon","dioxide","co2","air","gas","stomata"]},{"label":"It makes a sugar called glucose","any":["sugar","glucose","chlorophyll","chloroplast"]}],"need":2,"sample":"A plant soaks up water through its roots and takes in carbon dioxide through tiny holes in its leaves. Chlorophyll catches energy from sunlight to turn them into a sugar called glucose."},{"q":"Why would people and animals have trouble living without plants? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Plants make the oxygen we breathe","any":["oxygen","breath","air","o2"]},{"label":"Our food comes from plants","any":["food","eat","meal","apple","carrot","rice"]},{"label":"Even animals we eat, like cows, eat plants","any":["cow","grass","hamburger","meat"]}],"need":2,"sample":"Plants make the oxygen that people and animals need to breathe. Almost all of our food comes from plants, and even cows that give us hamburgers eat grass."}],"fixit":[{"wrong":"In autum, many trees stop making chlorophyll","right":"In autumn, many trees stop making chlorophyll.","errors":[{"bad":"autum,","good":"autumn,","type":"Spelling"},{"bad":"chlorophyll","good":"chlorophyll.","type":"Punctuation"}]},{"wrong":"A plant's roots soaks up water and it's leafs take in carbon dioxide.","right":"A plant's roots soak up water and its leaves take in carbon dioxide.","errors":[{"bad":"soaks","good":"soak","type":"Subject-Verb Agreement"},{"bad":"it's","good":"its","type":"Homophones"},{"bad":"leafs","good":"leaves","type":"Plurals"}]}]},{"id":"rainforests","title":"Up, Up, Up: Exploring the Layers of the Rainforest","category":"Plants & Nature","emoji":"🌳","minutes":4,"paragraphs":["Imagine stepping into a forest so thick and green that only a little sunlight reaches the ground. The air is warm and sticky, and the sounds of frogs, birds, and insects fill your ears. Welcome to the tropical rainforest! Rainforests get a lot of rain, often more than 80 inches a year. They cover only a small part of Earth's land, yet they are home to about half of all the kinds of plants and animals on the planet.","A rainforest is like a giant apartment building, with creatures living on different floors. Scientists divide it into four main layers. Starting from the top, they are the emergent layer, the canopy, the understory, and the forest floor. Each layer has its own amount of light, wind, and water, so each one is home to different living things.","The emergent layer is the very top. Here, a few giant trees poke out above everything else, some reaching more than 200 feet tall. These treetops get blasted by sunlight and strong winds. Butterflies flutter in the bright sun, and harpy eagles, some of the strongest birds of prey, build huge nests here. They swoop down from these heights to catch monkeys and sloths.","Just below is the canopy, a thick roof of leaves and branches. The canopy is the busiest layer of all. Many scientists think most rainforest animals live here, including toucans, tree frogs, and many kinds of monkeys. Fruits, flowers, and leaves are everywhere, so there is plenty to eat. Some animals spend their whole lives in the canopy and never touch the ground.","Under the canopy is the understory. It is shady and still, because the leaves above block most of the sunlight. Plants here often have extra-large leaves to catch whatever light they can. Jaguars rest on low branches, and snakes and frogs hide among the vines. At the very bottom is the forest floor. It is dark and damp, and only about two percent of the sunlight makes it down here. Fallen leaves rot quickly, while ants, termites, worms, and fungi break them down into nutrients that feed the trees.","Rainforests are important to the whole world. Their plants make oxygen and store huge amounts of carbon, which helps keep Earth's climate steady. Many medicines first came from rainforest plants. Sadly, large areas of rainforest are cut down each year for farms, cattle, and wood. Protecting these forests means protecting millions of creatures, from the tallest trees to the tiniest ants."],"funFact":"A scientist once found more than 40 kinds of ants living on a single rainforest tree in Peru. That is about as many kinds as live in all of Great Britain!","vocab":[{"word":"emergent","meaning":"Rising up above the things around it."},{"word":"canopy","meaning":"The thick roof of leaves and branches high in a forest."},{"word":"understory","meaning":"The shady layer of plants below the forest canopy."},{"word":"nutrients","meaning":"Things in food or soil that help living things grow."},{"word":"climate","meaning":"The usual weather in a place over many years."}],"comprehension":[{"q":"What is the main idea of the article?","options":["Rainforests are always cold and dry","Only birds live in rainforests","Jaguars are the biggest rainforest animals","A rainforest has layers, each with its own conditions and living things"],"answer":3,"explain":"Great job! The article walks through each layer and what lives there."},{"q":"Which layer does the article call the busiest?","options":["The emergent layer","The canopy","The understory","The forest floor"],"answer":1,"explain":"Yes! The article says the canopy is the busiest layer of all."},{"q":"Why do understory plants often have extra-large leaves?","options":["To catch as much of the little sunlight as they can","To scare away jaguars","To hold rainwater for frogs","To stay cool in the wind"],"answer":0,"explain":"Right! The text says they have extra-large leaves to catch whatever light they can."},{"q":"The forest floor is 'dark and damp.' What does 'damp' mean?","options":["Very hot","Very bright","Slightly wet","Very windy"],"answer":2,"explain":"Nice! In a rainy forest with little sun, the ground stays slightly wet, or damp."},{"q":"Why is the forest floor so dark?","options":["It is always night there","Animals cover it with mud","The fungi eat the sunlight","The layers above block almost all the sunlight"],"answer":3,"explain":"Exactly! The article says only about two percent of the sunlight makes it down to the floor."}],"grammar":[{"skill":"Prepositions","q":"Which word is the PREPOSITION in this sentence: 'Jaguars rest on low branches.'","options":["Jaguars","rest","on","low"],"answer":2,"explain":"'On' is a preposition because it shows where the jaguars rest."},{"skill":"Plurals","q":"Which is the correct plural of 'butterfly'?","options":["butterflys","butterflies","butterflyes","butterfly's"],"answer":1,"explain":"Change the 'y' to 'i' and add 'es' to get 'butterflies.'"},{"skill":"Adverbs","q":"Which word is the ADVERB in this sentence: 'Fallen leaves rot quickly.'","options":["Fallen","leaves","rot","quickly"],"answer":3,"explain":"'Quickly' is an adverb because it tells how the leaves rot."},{"skill":"Homophones","q":"Choose the correct word: '____ are four main layers in a rainforest.'","options":["There","Their","They're","Thier"],"answer":0,"explain":"'There' is used to say that something exists, like 'There are four layers.'"}],"spelling":[{"word":"apartment","sentence":"A rainforest is like a giant ____ building.","meaning":"A home inside a bigger building with many homes.","wrong":["apartmint","appartment","apartmant"]},{"word":"different","sentence":"Each layer is home to ____ living things.","meaning":"Not the same.","wrong":["diffrent","diferent","differant"]},{"word":"monkeys","sentence":"The canopy is home to toucans, tree frogs, and many kinds of ____.","meaning":"Furry animals with long tails that climb trees.","wrong":["monkies","monkeyes","munkeys"]},{"word":"medicines","sentence":"Many ____ first came from rainforest plants.","meaning":"Things that help sick people get better.","wrong":["medicins","medisines","medecines"]},{"word":"important","sentence":"Rainforests are ____ to the whole world.","meaning":"Mattering a lot.","wrong":["importent","importint","impotant"]},{"word":"branches","sentence":"The canopy is a thick roof of leaves and ____.","meaning":"The arms of a tree that grow out from the trunk.","wrong":["branchs","branshes","brantches"]}],"written":[{"q":"Describe the four layers of the rainforest from top to bottom.","minWords":15,"keyIdeas":[{"label":"Emergent layer: the tallest trees on top","any":["emergent","tallest","top","giant tree"]},{"label":"Canopy: a thick roof of leaves","any":["canopy","roof","middle","branch","second"]},{"label":"Understory: shady and still","any":["understory","shady","shade","below the canopy","under the canopy"]},{"label":"Forest floor: dark and damp","any":["floor","ground","bottom","dark","damp"]}],"need":3,"sample":"The emergent layer is at the top, where the tallest trees poke out. Below it is the canopy, a thick roof of leaves, and then the shady understory. The forest floor at the bottom is dark and damp."},{"q":"Why do you think most rainforest animals live in the canopy instead of on the forest floor?","minWords":10,"keyIdeas":[{"label":"There is lots of food up there","any":["food","fruit","flower","leaves","eat","plenty"]},{"label":"There is more sunlight","any":["sun","light","bright","warm"]},{"label":"The forest floor is dark","any":["dark","damp","shad","gloomy","wet"]},{"label":"It may be safer up high","any":["safe","hide","predator","jaguar","away"]}],"need":2,"sample":"The canopy has plenty of fruits, flowers, and leaves for animals to eat. It also gets more sunlight, while the forest floor is dark and damp."}],"fixit":[{"wrong":"Jaguars rests on low branchs in the understory","right":"Jaguars rest on low branches in the understory.","errors":[{"bad":"rests","good":"rest","type":"Subject-Verb Agreement"},{"bad":"branchs","good":"branches","type":"Plurals"},{"bad":"understory","good":"understory.","type":"Punctuation"}]},{"wrong":"rainforests get more then 80 inches of rain each year.","right":"Rainforests get more than 80 inches of rain each year.","errors":[{"bad":"rainforests","good":"Rainforests","type":"Capital Letters"},{"bad":"then","good":"than","type":"Homophones"}]}]},{"id":"coral-reefs","title":"Cities Under the Sea: The Wonderful World of Coral Reefs","category":"Plants & Nature","emoji":"🪸","minutes":4,"paragraphs":["Imagine putting on a mask and snorkel and floating above a busy underwater city. Fish in every color of the rainbow dart in and out of strange shapes that look like brains, fans, and antlers. This is a coral reef! Coral reefs cover less than one percent of the ocean floor, but they are home to about a quarter of all ocean species.","Many people think coral is a rock or a plant, but it is actually an animal! A coral is made of many tiny animals called polyps. Each polyp is soft and shaped like a small tube, with a mouth surrounded by tentacles. Polyps are related to jellyfish and sea anemones. Most are smaller than a pencil eraser.","So where does the hard reef come from? Each polyp builds a cup-shaped skeleton around its body out of limestone, which it makes from minerals in seawater. When polyps die, their skeletons stay behind, and new polyps grow on top. Over thousands of years, these layers pile up into enormous reefs. The Great Barrier Reef in Australia is so large that astronauts can see it from space!","Corals have a special partnership with tiny algae that live inside their bodies. The algae use sunlight to make food, and they share much of it with the coral. In return, the coral gives the algae a safe home. The algae also give many corals their beautiful colors. This kind of teamwork, where both partners help each other, is called symbiosis.","A reef is a busy neighborhood. Clownfish hide among the stinging tentacles of sea anemones, which do not sting them. Parrotfish crunch on coral with beak-like teeth and poop out fine white sand. In fact, much of the white sand on some tropical beaches came from parrotfish! Sea turtles, sharks, octopuses, and shrimp all find food and shelter on the reef.","Sadly, coral reefs are in trouble. When ocean water gets too warm, corals become stressed and push the algae out of their bodies. Without their colorful algae, the corals turn white. This is called coral bleaching. Bleached corals are not dead yet, but they are weak and hungry, and they can die if the water stays hot for too long. Pollution and careless fishing also harm reefs. Scientists are working hard to protect reefs and even grow baby corals to plant on damaged reefs."],"funFact":"On just a few nights each year, many corals release their eggs at the same time. The water fills with tiny floating bundles, like an underwater snowstorm!","vocab":[{"word":"polyps","meaning":"Tiny, soft, tube-shaped animals that make up coral."},{"word":"tentacles","meaning":"Long, bendy arms used for grabbing or stinging."},{"word":"enormous","meaning":"Very, very big."},{"word":"symbiosis","meaning":"When two different living things help each other live."},{"word":"bleaching","meaning":"Turning white after losing color."}],"comprehension":[{"q":"What is the article mostly about?","options":["Coral reefs are living, animal-built homes for many sea creatures and need protection","Coral reefs are made of plants that grow in deserts","Parrotfish are the only fish on a reef","Astronauts study coral from space"],"answer":0,"explain":"Great job! The article explains what coral is, who lives on reefs, and the dangers they face."},{"q":"What is a coral made of?","options":["Colorful rocks","Seaweed and sand","Many tiny animals called polyps","Old jellyfish shells"],"answer":2,"explain":"Yes! The article says a coral is made of many tiny animals called polyps."},{"q":"What causes coral bleaching?","options":["Too much sand on the reef","Parrotfish eating the coral","Cold water freezing the polyps","Warm water stresses corals, so they push out their algae"],"answer":3,"explain":"Right! The text says when water gets too warm, corals push the algae out and turn white."},{"q":"In the article, what does 'enormous' mean?","options":["Very tiny","Very, very big","Very colorful","Very old"],"answer":1,"explain":"Nice! The reefs are so big that astronauts can see one from space."},{"q":"Why is the partnership with algae good for the coral?","options":["The algae scare away sharks","The algae make the water colder","The algae share food they make from sunlight","The algae build the coral's skeleton"],"answer":2,"explain":"Exactly! The article says the algae use sunlight to make food and share much of it with the coral."}],"grammar":[{"skill":"Adjectives","q":"Which word is the ADJECTIVE in this sentence: 'Colorful fish dart around the reef.'","options":["Colorful","fish","dart","reef"],"answer":0,"explain":"'Colorful' is an adjective because it describes the fish."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'A coral reef ____ home to many animals.'","options":["are","is","were","be"],"answer":1,"explain":"'A coral reef' is one thing, so it goes with 'is.'"},{"skill":"Conjunctions","q":"Choose the best conjunction: 'Coral looks like a rock, ____ it is actually an animal.'","options":["and","so","or","but"],"answer":3,"explain":"'But' shows a surprise or contrast between two ideas."},{"skill":"Verb Tenses","q":"Which sentence changes 'Parrotfish crunch on coral' to the PAST tense?","options":["Parrotfish will crunch on coral.","Parrotfish are crunching on coral.","Parrotfish crunched on coral.","Parrotfish crunches on coral."],"answer":2,"explain":"Adding '-ed' to 'crunch' makes 'crunched,' which shows the past."}],"spelling":[{"word":"snorkel","sentence":"Imagine putting on a mask and ____ and floating above a reef.","meaning":"A tube that lets you breathe while your face is underwater.","wrong":["snorkle","snorkol","snorkell"]},{"word":"actually","sentence":"Many people think coral is a rock, but it is ____ an animal!","meaning":"Really; in truth.","wrong":["actualy","acshually","acually"]},{"word":"skeleton","sentence":"Each polyp builds a cup-shaped ____ around its body.","meaning":"The hard frame that holds up or protects a body.","wrong":["skeliton","skelton","skeletin"]},{"word":"astronauts","sentence":"The Great Barrier Reef is so large that ____ can see it from space!","meaning":"People who travel into space.","wrong":["astronaughts","astranauts","astronots"]},{"word":"pollution","sentence":"____ and careless fishing also harm reefs.","meaning":"Trash or harmful stuff that makes nature dirty.","wrong":["polution","pollusion","pollushun"]},{"word":"shelter","sentence":"Sea turtles and shrimp find food and ____ on the reef.","meaning":"A safe place that protects you.","wrong":["sheltor","shelder","shellter"]}],"written":[{"q":"Explain what a coral is and how a coral reef is built.","minWords":12,"keyIdeas":[{"label":"Coral is an animal, not a rock or plant","any":["animal","not a rock","not a plant","alive","living","creature"]},{"label":"It is made of tiny polyps","any":["polyp","tiny","small","tentacle"]},{"label":"Polyps build hard limestone skeletons","any":["skeleton","limestone","cup","hard","build"]},{"label":"The skeletons pile up over many years","any":["pile","layer","stack","years","on top","die"]}],"need":2,"sample":"A coral is actually an animal made of many tiny polyps. Each polyp builds a hard limestone skeleton, and over thousands of years the skeletons pile up into a reef."},{"q":"What would happen to a coral reef if the ocean water stayed too warm for a long time? Explain why.","minWords":10,"keyIdeas":[{"label":"The corals push out their algae","any":["alga","push out","kick out","lose"]},{"label":"The corals turn white, which is called bleaching","any":["white","bleach","color","colour"]},{"label":"The corals get weak and hungry and may die","any":["weak","hungry","starv","die","dead","food"]},{"label":"Reef animals would lose their home","any":["home","shelter","fish","creature"]}],"need":2,"sample":"If the water stayed too warm, the corals would push out their algae and turn white. Without the algae's food, the corals would get weak and hungry and could die."}],"fixit":[{"wrong":"Many clownfish hides among the tentacles of sea anemones","right":"Many clownfish hide among the tentacles of sea anemones.","errors":[{"bad":"hides","good":"hide","type":"Subject-Verb Agreement"},{"bad":"anemones","good":"anemones.","type":"Punctuation"}]},{"wrong":"The Great Barrier Reef is in australia, and it is so big that astronots can see it.","right":"The Great Barrier Reef is in Australia, and it is so big that astronauts can see it.","errors":[{"bad":"australia,","good":"Australia,","type":"Capital Letters"},{"bad":"astronots","good":"astronauts","type":"Spelling"}]}]},{"id":"bioluminescence","title":"Nature's Night-Lights: The Glow of Bioluminescence","category":"Plants & Nature","emoji":"✨","minutes":4,"paragraphs":["Imagine walking through a field on a summer night. Suddenly, tiny lights blink on and off all around you, like stars that came down to play. Those twinkling lights are fireflies! When a living thing makes its own light, it is called bioluminescence. 'Bio' means life, and 'luminescence' means giving off light. So bioluminescence means 'living light.'","How do living things glow? It happens through a chemical reaction inside their bodies. A special chemical called luciferin mixes with oxygen, helped along by a helper substance called luciferase. When they combine, they give off light. Unlike a hot light bulb, this light makes almost no heat. That is why it is sometimes called 'cold light.'","Fireflies are actually beetles, not flies. Each kind of firefly has its own flashing pattern, like a secret code. Males flash as they fly, and females answer from the grass. That way, they can find a mate of the right kind. In a few places, such as the Great Smoky Mountains, thousands of fireflies even flash at the same time, making the whole forest pulse with light.","The ocean is where bioluminescence really shines. In the deep sea, sunlight cannot reach, so it is darker than the darkest night. Scientists estimate that about three out of every four animals in the deep open ocean can make light. The anglerfish dangles a glowing lure in front of its huge mouth, like a fishing pole. Small fish swim toward the light, thinking it is food, and then... gulp!","Ocean creatures use light in many clever ways. Some squid glow on their bellies to match the faint light from above, so predators below cannot see their shadow. Certain shrimp spit out a cloud of glowing goo to startle an attacker, then escape. Tiny ocean living things called dinoflagellates light up when the water around them is disturbed. On some beaches at night, every crashing wave glows bright blue! If you splash your hand in the water there, sparkles swirl around your fingers.","Even some mushrooms glow! There are more than 100 known kinds of glowing fungi. Their soft green light is sometimes called 'foxfire.' Scientists think the glow may attract insects that help spread the fungi's spores. Today, researchers study bioluminescence to help in medicine and science. Maybe someday you will discover a new glowing creature of your own!"],"funFact":"Scientists borrowed a glowing protein from a jellyfish to help them light up and study cells. Its discovery won the Nobel Prize in Chemistry in 2008!","vocab":[{"word":"bioluminescence","meaning":"Light made by a living thing."},{"word":"chemical","meaning":"A substance that can mix or change into something new."},{"word":"reaction","meaning":"A change that happens when things mix together."},{"word":"lure","meaning":"Something used to trick an animal into coming closer."},{"word":"startle","meaning":"To suddenly surprise or scare."}],"comprehension":[{"q":"What is the main idea of the article?","options":["Fireflies are the only animals that glow","Many living things make their own light and use it in different ways","The deep sea is full of light bulbs","Mushrooms are a kind of insect"],"answer":1,"explain":"Great job! The article describes glowing fireflies, sea creatures, and fungi and why they glow."},{"q":"Why is bioluminescent light called 'cold light'?","options":["It only happens in winter","It is blue like ice","It comes from the cold deep sea","It makes almost no heat"],"answer":3,"explain":"Yes! The article says this light makes almost no heat, unlike a hot light bulb."},{"q":"Why would a squid want to hide its shadow?","options":["So predators below won't spot it","So it can see the stars","So it can stay warm","So other squid can find it"],"answer":0,"explain":"Right! The text says squid glow so predators below cannot see their shadow."},{"q":"The anglerfish dangles a glowing 'lure.' What is a lure?","options":["A kind of tooth","A deep-sea cave","Something that tricks an animal into coming closer","A type of fin for swimming"],"answer":2,"explain":"Nice! The article says small fish swim toward the light, thinking it is food."},{"q":"What makes dinoflagellates light up?","options":["The moon shining on them","The water around them is disturbed","Eating mushrooms","Warm sunshine"],"answer":1,"explain":"Exactly! The article says they light up when the water around them is disturbed."}],"grammar":[{"skill":"Punctuation","q":"Which sentence is punctuated correctly?","options":["Fireflies are beetles not flies?","fireflies are beetles, not flies","Fireflies, are beetles not, flies.","Fireflies are beetles, not flies."],"answer":3,"explain":"It starts with a capital letter, uses a comma before 'not flies,' and ends with a period."},{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'Bright mushrooms glow softly.'","options":["Bright","mushrooms","glow","softly"],"answer":1,"explain":"'Mushrooms' is a noun because it names a thing."},{"skill":"Homophones","q":"Choose the correct word: 'Fireflies glow, and some fish glow ____.'","options":["to","two","too","tow"],"answer":2,"explain":"'Too' means 'also,' which fits this sentence."},{"skill":"Sentence Types","q":"What kind of sentence is this: 'Every crashing wave glows bright blue!'","options":["Exclamation","Question","Command","Statement"],"answer":0,"explain":"It shows strong feeling and ends with an exclamation point, so it is an exclamation."}],"spelling":[{"word":"fireflies","sentence":"Those twinkling lights are ____!","meaning":"Insects that flash light from their bodies.","wrong":["fireflys","fierflies","fireflyes"]},{"word":"chemical","sentence":"Glowing happens through a ____ reaction inside their bodies.","meaning":"Having to do with substances that mix and change.","wrong":["chemicle","kemical","chemecal"]},{"word":"beetles","sentence":"Fireflies are actually ____, not flies.","meaning":"Insects with hard wing covers.","wrong":["beatles","beetels","bettles"]},{"word":"scientists","sentence":"____ estimate that most animals in the deep open ocean can make light.","meaning":"People who study the world to learn how it works.","wrong":["sientists","scientests","scintists"]},{"word":"mushrooms","sentence":"Even some ____ glow!","meaning":"Fungi with a stem and a cap.","wrong":["mushrums","mushroms","musherooms"]},{"word":"discover","sentence":"Maybe someday you will ____ a new glowing creature of your own!","meaning":"To find something for the first time.","wrong":["discuver","diskover","descover"]}],"written":[{"q":"In your own words, explain what bioluminescence is and how it happens.","minWords":12,"keyIdeas":[{"label":"A living thing makes its own light","any":["living","own light","make light","makes light","glow","alive"]},{"label":"It comes from a chemical reaction","any":["chemical","reaction","mix","luciferin","luciferase","oxygen"]},{"label":"The light makes almost no heat","any":["cold","heat","hot","warm","cool"]}],"need":2,"sample":"Bioluminescence is when a living thing makes its own light. It happens when a chemical called luciferin mixes with oxygen in a reaction. The light is cold, so it makes almost no heat."},{"q":"Why is glowing so useful for animals in the deep sea? Use details from the article.","minWords":10,"keyIdeas":[{"label":"The deep sea is very dark","any":["dark","no sun","no light","sunlight","black"]},{"label":"Light can help catch food","any":["food","prey","catch","lure","eat","hunt","anglerfish"]},{"label":"Light can help hide from predators","any":["hide","shadow","predator","safe","squid"]},{"label":"Light can startle attackers so they can escape","any":["startle","scare","escape","attacker","get away","shrimp","surprise"]}],"need":2,"sample":"The deep sea is darker than the darkest night, so light really stands out. An anglerfish uses a glowing lure to catch food, and some shrimp spit glowing goo to startle an attacker and escape."}],"fixit":[{"wrong":"Fireflys is actually beetles, not flies","right":"Fireflies are actually beetles, not flies.","errors":[{"bad":"Fireflys","good":"Fireflies","type":"Plurals"},{"bad":"is","good":"are","type":"Subject-Verb Agreement"},{"bad":"flies","good":"flies.","type":"Punctuation"}]},{"wrong":"Last summer we sees fireflies in the great Smoky Mountains.","right":"Last summer, we saw fireflies in the Great Smoky Mountains.","errors":[{"bad":"summer","good":"summer,","type":"Punctuation"},{"bad":"sees","good":"saw","type":"Verb Tense"},{"bad":"great","good":"Great","type":"Capital Letters"}]}]},{"id":"heart","title":"The Amazing Pump Inside You","category":"Human Body","emoji":"❤️","minutes":4,"paragraphs":["Put your hand on the left side of your chest, just a little toward the middle. Can you feel a steady thump, thump, thump? That is your heart, and it has been working since before you were born. Your heart is a muscle about the size of your fist. It never takes a vacation, and it never stops to rest. Every single day, it beats about 100,000 times!","So what is all that beating for? Your heart is a pump. Its job is to push blood through your whole body. Blood carries oxygen, the part of the air your body needs to live. It also carries food energy from the meals you eat. Every part of you, from your toes to your brain, depends on that delivery.","Blood travels through tubes called blood vessels. Arteries carry blood away from the heart. Veins bring blood back to the heart. The tiniest tubes are called capillaries, and they are thinner than a hair. If you could line up all the blood vessels in a grown-up's body, they would stretch around the Earth more than twice! Imagine a giant road map with highways, streets, and tiny alleys reaching every single house.","Your heart has four rooms inside, called chambers. The two top chambers collect blood, and the two bottom chambers squeeze it out. The right side sends blood to your lungs to pick up fresh oxygen. Then the blood returns to the left side, which pumps it out to the rest of your body. Little doors called valves open and close to keep blood moving in the right direction. The 'lub-dub' sound a doctor hears is those valves snapping shut.","Have you noticed that your heart beats faster when you run or jump? That is because your muscles are working hard and need more oxygen. Your heart speeds up to deliver it quickly. When you rest, it slows down again. A resting heart in a kid your age usually beats about 70 to 100 times a minute. Try counting your own heartbeats for one minute after sitting quietly, and then again after doing jumping jacks.","You can help your heart stay strong. Playing outside, riding a bike, and dancing are all great exercise for your heart muscle. Eating fruits and vegetables and drinking water help too. Getting plenty of sleep gives your heart a chance to slow down and relax. So the next time you feel that thump, thump, thump, say thank you to one of the hardest-working muscles you have!"],"funFact":"Your heart makes its own electricity! A tiny group of cells in your heart sends out electrical signals that tell it exactly when to beat.","vocab":[{"word":"oxygen","meaning":"The part of the air that your body needs to live."},{"word":"arteries","meaning":"Blood vessels that carry blood away from the heart."},{"word":"capillaries","meaning":"The tiniest blood vessels, thinner than a hair."},{"word":"chambers","meaning":"The four rooms inside your heart."},{"word":"valves","meaning":"Little doors that keep blood flowing the right way."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Your heart is a hard-working pump that moves blood through your body.","Blood vessels are thinner than a hair.","Doctors listen to hearts with special tools.","Running is the only way to exercise."],"answer":0,"explain":"Great job! The whole article explains how your heart pumps blood and how to keep it strong."},{"q":"What do arteries do?","options":["Bring blood back to the heart","Carry blood away from the heart","Open and close like little doors","Collect air in the lungs"],"answer":1,"explain":"You got it! The article says, 'Arteries carry blood away from the heart.'"},{"q":"Based on the article, what would most likely happen to your heartbeat while you sit quietly reading a book?","options":["It would speed up a lot","It would stop completely","It would slow down","It would make no sound at all"],"answer":2,"explain":"Nice thinking! The article says that when you rest, your heart slows down again."},{"q":"In the article, what are 'valves'?","options":["Tiny tubes thinner than a hair","The four rooms of the heart","The part of the air your body needs","Little doors that keep blood moving the right way"],"answer":3,"explain":"Well done! The article calls valves 'little doors' that open and close to keep blood moving in the right direction."},{"q":"Why does the right side of the heart send blood to the lungs?","options":["To pick up fresh oxygen","To make the blood warmer","To turn the blood into food","To make the lub-dub sound"],"answer":0,"explain":"Exactly! The article says the right side sends blood to your lungs 'to pick up fresh oxygen.'"}],"grammar":[{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'Your heart pumps blood.'","options":["Your","heart","pumps","blood"],"answer":2,"explain":"Yes! 'Pumps' is the action word that tells what the heart does."},{"skill":"Plurals","q":"What is the correct plural of 'artery'?","options":["arterys","arteries","arteryes","arteris"],"answer":1,"explain":"Correct! When a word ends in a consonant plus 'y,' change the 'y' to 'i' and add 'es.'"},{"skill":"Adjectives","q":"Which word is an ADJECTIVE in this sentence: 'The tiniest tubes are called capillaries.'","options":["tiniest","tubes","called","are"],"answer":0,"explain":"Super! 'Tiniest' describes the tubes, so it is an adjective."},{"skill":"Homophones","q":"Which word correctly completes the sentence: 'The heart has four chambers, and ____ all important.'","options":["their","there","there's","they're"],"answer":3,"explain":"Right! 'They're' is short for 'they are,' which fits the sentence."}],"spelling":[{"word":"oxygen","sentence":"Blood carries ____, the part of the air your body needs to live.","meaning":"The part of the air your body needs to live.","wrong":["oxigen","oxygin","oxegen"]},{"word":"arteries","sentence":"____ carry blood away from the heart.","meaning":"Blood vessels that carry blood away from the heart.","wrong":["arterys","artaries","artiries"]},{"word":"capillaries","sentence":"The tiniest tubes are called ____, and they are thinner than a hair.","meaning":"The tiniest blood vessels in your body.","wrong":["capilaries","capillarys","cappillaries"]},{"word":"chambers","sentence":"Your heart has four rooms inside, called ____.","meaning":"Rooms or spaces inside the heart.","wrong":["chambors","chambres","shambers"]},{"word":"muscle","sentence":"Your heart is a ____ about the size of your fist.","meaning":"A body part that tightens and relaxes to make things move.","wrong":["mussle","muscel","musle"]},{"word":"vessels","sentence":"Blood travels through tubes called blood ____.","meaning":"Tubes that carry blood around your body.","wrong":["vesels","vessles","vessals"]}],"written":[{"q":"In your own words, explain what your heart does for your body.","minWords":10,"keyIdeas":[{"label":"The heart is a pump","any":["pump","push","squeez","beat"]},{"label":"It moves blood through the body","any":["blood","vessel","arter","vein"]},{"label":"Blood carries oxygen and food energy","any":["oxygen","air","energy","food","nutrient"]},{"label":"It reaches every part of you","any":["whole body","every part","all over","everywhere","toes","brain"]}],"need":2,"sample":"My heart is a muscle that works like a pump. It pushes blood all over my body. The blood carries oxygen and food energy to every part of me."},{"q":"Why does your heart beat faster when you run? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Your muscles are working hard","any":["muscle","working hard","work hard","exercis","running","tired"]},{"label":"They need more oxygen","any":["oxygen","more air","air","breath"]},{"label":"The heart speeds up to deliver it quickly","any":["deliver","faster","quick","speed","pump more","send"]}],"need":2,"sample":"When I run, my muscles are working hard and need more oxygen. My heart beats faster so it can deliver oxygen to them quickly."}],"fixit":[{"wrong":"your heart pump blood all day","right":"Your heart pumps blood all day.","errors":[{"bad":"your","good":"Your","type":"Capital Letters"},{"bad":"pump","good":"pumps","type":"Subject-Verb Agreement"},{"bad":"day","good":"day.","type":"Punctuation"}]},{"wrong":"Arteries carrys blood away from the heart, and viens bring it back.","right":"Arteries carry blood away from the heart, and veins bring it back.","errors":[{"bad":"carrys","good":"carry","type":"Subject-Verb Agreement"},{"bad":"viens","good":"veins","type":"Spelling"}]}]},{"id":"brain","title":"Meet Your Brain, the Boss of You","category":"Human Body","emoji":"🧠","minutes":4,"paragraphs":["Imagine a computer that can laugh at jokes, remember your best friend's birthday, and help you ride a bike, all at the same time. You don't have to imagine it, because you already have one! It is your brain, and it sits safely inside your skull. A grown-up's brain weighs about three pounds, which is about as heavy as a cantaloupe. It is soft and wrinkly, a bit like a big walnut.","Your brain is made of billions of tiny cells called neurons. Scientists think there are about 86 billion of them! Neurons send messages to each other using tiny bursts of electricity and chemicals. These messages zip along very fast, some even faster than a race car. Long bundles called nerves carry messages between your brain and the rest of your body.","Different parts of the brain have different jobs. The biggest part is the cerebrum. It helps you think, learn, read, and imagine. It also makes sense of what you see, hear, and feel. At the back, tucked below the cerebrum, is the cerebellum. It helps you balance and move smoothly, like when you do a cartwheel. The brain stem connects your brain to your spinal cord. It controls things you never have to think about, like breathing and your heartbeat.","Your cerebrum has two halves, a left side and a right side. Here is a surprising twist: the left side of your brain controls the right side of your body, and the right side controls the left! When you wave your right hand, the left half of your brain is giving the order. Both halves work together as a team and share information all day long.","Every time you learn something new, your brain changes. Neurons build new connections, like making new paths through a forest. The more you practice, the stronger those paths become. That's why things like multiplication facts or piano songs get easier over time. Making mistakes is part of learning too, because your brain figures out what to fix and tries again.","You can take good care of your brain. Wear a helmet when you ride a bike or skate to protect it. Get plenty of sleep, because your brain sorts and saves memories while you rest. Eat healthy foods, drink water, and keep your mind busy with books, puzzles, and games. Your brain is truly one of a kind, and it is the reason you are you!"],"funFact":"Your brain uses about one-fifth of your body's energy, even though it makes up only about two percent of your body's weight.","vocab":[{"word":"skull","meaning":"The hard bone that surrounds and protects your brain."},{"word":"neurons","meaning":"Tiny cells in your brain that send messages."},{"word":"nerves","meaning":"Long bundles that carry messages between your brain and body."},{"word":"cerebellum","meaning":"The back part of the brain that helps you balance."},{"word":"connections","meaning":"Links that join things together."}],"comprehension":[{"q":"What is this article mostly about?","options":["How to ride a bike safely","How your brain works and how to care for it","Why computers are smarter than people","How to build a path through a forest"],"answer":1,"explain":"Great work! The article explains the parts and jobs of your brain and ways to keep it healthy."},{"q":"Which part of the brain helps you balance and move smoothly?","options":["The cerebrum","The brain stem","The cerebellum","The skull"],"answer":2,"explain":"You found it! The article says the cerebellum 'helps you balance and move smoothly.'"},{"q":"If someone kicks a ball with their left foot, which half of the brain is giving the order?","options":["The left half","The skull","The spinal cord","The right half"],"answer":3,"explain":"Smart thinking! The article says the right side of your brain controls the left side of your body."},{"q":"The article says neurons build new 'connections.' What does connections mean here?","options":["Links that join things together","Walls that block messages","Bones that protect the brain","Foods that give energy"],"answer":0,"explain":"Nice! The article compares connections to new paths that link places in a forest."},{"q":"According to the article, why do things get easier when you practice?","options":["Your skull grows bigger","The paths between neurons get stronger","Your brain stops making mistakes","You need less sleep"],"answer":1,"explain":"Exactly! The article says, 'The more you practice, the stronger those paths become.'"}],"grammar":[{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'Your brain sits safely inside your skull.'","options":["sits","safely","inside","skull"],"answer":3,"explain":"Yes! 'Skull' names a thing, so it is a noun."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'Neurons ____ messages to each other.'","options":["send","sends","sending","is send"],"answer":0,"explain":"Correct! 'Neurons' is plural, so it goes with the verb 'send.'"},{"skill":"Adverbs","q":"Which word is an ADVERB in this sentence: 'The cerebellum helps you move smoothly.'","options":["helps","move","smoothly","cerebellum"],"answer":2,"explain":"Great! 'Smoothly' tells how you move, so it is an adverb."},{"skill":"Capital Letters","q":"Which sentence uses capital letters correctly?","options":["my brain controls my body.","My brain controls my body.","My Brain controls my body.","my Brain Controls my body."],"answer":1,"explain":"Well done! Only the first word of the sentence needs a capital letter here."}],"spelling":[{"word":"neurons","sentence":"Your brain is made of billions of tiny cells called ____.","meaning":"Brain cells that send messages.","wrong":["nerons","neurans","nuerons"]},{"word":"cerebrum","sentence":"The biggest part of the brain is the ____.","meaning":"The largest part of the brain, used for thinking.","wrong":["serebrum","cerebrem","cerabrum"]},{"word":"balance","sentence":"The cerebellum helps you ____ and move smoothly.","meaning":"To stay steady without falling.","wrong":["balence","ballance","balanse"]},{"word":"electricity","sentence":"Neurons send messages using tiny bursts of ____ and chemicals.","meaning":"A kind of energy that can travel and send signals.","wrong":["electrisity","electricty","elecktricity"]},{"word":"memories","sentence":"Your brain sorts and saves ____ while you rest.","meaning":"Things you remember.","wrong":["memorys","memmories","memoryes"]},{"word":"practice","sentence":"The more you ____, the stronger those paths become.","meaning":"To do something again and again to get better.","wrong":["practis","pracktice","practiss"]}],"written":[{"q":"Describe two jobs that different parts of your brain do.","minWords":10,"keyIdeas":[{"label":"The cerebrum helps you think and learn","any":["cerebrum","think","learn","read","imagin","remember"]},{"label":"The cerebellum helps you balance and move","any":["cerebellum","balanc","move","cartwheel","smooth"]},{"label":"The brain stem controls breathing and heartbeat","any":["brain stem","breath","heartbeat","heart beat","spinal"]}],"need":2,"sample":"The cerebrum helps me think, learn, and imagine. The cerebellum helps me balance and move smoothly when I do a cartwheel."},{"q":"What happens in your brain when you practice something over and over? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Neurons build new connections","any":["neuron","connect","link","brain cell"]},{"label":"The paths get stronger","any":["stronger","strong","path","grow"]},{"label":"Things get easier over time","any":["easier","easy","better","improv","learn"]}],"need":2,"sample":"When I practice, my neurons build new connections like paths in a forest. The more I practice, the stronger the paths get, so the skill becomes easier."}],"fixit":[{"wrong":"the brain sends messages very fast","right":"The brain sends messages very fast.","errors":[{"bad":"the","good":"The","type":"Capital Letters"},{"bad":"fast","good":"fast.","type":"Punctuation"}]},{"wrong":"Your nurons builds new connections when you learn.","right":"Your neurons build new connections when you learn.","errors":[{"bad":"nurons","good":"neurons","type":"Spelling"},{"bad":"builds","good":"build","type":"Subject-Verb Agreement"}]}]},{"id":"bones","title":"The Super Skeleton Inside You","category":"Human Body","emoji":"🦴","minutes":4,"paragraphs":["Imagine trying to stand up if your body were as floppy as a jellyfish. You would flop right onto the floor! Luckily, you have a skeleton. Your skeleton is the frame of bones that holds you up, gives you your shape, and helps you move. A grown-up has 206 bones. But here is a surprise: a baby is born with about 300 bones and bone parts!","How can a baby have more bones than an adult? As babies grow, some of their bones slowly join together, or fuse. For example, a baby's skull starts out as several pieces with soft spots between them. Over time, the pieces grow together into a strong helmet that protects the brain. By the time a person is grown up, many small bones have joined to make bigger ones.","Bones are not dry and dead like the ones you might see in a museum. The bones inside you are alive! They have blood vessels, nerves, and living cells. The outside of a bone is hard and strong. Inside many bones is a soft, spongy material called marrow. Marrow is like a busy factory that makes millions of new blood cells every day.","Bones have important jobs. They protect the soft parts of your body. Your ribs form a cage around your heart and lungs, and your skull protects your brain. Bones also store minerals, like calcium, that keep them hard. Your bones work with your muscles to help you move. Muscles are attached to bones, and when muscles pull, the bones move.","The places where two bones meet are called joints. Some joints work like the hinge on a door, letting your knees and elbows bend back and forth. Others, like your shoulders and hips, are ball-and-socket joints. They let you swing your arms and legs in big circles. Without joints, you would move stiffly, like a robot that needs oil!","If a bone breaks, it can actually heal itself. A doctor may put on a cast to keep the bone still while new bone grows to fill the crack. You can help keep your bones strong right now. Foods like milk, yogurt, cheese, and leafy greens have calcium. Running, jumping, and dancing make bones stronger too. Your skeleton keeps growing until you are about 20 years old, so treat it well!"],"funFact":"The smallest bone in your body is deep inside your ear. It is called the stirrup, and it is only about as big as a grain of rice.","vocab":[{"word":"skeleton","meaning":"The frame of bones that holds up your body."},{"word":"fuse","meaning":"To join together into one piece."},{"word":"marrow","meaning":"Soft, spongy material inside bones that makes blood cells."},{"word":"calcium","meaning":"A mineral that keeps bones and teeth hard."},{"word":"joints","meaning":"Places where two bones meet so you can bend."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Babies have soft spots on their heads","Robots move stiffly without oil","Your bones are alive and do many important jobs","Milk is the only healthy drink"],"answer":2,"explain":"Great job! The article explains that bones are alive and protect, store minerals, and help you move."},{"q":"What does bone marrow make?","options":["New blood cells","Calcium for milk","Muscles","Joints"],"answer":0,"explain":"You got it! The article says marrow 'makes millions of new blood cells every day.'"},{"q":"Why do you think a cast helps a broken bone heal?","options":["It adds calcium to the bone","It makes the bone longer","It turns the bone into marrow","It keeps the bone still while new bone grows"],"answer":3,"explain":"Nice thinking! The article says a cast keeps the bone still while new bone fills the crack."},{"q":"In the article, what does the word 'fuse' mean?","options":["Break apart","Join together","Bend back and forth","Grow softer"],"answer":1,"explain":"Well done! The article says bones 'slowly join together, or fuse.'"},{"q":"What happens when a muscle pulls on a bone?","options":["The bone breaks","The bone makes marrow","The bone moves","The bone turns into a joint"],"answer":2,"explain":"Exactly! The article says, 'when muscles pull, the bones move.'"}],"grammar":[{"skill":"Conjunctions","q":"Which word is the CONJUNCTION in this sentence: 'The outside of a bone is hard, but the inside is soft.'","options":["outside","hard","but","soft"],"answer":2,"explain":"Yes! 'But' joins two ideas that are different, so it is a conjunction."},{"skill":"Punctuation","q":"Which sentence ends with the correct punctuation?","options":["How many bones do you have?","How many bones do you have.","How many bones do you have!","How many bones do you have,"],"answer":0,"explain":"Correct! A sentence that asks something ends with a question mark."},{"skill":"Prepositions","q":"Which word is a PREPOSITION in this sentence: 'Your ribs form a cage around your heart.'","options":["ribs","around","form","cage"],"answer":1,"explain":"Super! 'Around' shows where the cage is, so it is a preposition."},{"skill":"Verb Tenses","q":"Which sentence is written in the PAST tense?","options":["The bone heals quickly.","The bone will heal quickly.","The bone is healing quickly.","The bone healed quickly."],"answer":3,"explain":"Right! 'Healed' tells about something that already happened."}],"spelling":[{"word":"skeleton","sentence":"Your ____ is the frame of bones that holds you up.","meaning":"All the bones of your body together.","wrong":["skeliton","skelaton","skelton"]},{"word":"marrow","sentence":"Inside many bones is a soft, spongy material called ____.","meaning":"Soft material inside bones that makes blood cells.","wrong":["marow","marro","marrough"]},{"word":"calcium","sentence":"Foods like milk, yogurt, and cheese have ____.","meaning":"A mineral that makes bones strong.","wrong":["calsium","calcuim","calcim"]},{"word":"minerals","sentence":"Bones also store ____, like calcium, that keep them hard.","meaning":"Natural materials your body needs, like calcium.","wrong":["minerels","minrals","minerols"]},{"word":"attached","sentence":"Muscles are ____ to bones.","meaning":"Joined or fastened to something.","wrong":["atached","attatched","attacht"]},{"word":"joints","sentence":"The places where two bones meet are called ____.","meaning":"Places where bones meet and bend.","wrong":["joynts","jionts","jointes"]}],"written":[{"q":"Explain two important jobs that your bones do.","minWords":10,"keyIdeas":[{"label":"Bones hold you up and give you shape","any":["hold","shape","frame","support","stand"]},{"label":"Bones protect soft body parts","any":["protect","guard","rib","skull","cage","safe"]},{"label":"Bones help you move with muscles","any":["move","muscle","joint","bend","walk"]},{"label":"Bones make blood cells and store minerals","any":["marrow","blood cell","calcium","mineral","store"]}],"need":2,"sample":"Bones protect soft parts of my body, like my ribs guarding my heart and lungs. They also work with my muscles to help me move."},{"q":"Why does a baby have more bones than a grown-up? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Some bones join together as you grow","any":["join","fuse","grow together","combine","connect","stick together"]},{"label":"This happens as babies grow up","any":["grow","older","time","age"]},{"label":"Small bones become bigger ones, like the skull","any":["skull","bigger","fewer","pieces","soft spot"]}],"need":2,"sample":"A baby has more bones because some of them fuse together as the baby grows. For example, the pieces of the skull join to make one strong helmet."}],"fixit":[{"wrong":"A grown-up has 206 bone, and a baby has about 300","right":"A grown-up has 206 bones, and a baby has about 300.","errors":[{"bad":"bone,","good":"bones,","type":"Plurals"},{"bad":"300","good":"300.","type":"Punctuation"}]},{"wrong":"Yesterday my brother breaks his arm and gets a cast.","right":"Yesterday my brother broke his arm and got a cast.","errors":[{"bad":"breaks","good":"broke","type":"Verb Tense"},{"bad":"gets","good":"got","type":"Verb Tense"}]}]},{"id":"teeth","title":"Your Terrific Teeth","category":"Human Body","emoji":"🦷","minutes":4,"paragraphs":["Smile! Every time you bite into a crunchy apple or chew a slice of pizza, your teeth are hard at work. Teeth help you eat, help you speak clearly, and give you a bright smile. Most people get two sets of teeth in their lifetime. Your first set, called baby teeth, has 20 teeth. Your grown-up set, called permanent teeth, usually has 32.","Around age six, your baby teeth start to get wiggly and fall out. Don't worry, this is supposed to happen! Grown-up teeth are growing in the gums underneath, pushing the baby teeth out of the way. By about age 12 or 13, most kids have lost all of their baby teeth. Your permanent teeth have to last the rest of your life, so they need extra care.","Different teeth have different shapes and different jobs. The flat, sharp teeth in the front are called incisors. They work like scissors to bite off pieces of food. Next to them are the pointy canines, which help grip and tear food. In the back are the wide molars. Molars have bumpy tops that grind and mash food, a bit like crushing crackers with the back of a spoon.","The outside of each tooth is covered with enamel. Enamel is the hardest material in your whole body, even harder than bone! It protects the softer parts inside the tooth. In the very middle is the pulp, which has nerves and blood vessels. That is why a tooth can feel it when you sip something very cold.","Even though enamel is tough, it can be damaged. Tiny germs called bacteria live in your mouth. When you eat sugary foods, the bacteria eat the sugar too. Then they make acid that can wear away enamel and create holes called cavities. A sticky film of bacteria called plaque builds up on teeth if you don't clean them well.","The good news is that keeping your teeth healthy is simple. Brush for two minutes, two times a day, with toothpaste that has fluoride. Fluoride helps make enamel stronger. Floss once a day to clean between your teeth, where a toothbrush can't reach. Choose water and healthy snacks instead of lots of sweets. And visit the dentist for regular checkups. With a little care, your smile can shine for a lifetime!"],"funFact":"Long ago, people cleaned their teeth with chewing sticks, which are small twigs with frayed ends. Some people around the world still use them today!","vocab":[{"word":"permanent","meaning":"Meant to last for a very long time."},{"word":"incisors","meaning":"Flat, sharp front teeth that bite off food."},{"word":"enamel","meaning":"The super hard outer covering of a tooth."},{"word":"cavities","meaning":"Holes in teeth caused by acid from bacteria."},{"word":"fluoride","meaning":"A mineral in toothpaste that makes enamel stronger."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Baby teeth fall out at age six","Pizza is a crunchy food","Dentists use special tools","Teeth do important jobs, and we can keep them healthy"],"answer":3,"explain":"Great work! The article explains what teeth do and how to take care of them."},{"q":"Which teeth grind and mash food?","options":["Incisors","Molars","Canines","Baby teeth"],"answer":1,"explain":"You got it! The article says molars 'grind and mash food.'"},{"q":"Why do you think a dentist might tell you to drink water instead of soda?","options":["Soda has sugar that bacteria use to make acid","Water makes teeth fall out","Soda makes enamel harder","Water has plaque in it"],"answer":0,"explain":"Smart thinking! The article explains that bacteria eat sugar and then make acid that harms enamel."},{"q":"What does 'permanent' mean in the phrase 'permanent teeth'?","options":["Very small","Quick to fall out","Meant to last a long time","Pointy and sharp"],"answer":2,"explain":"Nice! The article says permanent teeth 'have to last the rest of your life.'"},{"q":"What happens right after bacteria eat sugar?","options":["The tooth grows bigger","A baby tooth falls out","Fluoride is made","They make acid that can wear away enamel"],"answer":3,"explain":"Exactly! The article says, 'Then they make acid that can wear away enamel.'"}],"grammar":[{"skill":"Homophones","q":"Choose the word that correctly completes the sentence: 'Brush your teeth ____ times a day.'","options":["to","too","two","tow"],"answer":2,"explain":"Yes! 'Two' is the number word, which is what this sentence needs."},{"skill":"Plurals","q":"What is the plural of 'tooth'?","options":["tooths","teeth","toothes","teeths"],"answer":1,"explain":"Correct! 'Tooth' has a special plural form: 'teeth.'"},{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["Incisors, canines, and molars are types of teeth.","Incisors canines, and molars are types of teeth.","Incisors, canines and, molars are types of teeth.","Incisors canines and molars, are types of teeth."],"answer":0,"explain":"Great! Commas separate each item in a list of three or more."},{"skill":"Sentence Types","q":"What type of sentence is this: 'Brush your teeth for two minutes.'","options":["Question","Statement","Exclamation","Command"],"answer":3,"explain":"Right! This sentence tells someone to do something, so it is a command."}],"spelling":[{"word":"enamel","sentence":"The outside of each tooth is covered with ____.","meaning":"The hard outer layer of a tooth.","wrong":["enamal","enammel","ennamel"]},{"word":"molars","sentence":"In the back are the wide ____.","meaning":"Wide back teeth that grind food.","wrong":["molers","mollars","molors"]},{"word":"bacteria","sentence":"Tiny germs called ____ live in your mouth.","meaning":"Tiny living things too small to see.","wrong":["bactiria","backteria","bacterea"]},{"word":"cavities","sentence":"Acid can wear away enamel and create holes called ____.","meaning":"Holes in teeth.","wrong":["cavitys","cavaties","cavites"]},{"word":"fluoride","sentence":"Brush with toothpaste that has ____.","meaning":"A mineral that helps protect teeth.","wrong":["flouride","fluorid","floride"]},{"word":"permanent","sentence":"Your grown-up set of teeth is called ____ teeth.","meaning":"Lasting for a very long time.","wrong":["permanant","permenent","purmanent"]}],"written":[{"q":"In your own words, explain how cavities form.","minWords":10,"keyIdeas":[{"label":"Bacteria live in your mouth","any":["bacteria","germ","bug","microb"]},{"label":"Bacteria eat sugar","any":["sugar","sweet","candy","soda","eat"]},{"label":"They make acid","any":["acid","make acid","turn sugar","sour"]},{"label":"The acid wears away enamel and makes holes","any":["enamel","hole","wear","damag","hurt","cavit"]}],"need":2,"sample":"Bacteria in my mouth eat the sugar from sweet foods. Then they make acid that wears away my enamel and makes holes called cavities."},{"q":"What would happen if you stopped brushing and flossing your teeth? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Plaque would build up","any":["plaque","build","sticky","film","dirty"]},{"label":"Bacteria would make acid","any":["bacteria","germ","acid","sugar"]},{"label":"You could get cavities","any":["cavit","hole","enamel","damag","rot","hurt"]}],"need":2,"sample":"If I stopped brushing and flossing, sticky plaque would build up on my teeth. The bacteria would make acid, and I could get cavities."}],"fixit":[{"wrong":"brush your teeth too times a day","right":"Brush your teeth two times a day.","errors":[{"bad":"brush","good":"Brush","type":"Capital Letters"},{"bad":"too","good":"two","type":"Homophones"},{"bad":"day","good":"day.","type":"Punctuation"}]},{"wrong":"Molars has bumpy tops that grind food, and incisers bite it off.","right":"Molars have bumpy tops that grind food, and incisors bite it off.","errors":[{"bad":"has","good":"have","type":"Subject-Verb Agreement"},{"bad":"incisers","good":"incisors","type":"Spelling"}]}]},{"id":"sleep","title":"Sweet Dreams: Why We Sleep","category":"Human Body","emoji":"😴","minutes":4,"paragraphs":["Every night, you climb into bed, close your eyes, and drift away. It might seem like nothing is happening while you sleep. But your body and brain are actually very busy! Kids your age need about 9 to 12 hours of sleep each night. That means you spend a big part of your life asleep, and there are good reasons why. Sleep is not wasted time at all. It is one of the most important things you do all day!","Sleep is like a nightly repair shop for your body. While you rest, your body fixes tired muscles and builds new cells. Kids even make extra growth hormone during deep sleep. A hormone is a chemical messenger that tells your body what to do. So in a way, you really do grow while you sleep!","Your brain is hard at work too. During the day, you take in tons of information, from spelling words to the names of new friends. At night, your brain sorts through it all, a bit like a librarian putting books on the right shelves. It saves important memories and clears away what it doesn't need. That's why a good night's sleep can help you do better on a test.","Sleep happens in stages that repeat in cycles through the night. In light sleep, you can wake up easily. In deep sleep, your breathing slows down, and it is hard to wake you. Then comes REM sleep. REM stands for 'rapid eye movement,' because your eyes dart back and forth under your eyelids. Most of your dreams happen during REM sleep.","Why do we dream? Scientists are still exploring that mystery. Many think dreams help the brain practice handling feelings and connect new memories with old ones. Dreams can be silly, strange, or exciting. You might dream that you can fly or that your dog can talk! Almost everyone dreams every night, even if they don't remember it in the morning.","When you don't get enough sleep, you might feel cranky, have trouble paying attention, or get sick more easily. To sleep well, try going to bed at the same time each night. Turn off screens about an hour before bedtime, because their bright light can trick your brain into thinking it's still daytime. A dark, quiet, cool room helps too. Then you can wake up refreshed and ready for a new adventure!"],"funFact":"Giraffes sleep only about four or five hours a day, often in short naps. But some brown bats sleep around 20 hours a day!","vocab":[{"word":"hormone","meaning":"A chemical messenger that tells your body what to do."},{"word":"memories","meaning":"Things your brain remembers."},{"word":"stages","meaning":"Steps or parts that happen in order."},{"word":"cycles","meaning":"Patterns that happen again and again."},{"word":"refreshed","meaning":"Feeling rested and full of energy again."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Sleep helps your body and brain in many important ways","Bats sleep more than people","Screens are fun to use at night","Dreams are always silly"],"answer":0,"explain":"Great job! The article explains how sleep repairs your body, sorts memories, and keeps you healthy."},{"q":"During which kind of sleep do most dreams happen?","options":["Light sleep","Deep sleep","REM sleep","Daytime naps"],"answer":2,"explain":"You got it! The article says, 'Most of your dreams happen during REM sleep.'"},{"q":"Maya stayed up very late playing a game. How will she most likely feel the next day?","options":["Extra energetic and calm","Cranky and having trouble focusing","Taller than before","Ready to sleep for 20 hours"],"answer":1,"explain":"Smart thinking! The article says not enough sleep can make you cranky and have trouble paying attention."},{"q":"According to the article, what is a 'hormone'?","options":["A type of dream","A stage of sleep","A muscle that gets tired","A chemical messenger that tells your body what to do"],"answer":3,"explain":"Nice! The article explains that a hormone is a chemical messenger."},{"q":"Why should you turn off screens before bedtime?","options":["Screens make your eyes dart back and forth","Screens help you grow taller","Their bright light can trick your brain into thinking it's daytime","They make the room too cool"],"answer":2,"explain":"Exactly! The article says screen light can trick your brain into thinking it's still daytime."}],"grammar":[{"skill":"Verb Tenses","q":"Which verb is in the FUTURE tense?","options":["will sleep","slept","sleeps","is sleeping"],"answer":0,"explain":"Yes! 'Will sleep' tells about something that is going to happen."},{"skill":"Adjectives","q":"Which word is an ADJECTIVE in this sentence: 'A dark room helps you sleep.'","options":["room","helps","dark","sleep"],"answer":2,"explain":"Correct! 'Dark' describes the room, so it is an adjective."},{"skill":"Homophones","q":"Choose the correct word: 'The twins need to brush ____ teeth before bed.'","options":["there","their","they're","theyre"],"answer":1,"explain":"Great! 'Their' shows that the teeth belong to the twins."},{"skill":"Punctuation","q":"Which is the correct contraction for 'do not'?","options":["dont","do'nt","dont'","don't"],"answer":3,"explain":"Right! The apostrophe goes where the letter 'o' in 'not' was left out."}],"spelling":[{"word":"hormone","sentence":"Kids make extra growth ____ during deep sleep.","meaning":"A chemical messenger in your body.","wrong":["hormoan","hormon","hormown"]},{"word":"muscles","sentence":"While you rest, your body fixes tired ____.","meaning":"Body parts that help you move.","wrong":["mussles","muscels","musles"]},{"word":"librarian","sentence":"Your brain sorts information like a ____ putting books on shelves.","meaning":"A person whose job is to help people find and borrow books.","wrong":["librairian","liberian","librarien"]},{"word":"mystery","sentence":"Scientists are still exploring that ____.","meaning":"Something that is not yet understood.","wrong":["mistery","mystary","mysterie"]},{"word":"attention","sentence":"Without enough sleep, you might have trouble paying ____.","meaning":"Focusing your mind on something.","wrong":["atention","attension","attenshun"]},{"word":"refreshed","sentence":"Then you can wake up ____ and ready for a new adventure!","meaning":"Rested and full of energy.","wrong":["refresht","refreshd","refrished"]}],"written":[{"q":"Explain two ways that sleep helps your body or your brain.","minWords":10,"keyIdeas":[{"label":"Sleep repairs and grows your body","any":["repair","fix","grow","hormone","muscle","cell"]},{"label":"Your brain sorts and saves memories","any":["memor","remember","sort","save","learn","test"]},{"label":"Sleep helps you feel good and stay healthy","any":["energy","refresh","rest","health","sick","attention","focus"]}],"need":2,"sample":"While I sleep, my body fixes tired muscles and makes growth hormone. My brain also sorts my memories and saves the important ones."},{"q":"Why might a kid who stays up too late have a hard time at school the next day? Use details from the article.","minWords":10,"keyIdeas":[{"label":"They might feel cranky or tired","any":["cranky","grump","tired","sleepy","mood","upset"]},{"label":"They have trouble paying attention","any":["attention","focus","concentrat","listen","think"]},{"label":"Their brain did not get to sort memories","any":["memor","remember","sort","learn","test"]},{"label":"They might get sick more easily","any":["sick","ill","germ","cold"]}],"need":2,"sample":"A kid who stays up too late might feel cranky the next day. They could have trouble paying attention, and their brain did not have time to save memories."}],"fixit":[{"wrong":"Last night I dream that my dog could talk","right":"Last night I dreamed that my dog could talk.","errors":[{"bad":"dream","good":"dreamed","type":"Verb Tense"},{"bad":"talk","good":"talk.","type":"Punctuation"}]},{"wrong":"The twins brush there teeth and turns off screens before bed.","right":"The twins brush their teeth and turn off screens before bed.","errors":[{"bad":"there","good":"their","type":"Homophones"},{"bad":"turns","good":"turn","type":"Subject-Verb Agreement"}]}]},{"id":"germs","title":"Germs vs. Your Body's Defense Team","category":"Human Body","emoji":"🦠","minutes":4,"paragraphs":["Achoo! When someone sneezes, tiny germs can fly through the air. Germs are living things so small that you need a microscope to see them. They are everywhere: on doorknobs, on your hands, and even floating in the air. Most germs are harmless, and some are actually helpful. But a few kinds can make you sick. Luckily, your body has an amazing defense team called the immune system.","There are a few main kinds of germs. Bacteria are tiny living things made of just one cell. Many bacteria are good for you, like the ones in your gut that help you digest food. Viruses are even smaller than bacteria. They cause illnesses like colds and the flu. A virus can't make copies of itself on its own, so it sneaks into your body's cells and uses them to make more viruses.","Your body's first line of defense is like the walls of a castle. Your skin is a strong barrier that keeps most germs out. Inside your nose, sticky mucus traps germs before they can go deeper. Tears and saliva even contain substances that fight germs. When you cough or sneeze, your body is trying to push germs out.","If germs sneak past those walls, your white blood cells spring into action. White blood cells are like guards that patrol your whole body. Some of them gobble up germs whole. Others make special proteins called antibodies. Each kind of antibody is shaped to grab onto one kind of germ, like a key that fits only one lock.","Here is the coolest part: your immune system has a memory! After it fights off a germ, it remembers how to make the right antibodies. If that same germ shows up again, your body can fight it much faster, often before you even feel sick. Vaccines work by teaching your immune system to recognize a germ ahead of time, so you don't have to get sick first.","Sometimes, when your body is fighting germs, you get a fever. A fever means your body temperature goes up a little, which helps your immune system do its job. You can help your defense team every day. Wash your hands with soap and water for 20 seconds, about as long as singing 'Happy Birthday' twice. Cough or sneeze into your elbow. Eat healthy foods, stay active, and get plenty of sleep. Your immune system will thank you!"],"funFact":"Scientists estimate that about 38 trillion bacteria live in and on your body. That is a little more than the number of human cells you have!","vocab":[{"word":"microscope","meaning":"A tool that makes tiny things look much bigger."},{"word":"barrier","meaning":"Something that blocks the way."},{"word":"mucus","meaning":"Slimy, sticky stuff in your nose that traps germs."},{"word":"antibodies","meaning":"Special proteins that grab onto germs."},{"word":"vaccines","meaning":"Medicines that teach your body to fight a germ."}],"comprehension":[{"q":"What is the main idea of this article?","options":["All germs are harmful","Your immune system protects your body from harmful germs","Viruses are bigger than bacteria","Singing helps you get well"],"answer":1,"explain":"Great job! The article explains how your body's defense team fights germs."},{"q":"What is your body's first line of defense, like the walls of a castle?","options":["Antibodies","A fever","White blood cells","Your skin"],"answer":3,"explain":"You got it! The article says, 'Your skin is a strong barrier that keeps most germs out.'"},{"q":"Why do you think people get vaccines before they get sick?","options":["So the body is ready to fight the germ quickly","So they can catch a cold","So their skin becomes thicker","So they never need to wash their hands"],"answer":0,"explain":"Smart thinking! The article says vaccines teach your immune system to recognize a germ ahead of time."},{"q":"In the article, the word 'barrier' most likely means...","options":["A kind of germ","A type of food","Something that blocks the way","A loud sneeze"],"answer":2,"explain":"Nice! The skin is called a barrier because it 'keeps most germs out.'"},{"q":"What happens when the same germ enters your body a second time?","options":["Your skin falls off","Your body fights it much faster","You always get a fever","Your white blood cells disappear"],"answer":1,"explain":"Exactly! The article says your body 'can fight it much faster' because it remembers the germ."}],"grammar":[{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'A virus ____ into your body's cells.'","options":["sneak","sneaking","sneaks","are sneaking"],"answer":2,"explain":"Yes! 'A virus' is one thing, so it goes with 'sneaks.'"},{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'Wash your hands with soap.'","options":["Wash","your","with","soap"],"answer":3,"explain":"Correct! 'Soap' names a thing, so it is a noun."},{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["Germs can be on doorknobs, hands, and phones.","Germs can be on doorknobs hands, and phones.","Germs, can be on doorknobs hands and phones.","Germs can be, on doorknobs, hands and, phones."],"answer":0,"explain":"Great! Commas separate the items in a list."},{"skill":"Adverbs","q":"Which word is an ADVERB in this sentence: 'Your body can fight the germ quickly.'","options":["body","quickly","fight","germ"],"answer":1,"explain":"Right! 'Quickly' tells how your body fights, so it is an adverb."}],"spelling":[{"word":"microscope","sentence":"Germs are so small that you need a ____ to see them.","meaning":"A tool for seeing tiny things.","wrong":["microscop","mikroscope","microscoap"]},{"word":"viruses","sentence":"____ are even smaller than bacteria.","meaning":"Tiny germs that can cause colds and the flu.","wrong":["virusses","viruss","vyruses"]},{"word":"barrier","sentence":"Your skin is a strong ____ that keeps most germs out.","meaning":"Something that blocks the way.","wrong":["barier","barrior","barreir"]},{"word":"antibodies","sentence":"Some white blood cells make special protein
