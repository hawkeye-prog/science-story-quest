    if(o.hairLong){c.beginPath();c.moveTo(-18,hy-4);c.quadraticCurveTo(-24,hy+20,-20,hy+36);c.lineTo(-13,hy+30);c.quadraticCurveTo(-14,hy+10,-14,hy);c.fill()}}
  if(o.hood){c.fillStyle=lg(c,-20,hy-24,20,hy+20,[[0,robe[0]],[1,robe[1]]]);c.beginPath();c.moveTo(-22,hy+16);c.quadraticCurveTo(-26,hy-26,0,hy-30);c.quadraticCurveTo(26,hy-26,22,hy+16);c.quadraticCurveTo(16,hy-12,0,hy-14);c.quadraticCurveTo(-16,hy-12,-22,hy+16);c.fill()}
  /* hat */if(o.hat!==false&&!o.hood){const hc=o.hatColor||robe[0];c.fillStyle=lg(c,-30,0,30,0,[[0,mix(hc,"#000",.3)],[.5,hc],[1,mix(hc,"#000",.35)]]);c.beginPath();c.ellipse(0,hy-14,30,7,0,0,TAU);c.fill();
    c.beginPath();c.moveTo(-17,hy-16);c.quadraticCurveTo(-8,hy-50,4,hy-66);c.quadraticCurveTo(18+Math.sin(t*1.5)*3,hy-78,26+Math.sin(t*1.5)*4,hy-70);c.quadraticCurveTo(14,hy-62,12,hy-46);c.lineTo(17,hy-16);c.fill();
    c.fillStyle=o.hatBand||"#c9a227";c.fillRect(-16,hy-24,33,5);if(o.stars!==false){c.fillStyle="#ffe58a";[[2,hy-36],[-6,hy-28],[8,hy-50]].forEach(([sx,sy])=>{star(c,sx,sy,3,1.2)})}}
  if(o.crown){c.fillStyle=o.crown;c.beginPath();c.moveTo(-15,hy-14);for(let i=0;i<5;i++){c.lineTo(-15+i*7.5,hy-30+(i%2?8:0))}c.lineTo(15,hy-14);c.fill();glow(c,0,hy-24,20,o.crown,.4)}
  c.restore()}
function star(c,x,y,R,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}

/* ---------------- creatures ---------------- */
function drawDragon(c,x,y,h,P,t,a){/* a: {atk:0..1, hurt, scale} facing left */const s=h/260;c.save();c.translate(x,y);c.scale(-s,s);

  const wing=(dir,dark)=>{c.save();c.translate(-10,-150);c.rotate(dir*(.25+flap*.35));c.fillStyle=lg(c,0,-150,0,40,[[0,dark?P.d:P.m],[1,hexA(P.d,.95)]]);c.beginPath();c.moveTo(0,0);
    c.lineTo(-40,-150);c.lineTo(-120,-170);c.quadraticCurveTo(-110,-110,-170,-80);c.quadraticCurveTo(-120,-70,-130,-20);c.quadraticCurveTo(-80,-30,-70,20);c.quadraticCurveTo(-40,0,0,20);c.fill();
    c.strokeStyle=P.d;c.lineWidth=5;c.beginPath();c.moveTo(0,0);c.lineTo(-40,-150);c.lineTo(-120,-170);c.moveTo(-40,-150);c.lineTo(-170,-80);c.moveTo(-40,-150);c.lineTo(-130,-20);c.moveTo(-40,-150);c.lineTo(-70,20);c.stroke();c.restore()};

  if(biome==="forest"||biome==="academy"){const chirp=()=>{if(!ambNodes.length)return;if(Math.random()<.6){const f=2500+Math.random()*1500;for(let i=0;i<3;i++)osc(f,.07,{f2:f*1.3,vol:.025,when:i*.1,dest:amb})}ambNodes._c=setTimeout(chirp,1500+Math.random()*3000)};chirp()}
  if(biome==="volcano"){const cr=()=>{if(!ambNodes.length)return;for(let i=0;i<5;i++)noise(.02,{type:"highpass",f:2500,vol:.2,when:Math.random()*.5,dest:amb});ambNodes._c=setTimeout(cr,600)};cr()}
  if(biome==="cave"){const dr=()=>{if(!ambNodes.length)return;osc(1200+Math.random()*800,.15,{f2:500,vol:.04,dest:amb});ambNodes._c=setTimeout(dr,1200+Math.random()*2500)};dr()}}
function stopAmb(){ambNodes.forEach(n=>{try{n.stop()}catch(e){}});if(ambNodes._c)clearTimeout(ambNodes._c);ambNodes=[]}
function setMusic(v){musicOn=v}
return{init,resume,FX,FOE_SFX,startMusic,stopMusic,ambience,stopAmb,setMusic,get musicOn(){return musicOn}}})();

/* ===================== THE SPELLBOUND SCHOLAR (game) ===================== */
const STORY = [{"n":1,"act":1,"title":"The Night the Lanterns Fell","location":"Starfall Academy","biome":"academy","time":"night","intro":[{"who":"narrator","text":"It is the night of the Lantern Festival at Starfall Academy. A thousand paper lanterns drift over the towers like slow, golden fireflies."},{"who":"bramble","text":"Hoo! {name}, you're standing on my tail feathers. Also, are you going to finish that blueberry tart? Asking for a very hungry owl."},{"who":"player","text":"Bramble, you've eaten four tarts already! Look, Professor Ashgrove is about to open the Grand Grimoire for the festival reading."},{"who":"elowen","text":"Welcome, students. Inside this book lives every spell in the realm. Remember: magic answers to knowledge. Every word you truly learn becomes a power word."},{"who":"narrator","text":"Suddenly the lanterns flicker out. A cold wind howls through the courtyard, and a figure in a cloak of living shadow descends from the sky."},{"who":"morwen","text":"Such a lovely party. Shame about the guest list. Old friend, you always did keep the best book for yourself."},{"who":"elowen","text":"Morwen! You were told never to return to Starfall. Put down your wand!"},{"who":"morwen","text":"Knowledge belongs to those strong enough to hold it. If I cannot own the Grimoire, no one will read it!"},{"who":"narrator","text":"With a crack like thunder, the Grand Grimoire bursts apart. Thirty-six glowing pages scatter across the sky like shooting stars."},{"who":"foe","text":"Skritch the Imp Captain, at your service, Mistress! Grab the shiny pages, lads! Snatch every one!"},{"who":"elowen","text":"{name}, one page fell by the fountain and Skritch's imps are swarming it. Use Spark, the spell you already know. Hurry!"},{"who":"bramble","text":"Right. Tiny screaming imps. My favorite. Let's go before they eat the dessert table."}],"explore":{"goal":"Collect 5 fallen festival lanterns to relight the courtyard and find the first Grimoire page.","collectible":"lantern","minion":"imp"},"gate":{"speaker":"the Bronze Lion Fountain","line":"Splish! I guard the page that fell into my waters. Prove you are a true reader, little scholar."},"foe":{"name":"Skritch the Imp Captain","kind":"flyer","palette":"violet","weak":"light","resist":"wind","boss":false,"taunts":["Finders keepers, scholar-squeakers!","My wings are tiny but my grudges are huge!","Mistress Morwen will give me a medal for this!"],"attacks":["Pinch and Dash","Lantern Snatch","Cackle Swarm"],"defeat":"Owwie! Fine, fine, keep your silly page! I'm telling Mistress Morwen you were rude!"},"outro":[{"who":"narrator","text":"Skritch zips away into the dark, leaving behind a page that glows soft blue in {name}'s hands."},{"who":"elowen","text":"It chose you, {name}. The Grimoire chooses readers, not rulers. And look, it is teaching you a new spell: Mend, to heal wounds and weariness."},{"who":"player","text":"Mend... I can feel the word humming in my fingers. Professor, who was that witch? She called you her old friend."},{"who":"elowen","text":"A story for another night. Thirty-five pages are still out there, and the brightest streak fell toward the Whispering Woods."},{"who":"bramble","text":"The spooky forest. At night. Wonderful. I'll pack blueberries."}],"page":{"title":"The Page of First Light","lore":"Every great spell began as a single word someone was curious enough to learn."}},{"n":2,"act":1,"title":"Webs in the Whispering Woods","location":"Whispering Woods","biome":"forest","time":"dusk","intro":[{"who":"narrator","text":"At dusk, {name}, Professor Elowen, and Bramble step beneath the silver trees of the Whispering Woods. The leaves murmur secrets to each other."},{"who":"bramble","text":"Did that tree just say 'snack'? Because I agree with that tree."},{"who":"elowen","text":"The trees here remember everything. Listen closely and they may guide us to the page."},{"who":"player","text":"I hear them! They keep saying 'webs... webs to the east.' That doesn't sound great."},{"who":"narrator","text":"Thick silver webs stretch between the trunks ahead. Moths glow, trapped like little lamps."},{"who":"elowen","text":"These are Silkfang's webs. She was a gentle weaver once, but something has made her greedy and cruel."},{"who":"player","text":"Professor, look at this old oak. Someone carved letters into it: 'M and E, study buddies forever.'"},{"who":"elowen","text":"Hm. Trees do keep the oddest things. Come along, {name}."},{"who":"bramble","text":"That was a very suspicious 'hm.' I know suspicious hm's. I invented them."},{"who":"foe","text":"Who's tugging at my webs? Ahh, a little scholar with a shiny page in her pocket. I collect shiny things, sweetling."},{"who":"elowen","text":"The page is wrapped in her biggest web, {name}. Spiders hate fire. Your Spark will burn through the silk!"}],"choice":{"prompt":"A tiny glowing moth is stuck in a web on the path. What do you do?","options":[{"text":"Carefully free the moth","reply":"The moth flutters free and circles your head, sprinkling glittering dust that makes you feel stronger.","reward":"hp"},{"text":"Ask the moth for directions","reply":"The moth blinks its wings in a pattern. Bramble translates: 'Go left, and the owl smells like pie.'","reward":"xp"}]},"explore":{"goal":"Collect 5 glowing moonstones to light the path through the webbed woods.","collectible":"moonstone","minion":"spider"},"gate":{"speaker":"the Stone Owl Gate","line":"Hoo-hoo. Only one who knows their words may pass. Bramble, stop glaring at me, I'm a statue."},"foe":{"name":"Silkfang the Weaver","kind":"spider","palette":"shadow","weak":"fire","resist":"nature","boss":false,"taunts":["Step into my parlor, little scholar!","Eight legs, eight eyes, zero patience!","I'll wrap you up like a birthday present!"],"attacks":["Web Snare","Venom Spit","Eight-Leg Stomp"],"defeat":"My webs... they're just webs again. Oh dear, I think a shadow whispered in my ear. Thank you for waking me."},"outro":[{"who":"narrator","text":"The dark mist drifts off Silkfang's back. She shrinks a little, blinking all eight eyes, and gently unwraps the glowing page."},{"who":"foe","text":"A woman in shadows promised me all the shiny things in the world. I am sorry, little one."},{"who":"player","text":"Morwen got to her too. She's tricking creatures into helping her."},{"who":"elowen","text":"Which means she fears what you can do, {name}. The trees whisper the next page sank into Gloomfen Bog."},{"who":"bramble","text":"A bog. Mud. Smells. You know, I joined this quest for the snacks, and so far the menu is terrible."}],"page":{"title":"The Page of Woven Words","lore":"A web catches flies, but a sentence catches ideas. Spin both with care."}},{"n":3,"act":1,"title":"The Bog Witch's Bargain","location":"Gloomfen Bog","biome":"swamp","time":"dusk","intro":[{"who":"narrator","text":"Gloomfen Bog bubbles and burps. Green fog curls around crooked trees, and frogs croak in grumpy little choirs."},{"who":"bramble","text":"Ugh. Something squelched. I don't want to know what squelched."},{"who":"player","text":"Bramble, it was just my boot. Professor, the page's glow is coming from that crooked hut on stilts."},{"who":"elowen","text":"That is Grizelda's hut. She is a bog witch, and she trades in bargains. Never agree to one without reading the fine print."},{"who":"foe","text":"Visitors! Come in, come in, my dearies! Grizelda has tea. Grizelda has cookies. Grizelda has a shiny page she is NOT giving back."},{"who":"player","text":"That page belongs to everyone, Grizelda. It's part of the Grand Grimoire."},{"who":"foe","text":"Morwen promised me a whole chapter of swamp spells if I guard it. A whole chapter! You can't beat that, dearie."},{"who":"elowen","text":"Morwen makes many promises. She made one to me, long ago, and broke it."},{"who":"bramble","text":"Did you hear that, {name}? Another clue! Professor Ashgrove is more mysterious than a sock that vanishes in the laundry."},{"who":"elowen","text":"Focus, both of you. Grizelda's bog magic grows from the mud and roots. Fire will dry it out!"}],"explore":{"goal":"Collect 5 floating lily-lights to mark a safe path across the bubbling bog.","collectible":"lily-light","minion":"wisp"},"gate":{"speaker":"the Grumpy Toad Gate","line":"Ribbit. I've sat here two hundred years waiting for someone clever. Answer well, or I'll croak at you."},"foe":{"name":"Grizelda the Bog Witch","kind":"witch","palette":"moss","weak":"fire","resist":"nature","boss":false,"taunts":["Have a cookie, dearie! It's only a little bit mud!","My bog swallows boots AND brave little girls!","Bargains are binding, sweetie!"],"attacks":["Mud Ladle","Swamp Gas Puff","Root Grab"],"defeat":"Oh, fiddlesticks! Take your page. Morwen never even sent me a thank-you note."},"outro":[{"who":"narrator","text":"Grizelda stomps back into her hut, muttering. The rescued page floats into {name}'s hands, cold as a winter morning."},{"who":"elowen","text":"This page holds the frost words. Speak them as I do, {name}: you have learned Frost Shard, a spell of sharp, sparkling ice."},{"who":"player","text":"Frost Shard! My breath is making little snowflakes!"},{"who":"bramble","text":"Excellent. Now you can make blueberry slushies. That's the most important use of magic, obviously."},{"who":"elowen","text":"The next page is deep in the Whispering Woods, in a hollow guarded by a troll. Be ready. Trolls do not like visitors."}],"page":{"title":"The Page of Winter's Breath","lore":"Water that is cooled enough becomes ice. Even the warmest heart should know how cold works."}},{"n":4,"act":1,"title":"The Troll Under Mossy Bridge","location":"Mossy Bridge Hollow","biome":"forest","time":"day","intro":[{"who":"narrator","text":"Sunlight drips through the Whispering Woods. At the bottom of a green hollow, a stone bridge arches over a babbling creek."},{"who":"player","text":"The page is glowing under the bridge! Of course it is. Things are always under bridges."},{"who":"foe","text":"WHO is TRAMPING over my BRIDGE? Mossback hears you! Mossback hears EVERYTHING!"},{"who":"bramble","text":"We haven't even touched your bridge yet, you big mossy pillow."},{"who":"foe","text":"Mossback found a shiny page. Shadow lady said keep it, or she take Mossback's bridge away!"},{"who":"elowen","text":"Mossback, I remember you. Years ago a girl from the Academy used to sit on your bridge and read you stories."},{"who":"foe","text":"Yes! Girl with dark hair. Read Mossback books about stars. Then she stopped coming. Mossback sad for long, long time."},{"who":"player","text":"Professor, that girl was Morwen, wasn't it?"},{"who":"elowen","text":"It was. She was kind once, {name}. Remember that. Now, Mossback is covered in thick wet moss. Freeze it stiff with your new Frost Shard!"}],"choice":{"prompt":"Mossback looks lonely. Before the battle, what do you say?","options":[{"text":"Promise to come back and read to him","reply":"Mossback's huge eyes fill with tears. \"Really? Mossback likes books about stars.\"","reward":"potion"},{"text":"Offer him one of Bramble's blueberries","reply":"Bramble gasps in horror, but Mossback munches it happily. \"Tiny. Tasty. Thank you.\"","reward":"hp"},{"text":"Ask him what Morwen was like","reply":"\"She laughed a lot. Then she stopped laughing,\" Mossback rumbles. You file that away as a clue.","reward":"xp"}]},"explore":{"goal":"Collect 5 shining acorns to wake the sleepy bridge stones.","collectible":"acorn","minion":"imp"},"gate":{"speaker":"the Mossy Bridge Arch","line":"Creeeak. I am an old bridge with an old riddle. Cross my mind before you cross my stones."},"foe":{"name":"Mossback the Bridge Troll","kind":"brute","palette":"moss","weak":"ice","resist":"nature","boss":false,"taunts":["Mossback SMASH! Gently. Mostly.","Bridge is MINE!","Mossback is very big and very grumpy!"],"attacks":["Boulder Toss","Moss Belly Flop","Creek Splash"],"defeat":"Mossback... tired. You keep page. But you come back and read, yes? Pinky promise?"},"outro":[{"who":"narrator","text":"Mossback sits down with a thump that shakes the hollow. He hands over the page with two enormous, careful fingers."},{"who":"player","text":"I pinky promise, Mossback. I'll bring the best star book in the library."},{"who":"elowen","text":"You are learning the most important magic of all, {name}. Kindness makes knowledge stronger."},{"who":"bramble","text":"I'd like to point out that I sacrificed a blueberry. A whole blueberry. Put that in the history books."},{"who":"narrator","text":"Far below the woods, something glimmers in the dark: the entrance to the Glowworm Caverns, where the next page has fallen."}],"page":{"title":"The Page of Gentle Giants","lore":"The biggest creatures are often the ones who most need a story read to them."}},{"n":5,"act":1,"title":"Queen of the Floating Lights","location":"Glowworm Caverns","biome":"cave","time":"night","intro":[{"who":"narrator","text":"The Glowworm Caverns sparkle like a sky turned upside down. Thousands of tiny glowworms twinkle on the ceiling."},{"who":"player","text":"It's beautiful! It's like walking inside a galaxy."},{"who":"bramble","text":"It's like walking inside a very damp galaxy. My feathers are frizzing."},{"who":"elowen","text":"Stay on the path, {name}. The cavern is home to wisps, little lights that lead travelers astray."},{"who":"narrator","text":"Soft glowing orbs drift closer, humming a sleepy song. Each one tries to tug {name} off the trail."},{"who":"foe","text":"Follow us, follow us, wander and stay. Forget your quest and dream away..."},{"who":"elowen","text":"The Will-o'-Wisp Queen. Morwen has wrapped her in shadow and given her the page to guard."},{"who":"player","text":"Her song is making me so sleepy... Bramble, poke me!"},{"who":"bramble","text":"With pleasure. Poke. Poke. Extra poke, for the blueberry incident."},{"who":"elowen","text":"Good! Stay awake and fight back. Wisps are like candle flames, {name}. A strong wind will scatter her light!"}],"explore":{"goal":"Collect 5 glowworm crystals while dodging the wisps that try to lead you astray.","collectible":"glow crystal","minion":"wisp"},"gate":{"speaker":"the Crystal Stalactite Gate","line":"Drip, drip. Knowledge drips slowly, like water making stone. Show me what has dripped into your mind."},"foe":{"name":"the Will-o'-Wisp Queen","kind":"wraith","palette":"violet","weak":"wind","resist":"light","boss":false,"taunts":["Lose your way, little light...","Sleep, scholar, sleep forever-ish...","My glow is brighter than your brain!"],"attacks":["Lullaby Glow","Wisp Swarm","Lost Path Hex"],"defeat":"The shadow... it's gone. I can see the path again. Go, scholar, and take my thanks with you."},"outro":[{"who":"narrator","text":"The Queen's purple glow turns a clear, friendly gold. The page drifts down like a falling leaf and lands in {name}'s open hands."},{"who":"elowen","text":"Read the shining words aloud, {name}. This page holds Aegis, a shield of light that guards you and your friends."},{"who":"player","text":"Aegis! A bubble of light just popped up around me! It's warm, like a hug."},{"who":"bramble","text":"Can it keep out cave drips? Because if so, I'm moving in."},{"who":"narrator","text":"A rumble shakes the cavern. Deeper in, something huge and stony is grinding its way toward them."}],"page":{"title":"The Page of the Shining Shield","lore":"A shield of light is made from the courage to protect others, not just yourself."}},{"n":6,"act":1,"title":"The Golem in the Deep","location":"Glowworm Caverns Depths","biome":"cave","time":"night","intro":[{"who":"narrator","text":"Deeper in the caverns, the glowworms thin out. The walls are carved with old Academy runes, half-covered in dust."},{"who":"player","text":"These carvings show students! Here's one reading, one mixing potions... and one taking a book away in the dark."},{"who":"elowen","text":"These caverns were once a hidden study hall. The bravest students came to practice spells too loud for the library."},{"who":"bramble","text":"So it's a library for loud people. I love it. Is there a loud snack bar?"},{"who":"narrator","text":"THOOM. THOOM. A giant made of granite steps out of the wall, eyes glowing like hot coals. The page is stuck in its chest."},{"who":"foe","text":"INTRUDERS. THIS HALL IS CLOSED. BY ORDER OF THE SHADOW STUDENT."},{"who":"player","text":"The Shadow Student? Do you mean Morwen? Was she here?"},{"who":"foe","text":"SHE STUDIED HERE. ALONE. EVERY NIGHT. SHE TOLD ME TO GUARD HER SECRETS. FOREVER."},{"who":"elowen","text":"Golems follow their last orders, {name}. We must loosen the page from its chest. Ice expands in the cracks of stone. Use your Frost Shard!"}],"explore":{"goal":"Collect 5 ancient rune stones to unlock the hidden study hall.","collectible":"rune stone","minion":"bat"},"gate":{"speaker":"the Rune-Carved Door","line":"Many students have knocked on me. Few have answered my question. Will you be one of the few?"},"foe":{"name":"the Granite Golem","kind":"brute","palette":"stone","weak":"ice","resist":"fire","boss":false,"taunts":["YOU. SHALL. NOT. STUDY.","I AM A VERY LARGE ROCK.","QUIET IN THE HALL."],"attacks":["Rockfall Punch","Gravel Storm","Stomp Quake"],"defeat":"ORDERS... COMPLETE. THE HALL IS OPEN AGAIN. STUDENTS ARE WELCOME. PLEASE USE INDOOR VOICES."},"outro":[{"who":"narrator","text":"The golem kneels, and the page slides free from a crack in its chest. Behind it, a wall swings open to reveal a dusty little desk."},{"who":"player","text":"There's a notebook on the desk. It says 'Morwen Vale, Year One.' The first page reads: 'I want to know everything, so nothing can ever hurt me again.'"},{"who":"elowen","text":"She wrote that the year her home village was lost to a flood. She thought knowledge could be a wall to hide behind."},{"who":"bramble","text":"That's... actually really sad. I don't like feeling sad about the villain. It ruins my appetite. Almost."},{"who":"elowen","text":"Keep the notebook, {name}. The next page has flown up to the cliffs of the Old Watchtower, where the harpies nest."}],"page":{"title":"The Page of Patient Stone","lore":"Mountains are made one grain at a time, and so are minds."}},{"n":7,"act":1,"title":"Shrieka of the Windy Cliffs","location":"Old Watchtower Cliffs","biome":"ruins","time":"day","intro":[{"who":"narrator","text":"The Old Watchtower leans on a cliff above the woods, its stones cracked by a thousand storms. Wind screams around the broken walls."},{"who":"bramble","text":"I am an owl. I am built for flying. And I am telling you, this wind is RUDE."},{"who":"player","text":"The page is at the top of that crumbling stairway! But something is circling it."},{"who":"foe","text":"SKREEEEE! Mine, mine, all mine! Shrieka found it first! Shrieka always finds things first!"},{"who":"elowen","text":"Shrieka the harpy. She steals anything that sparkles: spoons, buttons, and now a page of the Grimoire."},{"who":"player","text":"Shrieka, if you give it back, I'll find you something even sparklier!"},{"who":"foe","text":"Nothing is sparklier! The shadow lady said it was the most precious thing in the whole wide world!"},{"who":"elowen","text":"Harpies ride the warm winds, {name}. Chill the air with Frost Shard and her wings will grow heavy."},{"who":"bramble","text":"And watch out for her screech. My ears are still ringing from Skritch, and that was six chapters of adventure ago."}],"choice":{"prompt":"A baby harpy has fallen out of its nest onto the stairs, squeaking. What do you do?","options":[{"text":"Lift it gently back into the nest","reply":"The baby harpy chirps and drops a shiny button in your hand. It looks like a thank-you.","reward":"mp"},{"text":"Let Bramble talk to it","reply":"Bramble lectures the baby on 'proper flight posture.' It falls asleep. Bramble looks smug anyway.","reward":"xp"}]},"explore":{"goal":"Collect 5 sky feathers to climb the windy stairs of the Old Watchtower.","collectible":"sky feather","minion":"bat"},"gate":{"speaker":"the Weathervane Rooster","line":"Cock-a-doodle-QUIZ! I point the way to anyone who knows which way their words blow."},"foe":{"name":"Shrieka the Harpy","kind":"flyer","palette":"storm","weak":"ice","resist":"wind","boss":false,"taunts":["SKREEE! Shiny is mine!","You can't catch me, slowpoke!","I'll pluck that page right out of your pocket!"],"attacks":["Dive Bomb","Feather Flurry","Ear-Splitting Screech"],"defeat":"Fine! FINE! Keep it! I'll go find a nice spoon instead. Spoons never fight back."},"outro":[{"who":"narrator","text":"Shrieka flaps away in a huff, and the page flutters down the stairs into {name}'s waiting arms."},{"who":"elowen","text":"Well done. The watchtower top is only one floor higher now. But listen... do you hear growling?"},{"who":"player","text":"And smell that? Smoke. Something up there is very, very warm."},{"who":"bramble","text":"Growling AND smoke? I'm putting it in writing: I would like to go home now. With snacks."}],"page":{"title":"The Page of Restless Winds","lore":"Wind is air on the move, rushing from high pressure to low. Even the sky is always learning to balance."}},{"n":8,"act":1,"title":"The Wolf Made of Shadows","location":"Old Watchtower Hall","biome":"ruins","time":"night","intro":[{"who":"narrator","text":"Night falls. Inside the Old Watchtower, a great hall is lit only by moonlight through broken windows."},{"who":"elowen","text":"Stay close, {name}. Morwen has left a guardian here. I can feel its cold."},{"who":"narrator","text":"A wolf slinks out of the darkness. It is made of shadow, with two eyes like pale lanterns."},{"who":"foe","text":"Grrrr... The mistress raised me from a puppy of smoke. I will not let you pass, little reader."},{"who":"player","text":"You're Morwen's pet? Then you must know her. Why is she doing all this?"},{"who":"foe","text":"She was alone. Always alone. Only I listened. Now she will make the whole world listen."},{"who":"bramble","text":"Wow, a talking wolf with feelings. This quest is getting deep. I preferred shallow. Shallow is where the snacks are."},{"who":"elowen","text":"Shadows cannot bear brightness, {name}. Your Spark will sting it. And keep your Aegis ready, its bite is cold."},{"who":"player","text":"The page is on the stairs behind it. Last page before the tower top. I can do this."}],"explore":{"goal":"Collect 5 moonbeam shards to light up the dark hall and weaken the shadows.","collectible":"moonbeam shard","minion":"shade"},"gate":{"speaker":"the Moonlit Mirror","line":"I reflect what you truly know. Look into me, scholar, and answer with your own clear words."},"foe":{"name":"the Shadow Wolf","kind":"wolf","palette":"shadow","weak":"light","resist":"ice","boss":false,"taunts":["Arooo! The dark is my den!","I can smell your fear... wait, that's blueberries.","The mistress needs me!"],"attacks":["Shadow Pounce","Midnight Howl","Frostbite Fang"],"defeat":"The light... it doesn't hurt. It feels like morning. Tell the mistress... I just wanted her to be happy."},"outro":[{"who":"narrator","text":"The Shadow Wolf curls into a ball of soft gray smoke and drifts out the window, toward the stars."},{"who":"elowen","text":"This page sings with the wind, {name}. Read it, and learn Gale, a great gust to push foes back and scatter shadows."},{"who":"player","text":"Gale! Whoa, the whole hall's dust just swooshed out the window!"},{"who":"bramble","text":"My feathers are now pointing in fourteen directions. Thanks for that."},{"who":"narrator","text":"A ROAR shakes the tower. Fire pours down the stairs from the very top. Something enormous is waiting there."},{"who":"elowen","text":"A dragon. And by the sound of it, a very young and very frightened one."}],"page":{"title":"The Page of the Wild Gale","lore":"You cannot see the wind, only what it moves. Some of the strongest forces are invisible."}},{"n":9,"act":1,"title":"Emberclaw's Shadow Collar","location":"Old Watchtower Summit","biome":"ruins","time":"night","intro":[{"who":"narrator","text":"At the very top of the Old Watchtower, flames light the night. A young red dragon paces in circles, smoke pouring from his nose."},{"who":"narrator","text":"Around his neck is a collar of black shadow that pulses with Morwen's cold magic. Clutched in his claws: two Grimoire pages."},{"who":"foe","text":"Go away! I don't want to burn you! But the collar makes me... it makes me so ANGRY!"},{"who":"player","text":"He's not evil, Professor. He's scared. That collar is controlling him!"},{"who":"elowen","text":"You see clearly, {name}. If we can weaken him enough, the collar will crack and he will be free."},{"who":"morwen","text":"Clever girl. Elowen always did choose the clever ones. Did she tell you she once chose me?"},{"who":"player","text":"Morwen! Where are you?"},{"who":"morwen","text":"Everywhere my shadows go. Enjoy your little pages. Emberclaw, little ember, burn their books."},{"who":"bramble","text":"Okay. Okay. Everyone stay calm. Especially the dragon. Mostly the dragon."},{"who":"elowen","text":"He is a fire dragon, {name}. Ice is his weakness. Use Frost Shard, and protect us with Aegis. We fight to free him, not to hurt him!"}],"explore":{"goal":"Collect 5 cooling frost runes to calm the flames before the dragon's lair.","collectible":"frost rune","minion":"ember"},"gate":{"speaker":"the Watchtower's Iron Bell","line":"BONG. I rang for every class that ever graduated. Answer me, and I will ring for you."},"foe":{"name":"Emberclaw the Young Dragon","kind":"dragon","palette":"ember","weak":"ice","resist":"fire","boss":true,"taunts":["I can't stop! The collar won't let me!","Get back! I'm too hot to handle!","Rrrraaar! Please... help me!"],"attacks":["Ember Breath","Tail Sweep","Blazing Wingbeat"],"defeat":"The collar... it CRACKED! I'm free! I'm so sorry for the roaring. And the fire. And the bit where I sat on the stairs."},"outro":[{"who":"narrator","text":"The shadow collar shatters into a hundred harmless sparks. Emberclaw shakes his head, and his eyes turn from black to warm gold."},{"who":"emberclaw","text":"Thank you, {name}. Morwen caught me when I was just a hatchling. You can keep these pages. And if you ever need me, call my name into a fire."},{"who":"elowen","text":"Two pages, {name}. You are growing stronger with every word you learn. But look, Morwen's shadow is flying west, over the sea."},{"who":"player","text":"The Drowned Coast. That's where she's taking the rest of the pages, isn't it?"},{"who":"bramble","text":"The SEA? Owls and water do not mix. I'm writing a strongly worded letter about this whole chapter."},{"who":"narrator","text":"Emberclaw roars a farewell and soars into the stars. Act I ends, and far away, the tide begins to rise."}],"page":{"title":"The Page of the Freed Flame","lore":"Fire can cook a meal or burn a forest. Knowledge, like fire, needs a wise heart to guide it."}},{"n":10,"act":2,"title":"Song of the Misty Shore","location":"Seaglass Shore","biome":"coast","time":"day","intro":[{"who":"narrator","text":"Act II begins on Seaglass Shore, where the sand sparkles with polished glass in every color of the rainbow. Gulls cry overhead."},{"who":"bramble","text":"Sand. In my feathers. Already. This is the worst vacation ever."},{"who":"player","text":"It's not a vacation, Bramble! Morwen flew this way with the last pages from the tower. We have to find them."},{"who":"elowen","text":"Emberclaw's freedom made her angry, {name}. She will guard the pages here even more fiercely."},{"who":"narrator","text":"A thick silver mist rolls off the waves. From inside it comes a voice so lovely that even the gulls go quiet."},{"who":"foe","text":"Come into the waves, sweet scholar... come swim forever in my song..."},{"who":"player","text":"My feet are walking toward the water by themselves! Professor!"},{"who":"elowen","text":"The Siren of the Mists. She sings people into the sea. Cover your ears and think of your power words, {name}!"},{"who":"bramble","text":"I'll sing louder! La la LAAA! Blueberries! Blueberry PIE! Oh, I'm terrible. It's working, though!"},{"who":"elowen","text":"Her magic lives in the cold mist. Fire will burn it away!"}],"choice":{"prompt":"A stranded starfish is drying out on the hot sand. What do you do?","options":[{"text":"Carry it back to a tide pool","reply":"The starfish wiggles happily in the cool water and glows a friendly pink.","reward":"hp"},{"text":"Ask it about the Siren","reply":"\"She used to sing lullabies to sailors,\" it whispers. \"Then the shadow lady changed her song.\"","reward":"xp"},{"text":"Let Bramble name it","reply":"Bramble names it 'Sir Pointy McFivelegs the Third.' The starfish seems honored.","reward":"potion"}]},"explore":{"goal":"Collect 5 sea-glass gems to break through the Siren's silver mist.","collectible":"sea-glass gem","minion":"crab"},"gate":{"speaker":"the Great Conch Shell","line":"Hold me to your ear and you will hear the sea. Answer me, and you will hear the way forward."},"foe":{"name":"the Siren of the Mists","kind":"witch","palette":"sea","weak":"fire","resist":"ice","boss":false,"taunts":["Sing along, scholar!","The tide always wins, darling!","Your little words can't drown out my song!"],"attacks":["Mist Melody","Tidal Trill","Wave Crash Chorus"],"defeat":"My old song... I remember it now. A lullaby for sailors. Thank you, child. I'll sing it again."},"outro":[{"who":"narrator","text":"The mist clears. The Siren sinks gently back into the waves, humming a soft lullaby, and a page washes up at {name}'s feet."},{"who":"elowen","text":"Well done. Morwen is turning every creature on this coast against us. We must be quicker than her shadows."},{"who":"player","text":"Professor, the page has a drawing on it. A giant crab... wearing a crown?"},{"who":"bramble","text":"A crab with a crown. Of course. Why not? Next we'll meet a jellyfish with a mustache."},{"who":"narrator","text":"Down the beach, rocks start to move. They aren't rocks at all. They're claws."}],"page":{"title":"The Page of the Sailor's Lullaby","lore":"Sound travels as waves through air and water. A song can cross a whole ocean if someone is listening."}},{"n":11,"act":2,"title":"King Clatterclaw's Court","location":"Seaglass Tide Pools","biome":"coast","time":"dusk","intro":[{"who":"narrator","text":"At dusk, the tide pools of Seaglass Shore glow orange and pink. Hundreds of crabs click and clatter along the rocks."},{"who":"foe","text":"SILENCE! Bow before King Clatterclaw, Lord of the Tide Pools, Ruler of the Rocks, Pincher of Toes!"},{"who":"narrator","text":"A crab as big as a carriage rises from the largest pool. He wears a crown of barnacles, and on his shell sits a glowing page."},{"who":"player","text":"Your Majesty, that page belongs to the Grand Grimoire. Please give it back."},{"who":"foe","text":"The shadow lady crowned me KING! She said the page makes me the smartest crab in the sea. I'm keeping it!"},{"who":"bramble","text":"A page doesn't make you smart, your Crabby-ness. Reading it does. Have you even read it?"},{"who":"foe","text":"I... I can't read. But I LOOK smart with it! Very smart! Click click!"},{"who":"elowen","text":"Morwen is giving away pieces of knowledge as crowns and trophies, {name}. She thinks knowing is the same as owning."},{"who":"elowen","text":"His shell is wet and full of salt water, which carries a spark very well. Strike fast and strike true!"}],"explore":{"goal":"Collect 5 pearly shells to cross the tide pools before the water rises.","collectible":"pearl shell","minion":"crab"},"gate":{"speaker":"the Barnacle Throne","line":"Even a throne must think. Prove your mind is sharper than a crab's claw."},"foe":{"name":"King Clatterclaw","kind":"spider","palette":"sea","weak":"lightning","resist":"fire","boss":false,"taunts":["Click click! Bow to your king!","My claws are royal and very pinchy!","I'm the smartest crab who ever lived!"],"attacks":["Royal Pinch","Bubble Barrage","Sideways Stampede"],"defeat":"Okay, okay! You can have it! But... could you maybe teach me to read sometime? I'd like that."},"outro":[{"who":"narrator","text":"King Clatterclaw lowers his claws and slides the page across the rocks. His barnacle crown slips sideways over one eye."},{"who":"player","text":"I'll teach you to read, Your Majesty. Knowledge is better when it's shared!"},{"who":"elowen","text":"Spoken like a true Keeper. And look, the page is crackling with storms. Read it, {name}: you have learned Thunderbolt!"},{"who":"player","text":"Thunderbolt! My hair is standing up. I think I'm a little bit electric."},{"who":"bramble","text":"You look like a dandelion. A very powerful dandelion."},{"who":"narrator","text":"Out on the dark water, a ship's lantern blinks three times. A sailing ship is waiting in the bay, and someone on deck is waving."}],"page":{"title":"The Page of Crackling Skies","lore":"Lightning is electricity jumping between clouds and ground, hotter than the surface of the sun for just a blink."}},{"n":12,"act":2,"title":"Ghosts Aboard the Brave Tern","location":"The Brave Tern","biome":"sea","time":"night","intro":[{"who":"narrator","text":"A rowboat carries {name}, Elowen, and Bramble to a tall ship with patched blue sails. Her name is painted on the side: the Brave Tern."},{"who":"theo","text":"Oh! Hi! You're {name}, right? I'm Theo Quill, second year. The headmaster sent me with maps. Lots of maps. I may have overpacked."},{"who":"bramble","text":"You brought maps, but did you bring snacks? Wait, are those blueberry muffins in your bag? We're going to be great friends."},{"who":"theo","text":"I also brought potions! Some of them only bubble a little. Is it normal to be this nervous on your first quest?"},{"who":"player","text":"Totally normal. I was super nervous in chapter one. Welcome to the team, Theo!"},{"who":"narrator","text":"As the Brave Tern sails into the night, a green fog creeps over the deck. Ghostly lanterns flicker on in the rigging."},{"who":"foe","text":"Yo ho, landlubbers! Captain Hollowbones claims this ship, and the page hidden in its hold! Arr, and also the muffins!"},{"who":"theo","text":"A g-g-ghost pirate! My map says this whole bay is called Hollowbones Bay. I really should've read the fine print."},{"who":"foe","text":"A lass in shadows paid me in gold to haunt this ship. Long ago she paid me to sail her to the Sunken Temple, too."},{"who":"elowen","text":"Ghosts are bound by darkness and old regrets. Bright light will loosen his hold on the ship, {name}. Spark him!"}],"explore":{"goal":"Collect 5 ship's lanterns to drive the ghostly fog off the deck.","collectible":"ship's lantern","minion":"wisp"},"gate":{"speaker":"the Talking Figurehead","line":"I've sailed through a hundred storms, sweet scholar. Answer my riddle and I'll open the hatch to the hold."},"foe":{"name":"Captain Hollowbones","kind":"wraith","palette":"bone","weak":"light","resist":"ice","boss":false,"taunts":["Arr, walk the plank, ye bookworm!","Dead men tell no tales, but I tell LOTS!","Shiver me timbers... and YOUR timbers!"],"attacks":["Cutlass Swipe","Ghostly Anchor","Cannonball of Bones"],"defeat":"Arrr... the light feels warm. I've been cold for two hundred years. I'll rest now, lass. Take good care of me ship."},"outro":[{"who":"narrator","text":"Captain Hollowbones fades into a gentle mist that smells like salt and sunshine. In the hold, a page shines inside an old sea chest."},{"who":"theo","text":"That was amazing! You were amazing! I only dropped three potions. That's a personal best."},{"who":"player","text":"He said Morwen sailed to the Sunken Temple long ago. Professor, what's there?"},{"who":"elowen","text":"The oldest library in the realm, swallowed by the sea. Morwen went looking for the knowledge she lost in the flood. She never found it."},{"who":"bramble","text":"Speaking of things found, I found a muffin. Nobody saw anything. Moving on."},{"who":"narrator","text":"Thunder rumbles across the sky. Dark clouds pile up ahead, and inside them, wings are beating."}],"page":{"title":"The Page of the Faithful Ship","lore":"Sailors once found their way by reading the stars. A map is just knowledge someone chose to share."}},{"n":13,"act":2,"title":"Into the Harpy Storm","location":"The Stormbreak Sea","biome":"sea","time":"dusk","intro":[{"who":"narrator","text":"Waves as tall as towers crash over the Brave Tern. Lightning splits the purple clouds, and the sails crack like whips."},{"who":"theo","text":"According to my map, we're in the Stormbreak Sea. According to my stomach, we are upside down."},{"who":"bramble","text":"I've been blown off the mast four times. I am now mostly wet feathers and bad attitude."},{"who":"narrator","text":"From the clouds dive a flock of harpies with feathers of crackling blue. At their head flies one wearing a crown of lightning."},{"who":"foe","text":"I am Squallwing, Queen of the Storm Harpies! My cousin Shrieka told me ALL about you, page-thief!"},{"who":"player","text":"I'm not a thief! Those pages belong to everyone. Morwen is the one who stole them!"},{"who":"foe","text":"Morwen promised us the sky forever. Every cloud, every storm, every rainbow. You can't beat a deal like that!"},{"who":"elowen","text":"Squallwing's wings are charged with lightning, {name}, so your Thunderbolt won't hurt her much. Freeze her feathers with ice!"},{"who":"theo","text":"And I've got a Steady-Feet Potion! It keeps you from sliding off the deck. Probably. It's ninety percent probably."}],"choice":{"prompt":"Theo's potion bag is about to blow overboard! What do you grab first?","options":[{"text":"Grab Theo's potion bag","reply":"You snatch it just in time! Theo hands you a glowing blue bottle as a thank-you.","reward":"potion"},{"text":"Grab Theo before he slips","reply":"You catch Theo's sleeve. \"You saved me!\" he gasps. \"I owe you, like, a hundred favors.\"","reward":"hp"},{"text":"Grab Bramble out of the air","reply":"Bramble lands in your arms, soaked. \"My hero,\" he mutters. \"Tell no one I said that.\"","reward":"mp"}]},"explore":{"goal":"Collect 5 storm pearls to calm the winds around the Brave Tern.","collectible":"storm pearl","minion":"bat"},"gate":{"speaker":"the Ship's Wheel Spirit","line":"Steer with your mind, young captain. Answer me true and I'll guide us out of this storm."},"foe":{"name":"Squallwing, Queen of the Storm Harpies","kind":"flyer","palette":"storm","weak":"ice","resist":"lightning","boss":false,"taunts":["SKRAAA! The storm is mine!","I'll blow you back to the Academy!","Lightning loves me!"],"attacks":["Thunder Dive","Gust Slap","Static Feathers"],"defeat":"My wings are too heavy with frost! Fine! We'll find our own sky, without Morwen's silly promises!"},"outro":[{"who":"narrator","text":"Squallwing and her flock spiral off into the clouds. The storm breaks, and a rainbow arches over the waves."},{"who":"narrator","text":"A page drifts down out of the sky and lands right on Theo's head."},{"who":"theo","text":"Um. Is it supposed to do that?"},{"who":"elowen","text":"Pages go where they're needed. Keep your eyes on the water, everyone. The storm was hiding something."},{"who":"bramble","text":"Please be a giant floating muffin. Please be a giant floating muffin."},{"who":"narrator","text":"It is not a giant floating muffin. A long, scaly neck rises from the waves, taller than the mast."}],"page":{"title":"The Page of the Rainbow's Promise","lore":"A rainbow appears when sunlight bends through raindrops, splitting into every color at once."}},{"n":14,"act":2,"title":"Vashtar of the Deep","location":"The Serpent's Reach","biome":"sea","time":"night","intro":[{"who":"narrator","text":"Under the moon, the sea serpent Vashtar circles the Brave Tern. His scales shimmer green and silver, and his eyes glow like deep lanterns."},{"who":"foe","text":"Sssso. The little reader who freed Emberclaw. Morwen warned me you would come ssssailing by."},{"who":"player","text":"Vashtar, you're holding a Grimoire page in your coils. Why does Morwen want it so badly?"},{"who":"foe","text":"It holds the ssssecret of the sea's oldest library. She has searched for it sssince she was a girl. She wants to bring back what the flood took."},{"who":"theo","text":"Wait, the flood? I read about that in the Academy records. A whole village by the sea... washed away years ago."},{"who":"elowen","text":"Morwen's village. She was only eleven, {name}. Barely older than you."},{"who":"bramble","text":"Oh no. I'm getting the sad-villain feeling again. Someone hand me a muffin, quickly."},{"who":"foe","text":"Enough ssssad stories! I am the guardian now! The page sstays in the deep with me!"},{"who":"elowen","text":"Serpents of the sea live in the water and the water carries electricity. Your Thunderbolt will shock him, {name}!"}],"explore":{"goal":"Collect 5 moon pearls floating on the waves to light the serpent's hiding place.","collectible":"moon pearl","minion":"wisp"},"gate":{"speaker":"the Old Lighthouse Keeper's Bell","line":"Ding-a-ling. I've warned many ships of danger. Answer me, and your path will be clear."},"foe":{"name":"Vashtar the Sea Serpent","kind":"serpent","palette":"sea","weak":"lightning","resist":"ice","boss":false,"taunts":["Ssssink, little sssscholar!","My coilssss go on forever!","The deep keeps its ssssecrets!"],"attacks":["Coil Crush","Whirlpool Spin","Riptide Fang"],"defeat":"Sssstop! I yield. Take the page. And... tell Morwen I'm sssorry the sea took her home."},"outro":[{"who":"narrator","text":"Vashtar uncoils and bows his huge head. Gently, he lays the page on the deck, then slips beneath the waves."},{"who":"player","text":"I don't think Morwen is just a villain. I think she's someone who lost everything and never stopped being scared."},{"who":"elowen","text":"You are wise beyond your years, {name}. Understanding her doesn't mean letting her win. It means we fight for a better ending."},{"who":"theo","text":"My map shows a cave ahead, glowing under the water. It's called the Coral Grotto. And... the next page is right inside."},{"who":"bramble","text":"Another cave. Wet AND dark. Just the way I hate it."}],"page":{"title":"The Page of the Sea's Memory","lore":"The ocean covers most of our world and holds places no one has ever seen. There is always more to discover."}},{"n":15,"act":2,"title":"Hunt of the Mist Wolf","location":"Coral Grotto","biome":"cave","time":"night","intro":[{"who":"narrator","text":"The Brave Tern anchors beside a glowing sea cave. Inside the Coral Grotto, coral grows in every color, pink, orange, and violet."},{"who":"theo","text":"Oh wow. Coral is alive, you know. It's made of tiny animals. Millions of them. I read that in a book. Sorry, I get excited."},{"who":"player","text":"Don't be sorry, Theo! That's so cool. We're walking through a whole living city!"},{"who":"bramble","text":"A living city with no snack shops. Poor planning, if you ask me."},{"who":"narrator","text":"A howl echoes through the grotto. Thick white mist pours from the tunnels, and inside it prowl two cold, gray eyes."},{"who":"foe","text":"Awoooo! I am the Mist Wolf, cousin to the Shadow Wolf. You sent him away into the stars, girl."},{"who":"player","text":"We didn't hurt him. He's free now. He just wanted Morwen to be happy."},{"who":"foe","text":"Lies! The mist hides everything, and I will hide YOU, forever!"},{"who":"elowen","text":"This wolf is made of cold fog. Warm it up and the mist will thin. Use fire, {name}, and keep moving!"},{"who":"theo","text":"I'll mix a Clear-Eye Potion so we can see through the fog! Give me three minutes. Or five. Maybe ten."}],"explore":{"goal":"Collect 5 glowing coral sprigs to light a path through the thick mist.","collectible":"coral sprig","minion":"crab"},"gate":{"speaker":"the Giant Clam Gate","line":"Clap, clap! I only open my shell for a clever mind. Show me what you've learned, little pearl."},"foe":{"name":"the Mist Wolf","kind":"wolf","palette":"frost","weak":"fire","resist":"ice","boss":false,"taunts":["Lost in the mist, little scholar?","You can't hit what you can't see!","Awoooo! The fog is my friend!"],"attacks":["Fog Pounce","Chilling Howl","Phantom Bite"],"defeat":"My cousin is free? Truly? Then... I want to see the stars too. Goodbye, little reader."},"outro":[{"who":"narrator","text":"The mist fades into thin morning light. The Mist Wolf bounds out of the grotto toward the sky, and a page shines on a coral shelf."},{"who":"elowen","text":"This page is full of sunlight, {name}. Read it aloud. You have learned Sunbeam, the brightest spell yet, powerful against all shadow."},{"who":"player","text":"Sunbeam! The whole grotto is glowing gold. It feels like the first warm day of summer."},{"who":"theo","text":"That's exactly the spell we'll need against Morwen's shadows. You're incredible, {name}."},{"who":"bramble","text":"Fine, I'll admit it. She's incredible. I'm still the best-looking member of the team, though."},{"who":"narrator","text":"Then the floor of the grotto shudders. The coral walls start to move, piece by piece, into the shape of a giant."}],"page":{"title":"The Page of the Golden Sun","lore":"Sunlight takes about eight minutes to travel to our world. Every sunbeam is a gift from far away."}},{"n":16,"act":2,"title":"The Coral Golem Awakens","location":"Coral Grotto Heart","biome":"cave","time":"day","intro":[{"who":"narrator","text":"Sunlight beams through cracks in the grotto ceiling. The Coral Golem rises, a giant built of pink coral, barnacles, and seaweed."},{"who":"foe","text":"GLUB. I AM THE CORAL GOLEM. I PROTECT THE GROTTO. THE SHADOW WOMAN SAID YOU CAME TO BREAK IT."},{"who":"player","text":"That's not true! We would never hurt the coral. We just need the page you're guarding."},{"who":"theo","text":"Wait, it's built from living coral! If we fight too rough, we could hurt the reef. We need to be careful!"},{"who":"elowen","text":"Theo is right. Morwen chose this guardian on purpose. She hoped you would harm the reef and prove you are no better than her."},{"who":"bramble","text":"Sneaky, sneaky. That woman plays chess while everyone else plays checkers. Badly. With crumbs."},{"who":"narrator","text":"Inside the golem's chest, a page glows next to a small, dark shell carved with Morwen's mark."},{"who":"elowen","text":"That shell is the shadow charm controlling it. Aim for the charm, {name}. A Thunderbolt will crack it without hurting the coral."}],"choice":{"prompt":"Some tiny fish are trapped in a shallow pool and the water is drying up. What do you do?","options":[{"text":"Dig a channel back to the sea","reply":"The fish zip out into the open water, leaving a trail of shimmering bubbles that refresh your magic.","reward":"mp"},{"text":"Ask Theo for a water potion","reply":"Theo's potion fills the pool with fresh seawater. \"It actually worked!\" he shouts, amazed.","reward":"xp"}]},"explore":{"goal":"Collect 5 shimmering starfish to wake the reef and weaken the golem's charm.","collectible":"starfish","minion":"crab"},"gate":{"speaker":"the Seahorse Guardian","line":"Neigh-glub! I guard the heart of the grotto. Answer my riddle and the coral will open for you."},"foe":{"name":"the Coral Golem","kind":"brute","palette":"sea","weak":"lightning","resist":"fire","boss":false,"taunts":["GLUB. LEAVE THE REEF.","I AM MADE OF A MILLION TINY FRIENDS.","THE TIDE WILL WASH YOU OUT."],"attacks":["Coral Crush","Barnacle Blast","Seaweed Lash"],"defeat":"GLUB... THE CHARM IS BROKEN. YOU PROTECTED THE REEF. YOU ARE A FRIEND OF THE SEA."},"outro":[{"who":"narrator","text":"The dark shell cracks apart. The Coral Golem settles gently back into the grotto walls, and the page floats free."},{"who":"elowen","text":"You chose care over force, {name}. Morwen has never learned that lesson. Perhaps no one ever taught her."},{"who":"theo","text":"Look, there's a passage behind where the golem stood. It goes down... and down... to a temple under the sea!"},{"who":"bramble","text":"I can't breathe underwater. Can anyone else breathe underwater? Theo, tell me you have a potion for that."},{"who":"theo","text":"I have a Bubble-Helmet Potion! It tastes like old socks, but it works. Mostly."}],"page":{"title":"The Page of the Living Reef","lore":"A coral reef is built by tiny creatures working together for hundreds of years. Small efforts make great things."}},{"n":17,"act":2,"title":"Nerissa of the Sunken Temple","location":"The Sunken Temple","biome":"ruins","time":"dusk","intro":[{"who":"narrator","text":"Wearing Theo's bubble helmets, the friends walk through the halls of the Sunken Temple. Fish swim between columns carved with books."},{"who":"bramble","text":"This bubble smells like old socks. I'm an owl in a sock bubble. My ancestors would be ashamed."},{"who":"theo","text":"This was the Great Sea Library. My map says it sank three hundred years ago. All these shelves... still full of books!"},{"who":"player","text":"Morwen came here looking for something she lost. I wonder if she ever found it."},{"who":"foe","text":"She found ME, little scholar. I am Nerissa, the Sea Witch. Once I was Morwen's teacher. Now I am her guard."},{"who":"elowen","text":"Nerissa. I thought you were only a legend. You taught her the forbidden spells, didn't you?"},{"who":"foe","text":"I taught her that knowledge is a treasure to lock away. And you, Elowen, are the one who told the Academy her secrets."},{"who":"player","text":"Professor... is that true? Did you get Morwen expelled?"},{"who":"elowen","text":"I did, {name}. She was my dearest friend, and she was hurting people to learn more. Telling the truth was the hardest thing I ever did."},{"who":"bramble","text":"Whoa. Plot twist. I need to sit down. Does this bubble have a chair?"},{"who":"elowen","text":"We will talk later, I promise. Nerissa's magic is dark sea-shadow, {name}. Sunbeam will break it!"}],"explore":{"goal":"Collect 5 lost library scrolls to relight the sunken shelves.","collectible":"library scroll","minion":"shade"},"gate":{"speaker":"the Drowned Librarian Statue","line":"Shhh. This is a library, even underwater. Answer quietly and correctly, and you may enter the inner hall."},"foe":{"name":"Nerissa the Sea Witch","kind":"witch","palette":"violet","weak":"light","resist":"ice","boss":false,"taunts":["Knowledge is a treasure, and treasure is MINE!","The deep keeps every secret!","You read too much for your own good, child!"],"attacks":["Ink Cloud","Undertow Curse","Drowned Page Storm"],"defeat":"The light... I had forgotten how lovely sunlight is in the library. Perhaps books were meant to be read, not hidden."},"outro":[{"who":"narrator","text":"Nerissa's shadows dissolve in a wave of golden light. She drifts to a stone bench and, for the first time in centuries, opens a book."},{"who":"elowen","text":"{name}, I'm sorry I kept the truth from you. Morwen and I were study partners. I lost my best friend the night I lost her."},{"who":"player","text":"You did the right thing, Professor. And maybe there's still a way to get her back."},{"who":"theo","text":"Um, everyone? The water is getting really, really dark. And something huge just moved under the floor."},{"who":"narrator","text":"The temple trembles. Eight enormous tentacles curl up through the broken tiles, each as wide as a tree."}],"page":{"title":"The Page of the Open Book","lore":"A library is a promise that anyone, anywhere, may learn. A locked book teaches no one."}},{"n":18,"act":2,"title":"Wrath of the Kraken Mother","location":"Heart of the Sunken Temple","biome":"ruins","time":"night","intro":[{"who":"narrator","text":"The floor of the Sunken Temple cracks open. From the deep rises the Kraken Mother, older than the temple itself, with eyes like twin moons."},{"who":"foe","text":"WHO DISTURBS THE DEEP? Morwen promised me silence for a thousand years in exchange for guarding her pages."},{"who":"theo","text":"Her pages? There are THREE pages wrapped in her tentacles! That's the most we've seen in one place!"},{"who":"bramble","text":"Three pages, eight tentacles, one very nervous owl in a sock bubble. Those are the numbers."},{"who":"player","text":"Kraken Mother, those pages were stolen. They hold the magic for everyone in the realm, including your sea."},{"who":"foe","text":"The sea does not need your words, child. The sea is older than words."},{"who":"elowen","text":"Then let us show you what words can do. Remember everything we've learned on this coast, {name}. Every power word counts."},{"who":"morwen","text":"Oh, how sweet. My old friend, still giving speeches. Kraken Mother, keep them here. Forever."},{"who":"player","text":"Morwen! You can't hide in the shadows forever. We know what happened to your village!"},{"who":"morwen","text":"You know NOTHING. Defeat my kraken, little scholar, if you can."},{"who":"elowen","text":"The Kraken lives in salt water, {name}. Thunderbolt will strike her hardest. Theo, Bramble, protect the bubbles!"}],"explore":{"goal":"Collect 5 ancient temple pearls to power the shield around the sunken altar.","collectible":"temple pearl","minion":"shade"},"gate":{"speaker":"the Altar of the Tides","line":"I have waited three hundred years for a true scholar. Answer me, and face the mother of the deep."},"foe":{"name":"the Kraken Mother","kind":"kraken","palette":"sea","weak":"lightning","resist":"ice","boss":true,"taunts":["THE DEEP SWALLOWS ALL!","Eight arms, eight times the trouble!","You are a minnow before a mountain!"],"attacks":["Tentacle Tempest","Ink Abyss","Crushing Tide"],"defeat":"Enough, little scholar. You fight with knowledge and with kindness. Take your pages. The deep will sleep again."},"outro":[{"who":"narrator","text":"The Kraken Mother sinks back into the dark, and three pages float up into {name}'s arms, glowing like tiny suns."},{"who":"morwen","text":"Impressive. But you've forgotten something, Elowen. The next pages lie in the Frozen Peaks, and I have just the bait to bring you there."},{"who":"narrator","text":"A whip of black shadow lashes out. Before anyone can move, it wraps around Professor Elowen and pulls her up through the water."},{"who":"player","text":"PROFESSOR! Let her go, Morwen!"},{"who":"elowen","text":"{name}! Find the Frozen Peaks! Find Glacia! The Grimoire chooses readers, not rulers. Never forget that!"},{"who":"theo","text":"She's gone. Morwen took her north. The map... it's turning to frost in my hands."},{"who":"bramble","text":"Then we go north. All three of us. Nobody takes our professor. Act II is over, and now I'm angry. Hold my blueberries."}],"page":{"title":"The Page of the Turning Tide","lore":"Tides rise and fall because the moon pulls on the sea. Even far-away things can move us."}},{"n":19,"act":3,"title":"The Howl on Skyreach Pass","location":"Skyreach Pass","biome":"mountain","time":"dusk","intro":[{"who":"narrator","text":"The Brave Tern's sails are frozen stiff behind them. Ahead, Skyreach Pass climbs into clouds the color of pearls."},{"who":"theo","text":"The map from the Kraken Mother's lair says the next page is up there. Somewhere. Very, very up there."},{"who":"bramble","text":"Wonderful. Nothing says 'adventure' like losing all feeling in one's tail feathers. Did anyone pack blueberries?"},{"who":"player","text":"I packed three jars, Bramble. One is already empty. I wonder who did that."},{"who":"bramble","text":"A mystery for the ages, {name}. Truly unsolvable."},{"who":"elowen","text":"Stay close, all of you. The cold up here is not natural. Morwen's shadow has crept into the snow."},{"who":"narrator","text":"A long howl rolls down the slope. Blue eyes glimmer between the pines, and a huge silver wolf steps onto the path."},{"who":"foe","text":"Turn back, little scholar. The Peaks belong to my pack now. The Shadow Witch promised us the whole mountain."},{"who":"player","text":"The mountain isn't hers to give away. And I'm not going anywhere without that page."},{"who":"theo","text":"Um, {name}? There are a LOT of glowing eyes behind him. Like, more than I can count, and I'm good at counting."}],"explore":{"goal":"Climb the snowy switchbacks of Skyreach Pass and gather frost-blue crystals while dodging snowball sprites.","collectible":"crystal","minion":"snowball"},"gate":{"speaker":"An old stone trail marker","line":"Many climbers have passed me, but only the clever reach the top. Answer well, young climber."},"foe":{"name":"Frost Wolf Alpha","kind":"wolf","palette":"frost","weak":"fire","resist":"ice","boss":false,"taunts":["My pack never tires, and neither do I!","Your little sparks will melt in this wind!","Run, scholar, while your boots still work!"],"attacks":["Blizzard Howl","Frostbite Lunge","Icicle Pounce"],"defeat":"The Alpha's eyes clear from shadow to sky-blue. He bows his great head and leads his pack away into the peaceful snow."},"outro":[{"who":"narrator","text":"As the shadow melts off the wolf's fur, a page drifts down from the pines, green as a spring leaf."},{"who":"elowen","text":"A Grimoire page of growing things. Read it aloud, {name}. It wants you to."},{"who":"player","text":"Roots, reach. Stems, hold. Vine Bind! Whoa, little green vines just curled around my boots!"},{"who":"elowen","text":"Vine Bind can hold a foe in place while you think. Patience is a kind of power too."},{"who":"bramble","text":"Splendid. Now we can tie up the next monster AND hang our socks to dry."},{"who":"theo","text":"The page's back has a drawing of a big furry footprint. A really, really big one."}],"page":{"title":"The Page of Rooted Things","lore":"Even under ice, seeds remember the sun. This page teaches that every living thing holds on until spring."}},{"n":20,"act":3,"title":"The Grumpiest Snowman","location":"Skyreach Pass, High Meadow","biome":"mountain","time":"day","intro":[{"who":"narrator","text":"The next morning, the heroes follow giant footprints across a meadow buried in sparkling snow."},{"who":"theo","text":"Each print is as long as a rowboat. I measured. Twice. I really hope it's a friendly rowboat."},{"who":"bramble","text":"Footprints like that belong to either a legend or a very large problem. Possibly both."},{"who":"elowen","text":"They belong to Grumblefrost, the yeti who guards the meadow. He was always gruff, but never cruel."},{"who":"player","text":"Then why is he throwing boulders of snow at us?!"},{"who":"narrator","text":"A shaggy white yeti with a dark shadow-scarf around his neck stomps out of a drift, growling."},{"who":"foe","text":"Go AWAY! The witch says if I let anyone pass, she'll take my snowberry patch forever!"},{"who":"bramble","text":"Snowberries? Did he say snowberries? {name}, I now have a very personal reason to win this fight."},{"who":"player","text":"Grumblefrost, we don't want your berries. We want to help you get that scarf off!"},{"who":"foe","text":"Nobody helps Grumblefrost. Grumblefrost helps Grumblefrost. GRRRAH!"}],"choice":{"prompt":"Grumblefrost hesitates for a moment. What does {name} do?","options":[{"text":"Offer him a jar of blueberries","reply":"Grumblefrost sniffs the jar and his growl softens. Bramble looks heartbroken but proud.","reward":"hp"},{"text":"Tell him about the Grimoire","reply":"The yeti listens, puzzled, and you feel your magic brighten as you explain it.","reward":"mp"},{"text":"Study his footprints with Theo","reply":"Theo spots a weak, slushy patch on his left side. Smart thinking!","reward":"xp"}]},"explore":{"goal":"Cross the windy High Meadow and collect sweet snowberries for Bramble without waking the snowball sprites.","collectible":"snowberry","minion":"snowball"},"gate":{"speaker":"A snow-covered beehive with sleepy frost bees","line":"Bzzz... we only open for buzzing brains. Show us yours."},"foe":{"name":"Grumblefrost the Yeti","kind":"brute","palette":"frost","weak":"fire","resist":"ice","boss":false,"taunts":["Grumblefrost is grumpy! Very grumpy!","Snow hug! You will not like it!","Leave the meadow or get BURIED!"],"attacks":["Snowball Barrage","Grumble Stomp","Avalanche Hug"],"defeat":"The shadow-scarf crumbles, and Grumblefrost blinks. 'Oh. I am sorry. Would... would you like some snowberries?'"},"outro":[{"who":"foe","text":"The witch tricked Grumblefrost. She tricks everybody. She told me nobody would ever share with me."},{"who":"player","text":"Well, we're sharing now. Bramble, give him a blueberry."},{"who":"bramble","text":"This is the hardest thing I have ever done. Here. Enjoy it. Slowly."},{"who":"narrator","text":"Grumblefrost lifts a snowberry bush, and underneath it glows a Grimoire page."},{"who":"elowen","text":"Well done, {name}. Kindness opened that door, not just magic."},{"who":"theo","text":"This page shows a glacier with a tower made of ice. Is that... is that someone's house?"}],"page":{"title":"The Page of Gentle Giants","lore":"The biggest creatures often have the softest hearts. This page records the old friendships between yetis and mountain folk."}},{"n":21,"act":3,"title":"The Witch of Frostveil","location":"Frostveil Glacier","biome":"ice","time":"day","intro":[{"who":"narrator","text":"Frostveil Glacier stretches out like a frozen ocean, blue and white and endlessly bright."},{"who":"theo","text":"Careful, the ice here creaks. My potion book says creaky ice is either totally fine or totally not fine."},{"who":"bramble","text":"Very helpful, Theo. I shall fly. Owls do not do creaky."},{"who":"narrator","text":"A tower of glittering ice rises from the glacier. On its balcony stands a pale witch with a crown of icicles."},{"who":"foe","text":"Starfall students. How charming. Morwen said you would come. She said you were stubborn."},{"who":"player","text":"Are you working for Morwen? Why would anyone help her?"},{"who":"foe","text":"Because she promised to teach me spells no academy would. Real power, not lessons and homework."},{"who":"elowen","text":"Vesna. Morwen made me that same kind of promise once, long ago. It did not end well."},{"who":"player","text":"Professor? You knew Morwen?"},{"who":"elowen","text":"...We will talk about it later, {name}. Right now, mind the icicles."}],"explore":{"goal":"Slide across the glittering Frostveil Glacier and gather snowflake gems while ice wisps swirl around you.","collectible":"snowflake","minion":"wisp"},"gate":{"speaker":"A frozen mirror in Vesna's tower","line":"I reflect only what you truly know. Look into me and answer."},"foe":{"name":"Vesna the Ice Witch","kind":"witch","palette":"frost","weak":"fire","resist":"ice","boss":false,"taunts":["My frost is sharper than any lesson!","Morwen will make me the Queen of Winter!","You cannot out-cold me, little spark!"],"attacks":["Icicle Rain","Frozen Mirror","Glacier Grip"],"defeat":"Vesna's crown of icicles melts into drops. 'Maybe... maybe homework isn't so bad,' she sniffs, and flies off on a snowy breeze."},"outro":[{"who":"narrator","text":"Vesna's tower softens and sighs, and a glowing page floats down from its very top."},{"who":"player","text":"Professor, you said Morwen made you a promise. What did you mean?"},{"who":"elowen","text":"She was a student at Starfall when I was. Brilliant. Funny. She wanted to know everything."},{"who":"bramble","text":"That sounds suspiciously like someone I know. Ahem. {name}."},{"who":"elowen","text":"That is exactly what worries me, Bramble. Wanting to know everything is wonderful, until you stop wanting to share it."},{"who":"theo","text":"The page shows an enormous figure carved into the glacier. Please tell me that is a statue."}],"page":{"title":"The Page of Winter Light","lore":"Snow is made of countless tiny crystals, and no two are alike. This page says that every learner shines in their own pattern."}},{"n":22,"act":3,"title":"The Sleeping Giant","location":"Frostveil Glacier, Giant's Hollow","biome":"ice","time":"dusk","intro":[{"who":"narrator","text":"Deep in a hollow of the glacier, a giant made of ice and stone sits slumped against a frozen cliff."},{"who":"theo","text":"Not a statue. Definitely not a statue. Statues don't snore."},{"who":"bramble","text":"Let us tiptoe. Or in my case, tip-talon. Quietly, quietly, absolutely nobody sneeze."},{"who":"narrator","text":"A snowflake lands on Bramble's beak. He wobbles. He squints. He sneezes enormously."},{"who":"bramble","text":"ACHOO! ...In my defense, the snowflake started it."},{"who":"foe","text":"WHO DISTURBS HRIMM? I have slept here for a thousand winters and dreamed of quiet!"},{"who":"player","text":"We're sorry! We're looking for a page of the Grand Grimoire. Have you seen one?"},{"who":"foe","text":"The shadow witch gave me a page to guard. She said little thieves would come. You look like little thieves."},{"who":"elowen","text":"Hrimm, we are not thieves. That page belongs to everyone, including you."},{"who":"foe","text":"Then prove it, small one! Hrimm only respects those who stand their ground!"}],"choice":{"prompt":"Hrimm towers above you. How does {name} stand her ground?","options":[{"text":"Raise an Aegis shield","reply":"Your shield glows bright and steady. Hrimm grunts, impressed.","reward":"hp"},{"text":"Ask Theo for a warming potion","reply":"Theo hands you a fizzy orange potion. It tastes like cinnamon and courage.","reward":"potion"}]},"explore":{"goal":"Explore the echoing halls of Giant's Hollow and collect glowing runestones before Hrimm fully wakes.","collectible":"runestone","minion":"bat"},"gate":{"speaker":"A frost rune carved on Hrimm's door","line":"Giants guard with muscle, but runes guard with words. Speak the right one."},"foe":{"name":"Hrimm the Frost Giant","kind":"brute","palette":"stone","weak":"fire","resist":"ice","boss":false,"taunts":["Hrimm is mountain! Mountains do not move!","Tiny spells tickle Hrimm!","Back to bed after I squash you!"],"attacks":["Glacier Fist","Thousand-Winter Yawn","Frozen Earthquake"],"defeat":"Hrimm sits down with a THUMP that shakes the glacier. 'You stood your ground, small one. Take the page. Hrimm will go back to sleep now.'"},"outro":[{"who":"narrator","text":"Hrimm gently opens his giant fist. A tiny glowing page rests in his palm like a firefly."},{"who":"foe","text":"Wake me if the witch returns. Hrimm does not like being tricked."},{"who":"player","text":"Thank you, Hrimm. Sleep well."},{"who":"bramble","text":"And pleasant dreams. Ideally ones that do not involve squashing owls."},{"who":"theo","text":"{name}, look at the sky. Those dark clouds are moving against the wind. That's not weather, that's wings."},{"who":"elowen","text":"A storm wyvern. Morwen is sending her fastest hunters now. She knows we are getting close."}],"page":{"title":"The Page of Old Stone","lore":"Mountains grow so slowly that a giant's nap is just a moment to them. This page tells how ice carved the valleys over ages."}},{"n":23,"act":3,"title":"Wings of the Storm","location":"Thunderhorn Ridge","biome":"mountain","time":"night","intro":[{"who":"narrator","text":"Lightning cracks over Thunderhorn Ridge. Every flash lights up a winged shape circling above."},{"who":"theo","text":"Okay. Okay okay okay. I'm fine. I'm totally fine. Bramble, am I fine?"},{"who":"bramble","text":"You are a pale shade of terrified, Theo, but very bravely so."},{"who":"foe","text":"SKREEEE! I am Galeshrike, fastest wing of the Peaks! The Shadow Witch says I may keep whatever I catch!"},{"who":"player","text":"We're not snacks! And Bramble is definitely not a snack!"},{"who":"bramble","text":"I am, at most, a light appetizer. Wait, that came out wrong."},{"who":"narrator","text":"Galeshrike dives, and Elowen throws up a wall of wind. For a moment, her face looks very sad in the lightning."},{"who":"elowen","text":"Morwen and I used to watch storms like this from the Starfall bell tower. She would count the seconds between flashes."},{"who":"player","text":"Professor... were you and Morwen friends?"},{"who":"elowen","text":"The best of friends, {name}. Now, focus! Here it comes!"}],"explore":{"goal":"Scramble along the thundering ridge and gather storm feathers while dodging crackling wisps.","collectible":"feather","minion":"wisp"},"gate":{"speaker":"A copper weathervane spinning in the wind","line":"I point whichever way the wind blows, but answers must point true. Try me."},"foe":{"name":"Galeshrike the Storm Wyvern","kind":"dragon","palette":"storm","weak":"ice","resist":"lightning","boss":false,"taunts":["Too slow, too slow, scholar!","I ride the lightning itself!","Catch me if you can! You can't!"],"attacks":["Thunder Dive","Cyclone Wings","Static Screech"],"defeat":"Frost coats Galeshrike's wings and she lands with a huff. 'Fine! You're quick for a groundling.' She flaps off, sulking into the clouds."},"outro":[{"who":"narrator","text":"The storm breaks apart, and stars appear. A page drifts down, crackling with tiny sparks."},{"who":"player","text":"Professor, why didn't you tell us you were Morwen's best friend?"},{"who":"elowen","text":"Because I am not proud of how our friendship ended. I will tell you all of it, I promise. When the time is right."},{"who":"bramble","text":"Adults always say 'when the time is right.' It is never right. I have been waiting for dessert since Act One."},{"who":"theo","text":"The page shows a cave full of ice and something drifting inside it. Something see-through."},{"who":"elowen","text":"The Wailing Caves. Be brave, all of you. Ghosts are mostly lonely, not wicked."}],"page":{"title":"The Page of Thunderclouds","lore":"Lightning is far hotter than the surface of the sun, and thunder is the sound of air rushing apart. This page hums when storms are near."}},{"n":24,"act":3,"title":"The Wailing Caves","location":"The Wailing Ice Caves","biome":"cave","time":"night","intro":[{"who":"narrator","text":"Inside the Wailing Caves, the ice glows a soft, ghostly blue. A mournful sound echoes from deep below."},{"who":"theo","text":"I made a lantern potion. It glows when it's scared. It is glowing a LOT right now."},{"who":"bramble","text":"Fear not. I have excellent night vision, a brave heart, and only a mild desire to flee."},{"who":"narrator","text":"A cold mist gathers into the shape of a tall figure in a tattered frost cloak."},{"who":"foe","text":"Ooooo... I am the Frozen Wraith. I was a mountain guide, once. Morwen froze me here to guard her page."},{"who":"player","text":"That's awful. How long have you been down here?"},{"who":"foe","text":"So long I have forgotten the warmth of a campfire. Leave me the page and leave me alone."},{"who":"elowen","text":"The cure for this curse is warmth, {name}. Not just fire. Warmth."},{"who":"player","text":"Then I'll bring all the warmth I've got."},{"who":"foe","text":"You will try... and you will freeze, like all the others!"}],"explore":{"goal":"Light your way through the glowing ice caves and collect lost lanterns while frost bats flutter past.","collectible":"lantern","minion":"bat"},"gate":{"speaker":"The echo of the caves","line":"Caves... caves... caves... I repeat what I hear, but you must find the answer yourself."},"foe":{"name":"The Frozen Wraith","kind":"wraith","palette":"frost","weak":"fire","resist":"ice","boss":false,"taunts":["Cold... so cold... join me...","Your warmth will fade like all the rest!","Ooooo, shiver for me!"],"attacks":["Chilling Wail","Frostbite Touch","Blizzard Veil"],"defeat":"The frost melts from the wraith's cloak, and a smiling old guide fades into soft light. 'Thank you, child. I can finally go home.'"},"outro":[{"who":"narrator","text":"Where the wraith stood, a page burns with warm red-gold light, like a tiny sunrise."},{"who":"elowen","text":"This one is special, {name}. It holds the fire of falling stars. Read the power word."},{"who":"player","text":"Fire from the heavens, fall and shine. Meteor! Whoa, a blazing rock just zoomed across the ceiling!"},{"who":"bramble","text":"Note to self: never, ever steal blueberries from {name} again. Probably."},{"who":"theo","text":"Meteor is one of the strongest spells in the whole Grimoire. My textbook said so. Page four hundred and twelve."},{"who":"elowen","text":"The guide's last words told me where Morwen's lieutenant waits. The frozen monastery, beyond the avalanche fields."}],"page":{"title":"The Page of Falling Stars","lore":"Meteors are space rocks that glow as they rush through the air. This page burns warm even inside a glacier."}},{"n":25,"act":3,"title":"The Avalanche Fields","location":"Rumbleslope","biome":"mountain","time":"day","intro":[{"who":"narrator","text":"Beyond the caves lie the Avalanche Fields, a steep slope of heavy snow that rumbles at every step."},{"who":"theo","text":"Rule one of avalanche fields: no loud noises. Rule two: see rule one."},{"who":"bramble","text":"Then I shall speak only in whispers. Very dramatic, sophisticated whispers."},{"who":"narrator","text":"The snow shifts. A huge shape rises, made of boulders, snowpacks and ice, with two glowing shadow-eyes."},{"who":"foe","text":"RUMBLE. RUMBLE. Intruders on the slope. Intruders must slide all the way down."},{"who":"player","text":"Is that the Avalanche Golem? It's built out of the whole mountainside!"},{"who":"elowen","text":"Morwen gave it shadow-life. Somewhere in its chest is a dark rune holding it together."},{"who":"theo","text":"If we break the rune, the golem turns back into plain old snow! I think. Probably. Eighty percent sure."},{"who":"bramble","text":"Eighty percent! I love those odds. Said no owl ever."},{"who":"foe","text":"RUMBLE! Slide, little ones! SLIDE!"}],"choice":{"prompt":"The slope trembles under {name}'s feet. What's the plan?","options":[{"text":"Find a safe path with Theo's map","reply":"Theo traces a rocky ridge on his map. You reach solid ground just in time.","reward":"xp"},{"text":"Shield everyone with Aegis","reply":"A shining dome keeps the snow off your friends. Everyone cheers, quietly.","reward":"hp"},{"text":"Drink a quick energy potion","reply":"Fizz! Your magic tingles all the way to your fingertips.","reward":"mp"}]},"explore":{"goal":"Hop across the trembling slopes and gather pinecones while rolling snowball sprites tumble downhill.","collectible":"pinecone","minion":"snowball"},"gate":{"speaker":"A wise mountain goat on a ledge","line":"I've climbed every cliff in these Peaks. To pass my ledge, you must climb a thought."},"foe":{"name":"The Avalanche Golem","kind":"brute","palette":"stone","weak":"fire","resist":"ice","boss":false,"taunts":["RUMBLE! You cannot stop a mountain!","Snow falls down. So will you!","Heavy, heavy, HEAVY!"],"attacks":["Boulder Roll","Snowslide Slam","Frozen Rubble"],"defeat":"The shadow rune cracks, and the golem slumps into a harmless heap of snow. One small snowman head is left, smiling."},"outro":[{"who":"narrator","text":"In the heap of snow, a page glows like a lantern. Bramble pecks the leftover snowman head affectionately."},{"who":"bramble","text":"I shall name him Sir Rumbles. He is my new favorite golem."},{"who":"player","text":"I got the page! It's covered in drawings of buildings with bells and gardens."},{"who":"elowen","text":"The Frostbell Monastery. Scholars lived there long ago, sharing books with every traveler."},{"who":"theo","text":"And now Morwen's lieutenant lives there. Sable, the Shadow Knight. That's what the guide said."},{"who":"elowen","text":"Rest tonight, {name}. Sable is clever and strong, and she knows Morwen better than anyone. Except me."}],"page":{"title":"The Page of Moving Snow","lore":"Snow on a steep slope can slide all at once, so mountain folk learned to read the snow like a book. This page is a warning and a guide."}},{"n":26,"act":3,"title":"The Shadow Knight of Frostbell","location":"Frostbell Monastery","biome":"ruins","time":"dusk","intro":[{"who":"narrator","text":"The Frostbell Monastery sits on a cliff, its silent bells crusted with ice. Shadows move behind the windows."},{"who":"theo","text":"Do you hear that? It's quiet. Too quiet. I hate when it's too quiet."},{"who":"bramble","text":"I could fill the silence with a lecture on the history of bells. It
