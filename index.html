a gentle kind of ____.","meaning":"When a volcano bursts out lava, ash, or gas.","wrong":["erupshun","eruptian","erruption"]},{"word":"dangerous","sentence":"Even though volcanoes can be ____, they also help our planet.","meaning":"Able to cause harm.","wrong":["dangerus","dangeros","dangerouse"]},{"word":"violently","sentence":"Some volcanoes can explode ____, blasting ash into the sky.","meaning":"With great and sudden force.","wrong":["violentley","voilently","violintly"]},{"word":"underground","sentence":"Magma collects in an ____ pool called a magma chamber.","meaning":"Below the surface of the ground.","wrong":["undergrownd","undergound","undergraund"]},{"word":"extinct","sentence":"An ____ volcano will probably never erupt again.","meaning":"No longer active.","wrong":["extinked","extinkt","exstinct"]}],"written":[{"q":"Explain in your own words how a volcano erupts.","minWords":12,"keyIdeas":[{"label":"Magma (melted rock) rises from deep underground","any":["magma","melt","rise","hot rock","underground"]},{"label":"Pressure from magma and gas builds up","any":["pressure","build","gas","push"]},{"label":"Lava bursts out of the top or through cracks","any":["burst","erupt","lava","explo","out","crack","shoot"]}],"need":2,"sample":"Deep underground, hot magma rises and collects in a magma chamber. Gas and magma build up until the pressure is too great. Then the volcano erupts, and lava bursts out of the top or through cracks."},{"q":"Volcanoes can be dangerous, but how do they also help our planet? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Volcanic ash turns into rich soil","any":["soil","ash","dirt","fertil","ground"]},{"label":"Rich soil helps crops and plants grow","any":["crop","farm","plant","grow","food"]},{"label":"Volcanoes build new land and islands","any":["island","new land","land","build","hawaii"]}],"need":2,"sample":"Over time, volcanic ash breaks down into rich soil that is great for growing crops. Volcanoes also build new land when lava cools and hardens. Some islands, like Hawaii, were made by volcanoes."}],"fixit":[{"wrong":"The volcano erupt last year and lava flowed down it's sides.","right":"The volcano erupted last year, and lava flowed down its sides.","errors":[{"bad":"erupt","good":"erupted","type":"Verb Tense"},{"bad":"year","good":"year,","type":"Punctuation"},{"bad":"it's","good":"its","type":"Homophones"}]},{"wrong":"the volcanoes of hawaii have runny lava.","right":"The volcanoes of Hawaii have runny lava.","errors":[{"bad":"the","good":"The","type":"Capital Letters"},{"bad":"hawaii","good":"Hawaii","type":"Capital Letters"}]}]},{"id":"earthquakes","title":"When the Ground Shakes","category":"Earth","emoji":"🏚️","minutes":4,"paragraphs":["Imagine you are sitting at your desk when suddenly your pencil starts to roll. The windows rattle, and the floor sways like a boat on the water. After a few seconds, everything stops. You have just felt an earthquake! Earthquakes happen when the ground suddenly shakes, and they are caused by giant movements deep inside Earth.","To understand earthquakes, picture Earth like a hard-boiled egg with a cracked shell. Earth's outer layer, called the crust, is broken into huge pieces called tectonic plates. These plates fit together like pieces of a jigsaw puzzle. They rest on a layer of hot rock that flows very slowly. The plates are always moving, but only about as fast as your fingernails grow.","The edges where plates meet are called plate boundaries. In some places, plates push against each other. In other places, they pull apart or slide past one another. Often the edges get stuck because the rocks are rough and jagged. Pressure builds up for years and years. Finally, the rocks snap and slip all at once. That sudden slip sends waves of energy through the ground, and we feel the shaking.","Try this: press your palms together hard and slowly try to slide them past each other. Do you feel how they stick and then suddenly jump? That jump is a little like an earthquake. The place underground where the rocks first break is called the focus. The spot on the surface right above it is called the epicenter. The shaking is usually strongest near the epicenter.","Scientists who study earthquakes are called seismologists. They use machines called seismometers to measure how much the ground moves. Small earthquakes happen thousands of times every day around the world, but most are too weak for people to notice. Large ones are much rarer. A strong earthquake can crack roads, knock down buildings, and even cause giant ocean waves called tsunamis.","Earthquakes cannot be stopped, but people can prepare for them. Engineers design buildings that bend and sway instead of breaking. Schools practice earthquake drills. If you ever feel the ground shake, remember three words: drop, cover, and hold on. Drop to your hands and knees, cover your head under a sturdy table, and hold on until the shaking stops. Knowing what to do helps you stay safe and calm."],"funFact":"Because the plates are always moving, the continents were once all joined together in one giant supercontinent called Pangaea, more than 200 million years ago.","vocab":[{"word":"tectonic plates","meaning":"Giant pieces of Earth's crust that slowly move."},{"word":"boundaries","meaning":"The edges or lines where two areas meet."},{"word":"epicenter","meaning":"The spot on the surface right above where an earthquake starts."},{"word":"seismometers","meaning":"Machines that measure how much the ground shakes."},{"word":"tsunamis","meaning":"Giant ocean waves often caused by earthquakes under the sea."}],"comprehension":[{"q":"What is the main idea of the article?","options":["How to build a sandcastle","What causes earthquakes and how people stay safe","Why eggs crack when boiled","How fast fingernails grow"],"answer":1,"explain":"Great job! The article explains what causes earthquakes and how people can prepare for them."},{"q":"How fast do tectonic plates move?","options":["As fast as a car","As fast as a running cheetah","About as fast as a river flows","About as fast as your fingernails grow"],"answer":3,"explain":"Yes! The article says the plates move only about as fast as your fingernails grow."},{"q":"What happens right before the rocks snap and slip?","options":["The plates stop moving forever","An ocean wave forms","Pressure builds up for years where the edges are stuck","Scientists ring an alarm"],"answer":2,"explain":"Right! The text says pressure builds up for years and years, and then the rocks snap and slip."},{"q":"What is the 'epicenter'?","options":["The spot on the surface right above where the rocks first break","A machine that measures shaking","A kind of ocean wave","The middle of a building"],"answer":0,"explain":"Nice! The article says the epicenter is the spot on the surface right above the focus."},{"q":"Why do engineers design buildings that bend and sway?","options":["So the buildings look like trees","So people can feel the shaking more","So the buildings can be built faster","So the buildings are less likely to break during an earthquake"],"answer":3,"explain":"Exactly! The article says these buildings bend and sway instead of breaking."}],"grammar":[{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["Drop, cover and, hold on.","Drop cover, and hold on.","Drop, cover, and hold on.","Drop cover and hold, on."],"answer":2,"explain":"Well done! Commas separate each of the three actions in the list."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'The tectonic plates ____ very slowly.'","options":["moves","move","is moving","has moved"],"answer":1,"explain":"Yes! 'Plates' is plural, so it needs the plural verb 'move.'"},{"skill":"Adverbs","q":"Which word is the ADVERB in this sentence: 'The ground suddenly shakes.'","options":["suddenly","ground","shakes","The"],"answer":0,"explain":"Correct! 'Suddenly' tells HOW the ground shakes, so it is an adverb."},{"skill":"Sentence Types","q":"What kind of sentence is this: 'Earthquakes cannot be stopped.'","options":["A question","A command","An exclamation","A statement"],"answer":3,"explain":"Great! This sentence tells a fact and ends with a period, so it is a statement."}],"spelling":[{"word":"earthquake","sentence":"If you feel the ground shake, you are feeling an ____.","meaning":"A sudden shaking of the ground.","wrong":["erthquake","earthquak","earthqake"]},{"word":"tectonic","sentence":"Earth's crust is broken into huge pieces called ____ plates.","meaning":"Having to do with the moving pieces of Earth's crust.","wrong":["techtonic","tectonick","tektonic"]},{"word":"puzzle","sentence":"The plates fit together like pieces of a jigsaw ____.","meaning":"A game where you fit pieces together.","wrong":["puzzel","puzle","puzzul"]},{"word":"boundaries","sentence":"The edges where plates meet are called plate ____.","meaning":"Edges or lines where two areas meet.","wrong":["boundarys","boundries","boundaryes"]},{"word":"buildings","sentence":"A strong earthquake can knock down ____.","meaning":"Structures with walls and a roof, like houses.","wrong":["bildings","buildins","biuldings"]},{"word":"practice","sentence":"Schools ____ earthquake drills.","meaning":"To do something again and again to get better.","wrong":["practis","praktice","practace"]}],"written":[{"q":"In your own words, explain what causes an earthquake.","minWords":12,"keyIdeas":[{"label":"Earth's crust is broken into moving plates","any":["plate","tectonic","crust","piece"]},{"label":"Plate edges get stuck and pressure builds","any":["stuck","pressure","build","push","press"]},{"label":"The rocks suddenly snap or slip and send out waves","any":["snap","slip","break","jump","wave","energy","sudden"]}],"need":2,"sample":"Earth's crust is broken into huge pieces called tectonic plates that slowly move. Sometimes their edges get stuck and pressure builds up. When the rocks suddenly snap and slip, waves of energy shake the ground."},{"q":"Why is it a good idea to get under a sturdy table during an earthquake?","minWords":10,"keyIdeas":[{"label":"It protects your head and body","any":["protect","head","safe","cover","shield","hurt","injur"]},{"label":"Things might fall or break during the shaking","any":["fall","drop","break","crash","debris","glass","ceiling","object","stuff"]},{"label":"A sturdy table is strong","any":["sturdy","strong","hold","won't break","not break"]}],"need":2,"sample":"During an earthquake, things like books, lights, or pieces of the ceiling might fall. A sturdy table is strong, so it can protect your head and body. That is why you drop, cover, and hold on."}],"fixit":[{"wrong":"the tectonic plates moves very slowly","right":"The tectonic plates move very slowly.","errors":[{"bad":"the","good":"The","type":"Capital Letters"},{"bad":"moves","good":"move","type":"Subject-Verb Agreement"},{"bad":"slowly","good":"slowly.","type":"Punctuation"}]},{"wrong":"Earthquakes can crack rodes, knock down buildings and cause tsunamis.","right":"Earthquakes can crack roads, knock down buildings, and cause tsunamis.","errors":[{"bad":"rodes,","good":"roads,","type":"Spelling"},{"bad":"buildings","good":"buildings,","type":"Punctuation"}]}]},{"id":"water-cycle","title":"The Amazing Journey of Water","category":"Earth","emoji":"💧","minutes":4,"paragraphs":["Here is a mind-blowing idea: the water you drank today might once have been sipped by a dinosaur! That is because Earth keeps using the same water over and over. The water moves around our planet again and again. It travels from the oceans to the sky, down to the land, and back again. This never-ending trip is called the water cycle.","The journey begins with the Sun. When sunlight warms the water in oceans, lakes, and puddles, some of it turns into an invisible gas called water vapor. This change is called evaporation. You have seen evaporation in action if you have ever watched a puddle shrink and disappear on a sunny afternoon. Plants help too. They release water vapor from tiny holes in their leaves.","Warm air carries the water vapor high into the sky, where the air is much colder. The cold air makes the vapor cool down and turn back into tiny droplets of liquid water. This step is called condensation. Millions of these tiny droplets gather together to form clouds. You can see condensation at home, too. Think of the water drops that appear on the outside of a cold glass of lemonade on a hot day.","Inside a cloud, the tiny droplets bump into each other and join together. They grow bigger and heavier. When they become too heavy to float, they fall back to Earth. Water falling from the sky is called precipitation. It can be rain, snow, sleet, or hail, depending on how cold the air is.","When precipitation reaches the ground, it has several places to go. Some water flows across the land into streams and rivers. This is called runoff. The rivers carry the water back to lakes and oceans. Some water soaks deep into the soil and becomes groundwater, which people sometimes pump up from wells. In very cold places, water can stay frozen in a glacier for thousands of years before it melts.","Then the cycle starts all over again! The water cycle is very important for every living thing. It brings fresh water to plants, animals, and people. It fills our rivers and helps crops grow. Next time you splash in a puddle or watch the rain, remember that you are part of an amazing journey that has been going on for billions of years."],"funFact":"About 97 percent of Earth's water is salty ocean water. Most of the fresh water is frozen in ice, so only a tiny part is easy for people to use.","vocab":[{"word":"vapor","meaning":"Water in the form of an invisible gas."},{"word":"evaporation","meaning":"When liquid water warms up and turns into a gas."},{"word":"condensation","meaning":"When water vapor cools and turns back into liquid drops."},{"word":"precipitation","meaning":"Water that falls from clouds as rain, snow, sleet, or hail."},{"word":"groundwater","meaning":"Water that soaks into the soil and stays underground."}],"comprehension":[{"q":"What is this article mostly about?","options":["Dinosaurs drank a lot of water","How to make lemonade","Why puddles are fun to splash in","Water moves around Earth in a never-ending cycle"],"answer":3,"explain":"Great job! The article follows water on its never-ending trip called the water cycle."},{"q":"According to the article, what starts the water's journey?","options":["The Sun","The Moon","The wind","Volcanoes"],"answer":0,"explain":"Yes! The article says, 'The journey begins with the Sun.'"},{"q":"Which step comes right after evaporation?","options":["Precipitation","Runoff","Condensation","Groundwater"],"answer":2,"explain":"Right! After water vapor rises, it cools and turns into droplets, which is condensation."},{"q":"In the article, what does 'precipitation' mean?","options":["Water soaking into soil","Water falling from the sky as rain, snow, sleet, or hail","Water vapor rising into the air","Ice inside a glacier"],"answer":1,"explain":"Nice! The article says water falling from the sky is called precipitation."},{"q":"Why do droplets in a cloud fall to Earth?","options":["The Sun pushes them down","Birds fly through the clouds","They join together and become too heavy to float","The cloud runs out of room"],"answer":2,"explain":"Exactly! The article says the droplets grow bigger and heavier until they are too heavy to float."}],"grammar":[{"skill":"Homophones","q":"Choose the correct word: 'Plants release water vapor from ____ leaves.'","options":["there","they're","their","thier"],"answer":2,"explain":"Well done! 'Their' shows that the leaves belong to the plants."},{"skill":"Prepositions","q":"Which word is the PREPOSITION in this sentence: 'Water drops appear on the glass.'","options":["on","Water","appear","glass"],"answer":0,"explain":"Yes! 'On' shows where the water drops are in relation to the glass."},{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'The cold rain falls gently.'","options":["cold","rain","falls","gently"],"answer":1,"explain":"Correct! 'Rain' names a thing, so it is a noun."},{"skill":"Conjunctions","q":"Which conjunction best completes the sentence: 'It can be rain, snow, sleet, ____ hail.'","options":["but","because","so","or"],"answer":3,"explain":"Great! 'Or' is used when there are choices, and precipitation can be any one of these."}],"spelling":[{"word":"evaporation","sentence":"When sunlight turns liquid water into vapor, the change is called ____.","meaning":"When liquid water turns into a gas.","wrong":["evaperation","evaporashun","evoporation"]},{"word":"dinosaur","sentence":"The water you drank today might once have been sipped by a ____.","meaning":"A giant reptile that lived long ago.","wrong":["dinosor","dinasaur","dinosaure"]},{"word":"journey","sentence":"The ____ of water begins with the Sun.","meaning":"A long trip from one place to another.","wrong":["jurney","journy","journee"]},{"word":"droplets","sentence":"Millions of tiny ____ gather together to form clouds.","meaning":"Very small drops of liquid.","wrong":["droplits","dropplets","drooplets"]},{"word":"glacier","sentence":"Water can stay frozen in a ____ for thousands of years.","meaning":"A huge, slow-moving body of ice.","wrong":["glasier","glaicer","glacir"]},{"word":"important","sentence":"The water cycle is very ____ for every living thing.","meaning":"Mattering a lot.","wrong":["importent","importint","impotant"]}],"written":[{"q":"Describe the steps of the water cycle in your own words.","minWords":15,"keyIdeas":[{"label":"Water evaporates into vapor","any":["evaporat","vapor","gas","heat","warm","sun"]},{"label":"Vapor cools and condenses into clouds","any":["condens","cloud","droplet","cool"]},{"label":"Water falls as precipitation","any":["precipitat","rain","snow","fall","sleet","hail"]},{"label":"Water collects in rivers, oceans, or the ground and starts again","any":["river","ocean","lake","runoff","groundwater","collect","soak","again","repeat"]}],"need":3,"sample":"First, the Sun warms water and it evaporates into water vapor. The vapor cools high in the sky and condenses into clouds. When the drops get heavy, they fall as rain or snow, then flow back to rivers and oceans to start again."},{"q":"What would happen to a puddle on a hot, sunny day? Explain why.","minWords":10,"keyIdeas":[{"label":"The puddle would shrink or disappear","any":["shrink","disappear","dry","gone","smaller","vanish","away"]},{"label":"The water evaporates into vapor","any":["evaporat","vapor","gas","air"]},{"label":"The Sun's heat causes it","any":["sun","heat","hot","warm"]}],"need":2,"sample":"The puddle would slowly shrink and disappear. The heat from the Sun warms the water and turns it into water vapor, which goes up into the air. This is called evaporation."}],"fixit":[{"wrong":"Plants release water vapor from there leafs.","right":"Plants release water vapor from their leaves.","errors":[{"bad":"there","good":"their","type":"Homophones"},{"bad":"leafs.","good":"leaves.","type":"Plurals"}]},{"wrong":"yesterday it rain all afternoon","right":"Yesterday it rained all afternoon.","errors":[{"bad":"yesterday","good":"Yesterday","type":"Capital Letters"},{"bad":"rain","good":"rained","type":"Verb Tense"},{"bad":"afternoon","good":"afternoon.","type":"Punctuation"}]}]},{"id":"wild-weather","title":"Wild Winds: Tornadoes and Hurricanes","category":"Earth","emoji":"🌪️","minutes":4,"paragraphs":["Some of the most powerful storms on Earth are made of spinning wind. Tornadoes and hurricanes both twist and whirl, but they are very different. A tornado is like a fast, narrow spinning top. A hurricane is like a giant, slow pinwheel that can be wider than a whole state. Let's find out what makes each one so wild.","A tornado is a spinning column of air that stretches from a thunderstorm cloud down to the ground. Tornadoes can form when warm, wet air near the ground crashes into cool, dry air. This can create a huge, rotating thunderstorm. Sometimes a funnel twists down from the bottom of the storm. When that funnel touches the ground, it becomes a tornado. The winds in the strongest tornadoes can blow faster than 200 miles per hour!","Most tornadoes last only a few minutes, but they can be very destructive. They can rip roofs off houses and toss cars like toys. The United States has more tornadoes than any other country. Many of them happen in an area in the middle of the country nicknamed Tornado Alley. Spring is the busiest season there.","Hurricanes are much bigger storms that form over warm ocean water. The warm water heats the air above it, and the air rises quickly. As more warm, wet air rushes in, the storm begins to spin around a calm center called the eye. Inside the eye, the sky may be clear and the wind may be still. Around the eye is the eyewall, where the strongest winds and heaviest rain swirl. A hurricane can last for days or even a couple of weeks.","When a hurricane reaches land, it can bring strong winds, flooding rain, and a dangerous rise in ocean water called a storm surge. Over land, hurricanes slowly lose power because they no longer have warm ocean water to feed them. Weather experts give hurricanes names, like Maria or Ian, so people can keep track of them easily.","Meteorologists, the scientists who study weather, use radar and satellites to track these storms. They send out warnings so families have time to get ready. If there is a tornado warning, go to a basement or an inside room without windows. If a hurricane is coming, people may need to leave the coast. Wild weather can be scary, but being prepared helps everyone stay safe."],"funFact":"Hurricanes north of the equator spin counterclockwise, but the same kind of storm south of the equator spins clockwise!","vocab":[{"word":"rotating","meaning":"Spinning around and around a center."},{"word":"funnel","meaning":"A shape that is wide at the top and narrow at the bottom."},{"word":"destructive","meaning":"Causing a lot of damage."},{"word":"storm surge","meaning":"A rise of ocean water pushed onto land by a hurricane."},{"word":"meteorologists","meaning":"Scientists who study and predict the weather."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Tornadoes and hurricanes are powerful spinning storms that form in different ways","Spinning tops are fun toys","Tornadoes only happen over the ocean","Hurricanes are smaller than tornadoes"],"answer":0,"explain":"Great job! The article compares these two spinning storms and explains how each one forms."},{"q":"Where do hurricanes form?","options":["In deserts","Over cold mountains","Over warm ocean water","Inside small clouds on land"],"answer":2,"explain":"Yes! The article says hurricanes are big storms that form over warm ocean water."},{"q":"Why do hurricanes lose power over land?","options":["They run into tall buildings","The eye closes up","They get too cold from snow","They no longer have warm ocean water to feed them"],"answer":3,"explain":"Right! The text says hurricanes lose power over land because warm ocean water is what feeds them."},{"q":"The article says tornadoes can be 'destructive.' What does destructive mean?","options":["Very quiet","Causing a lot of damage","Easy to predict","Full of rain"],"answer":1,"explain":"Nice! The next sentence says tornadoes rip roofs off houses and toss cars, which is a lot of damage."},{"q":"Why is a room without windows a good place to go during a tornado warning?","options":["Wind and flying glass cannot reach you as easily","It is the warmest room","You can watch the storm better","Tornadoes cannot find rooms without windows"],"answer":0,"explain":"Exactly! Without windows, strong winds and broken glass are less likely to hurt you."}],"grammar":[{"skill":"Adjectives","q":"Which word is an ADJECTIVE in this sentence: 'The fierce wind howled.'","options":["wind","howled","fierce","The"],"answer":2,"explain":"Well done! 'Fierce' describes the wind, so it is an adjective."},{"skill":"Capital Letters","q":"Which sentence uses capital letters correctly?","options":["many tornadoes happen in the united states.","Many tornadoes happen in the United States.","Many Tornadoes happen in the united States.","Many tornadoes Happen in the United states."],"answer":1,"explain":"Yes! The first word and the name of a country, the United States, need capital letters."},{"skill":"Verb Tenses","q":"Which verb completes this sentence in the PAST tense: 'Yesterday, the storm ____ the roof off a barn.'","options":["rips","will rip","is ripping","ripped"],"answer":3,"explain":"Correct! 'Yesterday' tells us it already happened, so we use the past tense 'ripped.'"},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'A hurricane ____ over warm ocean water.'","options":["forms","form","are forming","have formed"],"answer":0,"explain":"Great! 'Hurricane' is singular, so it needs the singular verb 'forms.'"}],"spelling":[{"word":"tornado","sentence":"A ____ is a spinning column of air that touches the ground.","meaning":"A fast, spinning windstorm shaped like a funnel.","wrong":["tornadoe","tornaydo","tornato"]},{"word":"hurricane","sentence":"A ____ forms over warm ocean water.","meaning":"A huge spinning storm that forms over the ocean.","wrong":["huricane","hurricain","hurrycane"]},{"word":"satellite","sentence":"Meteorologists use radar and a weather ____ to track storms.","meaning":"A machine that circles Earth in space.","wrong":["satelite","sattelite","satellight"]},{"word":"column","sentence":"A tornado is a spinning ____ of air.","meaning":"A tall, narrow shape that stands up straight.","wrong":["colum","collumn","colunm"]},{"word":"prepared","sentence":"Being ____ helps everyone stay safe.","meaning":"Ready ahead of time.","wrong":["prepaired","prepard","perpared"]},{"word":"narrow","sentence":"A tornado is like a fast, ____ spinning top.","meaning":"Thin, not wide.","wrong":["narow","narrough","naro"]}],"written":[{"q":"Explain how a hurricane is different from a tornado.","minWords":12,"keyIdeas":[{"label":"Hurricanes are much bigger","any":["bigger","huge","wide","giant","large","state"]},{"label":"Hurricanes form over warm ocean water","any":["ocean","sea","water","warm"]},{"label":"Tornadoes come down from thunderstorms","any":["thunderstorm","funnel","ground","land","narrow","cloud"]},{"label":"Tornadoes last minutes, but hurricanes last days","any":["minute","day","week","longer","last"]}],"need":2,"sample":"A hurricane is much bigger than a tornado and can be wider than a whole state. Hurricanes form over warm ocean water, but tornadoes come down from thunderstorms on land. Tornadoes usually last a few minutes, while hurricanes can last for days."},{"q":"Why do hurricanes get weaker after they move over land?","minWords":10,"keyIdeas":[{"label":"There is no warm ocean water over land","any":["no warm","no ocean","no water","ocean","sea","water"]},{"label":"Warm water is what feeds the storm","any":["feed","fuel","energy","power","food"]},{"label":"So they lose power and slow down","any":["lose","weak","slow","die","shrink","calm"]}],"need":2,"sample":"Hurricanes get their power from warm ocean water. Over land, there is no warm ocean water to feed them. So they slowly lose power and get weaker."}],"fixit":[{"wrong":"Meteorologists use radar and satelites to track storms","right":"Meteorologists use radar and satellites to track storms.","errors":[{"bad":"satelites","good":"satellites","type":"Spelling"},{"bad":"storms","good":"storms.","type":"Punctuation"}]},{"wrong":"Many tornadoes happens in tornado alley every spring.","right":"Many tornadoes happen in Tornado Alley every spring.","errors":[{"bad":"happens","good":"happen","type":"Subject-Verb Agreement"},{"bad":"tornado","good":"Tornado","type":"Capital Letters"},{"bad":"alley","good":"Alley","type":"Capital Letters"}]}]},{"id":"rocks-minerals","title":"Rocks Rock! The Story of Stones","category":"Earth","emoji":"💎","minutes":4,"paragraphs":["Pick up a rock and hold it in your hand. It may look plain and gray, but it has a story to tell. That rock might be millions of years old. It might have been melted, squished, or broken into pieces many times. Rocks are always changing, just very, very slowly. Let's discover how rocks form and what they are made of.","Every rock is made of minerals. A mineral is a natural, solid material that forms in the Earth and was never alive. Minerals are like the ingredients in a cookie. Just as a cookie can have flour, sugar, and chocolate chips, a rock can have several different minerals mixed together. Quartz, salt, and gold are all minerals. Many minerals grow into beautiful shapes called crystals, with flat sides and sharp edges.","Scientists sort rocks into three main groups. The first group is igneous rock. Igneous rock forms when hot, melted rock cools and hardens. Some igneous rock forms deep underground, where it cools slowly and grows large crystals. Granite is one example. Other igneous rock forms when lava cools quickly on the surface. Obsidian cools so fast that it looks like shiny black glass.","The second group is sedimentary rock. Wind, water, and ice break rocks into tiny bits of sand, mud, and pebbles called sediment. Rivers carry the sediment and drop it in lakes and oceans. Over thousands of years, layer after layer piles up, like the layers of a sandwich. The heavy layers press down and glue the bits together into solid rock. Sandstone is one example. Sedimentary rocks are where we often find fossils of ancient plants and animals.","The third group is metamorphic rock. The word metamorphic means 'changed form.' These rocks start out as one kind of rock. Then they get squeezed and heated deep inside the Earth, but they do not melt. The heat and pressure change them into a new kind of rock. For example, limestone can turn into marble, a smooth stone often used for statues.","Rocks can move from one group to another in a never-ending process called the rock cycle. An igneous rock can be broken into sediment and become sedimentary rock. That rock can get squeezed into metamorphic rock. Then it might melt into magma and cool into igneous rock again. The next time you find a pebble, remember that it might be on a journey that started before the dinosaurs!"],"funFact":"Diamonds and the gray 'lead' in your pencil are made of the same thing, called carbon! The tiny bits of carbon are just arranged in different ways.","vocab":[{"word":"minerals","meaning":"Natural solid materials that form in the Earth and were never alive."},{"word":"crystals","meaning":"Solid shapes with flat sides and sharp edges."},{"word":"sediment","meaning":"Tiny bits of sand, mud, and pebbles carried by water or wind."},{"word":"fossils","meaning":"Remains or prints of plants and animals from long ago, saved in rock."},{"word":"rock cycle","meaning":"The never-ending way rocks change from one kind to another."}],"comprehension":[{"q":"What is the main idea of this article?","options":["Cookies are made of minerals","Rocks are made of minerals and slowly change through the rock cycle","Gold is the most important mineral","Dinosaurs collected pebbles"],"answer":1,"explain":"Great job! The article explains what rocks are made of and how they change from one kind to another."},{"q":"How does igneous rock form?","options":["When hot, melted rock cools and hardens","When layers of mud press together","When shells are glued together by water","When rocks are squeezed but do not melt"],"answer":0,"explain":"Yes! The article says igneous rock forms when hot, melted rock cools and hardens."},{"q":"In the article, what does 'sediment' mean?","options":["A kind of shiny crystal","Melted rock under the ground","A smooth stone used for statues","Tiny bits of sand, mud, and pebbles"],"answer":3,"explain":"Right! The article says wind, water, and ice break rocks into tiny bits called sediment."},{"q":"Which of these is a correct path in the rock cycle?","options":["Marble turns into chocolate chips","Metamorphic rock turns straight into fossils","Igneous rock breaks into sediment and becomes sedimentary rock","Sedimentary rock turns into lava in the sky"],"answer":2,"explain":"Nice! The article says an igneous rock can be broken into sediment and become sedimentary rock."},{"q":"Why are fossils usually found in sedimentary rock instead of igneous rock?","options":["Fossils like cold places","Igneous rock is too soft","Fossils are made of marble","Layers of sediment gently bury plants and animals, but melted rock would destroy them"],"answer":3,"explain":"Exactly! Sedimentary rock builds up in gentle layers, while igneous rock starts out as burning-hot melted rock."}],"grammar":[{"skill":"Plurals","q":"What is the correct plural of 'sandwich'?","options":["sandwichs","sandwiches","sandwichies","sandwich's"],"answer":1,"explain":"Well done! Words that end in 'ch' add 'es' to become plural."},{"skill":"Prepositions","q":"Which word is the PREPOSITION in this sentence: 'Fossils hide inside the rock layers.'","options":["Fossils","hide","rock","inside"],"answer":3,"explain":"Yes! 'Inside' shows where the fossils are in relation to the rock layers."},{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["Quartz, salt and, gold are minerals.","Quartz salt, and gold, are minerals.","Quartz, salt, and gold are minerals.","Quartz salt and gold are, minerals."],"answer":2,"explain":"Correct! Commas separate each item in a list of three or more things."},{"skill":"Adverbs","q":"Which word is the ADVERB in this sentence: 'Lava cools quickly on the surface.'","options":["quickly","Lava","cools","surface"],"answer":0,"explain":"Great! 'Quickly' tells HOW the lava cools, so it is an adverb."}],"spelling":[{"word":"mineral","sentence":"Quartz is a ____ that can grow into crystals.","meaning":"A natural solid material that forms in the Earth.","wrong":["minerel","minral","minerall"]},{"word":"crystal","sentence":"A ____ has flat sides and sharp edges.","meaning":"A solid shape with flat sides and sharp edges.","wrong":["cristal","crystel","krystal"]},{"word":"sediment","sentence":"Rivers carry ____ and drop it in lakes and oceans.","meaning":"Tiny bits of sand, mud, and pebbles.","wrong":["sedimant","sedement","sedimint"]},{"word":"ancient","sentence":"Sedimentary rocks often hold fossils of ____ plants and animals.","meaning":"Very, very old.","wrong":["anshent","ancent","anceint"]},{"word":"limestone","sentence":"Heat and pressure can turn ____ into marble.","meaning":"A kind of rock often made from old shells.","wrong":["limstone","lymestone","limestoan"]},{"word":"discover","sentence":"Let's ____ how rocks form and what they are made of.","meaning":"To find or learn something new.","wrong":["discuver","diskover","descover"]}],"written":[{"q":"Describe the three main groups of rocks and how each one forms.","minWords":15,"keyIdeas":[{"label":"Igneous rock forms when melted rock cools","any":["igneous","melt","lava","magma","cool","harden"]},{"label":"Sedimentary rock forms from layers of sediment","any":["sediment","layer","sand","mud","pebble","press"]},{"label":"Metamorphic rock forms from heat and pressure","any":["metamorphic","heat","pressure","squeez","squish","chang"]}],"need":2,"sample":"Igneous rock forms when hot, melted rock cools and hardens. Sedimentary rock forms when layers of sand, mud, and pebbles press together. Metamorphic rock forms when heat and pressure change one kind of rock into another."},{"q":"Why does the article say a pebble might be on a journey that started before the dinosaurs?","minWords":10,"keyIdeas":[{"label":"Rocks can be millions of years old","any":["million","old","ancient","long time","before"]},{"label":"Rocks keep changing in the rock cycle","any":["rock cycle","cycle","chang","turn into","become"]},{"label":"Rocks change very slowly","any":["slow","long","years","gradual","little by little"]}],"need":2,"sample":"Rocks can be millions of years old. In the rock cycle, a rock keeps changing from one kind to another, very slowly. So a pebble might have been changing since before the dinosaurs lived."}],"fixit":[{"wrong":"Quartz salt, and gold are all minerels.","right":"Quartz, salt, and gold are all minerals.","errors":[{"bad":"Quartz","good":"Quartz,","type":"Punctuation"},{"bad":"minerels.","good":"minerals.","type":"Spelling"}]},{"wrong":"limestone can turns into marble when it get squeezed.","right":"Limestone can turn into marble when it gets squeezed.","errors":[{"bad":"limestone","good":"Limestone","type":"Capital Letters"},{"bad":"turns","good":"turn","type":"Verb Tense"},{"bad":"get","good":"gets","type":"Subject-Verb Agreement"}]}]},{"id":"honeybees","title":"Buzzing Helpers: The Secret Life of Honeybees","category":"Animals","emoji":"🐝","minutes":4,"paragraphs":["Imagine a city where tens of thousands of residents live together, and every single one has a job. There are no cars or streetlights, but the city hums all day long. This busy city is a honeybee hive! A strong hive in summer can hold 50,000 bees or more, all working as a team.","Each hive has one queen. Her main job is to lay eggs, and she can lay up to 2,000 in a single summer day. Most of the other bees are female worker bees. Workers clean the hive, feed the babies, build wax honeycomb, guard the door, and fly out to find food. The male bees, called drones, have one job: to mate with a queen from another hive.","Worker bees visit flowers to collect two kinds of food. Sweet nectar is a sugary liquid that bees turn into honey. Pollen is a yellow powder that gives young bees protein, which helps them grow. A worker carries pollen home in tiny baskets on her back legs. It looks like she is wearing fuzzy yellow pants!","Here is where something amazing happens. As a bee crawls around inside a flower, pollen sticks to her hairy body. When she flies to the next flower of the same kind, some of that pollen rubs off. This is called pollination. Pollination helps the flower make seeds and fruit. Without it, many plants could not make the next generation of plants.","Bees also share news in a clever way. When a worker finds a great patch of flowers, she returns to the hive and performs a 'waggle dance.' She wiggles her body while moving in a figure-eight pattern. The direction of her dance shows which way to fly, compared to the sun. The length of the waggle tells how far away the flowers are. Her sisters watch closely, then zoom off to find the treasure.","Honeybees matter to people, too. Bees and other pollinators help grow many of the foods we love, such as apples, almonds, blueberries, and cucumbers. Sadly, bees face problems like disease, pesticides, and losing their wildflower homes. You can help by planting flowers, especially ones that grow naturally where you live. The next time you hear a gentle buzz, remember that a tiny helper is hard at work for all of us."],"funFact":"A single worker bee makes only about one-twelfth of a teaspoon of honey in her whole life. A jar of honey is the work of thousands of bees!","vocab":[{"word":"nectar","meaning":"A sweet, sugary liquid made by flowers."},{"word":"protein","meaning":"A nutrient in food that helps bodies grow strong."},{"word":"pollination","meaning":"Moving pollen between flowers so plants can make seeds."},{"word":"generation","meaning":"All the living things born around the same time."},{"word":"pesticides","meaning":"Chemicals people spray to kill bugs that hurt crops."}],"comprehension":[{"q":"What is this article mostly about?","options":["How to make honey at home","Why bees are dangerous to people","How honeybees live, work together, and help plants grow","How drones build the honeycomb"],"answer":2,"explain":"Great job! The article describes life in the hive, how bees gather food, and how they pollinate plants."},{"q":"Where does a worker bee carry pollen home?","options":["In her stinger","In tiny baskets on her back legs","On her wings","Inside the queen's mouth"],"answer":1,"explain":"Yes! The article says a worker carries pollen home in tiny baskets on her back legs."},{"q":"What happens when pollen from one flower rubs off on another flower of the same kind?","options":["The flower loses its color","The bee forgets the way home","The flower turns into honey","The flower can make seeds and fruit"],"answer":3,"explain":"Exactly! The article explains that pollination helps the flower make seeds and fruit."},{"q":"In the article, what does the word 'nectar' mean?","options":["A sugary liquid in flowers","A yellow powder","A kind of wax","A bee's dance"],"answer":0,"explain":"Nice work! The text says sweet nectar is a sugary liquid that bees turn into honey."},{"q":"Why is a bee's hairy body important for plants?","options":["It keeps the bee warm in winter","It helps pollen stick so she can carry it to other flowers","It makes the bee fly faster","It scares away birds"],"answer":1,"explain":"You got it! The article says pollen sticks to her hairy body and rubs off on the next flower."}],"grammar":[{"skill":"Adjectives","q":"Which word is the ADJECTIVE in this sentence: 'The busy bee flew home.'","options":["bee","flew","busy","home"],"answer":2,"explain":"'Busy' is an adjective because it describes the bee."},{"skill":"Plurals","q":"Which is the correct plural of 'body'?","options":["bodys","bodies","bodyes","bodis"],"answer":1,"explain":"When a word ends in a consonant plus 'y', change the 'y' to 'i' and add 'es': bodies."},{"skill":"Homophones","q":"Choose the correct word: 'The bees flew back to ____ hive.'","options":["there","they're","there's","their"],"answer":3,"explain":"'Their' shows that the hive belongs to the bees."},{"skill":"Verb Tenses","q":"Which sentence is in the PAST tense?","options":["The bee danced in the hive.","The bee dances in the hive.","The bee will dance in the hive.","The bee is dancing in the hive."],"answer":0,"explain":"'Danced' ends in '-ed' and tells about something that already happened."}],"spelling":[{"word":"together","sentence":"Tens of thousands of bees live ____ in one hive.","meaning":"With each other; in a group.","wrong":["togather","togeather","tugether"]},{"word":"protein","sentence":"Pollen gives young bees ____, which helps them grow.","meaning":"A nutrient in food that helps bodies grow.","wrong":["protien","protene","proteen"]},{"word":"pattern","sentence":"She wiggles her body while moving in a figure-eight ____.","meaning":"A shape or design that repeats.","wrong":["patern","pattren","paturn"]},{"word":"direction","sentence":"The ____ of her dance shows which way to fly.","meaning":"The way something is pointing or moving.","wrong":["derection","direcshun","dirrection"]},{"word":"pollination","sentence":"Moving pollen from flower to flower is called ____.","meaning":"Carrying pollen so plants can make seeds.","wrong":["polination","pollenation","pollinashun"]},{"word":"blueberries","sentence":"Bees help grow apples, almonds, ____, and cucumbers.","meaning":"Small, round, blue fruits that grow on bushes.","wrong":["blueberrys","bluberries","blueberies"]}],"written":[{"q":"In your own words, explain how bees help flowers make seeds.","minWords":10,"keyIdeas":[{"label":"Pollen sticks to the bee's hairy body","any":["pollen","stick","hairy","fuzzy","body"]},{"label":"The bee carries it to another flower","any":["next flower","another flower","other flower","carr","fly","flies","move","take"]},{"label":"This is called pollination","any":["pollinat","spread pollen","share pollen","move pollen","transfer"]},{"label":"Then the flower can make seeds or fruit","any":["seed","fruit","new plant","grow"]}],"need":2,"sample":"When a bee crawls inside a flower, pollen sticks to her hairy body. She flies to another flower of the same kind, and some pollen rubs off. This pollination helps the flower make seeds and fruit."},{"q":"What do you think would happen to foods like apples and almonds if there were no bees? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Flowers would not get pollinated","any":["pollinat","pollen","no bees","without bees","flower"]},{"label":"Plants could not make as much fruit or seeds","any":["fruit","seed","crop","grow"]},{"label":"We would have less of those foods","any":["less","fewer","no more","not as many","not enough","shortage","expensive","hungry","run out","disappear"]}],"need":2,"sample":"Without bees, many flowers would not get pollinated. The plants could not make as much fruit, so we would have fewer apples and almonds to eat."}],"fixit":[{"wrong":"the worker bees collects nectar and pollen from flowers","right":"The worker bees collect nectar and pollen from flowers.","errors":[{"bad":"the","good":"The","type":"Capital Letters"},{"bad":"collects","good":"collect","type":"Subject-Verb Agreement"},{"bad":"flowers","good":"flowers.","type":"Punctuation"}]},{"wrong":"Their are about 50,000 bees in a strong hive in sumer.","right":"There are about 50,000 bees in a strong hive in summer.","errors":[{"bad":"Their","good":"There","type":"Homophones"},{"bad":"sumer.","good":"summer.","type":"Spelling"}]}]},{"id":"butterflies","title":"From Crawly to Flutterby: The Magic of Metamorphosis","category":"Animals","emoji":"🦋","minutes":4,"paragraphs":["Imagine going to sleep as a chubby, crawling creature and waking up with beautiful wings. It sounds like a fairy tale, but butterflies really do this! Their amazing change is called metamorphosis, a word that means 'change of form.' A butterfly's life has four stages: egg, caterpillar, chrysalis, and adult.","It all begins with a tiny egg, often smaller than the head of a pin. A mother butterfly is picky about where she lays her eggs. A monarch butterfly, for example, lays her eggs only on milkweed plants. Why? Because milkweed is the only food her babies will eat. She tastes leaves with special sensors on her feet to find the right plant.","When the egg hatches, out crawls a caterpillar, also called a larva. Its first meal is usually its own eggshell! Then it starts munching leaves, and it barely stops. A caterpillar is like an eating machine. In about two weeks, a monarch caterpillar can grow around 2,000 times heavier than when it hatched. As it grows, its skin gets too tight, so it sheds that skin and wears a new, bigger one underneath. This is called molting, and most caterpillars molt four or five times.","Next comes the most mysterious stage. The caterpillar hangs upside down and sheds its skin one last time. Underneath is a hard, protective case called a chrysalis. From the outside, it looks like nothing is happening. Inside, though, much of the caterpillar's body is breaking down into a kind of soupy goo! Special groups of cells use that goo to build brand-new parts: wings, long legs, antennae, and a curly tongue.","After about one to two weeks for many butterflies, the chrysalis splits open. A wet, wrinkly butterfly pulls itself out. Its wings are soft and crumpled at first. The butterfly pumps fluid from its body into the veins of its wings, making them spread out. Then it rests while the wings dry and harden. Within a few hours, it is ready to fly.","The adult butterfly has a new diet, too. Instead of chewing leaves, it sips sweet nectar through a tongue shaped like a straw, called a proboscis. When it is not in use, the proboscis curls up like a garden hose. Soon, a female will lay eggs of her own, and the whole cycle starts again. So the next time you see a caterpillar, say hello to a future butterfly!"],"funFact":"Summer monarchs live only about two to six weeks, but the monarchs that fly south in the fall can live for eight or nine months!","vocab":[{"word":"metamorphosis","meaning":"A big change in body shape as an animal grows up."},{"word":"larva","meaning":"The young, wormlike stage of an insect, like a caterpillar."},{"word":"molting","meaning":"Shedding old skin so a bigger body can grow."},{"word":"chrysalis","meaning":"The hard case where a caterpillar becomes a butterfly."},{"word":"proboscis","meaning":"A long, straw-like tongue used for sipping."}],"comprehension":[{"q":"What is the main idea of the article?","options":["Butterflies only eat milkweed","A butterfly goes through four stages as it changes form","Caterpillars are dangerous to plants","Butterflies live for many years"],"answer":1,"explain":"Well done! The article follows a butterfly through egg, caterpillar, chrysalis, and adult."},{"q":"Why does a monarch lay her eggs only on milkweed?","options":["Milkweed has the prettiest flowers","Milkweed hides eggs from rain","Milkweed grows the tallest","Milkweed is the only food her babies will eat"],"answer":3,"explain":"Right! The article says milkweed is the only food her babies will eat."},{"q":"Which stage comes right after the caterpillar?","options":["Egg","Adult","Chrysalis","Larva"],"answer":2,"explain":"Yes! The caterpillar hangs upside down and forms a chrysalis next."},{"q":"In the article, what does 'molting' mean?","options":["Shedding old skin to grow a new, bigger one","Spinning a silk web","Laying eggs on a leaf","Sipping nectar from flowers"],"answer":0,"explain":"Nice! The article says the caterpillar sheds its tight skin and wears a new, bigger one, which is called molting."},{"q":"Why does a new butterfly rest before it flies?","options":["It is looking for milkweed","Its wings need time to dry and harden","It is waiting for its mother","It needs to eat its chrysalis"],"answer":1,"explain":"Exactly! The text says it rests while the wings dry and harden."}],"grammar":[{"skill":"Verbs","q":"Which word is the VERB in this sentence: 'The caterpillar munches leaves.'","options":["The","munches","leaves","caterpillar"],"answer":1,"explain":"'Munches' is the verb because it tells what the caterpillar does."},{"skill":"Commas","q":"Which sentence uses commas correctly?","options":["The stages are egg, caterpillar, chrysalis, and adult.","The stages are egg caterpillar, chrysalis and adult.","The stages, are egg caterpillar chrysalis, and adult.","The, stages are egg, caterpillar chrysalis and adult."],"answer":0,"explain":"Commas separate each item in a list: egg, caterpillar, chrysalis, and adult."},{"skill":"Sentence Types","q":"What kind of sentence is this: 'Why does she choose milkweed?'","options":["Command","Statement","Exclamation","Question"],"answer":3,"explain":"It asks something and ends with a question mark, so it is a question."},{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'The butterflies ____ sweet nectar.'","options":["sips","sipping","sip","is sip"],"answer":2,"explain":"'Butterflies' is plural, so it goes with the verb 'sip'."}],"spelling":[{"word":"caterpillar","sentence":"When the egg hatches, out crawls a ____.","meaning":"The wormlike baby stage of a butterfly.","wrong":["catterpillar","caterpiller","catapillar"]},{"word":"beautiful","sentence":"Imagine waking up with ____ wings.","meaning":"Very pretty or lovely to look at.","wrong":["beautifull","beutiful","beatiful"]},{"word":"protective","sentence":"Underneath is a hard, ____ case called a chrysalis.","meaning":"Keeping something safe from harm.","wrong":["protecktive","pertective","protectiv"]},{"word":"antennae","sentence":"Cells build wings, long legs, ____, and a curly tongue.","meaning":"The two feelers on an insect's head.","wrong":["antenae","antennay","antennea"]},{"word":"special","sentence":"She tastes leaves with ____ sensors on her feet.","meaning":"Different from others in an important way.","wrong":["speshal","specail","speciel"]},{"word":"creature","sentence":"Imagine going to sleep as a chubby, crawling ____.","meaning":"A living animal.","wrong":["creture","createure","creacher"]}],"written":[{"q":"Describe the four stages a butterfly goes through, in order.","minWords":12,"keyIdeas":[{"label":"It starts as an egg","any":["egg","tiny egg","first","begin","start"]},{"label":"A caterpillar hatches and eats","any":["caterpillar","larva","eat","munch"]},{"label":"It forms a chrysalis","any":["chrysalis","pupa","case","cocoon"]},{"label":"An adult butterfly comes out","any":["adult","butterfly","wing","grown"]}],"need":3,"sample":"A butterfly starts as a tiny egg. A caterpillar hatches and eats lots of leaves, then forms a chrysalis. Inside, its body changes, and an adult butterfly with wings comes out."},{"q":"What might happen to monarch caterpillars if all the milkweed plants disappeared? Explain why.","minWords":10,"keyIdeas":[{"label":"Milkweed is their only food","any":["only food","only thing","only eat","only plant","milkweed"]},{"label":"The caterpillars would go hungry","any":["starv","hungry","no food","nothing to eat","die","not survive","could not eat","couldn't eat","can't eat"]},{"label":"Mothers would have no place to lay eggs","any":["lay","egg","mother","female","nowhere"]},{"label":"There would be fewer monarchs","any":["fewer","less","no more","disappear","extinct","not as many","gone"]}],"need":2,"sample":"The caterpillars would starve because milkweed is the only food they eat. Mothers would have nowhere to lay their eggs, so there would be fewer monarch butterflies."}],"fixit":[{"wrong":"A monarch lays it's eggs on milkweed plants","right":"A monarch lays its eggs on milkweed plants.","errors":[{"bad":"it's","good":"its","type":"Homophones"},{"bad":"plants","good":"plants.","type":"Punctuation"}]},{"wrong":"Yesterday the caterpillar eats leafs all day.","right":"Yesterday, the caterpillar ate leaves all day.","errors":[{"bad":"Yesterday","good":"Yesterday,","type":"Punctuation"},{"bad":"eats","good":"ate","type":"Verb Tense"},{"bad":"leafs","good":"leaves","type":"Plurals"}]}]},{"id":"octopuses","title":"Eight Arms and a Big Brain: Meet the Clever Octopus","category":"Animals","emoji":"🐙","minutes":4,"paragraphs":["Imagine having eight arms, three hearts, and blue blood. You could change the color of your skin in less than a second and squeeze through a hole the size of a coin. That might sound like a superhero, but it is a real animal: the octopus! Octopuses live in oceans all around the world, from warm, shallow reefs to the cold, dark deep sea.","An octopus has no bones at all. Its soft body lets it slip into tiny cracks to hide. The only hard part is its beak, which looks a bit like a parrot's beak and is used to crack open crabs and clams. Each arm is lined with suckers that can grab, hold, and even taste! An octopus can sense the flavor of whatever it touches.","Why three hearts? Two hearts pump blood through the gills, where the octopus picks up oxygen from the water. The third heart pumps blood to the rest of its body. The blood is blue because it uses copper to carry oxygen. Our blood is red because it uses iron instead.","Octopuses are famous for being smart. They have a large brain for their size, and about two-thirds of their nerve cells are actually in their arms. This means each arm can explore and react almost on its own. In aquariums, octopuses have learned to open jars, solve puzzles, and even sneak out of their tanks! Scientists have found that some octopuses can recognize individual people and may treat them differently.","Octopuses are also masters of disguise. Their skin is full of special cells that hold colors, and the octopus can open or close them very quickly. In a flash, it can turn brown, red, white, or spotted to blend in with rocks or coral. Some can even change the bumpy texture of their skin to look like seaweed. The mimic octopus goes further. It can pretend to be other animals, like a dangerous lionfish or a striped sea snake.","If a predator gets too close, an octopus has another trick. It can squirt a cloud of dark ink into the water and jet away while the attacker is confused. Most octopuses live only one or two years, but they pack a lot of cleverness into that short time. Next time you visit an aquarium, look closely. The octopus might be looking right back at you!"],"funFact":"One deep-sea mother octopus guarded her eggs for about four and a half years without leaving them. That is the longest any animal is known to protect its eggs!","vocab":[{"word":"predator","meaning":"An animal that hunts and eats other animals."},{"word":"disguise","meaning":"A way of changing your look so others can't tell it's you."},{"word":"texture","meaning":"How something feels, like bumpy, smooth, or rough."},{"word":"recognize","meaning":"To know someone or something because you've seen it before."},{"word":"individual","meaning":"One single person or thing."}],"comprehension":[{"q":"What is the article mostly about?","options":["How to catch an octopus","Why octopuses have red blood","Where to find the best aquariums","The amazing bodies and clever behavior of octopuses"],"answer":3,"explain":"Great thinking! The article describes octopus hearts, brains, color changes, and tricks."},{"q":"Why is an octopus's blood blue?","options":["It uses copper to carry oxygen","It drinks blue seawater","It eats blue crabs","It has no heart"],"answer":0,"explain":"Yes! The article says the blood is blue because it uses copper to carry oxygen."},{"q":"Why can an octopus slip into tiny cracks?","options":["It is covered in slippery ink","It can shrink its eyes","It has no bones","It has three hearts"],"answer":2,"explain":"Right! The text says an octopus has no bones, so its soft body can slip into tiny cracks."},{"q":"'Octopuses are also masters of disguise.' What does 'disguise' mean here?","options":["A loud warning sound","Changing how you look so others can't spot you","A kind of food","A fast way to swim"],"answer":1,"explain":"Nice! The paragraph shows octopuses changing color and texture to blend in."},{"q":"What happens right after an octopus squirts ink?","options":["It falls asleep","It changes into a snake","It jets away while the attacker is confused","It grows a new arm"],"answer":2,"explain":"Exactly! The article says it can jet away while the attacker is confused."}],"grammar":[{"skill":"Nouns","q":"Which word is a NOUN in this sentence: 'The clever octopus opened the jar quickly.'","options":["clever","opened","jar","quickly"],"answer":2,"explain":"'Jar' is a noun because it names a thing."},{"skill":"Adverbs","q":"Which word is the ADVERB in this sentence: 'The octopus quietly crawled across the rocks.'","options":["octopus","quietly","crawled","rocks"],"answer":1,"explain":"'Quietly' is an adverb because it tells how the octopus crawled."},{"skill":"Capital Letters","q":"Which sentence uses capital letters correctly?","options":["We saw an octopus at the Monterey Bay Aquarium.","we saw an octopus at the Monterey bay aquarium.","We saw an octopus at the monterey bay aquarium.","We saw an Octopus at the Monterey Bay Aquarium."],"answer":0,"explain":"The first word and each word of a place's name get capitals, but 'octopus' does not."},{"skill":"Homophones","q":"Choose the correct word: 'The octopus changed ____ color to match the rocks.'","options":["it's","its'","it is","its"],"answer":3,"explain":"'Its' shows that the color belongs to the octopus. 'It's' means 'it is.'"}],"spelling":[{"word":"aquarium","sentence":"Next time you visit an ____, look closely.","meaning":"A place with tanks where people watch sea animals.","wrong":["aquarim","aqwarium","aquareum"]},{"word":"disguise","sentence":"Octopuses are also masters of ____.","meaning":"Changing how you look so you can hide.","wrong":["disgize","disguize","disgise"]},{"word":"oxygen","sentence":"In the gills, the octopus picks up ____ from the water.","meaning":"A gas that living things need to breathe.","wrong":["oxigen","oxygin","oxegen"]},{"word":"puzzles","sentence":"Octopuses have learned to open jars and solve ____.","meaning":"Problems or games that take thinking to figure out.","wrong":["puzzels","puzles","puzzuls"]},{"word":"dangerous","sentence":"The mimic octopus can pretend to be a ____ lionfish.","meaning":"Able to cause harm or hurt someone.","wrong":["dangerus","dangrous","dainjerous"]},{"word":"confused","sentence":"It can jet away while the attacker is ____.","meaning":"Mixed up and not sure what is happening.","wrong":["confuzed","confussed","cunfused"]}],"written":[{"q":"Explain two ways an octopus can hide or escape from danger.","minWords":10,"keyIdeas":[{"label":"It changes color to blend in","any":["color","colour","blend","camouflag","disguise","match"]},{"label":"It changes the texture of its skin","any":["texture","bump","skin","seaweed"]},{"label":"It squirts ink and jets away","any":["ink","squirt","cloud","jet"]},{"label":"It squeezes into small cracks","any":["crack","squeez","squish","hole","slip","no bones","bone"]}],"need":2,"sample":"An octopus can change the color of its skin to blend in with rocks or coral. If a predator gets too close, it squirts a cloud of dark ink and jets away."},{"q":"Why do you think an octopus can sneak out of a fish tank? Use details from the article.","minWords":10,"keyIdeas":[{"label":"It has no bones, so its body is soft","any":["bone","soft","squeez","squish","slip","bend","small hole","tiny"]},{"label":"It is very smart","any":["smart","clever","intelligen","brain","learn","solve","puzzle","figure"]},{"label":"Its arms can explore on their own","any":["arm","sucker","grab","explore","nerve"]}],"need":2,"sample":"An octopus has no bones, so its soft body can squeeze through tiny openings. It is also very smart and can solve puzzles, like opening jars."}],"fixit":[{"wrong":"An octopus have three hearts and blue blod.","right":"An octopus has three hearts and blue blood.","errors":[{"bad":"have","good":"has","type":"Subject-Verb Agreement"},{"bad":"blod.","good":"blood.","type":"Spelling"}]},{"wrong":"we saw too octopuses at the aquarium on monday.","right":"We saw two octopuses at the aquarium on Monday.","errors":[{"bad":"we","good":"We","type":"Capital Letters"},{"bad":"too","good":"two","type":"Homophones"},{"bad":"monday.","good":"Monday.","type":"Capital Letters"}]}]},{"id":"migration","title":"The Great Journeys: How Animals Travel the World","category":"Animals","emoji":"🦅","minutes":4,"paragraphs":["Imagine packing up and traveling thousands of miles without a map, a phone, or a car. Every year, billions of animals do exactly that! This long trip from one place to another and back again is called migration. Birds, butterflies, whales, fish, and many other animals migrate. They travel to find food, warmer weather, or a safe place to raise their babies.","The champion traveler is a small seabird called the Arctic tern. It spends summer near the top of the world in the Arctic. Then it flies all the way to Antarctica for the summer there! Because it zigzags across the ocean, some terns fly more than 40,000 miles in a single year. Over its lifetime, an Arctic tern may fly a distance equal to going to the Moon and back three times.","On land, huge herds of wildebeest in East Africa make a giant loop called the Great Migration. More than a million of these animals, along with zebras and gazelles, follow the rains to find fresh green grass. Along the way, they must cross rivers full of hungry crocodiles. It is one of the most dramatic sights on Earth.","In the ocean, humpback whales swim from cold polar waters, where they feast on tiny shrimp-like animals called krill and small fish, to warm tropical waters. There, mothers give birth to their calves. Some humpbacks travel about 5,000 miles each way. Many hardly eat at all during the trip, living off the thick fat stored in their bodies.","How do animals find their way? Scientists are still solving this mystery, but they have found some clues. Many birds use the position of the sun during the day and the stars at night. Some animals can sense Earth's magnetic field, which works like an invisible compass. Salmon may even use their sense of smell to find the very stream where they hatched years before.","Migration is not easy. Animals face storms, predators, and exhaustion. Today, they also face new dangers, such as tall glass buildings, busy roads, and the loss of places to rest and eat. People are helping by protecting wetlands and forests and by turning off bright city lights at night so birds do not get confused. When you see a V of geese honking overhead, cheer them on. They are on an incredible journey!"],"funFact":"A young bar-tailed godwit once flew about 8,400 miles from Alaska to Australia without landing even once. The nonstop flight took about 11 days!","vocab":[{"word":"migration","meaning":"A long trip animals make each year to another place and back."},{"word":"dramatic","meaning":"Exciting and full of action."},{"word":"tropical","meaning":"From the hot areas of Earth near the equator."},{"word":"compass","meaning":"A tool with a needle that shows which way is north."},{"word":"exhaustion","meaning":"Being extremely tired."}],"comprehension":[{"q":"What is the main idea of the article?","options":["Many animals make long journeys to survive and have clever ways to find their way","Arctic terns are the only animals that migrate","Whales are bigger than wildebeest","Animals migrate because they get bored"],"answer":0,"explain":"Great job! The article tells about many traveling animals and how they navigate."},{"q":"Which animal does the article call the champion traveler?","options":["Humpback whale","Wildebeest","Salmon","Arctic tern"],"answer":3,"explain":"Yes! The article says the champion traveler is the Arctic tern."},{"q":"Why do wildebeest travel in the Great Migration?","options":["To escape the cold snow","To follow the rains and find fresh grass","To visit the ocean","To find crocodiles"],"answer":1,"explain":"Right! The text says they follow the rains to find fresh green grass."},{"q":"Why might turning off bright city lights help birds?","options":["Birds like to sleep in the dark city","Lights make birds too warm","Birds traveling at night won't get confused by the lights","Birds eat the light bulbs"],"answer":2,"explain":"Exactly! The article says people turn off lights at night so birds do not get confused."},{"q":"'Earth's magnetic field works like an invisible compass.' What is a compass?","options":["A kind of bird nest","A tool that shows directions","A map of the ocean","A type of weather"],"answer":1,"explain":"Nice work! The text explains that animals use it to find their way, just like a compass shows direction."}],"grammar":[{"skill":"Prepositions","q":"Which word is the PREPOSITION in this sentence: 'The geese flew over the lake.'","options":["geese","flew","over","lake"],"answer":2,"explain":"'Over' is a preposition because it shows where the geese flew."},{"skill":"Conjunctions","q":"Which word is the CONJUNCTION in this sentence: 'The whales were hungry, but they kept swimming.'","options":["but","whales","hungry","swimming"],"answer":0,"explain":"'But' is a conjunction that joins the two parts of the sentence."},{"skill":"Homophones","q":"Choose the correct word: 'Whales swim ____ warm waters to have their calves.'","options":["two","too","tow","to"],"answer":3,"explain":"'To' shows direction, telling where the whales swim."},{"skill":"Punctuation","q":"Which sentence has the correct end punctuation?","options":["How do birds find their way.","How do birds find their way?","How do birds find their way,","How do birds find their way"],"answer":1,"explain":"This sentence asks a question, so it needs a question mark."}],"spelling":[{"word":"distance","sentence":"An Arctic tern may fly a ____ equal to going to the Moon and back three times.","meaning":"How far it is from one place to another.","wrong":["distanse","distence","distants"]},{"word":"crocodiles","sentence":"Wildebeest must cross rivers full of hungry ____.","meaning":"Large reptiles with long jaws and sharp teeth.","wrong":["crocodils","crockodiles","crocadiles"]},{"word":"journey","sentence":"Imagine making a long ____ without a map.","meaning":"A trip from one place to another.","wrong":["journy","jerney","jurney"]},{"word":"invisible","sentence":"Earth's magnetic field works like an ____ compass.","meaning":"Not able to be seen.","wrong":["invisable","invisibel","envisible"]},{"word":"weather","sentence":"Animals travel to find food or warmer ____.","meaning":"What the air outside is like, such as sunny or rainy.","wrong":["wether","whether","wheather"]},{"word":"incredible","sentence":"When you see geese overhead, remember they are on an ____ journey!","meaning":"So amazing it is hard to believe.","wrong":["incredable","incredibel","increddible"]}],"written":[{"q":"In your own words, explain why animals migrate.","minWords":10,"keyIdeas":[{"label":"To find food","any":["food","eat","grass","krill","feed"]},{"label":"To find warmer weather","any":["warm","weather","cold","winter"]},{"label":"To find a safe place to raise babies","any":["bab","calves","calf","young","raise","birth","safe","chick","nest"]}],"need":2,"sample":"Animals migrate to find food, like wildebeest following the rains to fresh grass. Some travel to warmer places, and whales go to warm water to have their babies."},{"q":"How might tall glass buildings and bright city lights cause problems for migrating birds? Use details from the article.","minWords":10,"keyIdeas":[{"label":"Lights can confuse birds at night","any":["confus","lost","mix","wrong way","night"]},{"label":"Birds can crash into glass buildings","any":["crash","hit","bump","fly into","glass","window"]},{"label":"Birds use the stars or sun to find their way","any":["star","sun","find their way","navigat","direction"]}],"need":2,"sample":"Bright city lights can confuse birds that fly at night and use the stars to find their way. Confused birds might crash into tall glass buildings and get hurt."}],"fixit":[{"wrong":"The arctic tern flys more than 40,000 miles in one year.","right":"The Arctic tern flies more than 40,000 miles in one year.","errors":[{"bad":"arctic","good":"Arctic","type":"Capital Letters"},{"bad":"flys","good":"flies","type":"Spelling"}]},{"wrong":"Humpback whales swim too warm waters, and there calves are born their.","right":"Humpback whales swim to warm waters, and their calves are born there.","errors":[{"bad":"too","good":"to","type":"Homophones"},{"bad":"there","good":"their","type":"Homophones"},{"bad":"their.","good":"there.","type":"Homophones"}]}]},{"id":"penguins","title":"Tuxedo Birds of the Frozen South: Penguins of Antarctica","category":"Animals","emoji":"🐧","minutes":4,"paragraphs":["Imagine standing on a sheet of ice in the middle of winter. The wind roars, and the temperature drops far below freezing, sometimes to 40 degrees below zero. Now imagine standing there for about two months, keeping an egg warm, without eating a single meal! For male emperor penguins in Antarctica, this is just part of being a dad.","Penguins are birds, but they cannot fly through the air. Instead, they 'fly' underwater! Their wings have become stiff, strong flippers that push them through the sea. Their bodies are shaped like torpedoes, which helps them zoom after fish, krill, and squid. Emperor penguins, the largest kind, can dive deeper than 1,600 feet and hold their breath for more than 20 minutes.","Of the 18 or so kinds of penguins, only a few live and raise chicks in Antarctica itself, including emperor and Adélie penguins. To survive the brutal cold, penguins have several tricks. They have a thick layer of fat called blubber under their skin. Their feathers are short, stiff, and packed tightly together, overlapping like shingles on a roof. This keeps the icy water and wind out and the warmth in.","Emperor penguins have a famous way of staying warm called the huddle. Thousands of penguins crowd together in a tight group. The birds on the inside stay toasty, while the ones on the outside face the wind. Slowly, the huddle shuffles, so everyone takes a turn in the warm middle and a turn on the chilly edge. It is like a giant, slow-motion dance of teamwork.","Emperor penguin families work as a team, too. The mother lays one egg and carefully passes it to the father. Then she heads to the sea to feed. The father balances the egg on his feet and covers it with a warm flap of skin called a brood pouch. He waits through the darkest part of winter. When the chick hatches, the mother returns with food in her belly to share. Then the hungry father finally waddles off to eat.","Penguins also have a clever color pattern. Their black backs blend in with the dark ocean when seen from above. Their white bellies blend in with the bright sky when seen from below. This kind of coloring is called countershading, and it helps them hide from predators like leopard seals and orcas. Today, scientists are watching penguins closely because warming temperatures are melting the sea ice they depend on. Protecting their icy home helps keep these tuxedo birds waddling for years to come."],"funFact":"Penguins can drink salty seawater! A special gland above their eyes removes the extra salt, and they sneeze or shake it out.","vocab":[{"word":"brutal","meaning":"Very harsh and hard to bear."},{"word":"blubber","meaning":"A thick layer of fat that keeps animals warm."},{"word":"huddle","meaning":"A tight group crowded close together."},{"word":"countershading","meaning":"Coloring that is dark on top and light underneath."},{"word":"predators","meaning":"Animals that hunt and eat other animals."}],"comprehension":[{"q":"What is the article mostly about?","options":["How penguins learn to fly in the air","Why penguins live in hot deserts","How penguins' bodies and behaviors help them survive in Antarctica","How to keep a penguin as a pet"],"answer":2,"explain":"Great job! The article explains blubber, feathers, huddles, and teamwork that help penguins survive."},{"q":"Where does the father emperor penguin keep the egg?","options":["On his feet, under a brood pouch","In a nest made of sticks","Under the snow","In his beak"],"answer":0,"explain":"Yes! The text says he balances the egg on his feet and covers it with a brood pouch."},{"q":"What happens right after the chick hatches?","options":["The father lays another egg","The chick swims to the sea alone","The huddle breaks apart forever","The mother returns with food, and the father goes to eat"],"answer":3,"explain":"Right! The article says the mother returns with food, then the hungry father waddles off to eat."},{"q":"In the article, what does 'huddle' mean?","options":["A fast dive into the sea","A tight group crowded together","A kind of fish","A loud call"],"answer":1,"explain":"Nice! The text says thousands of penguins crowd together in a tight group."},{"q":"Why does the huddle slowly shuffle?","options":["To chase away seals","To find food on the ice","So every penguin gets a turn in the warm middle","To make a path to the sea"],"answer":2,"explain":"Exactly! The article says everyone takes a turn in the warm middle and on the chilly edge."}],"grammar":[{"skill":"Subject-Verb Agreement","q":"Choose the correct verb: 'The penguins ____ together to stay warm.'","options":["huddles","huddle","is huddling","has huddled"],"answer":1,"explain":"'Penguins' is plural, so it needs the verb 'huddle.'"},{"skill":"Adjectives","q":"Which word is the ADJECTIVE in this sentence: 'The hungry father waddled to the sea.'","options":["hungry","father","waddled","sea"],"answer":0,"explain":"'Hungry' is an adjective because it describes the father."},{"skill":"Verb Tenses","q":"Which verb is in the FUTURE tense?","options":["swam","swims","will swim","swimming"],"answer":2,"explain":"'Will swim' tells about something that has not happened yet."},{"skill":"Capital Letters","q":"Which sentence uses capital letters correctly?","options":["Emperor Penguins live in antarctica.","emperor penguins live in Antarctica.","Emperor penguins Live in antarctica.","Emperor penguins live in Antarctica."],"answer":3,"explain":"The first word of a sentence and the name of a place, like Antarctica, are capitalized."}],"spelling":[{"word":"freezing","sentence":"The wind roars, and the temperature drops far below ____.","meaning":"So cold that water turns to ice.","wrong":["freazing","freezeing","freesing"]},{"word":"feathers","sentence":"Their ____ are short, stiff, and packed tightly together.","meaning":"The soft parts that cover a bird's body.","wrong":["fethers","feathres","feathurs"]},{"word":"temperature","sentence":"The ____ can drop to 40 degrees below zero.","meaning":"How hot or cold something is.","wrong":["temprature","temperture","tempurature"]},{"word":"carefully","sentence":"The mother lays one egg and ____ passes it to the father.","meaning":"In a gentle way, trying not to make mistakes.","wrong":["carefuly","carefullly","carfully"]},{"word":"finally","sentence":"Then the hungry father ____ waddles off to eat.","meaning":"At last, after a long wait.","wrong":["finaly","finnally","finnaly"]},{"word":"predators","sentence":"Countershading helps penguins hide from ____ like leopard seals.","meaning":"Animals that hunt other animals for food.","wrong":["predaters","preditors","pradators"]}],"written":[{"q":"Describe how emperor penguins stay warm in the freezing cold.","minWords":10,"keyIdeas":[{"label":"A thick layer of fat called blubber","any":["blubber","fat","layer","under their skin","chubby"]},{"label":"Tightly packed feathers","any":["feather","shingle","overlap","packed","tight"]},{"label":"They huddle together and take turns","any":["huddl","together","group","crowd","take turns","turn","middle"]}],"need":2,"sample":"Emperor penguins have a thick layer of blubber under their skin and tightly packed feathers. They also huddle together in a big group and take turns standing in the warm middle."},{"q":"What might happen to a penguin egg if the father did not keep it on his feet? Explain why.","minWords":10,"keyIdeas":[{"label":"The egg would touch the ice","any":["ice","ground","snow","floor"]},{"label":"It would get too cold and freeze","any":["cold","freez","frozen","chill"]},{"label":"The chick would not hatch or survive","any":["hatch","die","surviv","chick","baby","not live","break","crack"]},{"label":"The brood pouch keeps it warm","any":["pouch","warm","cover","flap","feet"]}],"need":2,"sample":"If the egg sat on the ice, it would get too cold and freeze. The chick inside would not survive or hatch, because only the father's feet and brood pouch keep it warm."}],"fixit":[{"wrong":"Penguins cant fly, but they swims very fast.","right":"Penguins can't fly, but they swim very fast.","errors":[{"bad":"cant","good":"can't","type":"Punctuation"},{"bad":"swims","good":"swim","type":"Subject-Verb Agreement"}]},{"wrong":"Emperor penguins live in antarctica and eat fish krill, and squid.","right":"Emperor penguins live in Antarctica and eat fish, krill, and squid.","errors":[{"bad":"antarctica","good":"Antarctica","type":"Capital Letters"},{"bad":"fish","good":"fish,","type":"Punctuation"}]}]},{"id":"photosynthesis","title":"Sunshine Snacks: How Plants Make Their Own Food","category":"Plants & Nature","emoji":"🌱","minutes":4,"paragraphs":["Imagine if you could make your own lunch just by standing in the sunshine and taking a sip of water. No kitchen, no grocery store, no cooking! That is almost exactly what plants do every day. They make their own food through a process called photosynthesis. The word comes from two Greek parts: 'photo' means light, and 'synthesis' means putting together.","To make food, a plant needs three ingredients: sunlight, water, and a gas called carbon dioxide. The roots soak up water from the soil, and it travels up through the stem like juice through a straw. Carbon dioxide enters the leaves through tiny holes called stomata. These holes are so small that you would need a microscope to see them. A single leaf can have thousands of them.","The real magic happens inside t
